<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 - Unit 4 - Exercise 3 - Option D</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#10283c;background:linear-gradient(145deg,#dff9f1,#d9f1ff 48%,#eef4ff)}
.wrap{max-width:1180px;margin:auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#064d52,#087f7a,#1d708f);border-radius:26px 26px 0 0;padding:23px 26px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 50px #064d5240}
.hero:after{content:"";position:absolute;width:240px;height:240px;border:28px solid #ffffff12;border-radius:50%;right:12%;top:-120px}
.brand{display:flex;align-items:center;gap:18px;z-index:1}.icon{font-size:68px}
h1{margin:0;font-size:clamp(28px,4vw,44px);color:#d9fff3}.sub{margin-top:7px;color:#ccefff;font-weight:800}
.sound{z-index:2;border:1px solid #bdebe1;background:#edfffa;color:#07565c;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}
.game{background:#fbfffe;border-radius:0 0 26px 26px;overflow:hidden;box-shadow:0 20px 55px #064d5228}
.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 20px;background:#dff6f1}
.track{height:13px;background:#c5dfdf;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#08a28f,#1875a2);transition:.3s}
.badge{background:white;border:1px solid #badbd8;border-radius:99px;padding:8px 12px;font-weight:900}
.main{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:20px}
.passage{background:#eafbf5;border:2px dashed #37968b;border-radius:18px;padding:20px;line-height:1.72;max-height:680px;overflow:auto}.passage h2{margin-top:0;color:#086a6c}.passage strong{color:#126f9a}
.quiz{background:#fff;border:2px solid #cde3e2;border-radius:18px;padding:20px}
.tag{display:inline-block;background:#087a77;color:#fff;border-radius:10px;padding:7px 12px;font-weight:900}.q{font-size:20px;line-height:1.52;margin:17px 0}
.answers{display:grid;gap:11px}.ans{background:#fff;border:2px solid #d1e2e2;border-radius:14px;padding:14px;text-align:left;font-size:16px;cursor:pointer;color:#10283c;transition:.15s}.ans:hover:not(:disabled){transform:translateX(4px);border-color:#178b87;background:#f2fffc}.ans.ok{background:#e7fff2;border-color:#22a76c}.ans.no{background:#fff0f1;border-color:#d94e5d}
.fb{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.fb.ok{display:block;background:#e8fff2;border-left:5px solid #22a76c}.fb.no{display:block;background:#fff0f2;border-left:5px solid #d94e5d}
.ctrl{text-align:right;margin-top:14px}.next{display:none;border:0;border-radius:12px;padding:12px 20px;background:#087774;color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#fbfffe;border-radius:26px;padding:35px;text-align:center;box-shadow:0 20px 55px #064d5228}.result.show{display:block}.big{font-size:62px;font-weight:1000;color:#087874}
.review{text-align:left;margin-top:22px}.r{background:#eaf8f7;border-left:5px solid #238c89;border-radius:12px;padding:13px 14px;margin:9px 0}.r.ok{border-color:#22a76c}.r.no{border-color:#d94e5d}
.restart{border:0;border-radius:12px;background:#087774;color:white;padding:12px 20px;font-weight:900;cursor:pointer}
.decor{position:fixed;pointer-events:none;opacity:.12;font-size:95px}.d1{left:1%;top:17%}.d2{right:1%;bottom:7%}
@media(max-width:900px){.main{grid-template-columns:1fr}.passage{max-height:420px}}@media(max-width:620px){.hero{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head>
<body>
<div class="decor d1">🌳</div><div class="decor d2">🚲</div>
<div class="wrap">
<div class="hero"><div class="brand"><div class="icon">🌿🏙️</div><div><h1>Eco City Architect</h1><div class="sub">Grade 12 · Unit 4 · Exercise 3 · Option D</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div>
<div id="game" class="game">
<div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="badge">🌱 Score <span id="score">0</span>/5</div><div class="badge">⚡ Streak <span id="streak">0</span></div></div>
<div class="main"><section id="passage" class="passage"></section><section class="quiz"><div id="tag" class="tag"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="fb"></div><div class="ctrl"><button id="next" class="next">NEXT →</button></div></section></div></div>
<div id="result" class="result"><div style="font-size:82px">🌿🏆🏙️</div><h2>City Plan Complete!</h2><div id="final" class="big"></div><p id="msg"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></div>
</div>
<script>
const Q=[{"q": "Rapid population growth can place considerable pressure on public services, particularly when urban infrastructure fails to (1) __________ pace with rising demand.", "o": ["hold", "keep", "maintain", "remain"], "a": 1, "e": "<b>keep pace with + N</b> = theo kịp với. → <i>keep pace with rising demand</i>. Không dùng <i>hold/remain pace with</i>."}, {"q": "Such planning can reduce people's (2) __________ on private vehicles and encourage them to walk, cycle, or use public transport instead.", "o": ["reliance", "connection", "demand", "preference"], "a": 0, "e": "<b>reliance on + N</b> = sự phụ thuộc vào. → <i>reduce people's reliance on private vehicles</i>. <i>Demand</i> và <i>preference</i> thường đi với <b>for</b>."}, {"q": "Constructing new residential areas without adequate consideration for the environment may come at the (3) __________ of parks, farmland, and natural habitats.", "o": ["expense", "sacrifice", "loss", "cost"], "a": 0, "e": "Cụm cố định: <b>at the expense of + N</b> = đánh đổi bằng / gây thiệt hại cho. Cấu trúc đề đã có <i>at the ___ of</i>, nên <b>expense</b> là đáp án chính xác."}, {"q": "Local authorities therefore need to ensure that economic development does not take (4) __________ over residents' well-being.", "o": ["advantage", "priority", "control", "preference"], "a": 1, "e": "<b>take priority over + N</b> = được ưu tiên hơn / quan trọng hơn. Phân biệt: <i>give priority to A</i> và <i>take priority over B</i>."}, {"q": "Successful urban planning depends not simply on how quickly a city grows, but on how effectively its resources are (5) __________ to meet the needs of its population.", "o": ["distributed", "supplied", "allocated", "delivered"], "a": 2, "e": "<b>allocate resources</b> = phân bổ nguồn lực. Collocation học thuật: <i>allocate resources/funds efficiently</i>. <i>Distributed</i> gần nghĩa nhưng không chính xác bằng <b>allocated</b> khi nói về phân bổ nguồn lực theo mục đích."}],P="\n<h2>Building Liveable Cities</h2>\n<p>As cities continue to expand, providing residents with a high quality of life has become an increasingly complex challenge. Rapid population growth can place considerable pressure on public services, particularly when urban infrastructure fails to <strong>(1) ______</strong> pace with rising demand. Transport networks become overcrowded, housing shortages worsen, and access to healthcare and education may become increasingly unequal.</p>\n<p>One solution is to develop more compact neighbourhoods where essential services are located within easy reach of residents. Such planning can reduce people's <strong>(2) ______</strong> on private vehicles and encourage them to walk, cycle, or use public transport instead. Nevertheless, urban development must be carefully managed. Constructing new residential areas without adequate consideration for the environment may come at the <strong>(3) ______</strong> of parks, farmland, and natural habitats.</p>\n<p>Local authorities therefore need to ensure that economic development does not take <strong>(4) ______</strong> over residents' well-being. By investing in affordable housing, efficient public transport, and green spaces, cities can become more inclusive and environmentally sustainable. Ultimately, successful urban planning depends not simply on how quickly a city grows, but on how effectively its resources are <strong>(5) ______</strong> to meet the needs of its population.</p>\n",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,hist=[],soundOn=true,ctx;const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.035,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(620,.08);tone(820,.1,.07);tone(1050,.13,.14)}function bad(){tone(175,.2)}function tap(){tone(420,.06)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tap()}
function render(){answered=false;let x=Q[i];$("tag").textContent="Question "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("ok");let yes=n===x.a;if(yes){score++;streak++;$("fb").className="fb ok";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("no");$("fb").className="fb no";$("fb").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("fb").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";hist.push({n,yes});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tap();if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.15,k*.08));let p=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+p+"%";$("msg").textContent=p===100?"Perfect! Your liveable city plan is complete.":p>=80?"Excellent work! Your eco-city is thriving.":p>=60?"Good work. Review the missed planning clues below.":"Review the explanations and rebuild your city plan.";let h="<h3>🏙️ City Planning Review</h3>";Q.forEach((x,k)=>{let a=hist[k];h+='<div class="r '+(a.yes?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.yes?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("passage").innerHTML=P;render();
</script></body></html>
