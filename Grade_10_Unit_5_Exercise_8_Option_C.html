<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 5 - Exercise 8 - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.utterances{font-size:clamp(18px,2.2vw,22px);font-weight:400;line-height:1.65}
.utterances p{margin:0 0 12px}
.utterances p:last-child{margin-bottom:0}
.utterances strong{color:#625910}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 5 - Exercise 8 - Option C</h1>
    <div class="sub">Exercise 8: Choose the best arrangement of the utterances or sentences.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "<div class=\"utterances\"><p><strong>a.</strong> Leo: That would solve my main problem. I often forget to water mine when I’m busy with schoolwork.</p><p><strong>b.</strong> Mia: Yes, it checks the soil and adds water only when the plant needs it.</p><p><strong>c.</strong> Mia: Then it might suit you, although you would still need to refill its water container occasionally.</p><p><strong>d.</strong> Leo: Have you tried the automatic plant-watering device you bought last month?</p></div>", "options": ["d – a – b – c", "d – b – a – c", "b – d – c – a", "a – c – d – b"], "answer": "d – b – a – c", "explanation": "Leo hỏi ở <strong>d</strong> → Mia trả lời về chức năng ở <strong>b</strong> → Leo liên hệ với vấn đề của mình ở <strong>a</strong> → Mia đưa ra lời khuyên và lưu ý ở <strong>c</strong>."}, {"q": "<div class=\"utterances\"><p><strong>a.</strong> Ben: But if they follow a screen the whole time, won’t they miss the actual objects on display?</p><p><strong>b.</strong> Alice: The museum’s new app lets visitors point their phones at an object to see additional information about it.</p><p><strong>c.</strong> Alice: That’s why the designers kept the explanations short and included reminders to look closely at the real exhibits.</p><p><strong>d.</strong> Ben: So visitors can learn more without having to read every information board?</p><p><strong>e.</strong> Alice: Exactly. It can even show how a damaged object might have looked when it was complete.</p></div>", "options": ["b – a – c – d – e", "d – e – b – c – a", "b – d – a – e – c", "b – d – e – a – c"], "answer": "b – d – e – a – c", "explanation": "Alice giới thiệu ứng dụng ở <strong>b</strong> → Ben hỏi về lợi ích ở <strong>d</strong> → Alice xác nhận ở <strong>e</strong> → Ben nêu lo ngại ở <strong>a</strong> → Alice giải thích cách thiết kế xử lý vấn đề ở <strong>c</strong>."}, {"q": "<div class=\"utterances\"><p><strong>a.</strong> Once the digital version is saved, the user can erase the reusable pages and begin a new set of notes.</p><p><strong>b.</strong> A reusable smart notebook combines handwritten notes with digital storage.</p><p><strong>c.</strong> This makes it possible to reuse the same pages while keeping a record of earlier work.</p><p><strong>d.</strong> After writing on its pages, users scan them with an app that stores a copy on their device.</p><p><strong>e.</strong> However, they should check that the saved images are clear before removing the original writing.</p></div>", "options": ["b – d – a – c – e", "b – a – e – d – c", "d – b – c – a – e", "b – d – c – e – a"], "answer": "b – d – a – c – e", "explanation": "Giới thiệu thiết bị ở <strong>b</strong> → mô tả việc quét và lưu ở <strong>d</strong> → xóa để dùng lại ở <strong>a</strong> → nêu lợi ích ở <strong>c</strong> → lưu ý trước khi xóa ở <strong>e</strong>."}, {"q": "<div class=\"utterances\"><p><strong>a.</strong> With fewer drivers searching for spaces, nearby streets may experience less congestion.</p><p><strong>b.</strong> Smart parking systems help drivers find available spaces without repeatedly circling a car park.</p><p><strong>c.</strong> However, this benefit depends on the information being updated quickly enough to remain accurate.</p><p><strong>d.</strong> Sensors detect whether individual spaces are occupied and send that information to a central system.</p><p><strong>e.</strong> The system then displays the available spaces on signs or sends their locations to a mobile app.</p></div>", "options": ["b – e – d – c – a", "d – e – b – a – c", "b – d – e – a – c", "b – d – a – c – e"], "answer": "b – d – e – a – c", "explanation": "Nêu chức năng ở <strong>b</strong> → cảm biến thu thập dữ liệu ở <strong>d</strong> → hệ thống hiển thị dữ liệu ở <strong>e</strong> → lợi ích giao thông ở <strong>a</strong> → điều kiện để đạt lợi ích đó ở <strong>c</strong>."}, {"q": "<div class=\"utterances\"><p><strong>a.</strong> Later, digital cameras allowed users to review images immediately instead of waiting for film to be developed.</p><p><strong>b.</strong> Today, smartphone cameras combine photography with editing and sharing tools in a single portable device.</p><p><strong>c.</strong> Before these digital devices became common, film cameras required users to develop their photographs before viewing them.</p><p><strong>d.</strong> This development shows that improvements in photography have changed not only how images are captured but also how they are used.</p><p><strong>e.</strong> The ability to check images at once also made it easier to notice mistakes and take another photograph.</p></div>", "options": ["c – e – a – b – d", "c – a – e – b – d", "a – c – b – d – e", "b – a – e – c – d"], "answer": "c – a – e – b – d", "explanation": "Máy ảnh phim ở <strong>c</strong> → máy ảnh kỹ thuật số ở <strong>a</strong> → lợi ích xem ảnh ngay ở <strong>e</strong> → máy ảnh điện thoại hiện nay ở <strong>b</strong> → kết luận ở <strong>d</strong>."}, {"q": "<div class=\"utterances\"><p><strong>a.</strong> To prevent that problem, the designers added a clear button that allowed users to switch the microphone off.</p><p><strong>b.</strong> A student team developed a voice-controlled lamp for people who found small switches difficult to use.</p><p><strong>c.</strong> The experience taught the team that a useful invention must respond to users’ concerns as well as perform its main function.</p><p><strong>d.</strong> Although the lamp responded accurately during testing, some users worried that its microphone might remain active unnecessarily.</p><p><strong>e.</strong> With this extra control, users could choose when the lamp listened for commands, making them more comfortable with the device.</p></div>", "options": ["b – a – e – d – c", "d – a – b – c – e", "b – d – e – c – a", "b – d – a – e – c"], "answer": "b – d – a – e – c", "explanation": "Giới thiệu phát minh ở <strong>b</strong> → nêu lo ngại khi thử nghiệm ở <strong>d</strong> → bổ sung giải pháp ở <strong>a</strong> → kết quả ở <strong>e</strong> → bài học thiết kế ở <strong>c</strong>."}];
const START=1;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
