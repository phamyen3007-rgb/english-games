<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 12 - Unit 2 - Exercise 5 - Option C</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f5f3ff,#ecfeff);color:#0f172a;padding:18px;min-height:100vh}
body.shake{animation:shake .42s}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.container{max-width:1000px;margin:auto}.header{background:linear-gradient(135deg,#1d4ed8,#0f766e,#7c3aed);color:white;padding:24px;border-radius:24px}.header h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:white;border-radius:16px;padding:14px;text-align:center;font-weight:800}
.progress{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:15px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed,#059669);transition:.3s}
.card,.final{background:white;border-radius:24px;padding:24px;box-shadow:0 18px 45px rgba(15,23,42,.12)}.qno{color:#7c3aed;font-weight:900}.question{font-size:clamp(22px,3vw,31px);line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:16px;border:2px solid #dbeafe;border-radius:16px;background:white;font-size:18px;font-weight:800;text-align:left;cursor:pointer}.answer.correct{background:#d1fae5;border-color:#10b981}.answer.wrong{background:#fee2e2;border-color:#ef4444}.answer:disabled{cursor:not-allowed}
.feedback{display:none;margin-top:18px;padding:17px;border-radius:16px;line-height:1.6}.feedback.show{display:block}.good{background:#ecfdf5}.bad{background:#fff1f2}
.next{display:none;width:100%;margin-top:16px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;font-size:18px;font-weight:900}.next.show{display:block}
.gift{display:none;margin-top:14px;padding:16px;text-align:center;background:#fef3c7;border-radius:16px;font-weight:900}.gift.show{display:block}
.final{display:none;text-align:center}.final.show{display:block}.score{font-size:68px;font-weight:900;color:#7c3aed}.restart{padding:14px 22px;border:0;border-radius:15px;background:#059669;color:white;font-size:18px;font-weight:900}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:burst .9s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.flash{position:fixed;inset:0;background:rgba(239,68,68,.28);display:none;pointer-events:none;z-index:9998}.flash.show{display:block;animation:flash .45s}@keyframes flash{0%,100%{opacity:0}40%{opacity:1}}
@media(max-width:700px){.answers{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.card{padding:18px}}
</style>
</head>
<body>
<div class="layer" id="layer"></div><div class="flash" id="flash"></div>
<div class="container">
<div class="header"><h1>Grade 12 - Unit 2 - Exercise 5 - Option C</h1><p>A Multicultural World • Word Form & Grammar Challenge</p></div>
<div class="stats">
<div class="stat"><span id="hearts">❤️❤️❤️❤️</span><br><small>Hearts</small></div>
<div class="stat"><span id="xp">0</span><br><small>XP</small></div>
<div class="stat"><span id="gifts">0</span><br><small>Gifts 🎁</small></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="card">
<div class="qno" id="qno"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div><div class="gift" id="gift">🎁 Surprise Gift! +20 XP</div>
<button class="next" id="next">Next question →</button>
</section>
<section class="final" id="final"><h2>🎉 Mission Complete!</h2><div class="score" id="score">0/6</div><p id="message"></p><p><b>XP:</b> <span id="finalXP"></span> • <b>Gifts:</b> <span id="finalGifts"></span></p><button class="restart" onclick="restart()">Play again</button></section>
</div>
<script>
const data=[
{q:"People from many countries now live together in our city, creating a truly ____________ community.",o:["culture","cultural","culturally","cultures"],a:1,e:"Chỗ trống đứng trước danh từ community nên cần tính từ. cultural = thuộc về văn hóa. Cụm đúng: a cultural community."},
{q:"Learning about different traditions not only broadens our minds but also ____________ respect for others.",o:["encourage","encouraging","encourages","encouraged"],a:2,e:"Learning about different traditions là cụm V-ing làm chủ ngữ và được xem là số ít, nên động từ chia ngôi thứ ba số ít: encourages."},
{q:"Visitors can enjoy traditional food, music, and ____________ from many cultures during the event.",o:["performs","performances","performing","performed"],a:1,e:"Sau food, music, and... cần một danh từ song song. performances = các màn biểu diễn."},
{q:"The festival gives everyone a chance to enjoy ____________ cultural performances from around the world.",o:["diversity","diversify","diversely","diverse"],a:3,e:"Chỗ trống đứng trước cultural performances nên cần tính từ. diverse = đa dạng."},
{q:"Community activities help ____________ friendship and mutual understanding among people from different backgrounds.",o:["promotion","promotes","promoting","promote"],a:3,e:"Sau help có thể dùng V nguyên mẫu hoặc to V. Đáp án đúng là promote. Cụm đúng: help promote friendship."},
{q:"The event celebrates our ____________ values while respecting cultural differences.",o:["sharing","share","shared","shares"],a:2,e:"Chỗ trống đứng trước values nên cần tính từ. shared = chung, được chia sẻ. Cụm đúng: shared values."}
];
let current=0,correct=0,hearts=4,xp=0,gifts=0,answered=false;
const qno=document.getElementById("qno"),question=document.getElementById("question"),answers=document.getElementById("answers"),feedback=document.getElementById("feedback"),next=document.getElementById("next"),bar=document.getElementById("bar"),heartEl=document.getElementById("hearts"),xpEl=document.getElementById("xp"),giftEl=document.getElementById("gifts"),gift=document.getElementById("gift"),card=document.getElementById("card"),final=document.getElementById("final");
function render(){answered=false;const x=data[current];qno.textContent=`Question ${current+1} of ${data.length}`;question.textContent=x.q;answers.innerHTML="";feedback.className="feedback";gift.className="gift";next.className="next";bar.style.width=`${current/data.length*100}%`;x.o.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${v}`;b.onclick=()=>choose(i,b);answers.appendChild(b)})}
function choose(i,b){if(answered)return;answered=true;const x=data[current],bs=[...document.querySelectorAll(".answer")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");if(i===x.a){correct++;xp+=10;b.classList.add("correct");feedback.className="feedback show good";feedback.innerHTML=`<b>✅ Chính xác!</b><br>${x.e}`;fireworks();soundGood();if((current+1)%3===0){gifts++;xp+=20;gift.className="gift show"}}else{hearts=Math.max(0,hearts-1);b.classList.add("wrong");feedback.className="feedback show bad";feedback.innerHTML=`<b>❌ Chưa đúng.</b><br>${x.e}`;bomb();soundBad()}update();next.className="next show";next.textContent=current===data.length-1?"See results →":"Next question →"}
function update(){heartEl.textContent="❤️".repeat(hearts)+"🖤".repeat(4-hearts);xpEl.textContent=xp;giftEl.textContent=gifts}
next.onclick=()=>{current++;current<data.length?render():finish()}
function finish(){bar.style.width="100%";card.style.display="none";final.classList.add("show");document.getElementById("score").textContent=`${correct}/6`;document.getElementById("finalXP").textContent=xp;document.getElementById("finalGifts").textContent=gifts;document.getElementById("message").textContent=correct===6?"Xuất sắc! Bạn đã làm đúng toàn bộ câu hỏi.":correct>=5?"Rất tốt! Bạn đã nắm khá chắc kiến thức.":correct>=3?"Khá tốt! Hãy xem lại những câu còn sai.":"Cố gắng thêm nhé! Hãy chơi lại để ghi nhớ tốt hơn.";fireworks();soundGood()}
function restart(){current=0;correct=0;hearts=4;xp=0;gifts=0;final.classList.remove("show");card.style.display="block";update();render()}
function fireworks(){const l=document.getElementById("layer"),c=["#f59e0b","#ef4444","#22c55e","#3b82f6","#a855f7","#ec4899"],cx=innerWidth/2,cy=innerHeight/3;for(let i=0;i<50;i++){const s=document.createElement("span");s.className="spark";s.style.left=cx+"px";s.style.top=cy+"px";s.style.background=c[Math.floor(Math.random()*c.length)];const a=Math.random()*Math.PI*2,d=80+Math.random()*220;s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");l.appendChild(s);setTimeout(()=>s.remove(),950)}}
function bomb(){const f=document.getElementById("flash");f.classList.remove("show");void f.offsetWidth;f.classList.add("show");document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),500)}
function soundGood(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),n=c.currentTime;[659,784,988,1319].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,n+i*.08);g.gain.exponentialRampToValueAtTime(.18,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.08+.22);o.connect(g).connect(c.destination);o.start(n+i*.08);o.stop(n+i*.08+.24)})}
function soundBad(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sawtooth";o.frequency.setValueAtTime(140,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.45);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.5)}
update();render();
</script>
</body>
</html>
