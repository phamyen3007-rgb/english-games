<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 2 - Exercise 2 - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f5f3ff);color:#172033;padding:16px;min-height:100vh}.app{max-width:880px;margin:auto}
.top{position:sticky;top:8px;z-index:5;background:#ffffffee;padding:14px;border-radius:18px;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;box-shadow:0 10px 25px #0001}.bar{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:.3s}
.hero{margin:16px 0;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:white;padding:24px;border-radius:24px}.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}.hero p{margin:0;line-height:1.5}
.card{background:white;border-radius:24px;padding:24px;box-shadow:0 16px 40px #0f172a1a}#meta{font-weight:800;color:#2563eb;margin-bottom:10px}#question{font-size:22px;font-weight:800;line-height:1.5;margin-bottom:18px}.opts{display:grid;gap:11px}
.opt{border:2px solid #e2e8f0;background:white;border-radius:15px;padding:14px;text-align:left;font-size:17px;cursor:pointer}.opt:hover:not(:disabled){border-color:#93c5fd;transform:translateY(-2px)}.correct{background:#ecfdf5!important;border-color:#22c55e!important}.wrong{background:#fef2f2!important;border-color:#ef4444!important}
#feedback{display:none;margin-top:17px;padding:16px;border-radius:15px;line-height:1.5}#feedback.good{display:block;background:#ecfdf5;border-left:5px solid #22c55e}#feedback.bad{display:block;background:#fef2f2;border-left:5px solid #ef4444}
#next,.mainbtn{display:none;margin:17px 0 0 auto;border:0;border-radius:14px;padding:12px 21px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;font-weight:900;font-size:16px;cursor:pointer}#next.show{display:block}.gift,.final{display:none;text-align:center}.gift.show,.final.show{display:block}.gift .emoji{font-size:70px}.gift .mainbtn,.final .mainbtn{display:inline-block;background:linear-gradient(135deg,#f59e0b,#ea580c)}
.big{font-size:56px;font-weight:900;color:#7c3aed}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.summary div{background:#f8fafc;padding:14px;border-radius:15px;font-weight:800}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}.spark{position:fixed;z-index:99;pointer-events:none;font-size:25px;animation:fly 1s forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(400deg);opacity:0}}@media(max-width:550px){.top{grid-template-columns:1fr auto}.card{padding:19px}.summary{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><div class="bar"><div id="fill"></div></div><b id="hearts">❤️ 7</b><b id="xp">⭐ 0 XP</b></div>
<section class="hero"><h1>Grade 11 – Unit 2</h1><p><b>Exercise 2 – Option B</b><br>Homework – Modal Verbs: 15 câu luyện tập với must, have to, should, ought to, might và modal perfect.</p></section>
<section class="card" id="quiz"><div id="meta"></div><div id="question"></div><div class="opts" id="opts"></div><div id="feedback"></div><button id="next">Next →</button></section>
<section class="card gift" id="gift"><div class="emoji">🎁</div><h2 id="giftTitle"></h2><p id="giftText"></p><button class="mainbtn" id="giftBtn">Tiếp tục</button></section>
<section class="card final" id="final"><div style="font-size:65px">🏆</div><h2>Homework Completed!</h2><div class="big" id="score"></div><p id="message"></p><div class="summary"><div id="s1"></div><div id="s2"></div><div id="s3"></div></div><button class="mainbtn" onclick="location.reload()">Play Again</button></section>
</div><script>
const data=[{"q": "Students ____________ wear their school uniforms on Mondays and during school ceremonies.", "o": ["must", "shouldn't", "don't have to", "mustn't"], "a": 0, "e": "<b>Must</b> = phải. Diễn tả quy định bắt buộc của nhà trường."}, {"q": "You ____________ leave your bike in front of the emergency exit. It's against the rules.", "o": ["don't have to", "mustn't", "should", "have to"], "a": 1, "e": "<b>Mustn't</b> = không được phép. Dấu hiệu: <i>It's against the rules</i>."}, {"q": "My sister ____________ stay up late tonight because she has an important exam tomorrow.", "o": ["doesn't have to", "shouldn't", "has to", "mustn't"], "a": 2, "e": "<b>Has to</b> = phải. Diễn tả sự bắt buộc do hoàn cảnh."}, {"q": "Parents ____________ compare their children with others because everyone is different.", "o": ["ought to", "have to", "don't have to", "shouldn't"], "a": 3, "e": "<b>Shouldn't</b> = không nên. Dùng để đưa ra lời khuyên."}, {"q": "When my grandfather was young, he ____________ work from morning until evening.", "o": ["had to", "must", "doesn't have to", "should"], "a": 0, "e": "<b>Had to</b> = đã phải. Diễn tả nghĩa vụ trong quá khứ."}, {"q": "You ____________ bring any food to the picnic. We'll prepare everything.", "o": ["shouldn't", "don't have to", "have to", "must"], "a": 1, "e": "<b>Don't have to</b> = không cần phải."}, {"q": "The classroom is very clean. The students ____________ have spent a lot of time cleaning it.", "o": ["should", "need", "must", "could"], "a": 2, "e": "<b>Must have + V₃</b> = chắc hẳn đã... Dùng để suy luận từ bằng chứng hiện tại."}, {"q": "Visitors ____________ feed the animals in this national park.", "o": ["should", "don't have to", "have to", "mustn't"], "a": 3, "e": "<b>Mustn't</b> = không được phép."}, {"q": "Teenagers ____________ learn to take responsibility for their own decisions.", "o": ["ought to", "mustn't", "don't have to", "had to"], "a": 0, "e": "<b>Ought to</b> = nên, có bổn phận nên làm."}, {"q": "We ____________ hurry. The movie starts in five minutes.", "o": ["shouldn't", "have to", "don't have to", "mustn't"], "a": 1, "e": "<b>Have to</b> = phải. Do hoàn cảnh yêu cầu."}, {"q": "You ____________ worry so much about making mistakes. Everyone learns from them.", "o": ["have to", "should", "don't have to", "must"], "a": 2, "e": "<b>Don't have to</b> = không cần phải."}, {"q": "Emma got full marks in the English test. She ____________ have studied very hard.", "o": ["should", "could", "need", "must"], "a": 3, "e": "<b>Must have + V₃</b> = chắc hẳn đã..."}, {"q": "You ____________ have shouted at your little brother. He was only trying to help.", "o": ["shouldn't", "needn't", "mustn't", "don't have to"], "a": 0, "e": "<b>Shouldn't have + V₃</b> = lẽ ra không nên... nhưng đã làm."}, {"q": "Students ____________ keep their phones silent during the lesson.", "o": ["don't have to", "should", "mustn't", "had to"], "a": 1, "e": "<b>Should</b> = nên. Dùng để đưa ra lời khuyên hoặc quy tắc ứng xử."}, {"q": "Look at those dark clouds! It ____________ rain later this afternoon.", "o": ["have to", "don't have to", "might", "mustn't"], "a": 2, "e": "<b>Might + V</b> = có thể sẽ... Dự đoán khả năng xảy ra trong tương lai."}];let i=0,hearts=7,xp=0,correct=0,answered=false;const $=id=>document.getElementById(id);
function render(){answered=false;let x=data[i];$("meta").textContent=`Question ${i+1} of ${data.length}`;$("question").textContent=x.q;$("opts").innerHTML="";$("feedback").className="";$("feedback").style.display="none";$("next").className="";$("fill").style.width=(i/data.length*100)+"%";x.o.forEach((t,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+n)+". "+t;b.onclick=()=>choose(n,b);$("opts").appendChild(b)})}
function choose(n,b){if(answered)return;answered=true;let x=data[i],bs=[...document.querySelectorAll(".opt")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");if(n===x.a){correct++;xp+=10;$("feedback").className="good";$("feedback").innerHTML="✅ <b>Chính xác!</b><br>"+x.e;fire();sound(700)}else{hearts=Math.max(0,hearts-1);b.classList.add("wrong");$("feedback").className="bad";$("feedback").innerHTML="💣 <b>Chưa đúng.</b><br>"+x.e;$("quiz").classList.add("shake");setTimeout(()=>$("quiz").classList.remove("shake"),380);sound(120)}$("feedback").style.display="block";$("hearts").textContent="❤️ "+hearts;$("xp").textContent="⭐ "+xp+" XP";$("next").textContent=i===14?"Xem kết quả →":"Next →";$("next").className="show"}
$("next").onclick=()=>{if(i===4)gift(1);else if(i===9)gift(2);else if(i===14)gift(3);else{i++;render()}};
function gift(n){$("quiz").style.display="none";$("gift").classList.add("show");let bonus=n===1?20:n===2?25:30;xp+=bonus;$("giftTitle").textContent=n===3?"Quà hoàn thành!":"Quà chặng "+n+"!";$("giftText").innerHTML="Bạn nhận thêm <b>"+bonus+" XP</b>.";$("giftBtn").textContent=n===3?"Xem kết quả":"Tiếp tục";$("giftBtn").onclick=n===3?finish:()=>{$("gift").classList.remove("show");$("quiz").style.display="block";i++;render()};$("xp").textContent="⭐ "+xp+" XP"}
function finish(){$("gift").classList.remove("show");$("final").classList.add("show");$("fill").style.width="100%";$("score").textContent=correct+"/15";$("s1").innerHTML="✅ Correct<br>"+correct+"/15";$("s2").innerHTML="⭐ Total XP<br>"+xp;$("s3").innerHTML="❤️ Hearts left<br>"+hearts;$("message").textContent=correct>=13?"Xuất sắc! Bạn nắm rất chắc modal verbs.":correct>=10?"Tốt lắm! Hãy xem lại câu sai.":"Hãy chơi lại để ghi nhớ tốt hơn."}
function fire(){for(let k=0;k<12;k++){let s=document.createElement("span");s.className="spark";s.textContent=["✨","🎉","⭐"][k%3];s.style.left=innerWidth/2+"px";s.style.top=innerHeight/2+"px";s.style.setProperty("--x",(Math.random()*450-225)+"px");s.style.setProperty("--y",(Math.random()*350-190)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function sound(f){try{let c=new (AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch(e){}}
render();</script></body></html>
