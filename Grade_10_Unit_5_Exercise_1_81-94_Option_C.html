<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 5 - Exercise 1 (81-94) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 5 - Exercise 1 (81-94) - Option C</h1>
    <div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "My assistant ________ the start button, so the machine is running now.", "options": ["has pressed just", "have just pressed", "just pressed", "has just pressed"], "answer": "has just pressed", "explanation": "Theo trọng tâm hiện tại hoàn thành, <em>has just pressed</em> diễn tả hành động vừa xảy ra với kết quả hiện tại là máy đang chạy. <em>Just</em> đứng giữa <em>has</em> và V3. <em>Just pressed</em> cũng có thể được dùng trong tiếng Anh Mỹ."}, {"q": "The scientists have not completed the experiment ________, so we cannot discuss the final results.", "options": ["already", "yet", "just", "ever"], "answer": "yet", "explanation": "<em>Yet</em> thường đứng cuối câu phủ định ở hiện tại hoàn thành, nghĩa là “chưa”: thí nghiệm chưa hoàn tất tính đến hiện tại."}, {"q": "This is the first time we ________ attended an international exhibition about artificial intelligence.", "options": ["have", "has", "had had", "have been"], "answer": "have", "explanation": "Cấu trúc <em>This is the first time + S + have/has + V3</em>. Chủ ngữ <em>we</em> đi với <em>have</em>; <em>attended</em> là V3."}, {"q": "They have tested this driverless car ________ times, but it still has some technical problems.", "options": ["several", "much", "a little", "little"], "answer": "several", "explanation": "<em>Times</em> là danh từ đếm được số nhiều nên dùng <em>several times</em> — vài lần. <em>Much</em>, <em>a little</em> và <em>little</em> dùng với danh từ không đếm được."}, {"q": "We have worked on this computer science project ________ three months.", "options": ["since", "for", "after", "in"], "answer": "for", "explanation": "<em>Three months</em> là khoảng thời gian, nên dùng <em>for</em>. <em>Since</em> đi với mốc bắt đầu."}, {"q": "Scientists have used 3D printing in research ________ 2010.", "options": ["since", "for", "before", "until"], "answer": "since", "explanation": "<em>2010</em> là mốc thời gian. <em>Since 2010</em> diễn tả việc bắt đầu năm 2010 và kéo dài đến hiện tại."}, {"q": "The company has improved its software a lot ________ recent years.", "options": ["on", "in", "at", "for"], "answer": "in", "explanation": "Cụm đúng là <em>in recent years</em> — trong những năm gần đây. Hiện tại hoàn thành diễn tả sự cải tiến trong giai đoạn gần đây tính đến hiện tại."}, {"q": "I have ________ finished installing the hardware, so the computer is ready to use.", "options": ["already", "ever", "yet", "never"], "answer": "already", "explanation": "<em>Already</em> nhấn mạnh việc lắp đặt đã hoàn tất. <em>Have already finished</em> phù hợp với kết quả máy đã sẵn sàng sử dụng."}, {"q": "The engineers ________ on several artificial intelligence projects this week.", "options": ["have worked", "worked", "are work", "works"], "answer": "have worked", "explanation": "<em>Have worked</em> phù hợp khi <em>this week</em> là giai đoạn chưa kết thúc, nói về công việc tính đến hiện tại. <em>Worked</em> cũng có thể dùng nếu người nói nhìn các hoạt động như những việc đã kết thúc trong tuần."}, {"q": "My brother is a software developer. He ________ three useful applications for language learners.", "options": ["has already created", "already created", "is already creating", "have already create"], "answer": "has already created", "explanation": "<em>Has already created</em> diễn tả thành quả đã đạt được tính đến hiện tại: ba ứng dụng đã được tạo. Chủ ngữ <em>he</em> dùng <em>has</em>. <em>Already created</em> cũng có thể dùng khi kể về các việc đã hoàn tất trong quá khứ."}, {"q": "We have discussed the advantages of e-readers several times, but we ________ a discussion about their environmental impact before today.", "options": ["have never had", "had never had", "are never having", "will never have"], "answer": "have never had", "explanation": "Theo trọng tâm trải nghiệm tính đến hiện tại, dùng <em>have never had</em>: chưa từng có cuộc thảo luận như vậy trước hôm nay. <em>Had never had</em> cũng có thể phù hợp nếu lấy một cuộc thảo luận đã diễn ra hôm nay làm mốc quá khứ."}, {"q": "The company has introduced a battery that lasts longer than anything it produced ________.", "options": ["after", "before", "just", "since"], "answer": "before", "explanation": "<em>Before</em> ở cuối mệnh đề nghĩa là “trước đây”: pin mới dùng lâu hơn mọi loại hãng từng sản xuất trước đó."}, {"q": "The researchers have checked the new driverless car carefully. ________ these tests, they have discovered several problems that still need to be solved.", "options": ["During", "Before", "Since", "Until"], "answer": "During", "explanation": "<em>During + danh từ/cụm danh từ</em> nghĩa là trong suốt hoặc trong quá trình. Các vấn đề được phát hiện trong quá trình kiểm tra."}, {"q": "How many driverless cars has the company tested ________?", "options": ["so far", "yet", "now", "before"], "answer": "so far", "explanation": "<em>So far</em> nghĩa là “tính đến hiện tại”, phù hợp với câu hỏi về tổng số xe đã thử nghiệm. <em>Before</em> cũng có thể dùng khi hỏi số xe đã từng thử nghiệm trước một lần hoặc thời điểm đang được nhắc đến."}];
const START=81;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
