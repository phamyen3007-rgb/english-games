<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 4 - Exercise 1 (101-130) - Option C</title>
<style>
:root{--bg1:#090a16;--bg2:#15112a;--panel:#11162a;--panel2:#181f38;--cyan:#63e7ff;--violet:#9a7cff;--pink:#ff6fb4;--gold:#ffd66e;--green:#52d99a;--red:#ff6679;--text:#f7f8ff;--muted:#b9bfd3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(99,231,255,.11),transparent 24%),radial-gradient(circle at 85% 17%,rgba(154,124,255,.10),transparent 24%),linear-gradient(155deg,var(--bg1),var(--bg2) 60%,#05060b);padding:20px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:46px 46px}.court{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:72%;height:30%;background:linear-gradient(180deg,rgba(154,124,255,.10),rgba(5,6,11,.5));clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}.beam{position:absolute;width:3px;height:48%;top:8%;background:linear-gradient(#63e7ff,transparent);opacity:.18}.x1{left:18%;transform:rotate(12deg)}.x2{right:18%;transform:rotate(-12deg)}
.wrap{max-width:980px;margin:auto;position:relative;z-index:2}.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.icon{font-size:64px}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#effcff,#63e7ff,#9a7cff,#ff6fb4,#ffd66e);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:6px;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(99,231,255,.23);background:#191f36;color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}
.panel{background:linear-gradient(180deg,rgba(24,31,56,.97),rgba(17,22,42,.97));border:1px solid rgba(99,231,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.42)}.top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:16px 20px;background:#0c1121}.progress{height:12px;background:#050711;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold));transition:.25s}.pill{background:#1b2440;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}.game{padding:22px}.case{background:#141c33;border:2px solid #34466f;border-radius:20px;padding:20px}.casehead{display:flex;justify-content:space-between;align-items:center;gap:12px}.qtag{display:inline-block;background:#202d50;color:#dff9ff;padding:7px 12px;border-radius:10px;font-weight:900}.mode{font-size:12px;letter-spacing:1.6px;color:#85e9ff;font-weight:900}.question{font-size:22px;line-height:1.55;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:15px;border:2px solid #3a4e74;border-radius:14px;background:#19243f;color:#fff;text-align:left;font-size:17px;cursor:pointer;transition:.15s}.answer:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 18px rgba(99,231,255,.08)}.answer.correct{background:#153f2e!important;border-color:var(--green)!important}.answer.wrong{background:#4b1d28!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#0c1629;line-height:1.55}.feedback.good{display:block;border-color:var(--green)}.feedback.bad{display:block;border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.next{display:none;border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#89ecff,#b4a7ff,#ffb7d9,#ffe18e);color:#17243b;cursor:pointer}.result{display:none;text-align:center;padding:34px}.result.show{display:block}.big{font-size:58px;font-weight:1000;color:#8beaff}.review{text-align:left;margin-top:22px}.item{padding:12px 14px;background:#111b30;border-left:5px solid #60708d;border-radius:12px;margin:9px 0;line-height:1.5}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}.restart{border:0;border-radius:12px;padding:12px 20px;background:#80e2ff;font-weight:900;cursor:pointer}
@media(max-width:720px){.answers{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.top{grid-template-columns:1fr 1fr}.progress{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="court"></div><div class="beam x1"></div><div class="beam x2"></div></div>
<div class="wrap">
<div class="hero"><div class="brand"><div class="icon">⚖️🌃</div><div><h1>Neon Urban Tribunal</h1><div class="sub">Grade 12 · Unit 4 · Exercise 1 (101–130) · Option C</div></div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="panel" id="game"><div class="top"><div class="progress"><div class="bar" id="bar"></div></div><div class="pill">⭐ <span id="score">0</span>/15</div><div class="pill">🔥 <span id="streak">0</span></div></div>
<div class="game"><div class="case"><div class="casehead"><div class="qtag" id="qtag"></div><div class="mode">URBAN REVIEW SESSION</div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next">NEXT CASE →</button></div></div></div></div>
<div class="panel result" id="result"><div style="font-size:78px">⚖️🏆</div><h2>Tribunal Review Complete!</h2><div class="big" id="final"></div><p id="message"></p><button class="restart" id="restart">Review Again ↻</button><div class="review" id="review"></div></div>
</div>
<script>
const Q=[{"q": "The redevelopment project has been criticised for displacing long-term residents rather than ____________ the shortage of affordable housing.", "o": ["approaching", "responding", "handling", "addressing"], "a": 3, "e": "Address a problem/shortage/issue = giải quyết một vấn đề hoặc tình trạng thiếu hụt. “Responding” cần đi với to; “handling” hiểu được nhưng kém tự nhiên hơn “addressing a shortage”."}, {"q": "As urban expansion accelerates, agricultural land is being converted into residential areas at an increasingly ____________ rate.", "o": ["alarmed", "alarming", "alarmingly", "alarm"], "a": 1, "e": "Cụm cố định: at an alarming rate = với tốc độ đáng báo động. “Alarming” là tính từ bổ nghĩa cho “rate”."}, {"q": "The government’s failure to invest in public transport has placed an additional ____________ on commuters living on the outskirts of the city.", "o": ["pressure", "shortage", "burden", "congestion"], "a": 2, "e": "Place a burden on somebody = đặt gánh nặng lên ai. “Additional burden on commuters” tự nhiên và chính xác nhất trong ngữ cảnh này."}, {"q": "The ____________ urban populations grow, the more difficult it becomes for local authorities to provide adequate public services.", "o": ["more rapidly", "most rapidly", "much more rapid", "rapid"], "a": 0, "e": "Cấu trúc so sánh kép: The + comparative..., the + comparative... Vì “grow” là động từ nên cần trạng từ → The more rapidly urban populations grow..."}, {"q": "Many historic neighbourhoods have undergone such extensive redevelopment that they are barely ____________ from their original form.", "o": ["remarkable", "noticeable", "distinguishable", "recognisable"], "a": 3, "e": "Barely recognisable = hầu như không còn nhận ra được. Ngữ cảnh nói khu phố thay đổi quá nhiều so với hình dạng ban đầu."}, {"q": "Urban regeneration schemes should be carefully designed so that economic growth does not come ____________ the expense of local communities.", "o": ["with", "at", "by", "for"], "a": 1, "e": "Cụm cố định: at the expense of somebody/something = gây tổn hại cho/đánh đổi bằng cái gì."}, {"q": "The new metro system is expected to ____________ some of the pressure on the city’s overcrowded road network.", "o": ["release", "resolve", "relieve", "recover"], "a": 2, "e": "Relieve pressure on something = làm giảm áp lực lên thứ gì. Không dùng “resolve pressure”."}, {"q": "Not until the city experienced a severe housing crisis ____________ the consequences of uncontrolled urban growth.", "o": ["did the authorities recognise", "had the authorities recognised", "the authorities recognised", "the authorities had recognised"], "a": 0, "e": "Khi Not until đứng đầu câu, mệnh đề chính đảo trợ động từ: Not until + clause + did + S + V nguyên mẫu."}, {"q": "Although the city attracts considerable foreign investment, the resulting economic benefits are not always ____________ across different sections of society.", "o": ["identically delivered", "fairly divided", "similarly provided", "equally distributed"], "a": 3, "e": "Benefits are equally distributed across society = lợi ích được phân bổ đồng đều trong xã hội. Đây là collocation tự nhiên nhất."}, {"q": "The closure of local businesses has deprived many residents ____________ both employment opportunities and essential services.", "o": ["from", "with", "of", "for"], "a": 2, "e": "Cấu trúc: deprive somebody of something = tước đi/khiến ai không có thứ gì."}, {"q": "The destruction of historic buildings may gradually ____________ residents’ sense of identity and attachment to their neighbourhood.", "o": ["underestimate", "undermine", "undergo", "undertake"], "a": 1, "e": "Undermine something = dần làm suy yếu/gây tổn hại. → undermine residents’ sense of identity."}, {"q": "Had stricter planning regulations been introduced earlier, much of the agricultural land ____________ to industrial use.", "o": ["would not have been converted", "would not be converted", "had not been converted", "would not convert"], "a": 0, "e": "Điều kiện loại 3 đảo ngữ: Had + S + V3, S + would have + V3. Vì land bị chuyển đổi nên dùng bị động → would not have been converted."}, {"q": "The rapid influx of rural migrants has created a demand for housing that the city is struggling to ____________.", "o": ["fulfil", "achieve", "accomplish", "satisfy"], "a": 3, "e": "Satisfy/meet a demand = đáp ứng nhu cầu. Các từ còn lại không kết hợp tự nhiên bằng trong cấu trúc này."}, {"q": "So severe ____________ that the authorities were forced to restrict private vehicles from entering the city centre.", "o": ["traffic congestion became", "did traffic congestion become", "was traffic congestion", "traffic congestion was"], "a": 2, "e": "Đảo ngữ với so + adjective: So + adjective + be + subject + that... → So severe was traffic congestion that..."}, {"q": "Urbanisation can contribute to economic growth, provided that its environmental and social consequences are properly ____________.", "o": ["dealt", "addressed", "responded", "coped"], "a": 1, "e": "Address a problem/issue/consequence = xử lý hoặc giải quyết. “Dealt” cần with; “responded” cần to; “coped” cần with."}],L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,history=[],soundOn=true,ctx=null;const $=id=>document.getElementById(id);
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="triangle",delay=0){if(!soundOn)return;const c=audio(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.03,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
function goodSound(){tone(650,.08);tone(950,.12,"sine",.08)}function badSound(){tone(170,.17,"sawtooth")}function nextSound(){tone(430,.06);tone(680,.08,"triangle",.06)}function winSound(){[523,659,784,1047].forEach((f,k)=>tone(f,.16,"triangle",k*.08))}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)nextSound()};
function render(){answered=false;const q=Q[i];$("qtag").textContent="Case "+(i+1)+" / "+Q.length;$("question").textContent=q.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").style.display="none";$("next").style.display="none";q.o.forEach((op,n)=>{const b=document.createElement("button");b.className="answer";b.innerHTML="<strong>"+L[n]+".</strong> "+op;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH REVIEW →":"NEXT CASE →"}
function choose(n,btn){if(answered)return;answered=true;const q=Q[i],bs=[...document.querySelectorAll(".answer")];bs.forEach(b=>b.disabled=true);bs[q.a].classList.add("correct");const right=n===q.a;if(right){score++;streak++;$("feedback").className="feedback good";$("feedback").innerHTML="<strong>✅ CORRECT — "+L[q.a]+". "+q.o[q.a]+"</strong><br>"+q.e;goodSound()}else{streak=0;btn.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").innerHTML="<strong>❌ INCORRECT. Correct answer: "+L[q.a]+". "+q.o[q.a]+"</strong><br>"+q.e;badSound()}$("feedback").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";history.push({selected:n,correct:right});$("next").style.display="block"}
$("next").onclick=()=>{if(!answered)return;nextSound();if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("game").style.display="none";$("result").classList.add("show");winSound();const pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("message").textContent=pct>=90?"Outstanding urban language control!":pct>=75?"Very strong performance.":pct>=60?"Good work — review the missed cases below.":"Review the explanations and try again.";let h="<h3>⚖️ Tribunal Case Review</h3>";Q.forEach((q,k)=>{const a=history[k];h+='<div class="item '+(a.correct?"ok":"no")+'"><strong>Case '+(k+1)+': '+(a.correct?"Correct":"Incorrect")+'</strong><br>Your answer: '+L[a.selected]+'. '+q.o[a.selected]+'<br>Correct: '+L[q.a]+'. '+q.o[q.a]+'<br><em>'+q.e+'</em></div>'});$("review").innerHTML=h}
$("restart").onclick=()=>location.reload();render();
</script>
</body></html>
