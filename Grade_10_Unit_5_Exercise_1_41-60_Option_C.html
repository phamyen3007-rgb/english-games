<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 5 - Exercise 1 (41-60) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 5 - Exercise 1 (41-60) - Option C</h1>
    <div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "Even a well-designed learning app may be less effective if frequent connection problems ________ students’ ability to follow the instructions.", "options": ["reflect", "affect", "collect", "select"], "answer": "affect", "explanation": "<em>Affect</em> nghĩa là ảnh hưởng đến; sự cố kết nối ảnh hưởng đến khả năng theo dõi hướng dẫn của học sinh."}, {"q": "The original machine was invented decades ago; the factory now ________ updated versions according to an approved design.", "options": ["discovers", "observes", "invents", "makes"], "answer": "makes", "explanation": "<em>Make</em> là sản xuất theo thiết kế có sẵn; <em>invent</em> là phát minh ra thứ mới."}, {"q": "For someone who mainly reads digital novels while travelling, an ________ offers a portable alternative to carrying several printed books.", "options": ["e-reader", "electronic calculator", "overhead projector", "interactive whiteboard"], "answer": "e-reader", "explanation": "<em>E-reader</em> là thiết bị đọc sách điện tử, phù hợp với việc mang theo nhiều tiểu thuyết khi di chuyển."}, {"q": "Instead of cutting a model from a solid block, ________ builds it by adding successive layers of material based on a digital design.", "options": ["virtual reality", "wireless communication", "3D printing", "artificial intelligence"], "answer": "3D printing", "explanation": "In 3D tạo vật thể bằng cách thêm từng lớp vật liệu theo mô hình kỹ thuật số."}, {"q": "The engineers tested whether the delivery drone could carry the same load over greater ________ without needing another charge.", "options": ["destinations", "distances", "directions", "dimensions"], "answer": "distances", "explanation": "<em>Over greater distances</em> nghĩa là trên những quãng đường xa hơn. <em>Destinations</em> là điểm đến."}, {"q": "The ________ of a more efficient cooling system allowed the device to operate for longer without overheating.", "options": ["develop", "developing", "developmental", "development"], "answer": "development", "explanation": "Cấu trúc <em>the + danh từ + of</em>. <em>The development of…</em> nghĩa là sự phát triển một hệ thống hoặc công nghệ."}, {"q": "Although the robot removed loose dust easily, it could not get rid of the dried coffee ________ on the kitchen floor.", "options": ["stains", "shadows", "signals", "cracks"], "answer": "stains", "explanation": "<em>Coffee stains</em> là các vết cà phê bám trên bề mặt, khác với bụi rời dễ làm sạch."}, {"q": "To restart the frozen device, ________ and hold the power button for five seconds, then release it.", "options": ["turn", "raise", "press", "slide"], "answer": "press", "explanation": "<em>Press and hold a button</em> nghĩa là nhấn và giữ một nút."}, {"q": "To protect personal information, the technician recommended ________ automatic security updates rather than postponing them repeatedly.", "options": ["enable", "enabling", "to enable", "enabled"], "answer": "enabling", "explanation": "<em>Recommend + V-ing</em>. <em>Enable automatic updates</em> nghĩa là bật tính năng cập nhật tự động."}, {"q": "During the experiment, the research ________ prepared the equipment and recorded measurements while the lead scientist checked the procedure.", "options": ["assistance", "assist", "assisting", "assistant"], "answer": "assistant", "explanation": "Cần danh từ chỉ người làm chủ ngữ. <em>Research assistant</em> là trợ lý nghiên cứu."}, {"q": "The application may install successfully on an older laptop but still fail to ________ smoothly when several other programmes are open.", "options": ["run", "charge", "connect", "print"], "answer": "run", "explanation": "<em>Run smoothly</em> nghĩa là hoạt động trơn tru; cài đặt thành công không đảm bảo phần mềm chạy tốt."}, {"q": "The parental settings let adults ________ the amount of time children spend on games by setting a daily limit.", "options": ["describe", "predict", "control", "recognise"], "answer": "control", "explanation": "<em>Control the amount of time</em> là kiểm soát thời lượng sử dụng, ở đây bằng giới hạn hằng ngày."}, {"q": "Before choosing a laptop for demanding tasks, compare its ________ rather than judging it only by its appearance.", "options": ["speed processor", "processor speed", "processor speedy", "speedy processing"], "answer": "processor speed", "explanation": "<em>Processor speed</em> là tốc độ bộ xử lý; danh từ <em>processor</em> bổ nghĩa cho danh từ chính <em>speed</em>."}, {"q": "The voice-control feature allows users ________ the room temperature without touching the screen.", "options": ["adjusting", "adjust", "adjusted", "to adjust"], "answer": "to adjust", "explanation": "<em>Allow somebody to do something</em>: cho phép ai làm việc gì."}, {"q": "Although ________ vehicles can perform driving tasks automatically, they may still require human assistance in conditions their systems cannot handle.", "options": ["driverless", "driver", "driving", "drivers"], "answer": "driverless", "explanation": "<em>Driverless vehicles</em> là phương tiện không người lái. Trước <em>vehicles</em> cần tính từ mô tả loại phương tiện."}];
const START=41;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
