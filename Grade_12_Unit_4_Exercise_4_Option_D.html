<head>

<title>Grade 12 - Unit 4 - Exercise 4 - Option D</title>
<style>
*{box-sizing:border-box} :root{--ink:#263238;--paper:#fffdf8;--red:#b83b45;--gold:#d8a33c;--blue:#3f6680}
body{margin:0;min-height:100vh;padding:24px;font-family:Arial,sans-serif;color:var(--ink);
background:linear-gradient(#cfe7ef 0 30%,#ead6b9 30% 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
background-image:linear-gradient(90deg,transparent 49%,#8f7655 50%,transparent 51%),linear-gradient(transparent 49%,#8f7655 50%,transparent 51%);background-size:80px 80px}
.shell{max-width:1180px;margin:auto;position:relative}.hero{border-radius:26px 26px 0 0;padding:24px 28px;color:#fff;background:linear-gradient(120deg,#253b48,#3f6680 58%,#8d5f49);box-shadow:0 18px 45px #24343c35}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px}.logo{display:flex;gap:18px;align-items:center}.train{font-size:70px}
h1{margin:0;color:#ffe5a7;font-size:clamp(27px,4vw,42px)}.sub{font-weight:800;color:#e5f5fa;margin-top:7px}.sound{border:1px solid #ffe2a0;background:#fff8df;color:#3c5260;padding:11px 15px;border-radius:12px;font-weight:900;cursor:pointer}
.game{background:#f8f4ea;border-radius:0 0 26px 26px;overflow:hidden;box-shadow:0 20px 55px #27394335}.status{padding:14px 20px;background:#e4ddd0;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:13px;background:#c8c0b4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#b83b45,#d8a33c);transition:.3s}.pill{background:#fffaf0;border:1px solid #cfc4b2;border-radius:99px;padding:8px 13px;font-weight:900}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.reading{background:#fffaf0;border:2px solid #b99d72;border-radius:18px;padding:21px;line-height:1.72;max-height:690px;overflow:auto;box-shadow:inset 0 0 0 5px #efe1c9}
.reading h2{margin-top:0;color:#9d343d}.reading strong{color:#a33c43}.quiz{background:#fff;border:2px solid #b9c8ce;border-radius:18px;padding:21px}.tag{display:inline-block;background:#3f6680;color:#fff;border-radius:9px;padding:7px 12px;font-weight:900}.q{font-size:20px;line-height:1.5;margin:17px 0}
.answers{display:grid;gap:11px}.ans{border:2px solid #d4d8d8;background:#fff;border-radius:12px;padding:14px;text-align:left;font-size:16px;color:var(--ink);cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateX(4px);border-color:#668ca3;background:#f5fbfd}.ans.correct{background:#eaffef;border-color:#3aa267}.ans.wrong{background:#fff0f1;border-color:#c84e59}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.feedback.good{display:block;background:#eaffef;border-left:5px solid #3aa267}.feedback.bad{display:block;background:#fff0f1;border-left:5px solid #c84e59}.controls{text-align:right;margin-top:14px}.next{display:none;border:0;border-radius:11px;padding:12px 21px;background:linear-gradient(90deg,#9f3841,#c67e37);color:white;font-weight:900;cursor:pointer}
.result{display:none;background:#fffaf0;border-radius:26px;padding:35px;text-align:center;box-shadow:0 20px 55px #27394335}.result.show{display:block}.scoreBig{font-size:62px;font-weight:1000;color:#a03942}.review{text-align:left;margin-top:24px}.reviewItem{padding:13px 15px;margin:9px 0;border-radius:11px;background:#eee8dc;border-left:5px solid #567a90}.reviewItem.ok{border-color:#3aa267}.reviewItem.no{border-color:#c84e59}.restart{border:0;border-radius:11px;padding:12px 21px;background:#3f6680;color:#fff;font-weight:900;cursor:pointer}
.deco{position:fixed;pointer-events:none;opacity:.16;font-size:90px}.d1{left:1%;top:18%}.d2{right:1%;bottom:6%}
@media(max-width:900px){.main{grid-template-columns:1fr}.reading{max-height:430px}}@media(max-width:620px){.heroRow{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head><body>
<div class="deco d1">🚉</div><div class="deco d2">🧳</div>
<div class="shell"><header class="hero"><div class="heroRow"><div class="logo"><div class="train">🚂</div><div><h1>Grand Railway Expedition</h1><div class="sub">Grade 12 - Unit 4 - Exercise 4 - Option D</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div></header>
<section id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill">🎫 Score <span id="score">0</span>/6</div><div class="pill">🔥 Streak <span id="streak">0</span></div></div>
<div class="main"><article id="reading" class="reading"></article><section class="quiz"><div id="tag" class="tag"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="next" class="next">NEXT →</button></div></section></div></section>
<section id="result" class="result"><div style="font-size:80px">🚂🏆🎫</div><h2>Journey Complete!</h2><div id="final" class="scoreBig"></div><p id="message"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></section></div>
<script>
const Q=[{"q": "(1) ______, when urban populations grow faster than cities can adapt, the resulting pressure on infrastructure can seriously affect residents' quality of life.", "o": ["Therefore", "However", "Similarly", "Consequently"], "a": 1, "e": "<b>However</b> = tuy nhiên. Ý trước nói về lợi ích của đô thị hoá, còn ý sau chuyển sang mặt tiêu cực khi dân số đô thị tăng quá nhanh → quan hệ tương phản."}, {"q": "The construction of new homes often fails to (2) ______ pace with population growth.", "o": ["follow", "hold", "maintain", "keep"], "a": 3, "e": "Cụm cố định: <b>keep pace with</b> = theo kịp. → <i>keep pace with population growth</i>."}, {"q": "Heavy dependence on private vehicles not only contributes to air pollution but also (3) ______ considerable strain on existing road networks.", "o": ["places", "carries", "brings", "makes"], "a": 0, "e": "Collocation: <b>place strain on sth</b> = gây áp lực lên cái gì. → <i>places considerable strain on existing road networks</i>."}, {"q": "...making cities increasingly susceptible (4) ______ flooding.", "o": ["with", "for", "to", "from"], "a": 2, "e": "Cấu trúc: <b>be susceptible to + N/V-ing</b> = dễ bị ảnh hưởng/tổn thương bởi. → <i>susceptible to flooding</i>."}, {"q": "Disadvantaged communities may find it especially difficult to (5) ______ with rising living costs.", "o": ["manage", "overcome", "handle", "cope"], "a": 3, "e": "Cụm cố định: <b>cope with sth</b> = đối phó/xoay xở với một tình huống khó khăn. → <i>cope with rising living costs</i>."}, {"q": "...public resources are distributed (6) ______ among residents.", "o": ["equal", "equitably", "equality", "equitable"], "a": 1, "e": "Sau <i>are distributed</i> cần trạng từ bổ nghĩa cho cách phân bổ → <b>equitably</b> = một cách công bằng/hợp lý. Collocation: <i>distribute resources equitably</i>."}],PASSAGE="\n<h2>The Challenges of Urban Expansion</h2>\n<p>Urbanisation has contributed significantly to economic development by bringing businesses, workers, and services together in cities. This concentration can create employment opportunities and improve access to education and healthcare. <strong>(1) ______</strong>, when urban populations grow faster than cities can adapt, the resulting pressure on infrastructure can seriously affect residents' quality of life.</p>\n\n<p>One of the most pressing concerns is the growing demand for affordable housing. In rapidly expanding cities, the construction of new homes often fails to <strong>(2) ______</strong> pace with population growth. Consequently, rising rents may force low-income households to spend a substantial proportion of their income on accommodation or move further away from employment centres.</p>\n\n<p>Transport systems face similar difficulties. Heavy dependence on private vehicles not only contributes to air pollution but also <strong>(3) ______</strong> considerable strain on existing road networks. Expanding public transport can help address this problem, provided that services are reliable, affordable, and easily accessible.</p>\n\n<p>Urban expansion can also have serious environmental consequences. As natural surfaces are replaced by concrete, rainwater is less easily absorbed into the ground, making cities increasingly susceptible <strong>(4) ______</strong> flooding. At the same time, the loss of vegetation can contribute to higher urban temperatures.</p>\n\n<p>For urbanisation to bring lasting benefits, authorities need policies that balance economic development with social and environmental concerns. Particular attention should be paid to disadvantaged communities, which may find it especially difficult to <strong>(5) ______</strong> with rising living costs. Ultimately, successful urban development should ensure that economic opportunities are widely available and public resources are distributed <strong>(6) ______</strong> among residents.</p>\n",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,history=[],soundOn=true,audioCtx;const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.04,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(600,.08);tone(800,.1,.07);tone(1000,.12,.14)}function bad(){tone(170,.2)}$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tone(440,.05)}
function render(){answered=false;let x=Q[i];$("tag").textContent="Station "+(i+1)+" / "+Q.length;$("question").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");let ok=n===x.a;if(ok){score++;streak++;$("feedback").className="feedback good";$("feedback").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("feedback").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";history.push({n,ok});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tone(440,.05);if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.13,k*.08));let pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("message").textContent=pct===100?"Perfect journey! All stations cleared.":pct>=80?"Excellent work! You reached the final station.":pct>=60?"Good work. Review the missed stations below.":"Review the explanations and ride the route again.";let h="<h3>🚉 Station Review</h3>";Q.forEach((x,k)=>{let a=history[k];h+='<div class="reviewItem '+(a.ok?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("reading").innerHTML=PASSAGE;render();
</script></body></html>
