<script id="lesson-data" type="application/json">[{"id":"u9_ex10_C","unit":9,"unitName":"Career Paths","exercise":10,"level":"C","title":"Grade 12 Unit 9 - Exercise 10 - Set C","topic":"Learning, feedback and responsibility in a kitchen","kind":"listening_tf","questions":[{"number":1,"stem":"Daniel says that his interest in cooking made his first job easy from the start.","options":["True","False"],"answer":1,"explanation":"Anh thích nấu ăn nhưng nói rõ interest did not make every task easy; những ca đầu còn cần hướng dẫn và luyện tập."},{"number":2,"stem":"His supervisor's feedback helped him change the way he worked.","options":["True","False"],"answer":0,"explanation":"Người hướng dẫn chỉ ra vấn đề trong cách tổ chức, cho anh luyện lại; Daniel thay đổi thứ tự chuẩn bị và kiểm tra."},{"number":3,"stem":"Daniel's later certificate meant that he no longer needed to learn at work.","options":["True","False"],"answer":1,"explanation":"Anh phủ định việc đó: the certificate did not mean ... finished learning. Chứng chỉ và học tiếp tại nơi làm việc không loại trừ nhau."},{"number":4,"stem":"He now allocates tasks and checks that new staff understand them.","options":["True","False"],"answer":0,"explanation":"Vai trò hiện tại bao gồm allocating tasks và checking ... understood, không phải tự làm toàn bộ công việc."},{"number":5,"stem":"Daniel advises pupils to choose a training course before checking its practical arrangements.","options":["True","False"],"answer":1,"explanation":"Cuối bài anh yêu cầu hỏi về practice, supervision và timetable trước khi chọn khóa học, ngược với statement."}],"range":"","passage":"","transcript":"I am Daniel, a head chef, and my route began with a supervised kitchen job after school. I enjoyed cooking, but that interest did not make every task easy. During my first few weeks, I could prepare individual ingredients, yet I struggled to organise several tasks for the same service. My supervisor watched how I worked and gave specific feedback. I changed the order in which I prepared and checked things, then practised the revised routine. Later, I took a course alongside work. Its certificate recorded the training I had completed; it did not mean that I had finished learning. A new menu or a different team could still require me to adapt. As head chef, I now allocate tasks and check that new staff have understood them. Doing everything myself would leave others without a chance to develop and would make coordination harder. I also discuss working hours with applicants, including the evening shifts involved here. For pupils considering a course, my advice is to ask about supervised practice, feedback and the timetable before choosing. An attractive course title is a starting point for questions, rather than enough information for a decision.","wordbank":[],"note":"","filename":"Grade_12_Unit_9_Exercise_10_Set_C.html","audio":"data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OExAAiWyXwphmMMRABQLgAiW7uSd6Yg5NM8HTMCFHptewhl69oYff73ZYDJ6YhERcECDpsQwgAEAcBpmABDsQIIOTJp7EODhdmEE9j/Ynd4OF0CBBCQiIYhDk7juTJ0QACgQIknsQ5NByZPfbIHptGX4ILMIGIH2enZ5MoEUDhawcL0xB78doh79////9CybADL2jI6lyZeQgYXYcAhhLIhSgdOkE76QQy3i/+uxV0zXksn2pq+Ffq9fe+3rjF//OExCklgsI0AHmYRC87eYRLe6BwJyiJCZZCkJhfEdp2IlltirDpLejc1hYwSHT9t6v0bP35pp2rHAsPnERXBuAOAcRxDEc/XjgFCwSGVURm+vfhfv/JCZAtM3/p2r4vgMDyES1dGnCur1g81JGyJatszSHk9z8ERS8GQLQxiJ5sHrAWTMGECosaAN+XCHUYJHCRBSbH7bE2nPzFnreJYR41HC1AsJDgIyig0BNieD7SBzH+1qRkY1tFv3ze2Q1z//OExEY4iso1YMaeGBGaGwKqrYXw9D0H2EwQ46Al5Sl7OYlitSjHEJeaQxiEk+H2r1OHEc5oJUxnh/Q1IwqhphObM7XkUbj04jkMIjRBDFDhJ0e5LhMiUg3iXK4booFMaigZjkGotl/Bft6oHkcZMx2Gyd5YkuqIZhHyfh0VP5G6YVQUcFDksr0RGHapSNDxJITYOMCGArB0BlGqdJvENHGjVAxViRoztNWQu0gKN3IBViyrahqGxpx8gdMBGJRB//OExBYp+ro8AMvYJCSJRaOTlY34koA4lQdmWj4JQGuLtm0vT0a6Wobdej2adRtnoSolzBaEEKV1BCLSGfFZs5WqSUHKmqY3Claerea7+W800/RLTTkQVKEfCk/dJp0gjqcBEEJJHAAx+PUMYFlRWwulYQgPDkgmSUdVteZZOYjl21EMxPI04JHycERABsrZLMJNKQAwyRD+LTmPnglQHmNYbIgCjFJP5vr4UKu8tiiUtYtm2i0ytDxwzXK <script>
'use strict';
const LESSONS=JSON.parse(document.getElementById('lesson-data').textContent);
const DEFAULT_LESSON="u9_ex10_C";
const APPENDIX_HTML="<article><h2>1. Cụm động từ: học cả cụm và ngữ cảnh<\/h2><p>Với những cụm ba thành phần dưới đây, đặt tân ngữ sau thành phần cuối:<br><b>keep up with changes:<\/b> theo kịp thay đổi.<br><b>put up with noise:<\/b> chịu đựng tiếng ồn.<br><b>live up to expectations:<\/b> đáp ứng kỳ vọng.<br><b>come up with an idea:<\/b> nghĩ ra một ý tưởng.<br><b>run out of time:<\/b> hết thời gian.<br><b>cut down on waste:<\/b> cắt giảm lượng lãng phí.<br><b>fall back on a skill:<\/b> dựa vào một kỹ năng khi cần phương án dự phòng.<br><b>make up for a delay:<\/b> bù đắp cho sự chậm trễ.<\/p><p>Không áp dụng một quy tắc tách cụm cho mọi động từ nhiều thành phần. Ví dụ <b>take something into account<\/b>: cân nhắc điều gì; cũng gặp take into account + cụm danh từ. Luôn kiểm tra cấu trúc đi kèm từ cụ thể.<\/p><\/article>\n<article><h2>2. To + V-ing trong ba cụm cần nhớ<\/h2><p><b>look forward to + danh từ / V-ing:<\/b> mong đợi.<br>I look forward to hearing your feedback.<br><b>get down to + danh từ / V-ing:<\/b> bắt tay nghiêm túc vào việc.<br>We got down to reviewing the applications.<br><b>get round to + danh từ / V-ing:<\/b> cuối cùng cũng thu xếp làm được việc.<br>She got round to updating her portfolio.<\/p><p>Trong ba cụm này, <b>to là giới từ<\/b>, không phải dấu hiệu của động từ nguyên mẫu. Vì vậy dùng hearing, reviewing, updating. Ngược lại: want to apply, plan to study dùng động từ nguyên mẫu.<\/p><\/article>\n<article><h2>3. Phân biệt các cụm dễ nhầm<\/h2><table><thead><tr><th>Cụm<\/th><th>Nghĩa trong bài<\/th><th>Ví dụ mới<\/th><\/tr><\/thead><tbody><tr><td>stand in for<\/td><td>Làm thay người tạm vắng<\/td><td>Mai will stand in for the absent host.<\/td><\/tr><tr><td>stand up for<\/td><td>Bảo vệ, ủng hộ người hoặc quyền lợi<\/td><td>They stand up for the trainees' right to fair feedback.<\/td><\/tr><tr><td>stand up to<\/td><td>Chống lại, không chịu khuất phục trước người đối xử tệ<\/td><td>She stood up to the bully.<\/td><\/tr><tr><td>look up to<\/td><td>Kính trọng, ngưỡng mộ<\/td><td>I look up to the patient supervisor.<\/td><\/tr><tr><td>look down on<\/td><td>Coi thường<\/td><td>Do not look down on a different training route.<\/td><\/tr><tr><td>get on with<\/td><td>Hòa thuận với; hoặc tiếp tục làm, tùy ngữ cảnh<\/td><td>He gets on with his colleagues.<\/td><\/tr><tr><td>check up on<\/td><td>Kiểm tra tình hình, xem có ổn/đúng yêu cầu không<\/td><td>The tutor checked up on the trainees' progress.<\/td><\/tr><tr><td>get through to<\/td><td>Liên lạc được; hoặc làm ai hiểu, tùy ngữ cảnh<\/td><td>I finally got through to the coordinator by phone.<\/td><\/tr><\/tbody><\/table><p>Đọc người/vật theo sau và mục đích hành động. Stand up for a trainee bảo vệ học viên; stand up to a bully chống lại kẻ bắt nạt. Hai cách dùng không thay thế nhau trong cùng một tình huống.<\/p><\/article>\n<article><h2>4. Từ vựng và phạm vi kết luận về nghề nghiệp<\/h2><p><b>qualify<\/b> (động từ) → <b>qualification<\/b> (danh từ) → <b>qualified<\/b> (tính từ).<br><b>supervise<\/b> → <b>supervision<\/b> → <b>supervisor<\/b>.<br><b>relevant<\/b> → <b>relevance<\/b>; <b>obsolete<\/b> → <b>obsolescence<\/b>.<br><b>work experience:<\/b> kinh nghiệm làm việc; khi nói chung, experience không đếm được.<br><b>qualified applicant:<\/b> ứng viên đáp ứng yêu cầu; <b>a qualified conclusion:<\/b> kết luận có giới hạn/điều kiện — đọc ngữ cảnh để chọn nghĩa.<\/p><p>Một chứng chỉ ghi nhận việc hoàn thành/đạt yêu cầu của chương trình cụ thể; nó không tự bảo đảm việc làm hoặc mọi năng lực trong mọi bối cảnh. Một thay đổi ở nhiệm vụ không tự chứng minh toàn bộ nghề sẽ biến mất. Hai ví dụ cá nhân không đại diện cho mọi người thuộc một thế hệ.<\/p><p>Khi viết thư ứng tuyển, nêu ví dụ liên quan và phân biệt đóng góp cá nhân với kết quả nhóm. Với câu paraphrase/suy luận, giữ đúng may/can/some; không tự đổi thành always/all/guarantees. Với câu chèn, kiểm tra liên kết ở cả câu trước và câu sau.<\/p><\/article>";
const ALL_IN_ONE=false;
const app=document.getElementById('app');
const DBKEY='yenpham_g12_u9_sets_bcd_v1';

const fmt=sec=>{sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;};

const footer=()=>'<footer class="footer"><span>THPT English Practice · Developed &amp; Curated by Yen Pham, M.A.</span><span>Global Success 12 · Unit 9</span></footer>';

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3500);}
function stopAudio(){for(const a of document.querySelectorAll('audio'))a.pause();}
function stopClock(){if(clock){clearInterval(clock);clock=null;}}
function timeNow(){return state?Math.floor((Date.now()-state.startedAt)/1000):0;}
function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Điền họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Mỗi lần chọn sai mất 1 tim; bạn được thử lại. Sau khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 tính theo lần chọn đầu</b>. Số câu đã nắm được sau khi thử lại được báo riêng. Đạt 5 câu đúng liên tiếp sẽ hồi 1 tim, tối đa 5 tim.</p><p>Khi làm lại, câu rời và đáp án được trộn. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu để dễ đối chiếu. Kết quả lưu trên trình duyệt đang dùng.</p><p>Set B củng cố kiến thức vừa học. Set C tăng độ khó khoảng 30% theo mục tiêu thiết kế bằng ngữ cảnh, liên kết và suy luận. Set D tăng yêu cầu xử lý bằng chứng, diễn đạt tương đương và đọc hiểu theo hướng THPT 2026. Trọng tâm ngữ pháp: cụm động từ, đặc biệt các cụm ba thành phần và dạng V-ing sau to trong look forward to, get down to, get round to.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}
function openModal(fn){lastFocus=document.activeElement;modalResolve=fn;document.getElementById('modal').classList.remove('hidden');document.getElementById('modalConfirm').focus();}
function closeModal(ok){document.getElementById('modal').classList.add('hidden');const fn=modalResolve;modalResolve=null;lastFocus?.focus();if(ok&&fn)fn();}
function ask(title,text,fn,confirm='Nộp bài'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').innerHTML=`<p>${esc(text)}</p>`;document.getElementById('modalCancel').classList.remove('hidden');document.getElementById('modalConfirm').textContent=confirm;openModal(fn);}

document.addEventListener('keydown',e=>{if(document.getElementById('modal').classList.contains('hidden'))return;const focusable=[...document.getElementById('modal').querySelectorAll('button')].filter(x=>!x.classList.contains('hidden'));if(e.key==='Escape'){closeModal(false);e.preventDefault();}if(e.key==='Tab'&&focusable.length){const a=focusable[0],b=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}});

function renderHome(){stopClock();stopAudio();active=null;state=null;document.title='Grade 12 Unit 9 - Sets B, C & D';app.innerHTML=`<section class="hero"><div><p class="eyebrow">Grade 12 / Global Success / Unit 9</p><h1>Explore your path.<span>Make an informed choice.</span></h1><p class="lead">Career Paths.<br>Hiểu nghề nghiệp, luyện cụm động từ và lựa chọn có căn cứ.<br>Chọn Set B, C hoặc D để luyện theo từng bước.</p><div class="pills"><span class="pill accent">Exercise 1 · 15 câu cốt lõi/bài</span><span class="pill">3 set · B / C / D</span><span class="pill">Giải thích tiếng Việt</span></div></div><aside class="heroart"><div class="artcaption">Explore. Reflect. Grow.</div><div class="artline">A clearer direction.<br>Your next step.</div><div class="artsmall">Read carefully.<br>Think independently.</div><div class="equal" aria-hidden="true">U9</div></aside></section><div class="statsbar"><div class="stat"><strong>${LESSONS.length}</strong><span>Bài thực hành</span></div><div class="stat"><strong>${LESSONS.reduce((n,l)=>n+l.questions.length,0)}</strong><span>Câu có giải thích</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.transcript).length}</strong><span>Audio nhúng sẵn</span></div><div class="stat"><strong id="completedCount">0</strong><span>Bài đã luyện tại đây</span></div></div><section aria-labelledby="catalogTitle"><div class="cataloghead"><div><p class="eyebrow" style="margin-bottom:6px">Choose your next step</p><h2 id="catalogTitle">Chọn bài luyện tập</h2><p>Exercise 1 có 5 bài/set, mỗi bài đúng 15 câu cốt lõi.</p></div><div class="filters" role="group" aria-label="Lọc set"><button class="filter" data-filter="all">Tất cả</button><button class="filter" data-filter="B">Set B</button><button class="filter" data-filter="C">Set C</button><button class="filter" data-filter="D">Set D</button></div></div><input class="search" id="lessonSearch" type="search" placeholder="Tìm Exercise, số câu hoặc kỹ năng…" aria-label="Tìm bài luyện tập" value="${esc(search)}"><div class="cards" id="cards"></div></section><details class="catalog-note"><summary>Phạm vi và mức độ của từng set</summary><p>Đủ Exercise 1–11. Mỗi set có 15 bài, 141 câu. Exercise 1 có 75 câu mới/set, chia 5 bài × 15 câu; các trọng tâm trong 86 câu mẫu được tuyển chọn và tái nhóm theo kỹ năng.</p><p>Set B: củng cố kiến thức. Set C: khó hơn khoảng 30% theo mục tiêu thiết kế, với ngữ cảnh, liên kết và yêu cầu phân tích sâu hơn. Set D: vận dụng theo hướng THPT 2026, tập trung bằng chứng, phạm vi kết luận, diễn đạt tương đương, chèn câu và suy luận.</p><p>Đây là bộ luyện theo Unit. Hai bài nghe của tài liệu được giữ ở cả ba set. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu; câu rời, sắp xếp và phương án được trộn khi làm lại.</p><p>Nhân vật, nơi làm việc và chương trình trong bài là giả định phục vụ học tập. Sáu audio dùng giọng tổng hợp, nhúng sẵn để nghe không cần mạng. Kết quả lưu trên trình duyệt đang dùng.</p></details><div class="catalog-note"><b>Ôn nhanh trước khi luyện</b><p>Phân biệt stand in for / stand up for / stand up to, look up to / look down on; luyện V-ing sau to trong các cụm đã học.</p><button class="secondary" id="appendixBtn">Ôn nhanh cụm động từ</button></div>${footer()}`;

value.trim().replace(/\s+/g,' ');if(!name){document.getElementById('nameError').textContent='Em hãy nhập họ tên trước khi bắt đầu.';return;}db.name=name;save();startLesson(false);};window.scrollTo({top:0,behavior:'instant'});}
function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange','wordform','verbform'].includes(l.kind))qs=shuffle(qs);return qs;}
function startLesson(restart){stopClock();stopAudio();if(restart){db.restarts[active.id]=(db.restarts[active.id]||0)+1;save();}state={lesson:active,questions:makeQuestions(active),index:0,hearts:5,xp:0,combo:0,maxCombo:0,firstCorrect:0,startedAt:Date.now(),finished:false,transcriptSeen:false,plays:0,restarts:db.restarts[active.id]||0,answers:{}};for(const q of state.questions)state.answers[q.number]={attempts:0,firstCorrect:false,done:false,wrong:[],selected:null};renderWork();clock=setInterval(()=>{const el=document.getElementById('timer');if(el&&!state.finished)el.textContent=fmt(timeNow());},1000);}
function passageHTML(l){const lines=l.passage.split('\n').filter(Boolean);if(!lines.length)return '';const title=lines.shift();return `<h2>${esc(title)}</h2>`+lines.map(t=>'<p>'+esc(t).replace(/^\[(\d+)\]/,'<span class="paragraphnum">$1</span>').replace(/\((\d+)\) _____/g,(_,n)=>`<button type="button" class="blank" data-jump="${n}" aria-label="Đến chỗ trống ${n}">(${n}) _____</button>`)+ '</p>').join('');}
function audioHTML(l){return `<div class="audiobox"><h3>Audio luyện nghe</h3><audio id="listeningAudio" controls preload="metadata" src="${l.audio}"></audio><div class="audiorow"><span>Giọng đọc tổng hợp · Nghe lại tùy nhu cầu</span><label>Tốc độ <select id="audioSpeed" aria-label="Tốc độ nghe"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option></select></label></div></div><details class="transcript" id="transcript"><summary>Mở transcript để tự học</summary><p class="finenote">Để luyện nghe, em hãy trả lời trước khi mở transcript.</p>${l.transcript.split('\n').filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}</details>`;}
function renderWork(){const l=state.lesson;const withContext=!!(l.passage||l.transcript||l.wordbank.length);app.innerHTML=`<section class="lessonintro"><p class="eyebrow">Unit ${l.unit} · ${TYPES[l.kind]} · Set ${l.level}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.topic)}</p>${l.note?`<p class="finenote">${esc(l.note)}</p>`:''}</section><div class="toolbar"><span class="person">${esc(db.name)}</span><div class="metrics"><span class="metric" id="heartMetric"></span><span class="metric">XP <strong id="xp">0</strong></span><span class="metric">Combo <strong id="combo">0</strong></span><span class="metric">Thời gian <strong id="timer">00:00</strong></span></div></div><div class="progressbar" role="progressbar" id="progressBar" aria-label="Số câu đã trả lời đúng" aria-valuemin="0" aria-valuemax="${l.questions.length}" aria-valuenow="0"><div id="progressFill"></div></div><div class="workgrid ${withContext?'':'solo'}">${withContext?`<aside class="passagebox"><details id="contextDetails" open><summary>${l.transcript?'Bài nghe & transcript':l.passage?'Đoạn văn · giữ nguyên thứ tự câu':'Ngân hàng từ'}</summary>${l.wordbank.length?`<div class="wordchips">${l.wordbank.map(w=>`<span class="wordchip">${esc(w)}</span>`).join('')}</div><p class="finenote">${l.kind==='wordform'?'Dùng dạng phù hợp của từ gốc.':'Dùng mỗi mục phù hợp một lần; giữ đúng cụm từ nếu có.'}</p>`:''}${l.passage?`<div id="passageText">${passageHTML(l)}</div>`:l.transcript?audioHTML(l):''}</details></aside>`:''}<section><div class="questionbox" id="questionArea"></div><nav class="qnav" id="questionNav" aria-label="Chọn câu hỏi"></nav><p class="navhint">Viền xanh: câu đang xem · Nền xanh: đã đúng · Nền vàng: đã thử</p></section></div><div class="underactions"><button class="textbtn" id="restartBtn">Làm lại &amp; trộn bài</button><button class="secondary" id="submitBtn">Nộp bài / Xem kết quả</button></div>${footer()}`;
 document.getElementById('restartBtn').onclick=()=>ask('Làm lại từ đầu?','Lượt đang làm sẽ kết thúc mà không lưu điểm. Câu rời và đáp án được trộn; thứ tự bài đọc/nghe được giữ nguyên.',()=>startLesson(true),'Làm lại');document.getElementById('submitBtn').onclick=()=>{const un=state.questions.filter(q=>!state.answers[q.number].done).length;ask('Nộp bài?',un?`Còn ${un} câu chưa trả lời đúng. Điểm lần chọn đầu vẫn được lưu; câu chưa trả lời tính 0 điểm.`:'Tất cả câu đã được trả lời đúng. Lưu kết quả lượt này?',()=>finish('submitted'));};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const idx=state.questions.findIndex(q=>q.number===Number(b.dataset.jump));if(idx>=0){state.index=idx;renderQuestion(true);}});
 if(l.transcript){const a=document.getElementById('listeningAudio');a.onplay=()=>state.plays++;a.onerror=()=>toast('Không phát được audio trên trình duyệt này. Thử mở MP3 trong thư mục audio của gói ZIP.');document.getElementById('audioSpeed').onchange=e=>a.playbackRate=Number(e.target.value);document.getElementById('transcript').ontoggle=e=>{if(e.target.open)state.transcriptSeen=true;};}renderQuestion();window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;const ready=typed?String(a.selected||'').trim().length>0:a.selected!==null&&!a.wrong.includes(a.selected);document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2>${typed?`<label class="finenote" for="typedAnswer">${state.lesson.kind==='ordering'?'Nhập chuỗi chữ cái theo thứ tự':'Nhập từ hoặc cụm từ phù hợp'}</label><input class="answerinput" id="typedAnswer" aria-labelledby="questionStem" value="${esc(a.selected||'')}" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" ${a.done?'disabled':''}><p class="finenote">Không phân biệt chữ hoa/thường. Có thể bấm Enter để kiểm tra.</p>`:`<div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?`<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>${typed?`Lần nhập trước: “${esc(a.wrong[a.wrong.length-1])}”. Chú ý dạng từ, cấu trúc và ngữ cảnh.`:'Đọc kỹ ngữ cảnh hoặc nghe lại trước khi chọn.'} Mỗi lần sai mất 1 tim.</div>`:''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||!ready?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 if(typed){const input=document.getElementById('typedAnswer');input.oninput=()=>{a.selected=input.value;document.getElementById('checkBtn').disabled=!input.value.trim();};input.onkeydown=e=>{if(e.key==='Enter'&&!a.done&&input.value.trim()){e.preventDefault();checkAnswer();}};}else{document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});}
 document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};
 document.getElementById('questionNav').innerHTML=state.questions.map((x,i)=>{const r=state.answers[x.number];return `<button class="${i===state.index?'current':''} ${r.done?'done':''} ${r.attempts?'attempted':''}" data-nav="${i}" aria-label="Câu ${x.number}${r.done?', đã đúng':''}" ${i===state.index?'aria-current="step"':''}>${x.number}</button>`;}).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.nav);renderQuestion(true);});document.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('active',Number(b.dataset.jump)===q.number));updateMetrics();if(focus)document.getElementById('questionStem').focus({preventScroll:false});}
function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;if(a.done||a.selected===null)return;if(typed&&!String(a.selected).trim())return;if(!typed&&a.wrong.includes(a.selected))return;const correct=typed?q.accepted.some(x=>normalise(x,state.lesson.kind)===normalise(a.selected,state.lesson.kind)):a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='D'?'d':s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(correctText(q))}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Grade12_Unit9_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.wordbank.length?`<p><b>Word box:</b> ${l.wordbank.map(esc).join(' · ')}</p>`:''}${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.accepted?'Answer: __________________________________________':q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}

function correctText(q){return q.accepted?q.accepted[0]:q.options[q.answer];}
function normalise(text,kind){let t=String(text).normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'");if(kind==='ordering')return t.replace(/[^a-z]/g,'');return t.replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function renderAppendix(){stopClock();stopAudio();active=null;state=null;app.innerHTML=`<section class="lessonintro"><button class="back" id="appendixBack">Danh mục lớp 12</button><p class="eyebrow">Phần tham khảo bổ sung · Không tính điểm</p><h1>Ôn nhanh · Unit 9</h1></section><section class="resource">${APPENDIX_HTML}</section>${footer()}`;document.getElementById('appendixBack').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}

window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
