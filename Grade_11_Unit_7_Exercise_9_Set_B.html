<script id="lesson-data" type="application/json">[{"id":"u7_ex9_B","unit":7,"unitName":"Education and Career Pathways","exercise":9,"level":"B","title":"Grade 11 Unit 7 - Exercise 9 - Set B","topic":"Listening: a first year studying abroad","kind":"listening_tf","questions":[{"number":1,"stem":"Daniel is describing a fictional first year studying in Viet Nam.","explanation":"Mở bài nói “a fictional account ... my first year studying in Viet Nam”.","options":["True","False"],"answer":0},{"number":2,"stem":"His host family refused to help when daily routines felt unfamiliar.","explanation":"Host family giải thích thói quen và khuyến khích hỏi; không từ chối giúp.","options":["True","False"],"answer":1},{"number":3,"stem":"He says that he is completely fluent in Vietnamese now.","explanation":"Người nói nói rõ “not completely fluent”; đã tiến bộ không đồng nghĩa thông thạo hoàn toàn.","options":["True","False"],"answer":1},{"number":4,"stem":"Planning spending helped him understand his living costs.","explanation":"Transcript nêu ghi expenses để biết mức chi thực tế mỗi tuần và tránh đoán chi phí.","options":["True","False"],"answer":0},{"number":5,"stem":"He believes the experience has increased his confidence and cultural awareness.","explanation":"Câu kết nêu more confident và more aware of cultural differences.","options":["True","False"],"answer":0}],"range":"","passage":"","transcript":"My name is Daniel, and this is a fictional account for your listening lesson. I am describing my first year studying in Viet Nam. At first, some daily routines were unfamiliar. I sometimes misunderstood when to ask a question or how a shared meal was organised. My host family explained things patiently and encouraged me to ask rather than pretend I understood.\nMy Vietnamese has improved, but I am not completely fluent. I can manage more everyday conversations, and I still need help with complex explanations. Keeping a record of new expressions has been useful.\nI also learnt to plan my spending. By recording expenses, I could see what I was spending each week instead of guess how much money remained. That was part of becoming more independent, not a sign that I could never ask for advice.\nThe year has made me more confident and more aware of cultural differences. I have learnt that adapting involves listening, making mistakes and reviewing what happens, rather than understanding everything immediately.","wordbank":[],"note":"Lời kể giả định mới; không phải bản ghi âm gốc của tài liệu.","filename":"Grade_11_Unit_7_Exercise_9_Set_B.html","audio":"data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAKEgAHjkAAAwUICg0PEhQXGhwfISQnKSsuMTM2ODs+QEJFSEpNT1JVV1lcX2FkZmlsbnBzdnh7fYCDhYeKjY+SlJaanJ6hpKapq66xs7W4u73AwsXIyszP0tTX2dzf4eTm6evu8PP2+Pv9AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQC+wAAAAAAB45A7IufZwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//OExAAiOyYAJsPMJTADiGGsOoIRgpcDmwBkOBbiXMAAQhEkMiSbZ43n6YQQz+Iz9oiiE7ERadpsQiHB1kzMtnoEUCAAIexYDT5YDJk1kEIz7njxjaQIYeTKCHACF22Xe+D07swg5ByZMpA+iCexBBBz7/vexmX4/aCCBYRn8Y55NVnk98f3////////JAhg8ejEB48QgAKE3GGgDh6SbRBYo+9/WtxyUZrTYZCrhiyqUZkHsZdY2EDI/t1oHaaT//OExCokOsIgDsGSeBIgwkQEjDS65OwwQID5CfhFInTXNMoZEjCJhCQIEyZu22E0TL6c9zZYUMlzQYRIV28YhBPrpLHUcEahPrk53pMwYeRsHIqXjoUonKE26jC21EH5HpldN7FRUPUd28eCYz/K22GA898WEkAMzMoyAonaCSJcdNTpr0pI9dBVH+aglqCRcoZSR+lP6yr8IhYmRzFS8wbOIUTTq00iRIQtM6YE70yiOcmlBSwGloOJ1EDaRRWZ//OExEwlcsIcANGSWTyRUiMkgOiwpARoUroAssmCrigqIyRG9pYcPCtJk8mUGC7cBSoFgVmGiBVILHCr6YESK1IoCi5PJIjNHzovyZgSQKnTKWTdLZFZARJlzk15CkZhSG6G8enKOSxVZMCkFA07QWhK66cxSSEtBM9kjsiPZVNEL3DjOxJ6nEVB4VKEIjLGkrc0MwnOGpHg/AnYXMKpoXDZKMI6IiwHLiMUMKIVBaJGFlnMHlrTmgJgwTKmlSES//OExGklesIYAMmSeRtco2mmOjqq6gpkjR6TIlDSFDbkhUI21TBAqWCpBZFQ6gEZonbhJGuwygFPThAHgVOM8IDIGFWrCXuWABVgxPTnn7Ce49lFOjDFuxhiNH8qvkGZkh2u6x5h5Plnidob6AhcTNyZG2xUgfcjcjUCFowjQM3BnRQS2qVFmqJ6PChERmdHEJIhZJyamGBuUEjxAI0PKrRWIrk6JdHODyN0iWEEClT0XYQFlfHmVESKTXXbQoIL//OExIYkyr4cJsmSPArboSAluX8yYxGZLg7VMCkEcEAQDKRi3ZcZnMNyEmC <script>
'use strict';
const LESSONS=JSON.parse(document.getElementById('lesson-data').textContent);
const DEFAULT_LESSON="u7_ex9_B";
const APPENDIX_HTML="<article><h2>Ngữ điệu trọng tâm<\/h2><p><b>Unit 6:<\/b> câu trần thuật và mệnh lệnh thông thường xuống giọng ở cuối. Với danh sách, các mục chưa kết thúc thường lên giọng nhẹ; mục cuối xuống giọng.<\/p><p>Our class will visit the museum. [fall]<br>Keep to the marked path. [fall]<br>We saw old houses [level-rise], workshops [level-rise] and a wooden bridge [fall].<\/p><p><b>Unit 7:<\/b> câu hỏi Yes/No thường lên giọng; câu hỏi Wh- thông thường xuống giọng. Đây là mẫu cốt lõi; sắc thái giao tiếp có thể làm thay đổi ngữ điệu.<\/p><p>Does the course include practice? [rise]<br>When does the course begin? [fall]<\/p><\/article>\n<article><h2>Making appointments<\/h2><p><b>Set B:<\/b> Ask to meet a course adviser. Suggest a time, ask for confirmation and thank the adviser.<br><b>Useful language:<\/b> Could I make an appointment ...? / Would Tuesday morning suit you? / What time would be convenient? / Thank you. I will see you then.<\/p><p><b>Set C:<\/b> The first proposed time is unavailable. Respond politely, suggest another time and confirm both the purpose and the arrangement.<br><b>Useful language:<\/b> I'm afraid I can't manage that time. / Would ... be possible instead? / I would like to discuss ... / May I confirm that ...?<\/p><\/article><article><span class=\"settag\">Set B · Writing<\/span><h2>A formal request for course information<\/h2><p>Write a formal letter of 140–170 words to a vocational school. Request information about a technical course. Ask about entry requirements, duration, timetable, fees and practical training. Explain briefly why the details would help you.<\/p><p class=\"finenote\">Tự kiểm tra: mục đích rõ; yêu cầu đủ chi tiết; bố cục mở–thân–kết; giọng lịch sự; ngữ pháp và chính tả. Bài viết tự luận không được chấm điểm tự động.<\/p><details><summary>Bài mẫu tham khảo · 162 từ<\/summary><p>Dear Course Adviser,\n\nI am writing to request further information about your technical maintenance course. I will finish secondary school this year and would like to develop practical skills before deciding on my next stage of education.\n\nCould you please tell me the entry requirements and the next application deadline? I would also appreciate details of the course duration, weekly timetable and tuition fees. In particular, I would like to know whether equipment is provided or whether learners must buy it separately.\n\nYour brochure mentions practical training. Could you explain where this takes place, who supervises the tasks and how learners receive feedback? Information about any apprenticeship opportunities would also be useful.\n\nFinally, please let me know whether there are opportunities for further study after completing the course. These details would help me compare the programme with other options and discuss the total costs with my family.\n\nThank you for your time. I look forward to your reply.\n\nYours faithfully,\nLinh Nguyen<\/p><\/details><\/article><article><span class=\"settag\">Set C · Writing<\/span><h2>A formal request for course information<\/h2><p>Write a formal letter of 140–170 words after reading an incomplete course advertisement. Ask for clarification about supervised practice, assessment, total costs and possible progression. Distinguish a possible opportunity from guaranteed entry, and explain your own planning needs.<\/p><p class=\"finenote\">Tự kiểm tra: mục đích rõ; yêu cầu đủ chi tiết; bố cục mở–thân–kết; giọng lịch sự; ngữ pháp và chính tả. Bài viết tự luận không được chấm điểm tự động.<\/p><details><summary>Bài mẫu tham khảo · 162 từ<\/summary><p>Dear Course Adviser,\n\nHaving read the summary of your programme, I would be grateful for clarification before submitting an application. I am interested in practical training, but I also hope to keep suitable opportunities for further study open.\n\nThe brochure refers to supervised experience without explaining how it is organised. Could you specify the balance between demonstrations, independent practice and workplace tasks? I would also like to know how progress is assessed and what support is available when a learner needs additional practice.\n\nPlease could you provide the entry requirements, application deadline and full fee information, including any separate equipment costs? As I may need to travel, a weekly timetable would help me estimate the total commitment.\n\nFinally, does completing the programme create any progression opportunities, and what additional conditions would apply? I understand that a possible route is not the same as guaranteed admission.\n\nThank you for considering my questions. I look forward to receiving the information.\n\nYours faithfully,\nMinh Tran<\/p><\/details><\/article>";

function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Điền họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Mỗi lần chọn sai mất 1 tim; bạn được thử lại. Sau khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 tính theo lần chọn đầu</b>. Số câu đã nắm được sau khi thử lại được báo riêng. Đạt 5 câu đúng liên tiếp sẽ hồi 1 tim, tối đa 5 tim.</p><p>Khi làm lại, câu rời và đáp án được trộn. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu để dễ đối chiếu. Kết quả lưu trên trình duyệt đang dùng.</p><p>Set B củng cố kiến thức vừa học. Set C tăng độ khó khoảng 30% bằng ngữ cảnh, phương án gần nhau và suy luận. Unit 6 luyện to-infinitive; Unit 7 luyện perfect gerunds và perfect participle clauses.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}
function openModal(fn){lastFocus=document.activeElement;modalResolve=fn;document.getElementById('modal').classList.remove('hidden');document.getElementById('modalConfirm').focus();}
function closeModal(ok){document.getElementById('modal').classList.add('hidden');const fn=modalResolve;modalResolve=null;lastFocus?.focus();if(ok&&fn)fn();}
function ask(title,text,fn,confirm='Nộp bài'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').innerHTML=`<p>${esc(text)}</p>`;document.getElementById('modalCancel').classList.remove('hidden');document.getElementById('modalConfirm').textContent=confirm;openModal(fn);}
document.getElementById('modalCancel').onclick=()=>closeModal(false);

function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange','wordform','verbform'].includes(l.kind))qs=shuffle(qs);return qs;}

function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;const ready=typed?String(a.selected||'').trim().length>0:a.selected!==null&&!a.wrong.includes(a.selected);document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2>${typed?`<label class="finenote" for="typedAnswer">${state.lesson.kind==='ordering'?'Nhập chuỗi chữ cái theo thứ tự':'Nhập từ hoặc cụm từ phù hợp'}</label><input class="answerinput" id="typedAnswer" aria-labelledby="questionStem" value="${esc(a.selected||'')}" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" ${a.done?'disabled':''}><p class="finenote">Không phân biệt chữ hoa/thường. Có thể bấm Enter để kiểm tra.</p>`:`<div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?`<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>${typed?`Lần nhập trước: “${esc(a.wrong[a.wrong.length-1])}”. Chú ý dạng từ, cấu trúc và ngữ cảnh.`:'Đọc kỹ ngữ cảnh hoặc nghe lại trước khi chọn.'} Mỗi lần sai mất 1 tim.</div>`:''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||!ready?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 if(typed){const input=document.getElementById('typedAnswer');input.oninput=()=>{a.selected=input.value;document.getElementById('checkBtn').disabled=!input.value.trim();};input.onkeydown=e=>{if(e.key==='Enter'&&!a.done&&input.value.trim()){e.preventDefault();checkAnswer();}};}else{document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});}
 document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};

function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;if(a.done||a.selected===null)return;if(typed&&!String(a.selected).trim())return;if(!typed&&a.wrong.includes(a.selected))return;const correct=typed?q.accepted.some(x=>normalise(x,state.lesson.kind)===normalise(a.selected,state.lesson.kind)):a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(correctText(q))}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Unit6_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.wordbank.length?`<p><b>Word box:</b> ${l.wordbank.map(esc).join(' · ')}</p>`:''}${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.accepted?'Answer: __________________________________________':q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}

function correctText(q){return q.accepted?q.accepted[0]:q.options[q.answer];}
function normalise(text,kind){let t=String(text).normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'");if(kind==='ordering')return t.replace(/[^a-z]/g,'');return t.replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function renderAppendix(){stopClock();stopAudio();active=null;state=null;app.innerHTML=`<section class="lessonintro"><button class="back" id="appendixBack">Danh mục lớp 11</button><p class="eyebrow">Phần tham khảo bổ sung · Không tính điểm</p><h1>Giao tiếp, viết &amp; ngữ điệu</h1></section><section class="resource">${APPENDIX_HTML}</section>${footer()}`;document.getElementById('appendixBack').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}

window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
