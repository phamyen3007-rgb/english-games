<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 11 - Unit 2 - Exercise 11 - Option B</title>
<style>
:root{
 --cream:#fff8ec;--tan:#e9c89c;--brown:#8b5e3c;--deep:#513622;--orange:#f4a261;
 --pink:#f6a5b8;--blue:#8fd3ff;--green:#53c98b;--red:#ef6675;--yellow:#ffd166;
 --text:#4b382b;--muted:#806b5a;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
   radial-gradient(circle at 13% 16%,rgba(244,162,97,.16),transparent 24%),
   radial-gradient(circle at 86% 15%,rgba(143,211,255,.18),transparent 25%),
   linear-gradient(180deg,#dff4ff 0 59%,#d8efbd 59% 100%);
 padding:18px;overflow-x:hidden
}
.puppy-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.86}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:36px;left:6%;top:10%}.c1:before{width:52px;height:52px;left:18px;top:-24px}.c1:after{width:60px;height:60px;right:12px;top:-28px}
.c2{width:95px;height:30px;right:8%;top:17%}.c2:before{width:42px;height:42px;left:14px;top:-18px}.c2:after{width:48px;height:48px;right:8px;top:-22px}
.paw{position:absolute;font-size:28px;opacity:.28;animation:pawMove 9s linear infinite}
.p1{left:-40px;top:28%}.p2{left:-60px;top:52%;animation-delay:3s}.p3{left:-50px;top:72%;animation-delay:6s}
@keyframes pawMove{to{transform:translateX(112vw) rotate(25deg)}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.puppy-icon{width:110px;height:110px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 10px 16px rgba(95,60,35,.18))}
.head{width:78px;height:70px;border-radius:48% 48% 44% 44%;background:linear-gradient(180deg,#e8bd86,#c78a55);position:relative;border:3px solid #976542}
.ear{position:absolute;top:6px;width:32px;height:55px;background:#a86f48;border-radius:55% 45% 60% 40%;z-index:-1}
.ear.l{left:-19px;transform:rotate(18deg)}.ear.r{right:-19px;transform:rotate(-18deg)}
.eye{position:absolute;top:23px;width:11px;height:13px;background:#fff;border-radius:50%}.eye:after{content:"";position:absolute;width:6px;height:7px;background:#2e231c;border-radius:50%;left:3px;top:4px}
.eye.l{left:19px}.eye.r{right:19px}
.muzzle{position:absolute;left:50%;top:39px;transform:translateX(-50%);width:38px;height:27px;background:#f4d5ae;border-radius:50%}
.nose{position:absolute;left:50%;top:39px;transform:translateX(-50%);width:14px;height:10px;background:#34251d;border-radius:50%;z-index:4}
.tongue{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:14px;height:16px;background:#ef8fa4;border-radius:0 0 50% 50%;z-index:3}
.collar{position:absolute;bottom:8px;width:62px;height:10px;background:#ef6675;border-radius:999px}
.tag-medal{position:absolute;bottom:-2px;width:18px;height:18px;border-radius:50%;background:#ffd166;border:2px solid #d29d31}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#7b5134,#e68a4e,#ef8fa4,#579ed0);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:#6d635b;font-weight:700}
.sound{border:1px solid rgba(139,94,60,.25);background:#fff;color:#65442e;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:rgba(255,253,248,.98);border:1px solid rgba(139,94,60,.18);border-radius:24px;box-shadow:0 24px 65px rgba(80,55,35,.16);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:linear-gradient(90deg,#fff3e4,#fff8ef,#eefaff)}
.barbox{height:13px;background:#eadfce;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#f4a261,#ef8fa4,#8fd3ff);transition:.3s}
.chip{background:#fff;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(80,55,35,.07)}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#fffdf8;border:2px solid #ead8bd;border-radius:18px;padding:18px;max-height:560px;overflow:auto;line-height:1.75}
.passage h3{margin:0 0 10px;color:#8b5e3c}
.quizbox{background:#fff8ef;border:2px solid #ead8c4;border-radius:18px;padding:18px}
.tag{display:inline-block;background:#ffead8;color:#88583b;padding:7px 12px;border-radius:10px;font-weight:900}
.statement{font-size:23px;line-height:1.5;margin:16px 0 20px}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf-btn{padding:20px 14px;border-radius:16px;border:2px solid #e2d0bc;background:#fff;color:var(--text);font-size:20px;font-weight:900;cursor:pointer;transition:.16s}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#f4a261;box-shadow:0 9px 18px rgba(120,80,45,.09)}
.tf-btn.correct{background:#e8fff3!important;border-color:var(--green)!important}
.tf-btn.wrong{background:#fff0f2!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:17px;padding:15px;border-left:5px solid;border-radius:12px;background:#fff;line-height:1.6}
.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#ffd69c,#addfff);color:#514032}
.next:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}
.scorebig{font-size:58px;font-weight:1000;color:#d57b47}
.review{text-align:left;margin-top:24px;border-top:1px solid #eadccc;padding-top:16px}
.item{padding:12px 14px;background:#fffaf2;border-radius:12px;margin:9px 0;border-left:5px solid #b59f89;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}
@media(max-width:650px){.hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.puppy-icon{transform:scale(.78);transform-origin:left center;width:85px}}
</style>
</head>
<body>
<div class="puppy-bg">
 <div class="cloud c1"></div><div class="cloud c2"></div>
 <div class="paw p1">🐾</div><div class="paw p2">🐾</div><div class="paw p3">🐾</div>
</div>

<main class="wrap">
<header class="hero">
 <div class="puppy-icon">
  <div class="head">
   <div class="ear l"></div><div class="ear r"></div>
   <div class="eye l"></div><div class="eye r"></div>
   <div class="muzzle"></div><div class="nose"></div><div class="tongue"></div>
  </div>
  <div class="collar"></div><div class="tag-medal"></div>
 </div>
 <div>
  <h1>Puppy True / False Reading Quest</h1>
  <p class="subtitle">Grade 11 · Unit 2 · Exercise 11 · Option B</p>
 </div>
 <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
 <div class="status">
  <div class="barbox"><div class="bar" id="bar"></div></div>
  <div class="chip" id="counter"></div>
  <div class="chip" id="scoreChip"></div>
  <div class="chip" id="heartChip"></div>
 </div>

 <div class="main">
  <div class="passage">
   <h3>🐶 David's Blog</h3>
   <div id="passageText"></div>
  </div>

  <div class="quizbox">
   <div class="tag" id="tag"></div>
   <div class="statement" id="statement"></div>
   <div class="tf-grid">
    <button class="tf-btn" id="trueBtn">T · TRUE ✅</button>
    <button class="tf-btn" id="falseBtn">F · FALSE ❌</button>
   </div>
   <div id="feedback" class="feedback"></div>
   <div class="controls"><button id="nextBtn" class="next" disabled>Next Paw 🐾</button></div>
  </div>
 </div>
</div>

<div id="resultArea" class="result">
 <div style="font-size:74px">🐶🏆</div>
 <h2>Puppy Quest Complete!</h2>
 <div id="finalScore" class="scorebig"></div>
 <p id="message"></p>
 <button id="restartBtn" class="next">Play Again ↻</button>
 <div id="review" class="review"></div>
</div>
</section>
</main>

<script>
const passage="Many teenagers think that having disagreements with their parents means there is something wrong with their family. I used to believe that too, but now I know that differences of opinion are a natural part of growing up.\n\nLast year, I often argued with my parents because they expected me to spend less time playing online games and more time studying. At first, I thought they were trying to control my life. Later, I realized that they simply wanted me to develop better study habits and prepare for my future.\n\nOne thing that really improved our relationship was learning to communicate honestly. Instead of keeping my feelings to myself, I explained why I enjoyed gaming, and my parents explained why they were concerned. We finally agreed on a timetable that balanced my study time and free time.\n\nI also learned that respecting your parents does not mean you must always agree with them. You can politely express a different opinion while still listening to their advice. In fact, many of my parents' suggestions have helped me avoid making poor decisions.\n\nAlthough family arguments still happen sometimes, we now solve them much more quickly because everyone is willing to listen and make compromises. I believe a happy family is built on trust, respect, and understanding rather than always having the same opinions.";
const questions=[{"statement": "David's parents wanted him to stop playing online games completely.", "answer": false, "explanation": "The blog says his parents expected him to spend less time playing online games and more time studying. “Spend less time” does not mean “stop completely”."}, {"statement": "David eventually understood why his parents were worried about him.", "answer": true, "explanation": "David says he later realized that his parents wanted him to develop better study habits and prepare for his future. Vì vậy statement này đúng."}, {"statement": "David and his parents solved their problem by agreeing on a schedule.", "answer": true, "explanation": "The blog says: “We finally agreed on a timetable that balanced my study time and free time.” Schedule và timetable có nghĩa tương đương trong ngữ cảnh này."}, {"statement": "According to David, respecting your parents means always accepting their opinions.", "answer": false, "explanation": "David clearly says: “respecting your parents does not mean you must always agree with them.” Vì vậy statement này sai."}, {"statement": "David believes that family members do not need to have the same opinions to build a happy family.", "answer": true, "explanation": "David says a happy family is built on trust, respect, and understanding rather than always having the same opinions. Vì vậy statement này đúng."}];

let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
 if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}
function tone(freq,duration=.1,type="sine",volume=.04,delay=0){
 if(!soundOn)return;
 const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(freq,s);
 g.gain.setValueAtTime(.0001,s);
 g.gain.exponentialRampToValueAtTime(volume,s+.01);
 g.gain.exponentialRampToValueAtTime(.0001,s+duration);
 o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03);
}
function correctSound(){tone(620,.07,"triangle",.03);tone(850,.1,"sine",.035,.07);tone(1050,.13,"triangle",.03,.16)}
function wrongSound(){tone(180,.16,"sawtooth",.035);tone(105,.2,"square",.02,.11)}
function nextSound(){tone(440,.06,"triangle",.018);tone(650,.07,"triangle",.016,.06)}
function finishSound(){[523,659,784,988].forEach((f,i)=>tone(f,.18,"triangle",.03,i*.09))}

$("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
 if(soundOn)nextSound();
};

function render(){
 answered=false;
 $("trueBtn").disabled=false;
 $("falseBtn").disabled=false;
 $("trueBtn").className="tf-btn";
 $("falseBtn").className="tf-btn";
 $("nextBtn").disabled=true;
 $("feedback").className="feedback";
 $("feedback").innerHTML="";

 const q=questions[current];
 $("tag").textContent=`Statement ${current+1}`;
 $("statement").textContent=q.statement;
 $("counter").textContent=`Câu ${current+1}/${questions.length}`;
 $("scoreChip").textContent=`🐾 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${current/questions.length*100}%`;
 $("nextBtn").textContent=current===questions.length-1?"Finish Quest 🐶":"Next Paw 🐾";
}

function choose(value){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const correct=value===q.answer;
 $("trueBtn").disabled=true;
 $("falseBtn").disabled=true;

 const chosenBtn=value?$("trueBtn"):$("falseBtn");
 const correctBtn=q.answer?$("trueBtn"):$("falseBtn");
 correctBtn.classList.add("correct");

 if(correct){
  score+=10+combo*2;
  combo++;
  $("feedback").className="feedback correct show";
  $("feedback").innerHTML=`<strong>🐶 Woof! Chính xác — ${q.answer?"TRUE":"FALSE"}.</strong>${q.explanation}`;
  correctSound();
 }else{
  hearts=Math.max(0,hearts-1);
  combo=0;
  chosenBtn.classList.add("wrong");
  $("feedback").className="feedback wrong show";
  $("feedback").innerHTML=`<strong>🐾 Chưa đúng. Đáp án: ${q.answer?"TRUE":"FALSE"}.</strong>${q.explanation}`;
  wrongSound();
 }

 answers.push({selected:value,correct});
 $("scoreChip").textContent=`🐾 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(current+1)/questions.length*100}%`;
 $("nextBtn").disabled=false;
}

$("trueBtn").onclick=()=>choose(true);
$("falseBtn").onclick=()=>choose(false);

$("nextBtn").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(current<questions.length-1){current++;render();}
 else showResult();
};

function showResult(){
 $("quizArea").style.display="none";
 $("resultArea").classList.add("show");

 const correctCount=answers.filter(a=>a.correct).length;
 $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
 finishSound();

 if(correctCount===5) $("message").textContent="Perfect Puppy Reader! Em đã trả lời đúng toàn bộ statements.";
 else if(correctCount>=4) $("message").textContent="Excellent! Em xác định thông tin True / False rất tốt.";
 else if(correctCount>=3) $("message").textContent="Good job! Hãy xem lại những statement chưa đúng.";
 else $("message").textContent="Hãy đọc lại David's Blog và thử thêm một lần nữa nhé.";

 let html="<h3>🐾 Puppy Review</h3>";
 questions.forEach((q,i)=>{
  const a=answers[i];
  html+=`<div class="item ${a&&a.correct?"ok":"no"}">
   <strong>Câu ${i+1}: ${a&&a.correct?"Đúng":"Sai"}</strong><br>
   Em chọn: ${a?(a.selected?"TRUE":"FALSE"):"-"}<br>
   Đáp án đúng: ${q.answer?"TRUE":"FALSE"}<br>
   <em>${q.explanation}</em>
  </div>`;
 });
 $("review").innerHTML=html;
}

$("restartBtn").onclick=()=>{
 current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
 $("resultArea").classList.remove("show");
 $("quizArea").style.display="block";
 render();nextSound();
};

$("passageText").innerHTML=passage.split("\n\n").map(p=>`<p>${p}</p>`).join("");
render();
</script>
</body>
</html>
