<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 3 - Exercise 1 (101-126) - Option C</title>
<style>
:root{--bg:#030712;--panel:rgba(8,15,35,.94);--cyan:#4de8ff;--blue:#5a75ff;--violet:#9d5cff;--pink:#ff4fd8;--green:#42f5a7;--red:#ff657a;--yellow:#ffd166;--text:#f4f8ff;--muted:#a9b7d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 15%,rgba(90,117,255,.22),transparent 28%),radial-gradient(circle at 78% 18%,rgba(157,92,255,.2),transparent 26%),linear-gradient(180deg,#030712,#07101f 58%,#030712);padding:20px;overflow-x:hidden}
.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-repeat:repeat;z-index:0}.stars{background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.4px),radial-gradient(circle,rgba(77,232,255,.8) 0 1px,transparent 1.5px);background-size:90px 90px,140px 140px;animation:drift 45s linear infinite;opacity:.65}.stars:before{background-image:radial-gradient(circle,rgba(255,255,255,.7) 0 1.2px,transparent 1.7px);background-size:180px 180px;animation:drift 70s linear infinite reverse;opacity:.45}@keyframes drift{to{transform:translateY(-240px)}}
.planet{position:fixed;border-radius:50%;pointer-events:none;z-index:0}.p1{width:170px;height:170px;left:-55px;top:12%;background:linear-gradient(145deg,#3450b8,#101a49 65%,#050916);box-shadow:0 0 50px rgba(90,117,255,.28)}.p2{width:110px;height:110px;right:3%;bottom:7%;background:linear-gradient(145deg,#a03d9d,#3b145c 70%,#10041b);box-shadow:0 0 45px rgba(255,79,216,.24)}
.shell{width:min(1080px,100%);margin:auto;position:relative;z-index:2}.hero{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}.corebox{width:100px;height:100px;display:grid;place-items:center;position:relative}.core{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,white 0 5%,var(--cyan) 18%,var(--blue) 52%,#162452 100%);box-shadow:0 0 16px rgba(77,232,255,.75),0 0 34px rgba(90,117,255,.45);animation:pulse 2.6s ease-in-out infinite}.ring{position:absolute;border-radius:50%;border:2px solid rgba(77,232,255,.45)}.r1{width:92px;height:40px;animation:s1 7s linear infinite}.r2{width:42px;height:92px;border-color:rgba(255,79,216,.36);animation:s2 9s linear infinite}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes s1{to{transform:rotate(360deg)}}@keyframes s2{to{transform:rotate(-360deg)}}
h1{margin:0;font-size:clamp(28px,4vw,46px);background:linear-gradient(90deg,#fff,var(--cyan),#c8b8ff,var(--pink));-webkit-background-clip:text;color:transparent}.title p{margin:7px 0 0;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(77,232,255,.35);background:rgba(9,18,41,.9);color:var(--text);border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(17,27,58,.94),var(--panel));border:1px solid rgba(117,153,255,.28);box-shadow:0 25px 70px rgba(0,0,0,.55)}.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:18px 22px 13px;border-bottom:1px solid rgba(117,153,255,.22);background:rgba(3,7,18,.46)}.barbox{height:13px;border-radius:999px;overflow:hidden;background:#071020}.bar{width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet),var(--pink));transition:.35s}.chip{background:rgba(14,24,52,.92);border-radius:999px;padding:8px 13px;font-weight:900}
.content{padding:24px 22px 26px}.qtag{display:inline-block;color:var(--cyan);border:1px solid rgba(77,232,255,.44);background:rgba(77,232,255,.07);padding:7px 13px;border-radius:10px;font-weight:900;margin-bottom:13px}.question{margin:0 0 22px;font-size:clamp(22px,2.8vw,31px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{min-height:72px;border-radius:17px;border:1px solid rgba(117,153,255,.25);background:linear-gradient(135deg,rgba(23,35,73,.97),rgba(9,17,38,.98));color:var(--text);display:flex;align-items:center;gap:13px;padding:16px 17px;font-size:18px;text-align:left;cursor:pointer;transition:.17s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}.letter{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;font-weight:1000;color:#03101c;background:linear-gradient(135deg,var(--cyan),#b6f7ff)}.correct{border-color:var(--green)!important;background:linear-gradient(135deg,rgba(24,80,61,.96),rgba(10,39,34,.98))!important}.wrong{border-color:var(--red)!important;background:linear-gradient(135deg,rgba(93,34,51,.96),rgba(48,17,30,.98))!important}
.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:16px;line-height:1.58;border-left:5px solid;background:rgba(5,11,26,.86)}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--yellow)}.feedback strong{display:block;margin-bottom:7px}.details{margin-top:9px;color:#c4d1e4;font-size:15px}.controls{display:flex;justify-content:flex-end;margin-top:20px}.action{border:0;border-radius:14px;padding:13px 23px;font-size:17px;font-weight:1000;color:#04101b;cursor:pointer;background:linear-gradient(90deg,var(--cyan),#b0f4ff)}.action:disabled{opacity:.38;cursor:not-allowed}
.result{display:none;text-align:center;padding:38px 24px 42px}.result.show{display:block}.result-icon{font-size:76px}.score-big{font-size:64px;font-weight:1000;margin:12px 0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;color:transparent}.result p{max-width:650px;margin:0 auto 24px;color:var(--muted);font-size:18px}.review{text-align:left;margin-top:26px;border-top:1px solid rgba(117,153,255,.22);padding-top:20px}.review-item{padding:14px 15px;margin-bottom:11px;border-radius:14px;background:rgba(8,16,36,.82);border-left:5px solid #6078a5}.review-item.ok{border-left-color:var(--green)}.review-item.no{border-left-color:var(--red)}
@media(max-width:780px){.hero{grid-template-columns:80px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:3}.options{grid-template-columns:1fr}.content{padding:18px 15px 22px}}
</style>
</head>
<body>
<div class="stars"></div><div class="planet p1"></div><div class="planet p2"></div>
<main class="shell">
<header class="hero">
<div class="corebox"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div>
<div class="title"><h1>Universe Collocation Mission</h1><p>Grade 12 · Unit 3 · Exercise 1 (101–126) · Option C</p></div>
<button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>
<section class="card">
<div id="quizArea">
<div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="counter"></div><div class="chip" id="scoreChip"></div></div>
<div class="content"><div class="qtag" id="qtag"></div><h2 class="question" id="qtext"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action" id="nextBtn" disabled>Tiếp tục ✦</button></div></div>
</div>
<div class="result" id="result"><div class="result-icon" id="icon">🌌</div><h2>Mission Complete</h2><div class="score-big" id="finalScore"></div><p id="message"></p><button class="action" id="restart">Khởi động lại ↻</button><div class="review" id="review"></div></div>
</section></main>
<script>
const Q=[
["Many countries have promised to ____________ carbon emissions by at least 50% before 2040.",["reduce","decrease down","fall","decline"],0,"reduce carbon emissions = giảm lượng khí thải carbon.","decrease down sai kết hợp; fall và decline thường là nội động từ trong ngữ cảnh này."],
["Governments should ____________ stricter penalties for companies that illegally dump industrial waste.",["apply","impose","produce","create"],1,"impose penalties/fines/restrictions = áp đặt hình phạt hoặc hạn chế.",""],
["Environmental organizations are working together to ____________ endangered wildlife.",["preserve","reserve","deserve","observe"],0,"preserve wildlife = bảo tồn động vật hoang dã.","reserve = dành riêng; deserve = xứng đáng; observe = quan sát."],
["Experts warned that rising sea levels could ____________ millions of people living in coastal areas.",["affect","effect","reflect","infect"],0,"affect people/lives/the environment = ảnh hưởng đến.","effect thường là danh từ; reflect = phản ánh; infect = lây nhiễm."],
["Scientists continue to ____________ the long-term impact of air pollution on children's health.",["carry","conduct","perform","make"],1,"conduct research/studies/an investigation = tiến hành nghiên cứu.",""],
["Everyone has a responsibility to ____________ natural resources for future generations.",["consume","conserve","destroy","remove"],1,"conserve natural resources = bảo tồn tài nguyên thiên nhiên.",""],
["The campaign successfully ____________ public attention to the problem of marine pollution.",["caught","drew","made","gave"],1,"draw attention to = thu hút sự chú ý đến.","Quá khứ của draw là drew."],
["People should avoid ____________ food because millions of people still suffer from hunger.",["wasting","throwing","reducing","damaging"],0,"waste food = lãng phí thực phẩm.","Sau avoid dùng V-ing."],
["The government plans to ____________ more investment in renewable energy projects.",["attract","invite","collect","gather"],0,"attract investment = thu hút đầu tư.",""],
["Students are encouraged to ____________ an active role in protecting the environment.",["do","play","take","make"],2,"take an active role in = đóng vai trò tích cực trong.",""],
["The new recycling programme has already ____________ positive results in several cities.",["brought about","taken over","looked after","turned off"],0,"bring about positive results/changes = mang lại kết quả hoặc thay đổi tích cực.",""],
["Environmental laws should be strictly ____________ to protect ecosystems.",["followed","obeyed","enforced","controlled"],2,"enforce a law = thực thi pháp luật.",""],
["The company is trying to ____________ its environmental impact by using recycled materials.",["minimize","shorten","narrow","weaken"],0,"minimize environmental impact = giảm thiểu tác động môi trường.",""],
["Researchers hope their findings will ____________ future environmental policies.",["influence","impress","persuade","convince"],0,"influence policy/decision = tác động đến chính sách hoặc quyết định.","persuade và convince thường cần tân ngữ chỉ người."],
["International cooperation plays a crucial role ____________ solving global environmental problems.",["on","at","in","for"],2,"play a role in + V-ing = đóng vai trò trong việc gì.",""]
];
const L=["A","B","C","D"];let i=0,score=0,done=false,ans=[],sound=true,ctx=null;
const $=id=>document.getElementById(id);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.12,t="sine",v=.05,delay=0){if(!sound)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
const ok=()=>{tone(523,.12,"triangle",.06);tone(659,.13,"triangle",.055,.1);tone(988,.18,"sine",.05,.2)}
const no=()=>{tone(210,.16,"sawtooth",.035);tone(150,.22,"square",.022,.12)}
const go=()=>{tone(400,.07,"square",.022);tone(680,.08,"square",.018,.06)}
const finish=()=>[392,523,659,784,1047].forEach((f,n)=>tone(f,.24,"triangle",.045,n*.11))
$("soundBtn").onclick=()=>{sound=!sound;$("soundBtn").textContent=sound?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(sound)go()}
function render(){done=false;$("nextBtn").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";const q=Q[i];$("qtag").textContent=`Question ${i+1}`;$("qtext").textContent=q[0];$("counter").textContent=`Câu ${i+1}/${Q.length}`;$("scoreChip").textContent=`🚀 ${score} điểm`;$("bar").style.width=`${i/Q.length*100}%`;$("options").innerHTML="";q[1].forEach((x,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${L[n]}</span><span>${x}</span>`;b.onclick=()=>choose(n);$("options").appendChild(b)});$("nextBtn").textContent=i===Q.length-1?"Xem kết quả 🌌":"Tiếp tục ✦"}
function choose(n){if(done)return;done=true;const q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add("correct");if(right){score++;bs[n].classList.add("correct");$("feedback").className="feedback correct show";$("feedback").innerHTML=`<strong>🌟 Chính xác! Hệ thống xác nhận.</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;ok()}else{bs[n].classList.add("wrong");$("feedback").className="feedback wrong show";$("feedback").innerHTML=`<strong>⚠ Sai quỹ đạo. Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;no()}ans.push({selected:n,correct:q[2],right});$("scoreChip").textContent=`🚀 ${score} điểm`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("nextBtn").disabled=false}
function results(){$("quizArea").style.display="none";$("result").classList.add("show");$("finalScore").textContent=`${score}/${Q.length}`;finish();const p=score/Q.length*100;if(p===100){$("icon").textContent="🏆🌌";$("message").textContent="Perfect orbit! Bạn đã chinh phục toàn bộ collocations trong nhiệm vụ vũ trụ."}else if(p>=80){$("icon").textContent="🚀✨";$("message").textContent="Excellent mission! Kiến thức collocation của bạn rất vững."}else if(p>=60){$("icon").textContent="🛰️💫";$("message").textContent="Good mission! Hãy xem lại những câu sai để nâng cấp kỹ năng."}else{$("icon").textContent="🌍📘";$("message").textContent="Training orbit! Ôn lại collocations trọng tâm rồi khởi động lại nhiệm vụ."}let h="<h3>Galaxy Review</h3>";Q.forEach((q,n)=>{const a=ans[n];h+=`<div class="review-item ${a&&a.right?"ok":"no"}"><strong>Câu ${n+1}: ${a&&a.right?"Đúng":"Sai"}</strong><br>Bạn chọn: ${a?`${L[a.selected]}. ${q[1][a.selected]}`:"Chưa trả lời"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><em>${q[3]}</em>${q[4]?`<div class="details">${q[4]}</div>`:""}</div>`});$("review").innerHTML=h}
$("nextBtn").onclick=()=>{if(!done)return;go();if(i<Q.length-1){i++;render()}else results()}
$("restart").onclick=()=>{i=0;score=0;done=false;ans=[];$("result").classList.remove("show");$("quizArea").style.display="block";render();go()}
render();
</script>
</body></html>
