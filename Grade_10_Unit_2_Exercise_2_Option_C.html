<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 2 - Option C</title>
<style>
:root{--deep:#04182b;--navy:#06243e;--panel:#0b2f4d;--panel2:#0f4167;--blue:#46b8ff;--cyan:#58e1ff;--foam:#dff8ff;--green:#4fd39a;--red:#ff6575;--text:#f4fbff;--muted:#b8d5e5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(88,225,255,.12),transparent 24%),radial-gradient(circle at 85% 18%,rgba(70,184,255,.12),transparent 24%),linear-gradient(180deg,#03111f,#05253e 58%,#03101a);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.wave{position:absolute;left:-10%;width:120%;height:180px;border-radius:50%;border-top:3px solid rgba(223,248,255,.2);animation:waveMove 8s ease-in-out infinite}.w1{bottom:5%;transform:rotate(-2deg)}.w2{bottom:14%;animation-delay:2s;opacity:.6}.w3{bottom:23%;animation-delay:4s;opacity:.35}@keyframes waveMove{50%{transform:translateX(5%) translateY(-10px) rotate(1deg)}}.bubble{position:absolute;border-radius:50%;border:2px solid rgba(88,225,255,.25);animation:rise linear infinite}.b1{width:18px;height:18px;left:8%;bottom:-30px;animation-duration:8s}.b2{width:28px;height:28px;left:22%;bottom:-40px;animation-duration:11s;animation-delay:2s}.b3{width:20px;height:20px;right:12%;bottom:-30px;animation-duration:9s;animation-delay:1s}@keyframes rise{to{transform:translateY(-115vh);opacity:.05}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}.hero{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;margin-bottom:16px}.icon{font-size:70px;text-align:center;filter:drop-shadow(0 0 18px rgba(88,225,255,.25))}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#dff8ff,#58e1ff,#46b8ff);-webkit-background-clip:text;color:transparent}.sub{margin:7px 0 0;color:#b8d5e5;font-weight:700}.sound{border:1px solid rgba(88,225,255,.35);background:#0b2b45;color:#f4fbff;border-radius:12px;padding:11px 14px;font-weight:900}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(88,225,255,.2);border-radius:24px;box-shadow:0 24px 65px rgba(0,0,0,.45);overflow:hidden}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:#08253d}.barbox{height:13px;background:#03131f;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#dff8ff,#58e1ff,#46b8ff);transition:.3s}.chip{background:#0f3553;padding:8px 12px;border-radius:999px;font-weight:900}.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.passage,.quiz{border:2px solid #1c5376;border-radius:18px;padding:18px;background:#08263f}.passage{max-height:560px;overflow:auto;line-height:1.75}.passage h3{margin-top:0;color:#dff8ff}.tag{display:inline-block;background:#12466d;color:#dff8ff;padding:7px 12px;border-radius:10px;font-weight:900}.question{font-size:23px;margin:16px 0}.options{display:grid;gap:12px}.option{padding:14px 15px;border:2px solid #1f5a7f;border-radius:14px;background:#0c3555;color:#f4fbff;text-align:left;font-size:17px;cursor:pointer}.option:hover:not(:disabled){border-color:#58e1ff}.correct{background:#14392f!important;border-color:var(--green)!important}.wrong{background:#47212a!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#08263f;line-height:1.55}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#dff8ff,#74d8ff);color:#16364b}.btn:disabled{opacity:.4}.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}.scorebig{font-size:58px;font-weight:1000;color:#8fe8ff}.review{text-align:left;margin-top:24px}.item{padding:12px 14px;background:#08263f;border-left:5px solid #5f7f90;border-radius:12px;margin:9px 0}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}@media(max-width:850px){.main{grid-template-columns:1fr}}@media(max-width:650px){.hero{grid-template-columns:70px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style></head><body>
<div class="bg"><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div></div>
<div class="wrap"><div class="hero"><div class="icon">🌊</div><div><h1>Blue Wave Reading Challenge</h1><div class="sub">Grade 10 · Unit 2 · Exercise 2 · Option C</div></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></div>
<div class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="main"><div class="passage"><h3>🌊 Green School</h3><div id="passage"></div></div><div class="quiz"><div class="tag" id="tag"></div><div class="question" id="q"></div><div class="options" id="ops"></div><div class="feedback" id="fb"></div><div class="controls"><button class="btn" id="next" disabled>Next Wave →</button></div></div></div></div><div class="result" id="result"><div style="font-size:74px">🌊✨</div><h2>Blue Wave Challenge Complete!</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="btn" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage="Green School is a project that encourages students to live in a more environmentally friendly way. Students are taught to (1) ____________ energy by turning off lights and electrical appliances when they are not in use. They are also encouraged to (2) ____________ the amount of plastic waste they produce every day. Instead of throwing plastic bottles away, students can (3) ____________ them for other purposes or put them in recycling bins. The school has also planted more trees to help (4) ____________ the environment and provide homes for small animals. In addition, students take part in activities that (5) ____________ awareness about environmental problems. By making these simple changes, everyone can make a positive impact (6) ____________ the planet.";
const Q=[["Question 1", ["waste", "conserve", "damage", "consume"], 1, "conserve energy = tiết kiệm/bảo tồn năng lượng. Waste = lãng phí; consume = tiêu thụ; damage = làm hư hại."], ["Question 2", ["reduce", "prevent", "protect", "produce"], 0, "reduce the amount of waste = giảm lượng rác thải. Produce waste = tạo ra rác thải, ngược với ý của câu."], ["Question 3", ["release", "reuse", "remove", "replace"], 1, "reuse plastic bottles = tái sử dụng chai nhựa. Cụm “for other purposes” cho thấy dùng lại cho mục đích khác."], ["Question 4", ["pollute", "destroy", "protect", "affect"], 2, "protect the environment = bảo vệ môi trường. Trồng thêm cây giúp bảo vệ môi trường và tạo nơi sống cho động vật."], ["Question 5", ["rise", "raise", "grow", "increase"], 1, "raise awareness about/of sth = nâng cao nhận thức về vấn đề gì. Rise là nội động từ nên không dùng trực tiếp với awareness."], ["Question 6", ["in", "at", "on", "for"], 2, "have/make an impact on sth = có/tạo ra ảnh hưởng đối với cái gì."]];
const L=["A","B","C","D"];let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine"){if(!on)return;let z=ac(),o=z.createOscillator(),g=z.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(z.destination);o.start();o.stop(z.currentTime+d)}
function ok(){tone(560,.08);setTimeout(()=>tone(820,.12,"triangle"),80)}function bad(){tone(160,.16,"sawtooth")}function go(){tone(360,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(on)go()};
function show(){a=false;$("next").disabled=true;$("fb").className="feedback";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🌊 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${o}`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Wave 🌊":"Next Wave →"}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+c*2;c++;$("fb").className="feedback correct show";ok()}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");$("fb").className="feedback wrong show";bad()}$("fb").innerHTML=`<strong>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</strong><br>${q[3]}`;ans.push({n,right});$("score").textContent=`🌊 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};
function result(){$("quizArea").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct===6?"Perfect Blue Wave Reader!":correct>=5?"Excellent!":"Hãy xem lại các câu sai.";let r="<h3>🌊 Blue Wave Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}: ${z&&z.right?"Đúng":"Sai"}</b><br>Em chọn: ${z?L[z.n]:"-"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`});$("review").innerHTML=r}
$("restart").onclick=()=>location.reload();$("passage").textContent=passage;show();
</script></body></html>
