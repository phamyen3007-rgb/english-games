<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (21-40) - Option D</title>
<style>
*{box-sizing:border-box}
:root{--cream:#fff8e7;--brown:#493421;--leaf:#507a45;--leaf2:#7ca66a;--gold:#d8a63d;--red:#c94e46;--green:#3e8b57}
body{margin:0;min-height:100vh;padding:22px;font-family:Georgia,"Times New Roman",serif;color:var(--brown);
background:
radial-gradient(circle at 10% 20%,#fff8 0 2px,transparent 3px),
linear-gradient(135deg,#dce9c9,#f4e6b8 48%,#c8dba9);
background-size:34px 34px,auto}
.wrap{max-width:1120px;margin:auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#31543b,#5c7d4d 58%,#8b6b3e);color:white;border-radius:30px 30px 0 0;padding:25px 30px;box-shadow:0 18px 45px #46351d55}
.hero:before,.hero:after{position:absolute;font-size:120px;opacity:.15}.hero:before{content:"🍃";left:-25px;bottom:-55px}.hero:after{content:"🦋";right:25px;top:-35px}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:18px}.icon{font-size:67px}
h1{margin:0;color:#fff2b7;font-size:clamp(29px,4vw,44px);text-shadow:0 3px 8px #0006}
.sub{font-weight:bold;margin-top:7px;color:#fff}
.sound{border:2px solid #f6dc91;background:#fff8e7;color:#4f633f;border-radius:20px;padding:10px 15px;font-weight:bold;cursor:pointer}
.game{background:#fffaf0;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 20px 50px #46351d44}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:14px 20px;background:#efe4c5;border-bottom:2px dashed #9a8057}
.track{height:14px;background:#d6c8a8;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#6c984e,#d5a53c);transition:.3s}
.pill{background:#fff9e8;border:1px solid #b89b6b;border-radius:99px;padding:8px 13px;font-weight:bold;white-space:nowrap}.hearts{font-size:20px;letter-spacing:2px}
.main{padding:22px}.quiz{background:#fffdf5;border:2px solid #b9a276;border-radius:22px;padding:23px;box-shadow:inset 0 0 25px #d7c79d33}
.tag{display:inline-block;background:#5e844f;color:white;padding:8px 14px;border-radius:18px;font-weight:bold}.q{font-size:21px;line-height:1.55;margin:19px 0;font-weight:bold}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{border:2px solid #c9b88f;background:#fff9e9;color:#493421;border-radius:16px;padding:15px;text-align:left;font:16px Georgia,serif;cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#668c54;background:#f0f7e7}.ans.correct{background:#e3f3df;border-color:#4e985a}.ans.wrong{background:#f9ded8;border-color:#c94e46}
.fb{display:none;margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}.fb.good{display:block;background:#e5f4df;border-left:6px solid #4e985a}.fb.bad{display:block;background:#f9ded8;border-left:6px solid #c94e46}.bonus{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff0b8;border-left:6px solid #d5a53c;font-weight:bold}
.next{display:none;float:right;margin-top:15px;border:0;border-radius:18px;padding:12px 22px;background:#5e844f;color:white;font:bold 15px Georgia;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#2b241bd9;z-index:99;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.box{max-width:520px;width:100%;background:#fff8e7;border:4px solid #b65b4e;border-radius:28px;padding:30px;text-align:center;box-shadow:0 15px 50px #0007}.restart{border:0;border-radius:18px;padding:13px 22px;background:#a84b43;color:white;font:bold 15px Georgia;cursor:pointer}
.result{display:none;background:#fffaf0;border-radius:30px;padding:36px;text-align:center;box-shadow:0 20px 50px #46351d44}.result.show{display:block}.big{font-size:60px;font-weight:bold;color:#557b48}.review{text-align:left;margin-top:24px}.r{padding:13px 15px;margin:9px 0;border-radius:14px;background:#f3ead1;border-left:6px solid #688d55;line-height:1.55}
@media(max-width:820px){.answers{grid-template-columns:1fr}.heroRow{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style></head>
<body><div class="wrap">
<header class="hero"><div class="heroRow"><div class="brand"><div class="icon">🌳🦉</div><div><h1>Enchanted Forest Quest</h1><div class="sub">Grade 11 - Unit 3 - Exercise 1 (21-40) - Option D</div></div></div><button id="sound" class="sound">🔊 Forest Sound On</button></div></header>
<section id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div><div class="pill">🍀 Streak <span id="streak">0</span></div><div class="pill">🔁 Restarts <span id="restarts">0</span></div></div>
<main class="main"><section class="quiz"><div id="tag" class="tag"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="fb"></div><div id="bonus" class="bonus"></div><button id="next" class="next">NEXT PATH →</button><div style="clear:both"></div></section></main></section>
<section id="result" class="result"><div style="font-size:80px">🌳🏆🦉</div><h2>Forest Quest Completed!</h2><div id="final" class="big"></div><p id="msg"></p><div id="review" class="review"></div></section>
</div>
<div id="overlay" class="overlay"><div class="box"><div style="font-size:76px">🍂💔</div><h2>All Hearts Lost!</h2><p>Hết 5 tim. Học sinh phải quay lại làm từ Question 1.</p><p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p><button id="restartBtn" class="restart">RETURN TO THE FOREST ENTRANCE ↻</button></div></div>
<script>
const Q=[{"q": "Flexible working hours have been introduced partly to reduce the number of commuters travelling during ______ periods.", "o": ["intensive", "crowded", "peak", "dense"], "a": 2, "e": "<b>peak periods / peak hours</b> = thời gian cao điểm."}, {"q": "Local universities have agreed to ______ with the city council on research into more sustainable forms of public transport.", "o": ["participate", "cooperate", "contribute", "interact"], "a": 1, "e": "<b>cooperate with sb on sth</b> = hợp tác với ai về việc gì."}, {"q": "Despite concerns about its high maintenance costs, the newly installed security system ______ highly effective in preventing unauthorized access.", "o": ["remains", "maintains", "keeps", "retains"], "a": 0, "e": "Cấu trúc <b>remain + adjective</b> → <i>remains highly effective</i>."}, {"q": "What makes the latest generation of smart homes particularly ______ is their ability to respond automatically to residents' daily routines.", "o": ["sustainable", "efficient", "interactive", "renewable"], "a": 2, "e": "<b>interactive</b> = có tính tương tác/phản hồi với người sử dụng."}, {"q": "Regular neighbourhood events can help develop a stronger ______ of community among residents who might otherwise rarely meet one another.", "o": ["awareness", "spirit", "feeling", "sense"], "a": 3, "e": "Collocation: <b>a sense of community</b> = cảm giác/ý thức gắn kết cộng đồng."}, {"q": "Biometric entry systems can significantly improve building ______ by preventing unauthorized individuals from entering restricted areas.", "o": ["privacy", "security", "stability", "convenience"], "a": 1, "e": "<b>building security</b> = an ninh tòa nhà."}, {"q": "One major ______ of introducing smart technology throughout a city is the considerable initial investment required.", "o": ["disadvantage", "inconvenience", "weakness", "failure"], "a": 0, "e": "<b>a disadvantage of doing sth</b> = một bất lợi của việc làm gì."}, {"q": "Urban planning ______ argue that simply constructing more roads is unlikely to provide a long-term solution to traffic congestion.", "o": ["inhabitants", "authorities", "experts", "occupants"], "a": 2, "e": "<b>urban planning experts</b> = chuyên gia quy hoạch đô thị."}, {"q": "Following repeated requests from local residents, the council has agreed to ______ the operating hours of the community centre.", "o": ["enlarge", "expand", "lengthen", "extend"], "a": 3, "e": "Collocation: <b>extend operating/opening hours</b> = kéo dài giờ hoạt động."}, {"q": "Residential buildings are responsible for a substantial ______ of total electricity consumption in many large cities.", "o": ["proportion", "amount", "quantity", "level"], "a": 0, "e": "<b>a substantial proportion of</b> = một tỷ lệ đáng kể của..."}, {"q": "Constant construction noise may ______ residents' concentration, particularly those who regularly work or study from home.", "o": ["interrupt", "disrupt", "prevent", "interfere"], "a": 1, "e": "Collocation: <b>disrupt concentration</b> = làm gián đoạn/phá vỡ sự tập trung."}, {"q": "City authorities hope to transform the former industrial district into a ______ that combines affordable housing, green spaces, and efficient public transport.", "o": ["sustainable densely urban area", "densely sustainable urban area", "sustainable urban densely area", "densely populated sustainable urban area"], "a": 3, "e": "Cụm đúng: <b>densely populated sustainable urban area</b>."}, {"q": "Researchers ______ that demand for energy-efficient housing will continue to increase as urban populations grow.", "o": ["prevent", "predict", "advise", "estimate"], "a": 1, "e": "<b>predict that + clause</b> = dự đoán rằng..."}, {"q": "Despite rapid commercial development in the surrounding area, the neighbourhood ______ relatively peaceful and attractive to families.", "o": ["keeps", "becomes", "remains", "maintains"], "a": 2, "e": "<b>remain + adjective</b> → <i>remains relatively peaceful and attractive</i>."}, {"q": "Smart-city projects can greatly improve residents' quality of life; ______, they may create serious privacy concerns if personal data is not properly protected.", "o": ["however", "therefore", "moreover", "consequently"], "a": 0, "e": "Hai vế tương phản → <b>however</b> = tuy nhiên."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;
const $=x=>document.getElementById(x);
function tone(f,d=.1){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type="sine";g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Forest Sound On":"🔇 Sound Off"};
function update(){$("hearts").textContent="❤️".repeat(hearts)+"🤎".repeat(MAX-hearts);$("streak").textContent=streak;$("restarts").textContent=restarts;$("bar").style.width=(i/Q.length*100)+"%"}
function render(){let x=Q[i];$("tag").textContent="Forest Stop "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("bonus").style.display="none";$("next").style.display="none";update();x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)})}
function choose(n,b){let x=Q[i];attempts[i]++;
if(n!==x.a){hearts--;streak=0;b.classList.add("wrong");b.disabled=true;$("fb").className="fb bad";$("fb").style.display="block";$("fb").innerHTML="<b>❌ Chưa đúng.</b> Mất 1 ❤️. Em phải chọn lại đến khi đúng mới được đi tiếp.";tone(170,.2);update();if(hearts<=0){restarts++;$("restarts").textContent=restarts;$("restartBox").textContent=restarts;setTimeout(()=>$("overlay").classList.add("show"),250)}return}
streak++;if(attempts[i]===1)firstTry++;document.querySelectorAll(".ans").forEach(z=>z.disabled=true);b.classList.add("correct");$("fb").className="fb good";$("fb").style.display="block";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;tone(760,.11);
let qn=i+1;if(BONUS.includes(qn)){let before=hearts;hearts=Math.min(MAX,hearts+1);$("bonus").style.display="block";$("bonus").innerHTML=hearts>before?"🧚 BONUS HEART! +1 ❤️":"🧚 BONUS CHECKPOINT! Em đang đủ 5 ❤️ nên số tim giữ nguyên.";tone(1050,.12)}
update();$("bar").style.width=((i+1)/Q.length*100)+"%";$("next").style.display="inline-block";$("next").textContent=i===Q.length-1?"FINISH QUEST →":"NEXT PATH →"}
$("next").onclick=()=>{if(i<Q.length-1){i++;render()}else finish()};
$("restartBtn").onclick=()=>{$("overlay").classList.remove("show");i=0;hearts=MAX;streak=0;firstTry=0;attempts=Array(Q.length).fill(0);render()};
function finish(){$("game").style.display="none";$("result").classList.add("show");$("final").textContent="15 / 15";$("msg").innerHTML="Hoàn thành với <b>"+restarts+"</b> lần làm lại.<br>Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";let h="<h3>📜 Forest Review</h3>";Q.forEach((x,k)=>h+='<div class="r"><b>Question '+(k+1)+'</b> — '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>');$("review").innerHTML=h}
render();
</script></body></html>
