<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 4 - Exercise 1 (41-60) - Option C</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);min-height:100vh;color:#423d13}.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}.head{padding:20px;margin-bottom:18px}h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}button{font:inherit}.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}.card{padding:24px}.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}.opts{display:grid;gap:12px}.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}.opt:hover{background:#fff8cb;transform:translateY(-1px)}.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}.correct{background:#eff8d4!important;border-color:#99bc3b!important}.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}.feedback.show{display:block}.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}.next.show{display:block}.finish{text-align:center;padding:20px}.finish h2{font-size:34px;color:#676016}.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap"><section class="head"><h1>Grade 10 - Unit 4 - Exercise 1 (41-60) - Option C</h1><div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div><div class="bar"><div class="track"><div id="prog"></div></div><div id="hearts"></div><button class="reset" onclick="manualReset()">↻ Reset</button></div></section><section class="card" id="card"></section><div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div></div>
<div class="modal" id="modal"><div class="box"><h2>💛 Hết tim rồi!</h2><p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p><button onclick="gameOverReset()">Làm lại bài</button></div></div>
<script>
const original=[{"q": "By offering free vocational training, the organisation hopes to help families escape ________ rather than depend permanently on donations.", "options": ["poverty", "luxury", "popularity", "generosity"], "answer": "poverty", "explanation": "<em>Escape poverty</em> nghĩa là thoát nghèo; việc đào tạo nghề giúp các gia đình tự tạo thu nhập."}, {"q": "The reading programme aims ________ children who have left school return to education.", "options": ["helping", "help", "to help", "helped"], "answer": "to help", "explanation": "Cấu trúc <em>aim to do something</em>: hướng tới hoặc đặt mục tiêu làm việc gì."}, {"q": "Volunteers must check the names ________ before handing out payments, as even a small mistake could send money to the wrong person.", "options": ["care", "careful", "careless", "carefully"], "answer": "carefully", "explanation": "Cần trạng từ <em>carefully</em> bổ nghĩa cho động từ <em>check</em>: kiểm tra một cách cẩn thận."}, {"q": "It was ________ of the assistant to post the children’s private information on a public noticeboard without checking the rules.", "options": ["considerate", "careless", "grateful", "practical"], "answer": "careless", "explanation": "<em>It was careless of somebody to do something</em> diễn tả một hành động bất cẩn của ai đó."}, {"q": "The students sold handmade bookmarks to raise money ________ a school whose classrooms had been damaged by a storm.", "options": ["to", "with", "for", "about"], "answer": "for", "explanation": "<em>Raise money for somebody/something</em>: gây quỹ để hỗ trợ một người, tổ chức hoặc mục đích."}, {"q": "The new community kitchen serves affordable meals; ________, it offers cooking classes to unemployed adults.", "options": ["moreover", "nevertheless", "otherwise", "instead"], "answer": "moreover", "explanation": "<em>Moreover</em> bổ sung một lợi ích cùng chiều: ngoài phục vụ bữa ăn, nhà bếp còn tổ chức lớp nấu ăn."}, {"q": "________ providing temporary accommodation, the centre helps families find permanent homes.", "options": ["Although", "Because", "In addition", "Besides"], "answer": "Besides", "explanation": "<em>Besides + V-ing</em> nghĩa là ngoài việc gì. <em>In addition</em> phải đi với <em>to</em> trước <em>V-ing</em>."}, {"q": "The volunteers had collected enough food for the weekend. ________, they still needed a vehicle to transport it to the island.", "options": ["Therefore", "However", "Furthermore", "Similarly"], "answer": "However", "explanation": "<em>However</em> diễn tả sự tương phản: đã có đủ thực phẩm nhưng vẫn thiếu phương tiện vận chuyển."}, {"q": "The children were thankful ________ the local tailor ________ repairing their school uniforms free of charge.", "options": ["for – to", "with – about", "to – for", "about – with"], "answer": "to – for", "explanation": "<em>Be thankful to somebody for something/doing something</em>: biết ơn ai vì điều gì."}, {"q": "Through the home-visiting programme, students came into ________ with older residents whose experiences were very different from their own.", "options": ["contact", "agreement", "competition", "discussion"], "answer": "contact", "explanation": "<em>Come into contact with somebody</em>: tiếp xúc, gặp gỡ ai."}, {"q": "The youth forum gives teenagers an opportunity ________ solutions to problems in their neighbourhood.", "options": ["proposed", "proposing", "propose", "to propose"], "answer": "to propose", "explanation": "Cấu trúc <em>an opportunity to do something</em>: cơ hội làm việc gì."}, {"q": "A donated computer is of limited use if students do not have access ________ a reliable internet connection.", "options": ["for", "to", "with", "on"], "answer": "to", "explanation": "<em>Have access to something</em>: có khả năng tiếp cận hoặc sử dụng thứ gì."}, {"q": "The volunteers are looking forward to ________ the families they have supported through the online mentoring project.", "options": ["meeting", "meet", "met", "be meeting"], "answer": "meeting", "explanation": "<em>Look forward to + V-ing</em>. <em>To</em> trong cấu trúc này là giới từ."}, {"q": "Keep a printed list of emergency numbers ________ your phone runs out of battery during the trip.", "options": ["because of", "in case of", "in case", "despite"], "answer": "in case", "explanation": "<em>In case + mệnh đề</em> diễn tả sự phòng ngừa. <em>In case of</em> phải đi với danh từ hoặc cụm danh từ."}, {"q": "The temporary learning centre, which is located near the bus station, is in need ________ folding tables and chairs.", "options": ["with", "for", "at", "of"], "answer": "of", "explanation": "<em>Be in need of something</em> nghĩa là đang cần thứ gì; ở đây trung tâm cần thêm bàn ghế."}];const START=41;let qs=[],i=0,lives=5,correct=0,solved=false;
function shuffle(a){a=[...a];for(let x=a.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function build(mix=false){qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}))}
function hearts(){document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives)}
function progress(){document.getElementById('prog').style.width=(correct/qs.length*100)+'%'}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){solved=false;hearts();progress();const card=document.getElementById('card');if(i>=qs.length){card.innerHTML=`<div class="finish"><h2>🎉 Hoàn thành!</h2><p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p><p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p></div>`;return}const x=qs[i],labels=['A','B','C','D'];card.innerHTML=`<div class="qnum">Question ${START+i}</div><div class="q">${x.q}</div><div class="opts">${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)"><span class="letter">${labels[k]}</span><span>${o}</span></button>`).join('')}</div><div id="fb" class="feedback"></div><button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`}
function choose(btn){if(solved)return;const x=qs[i],v=btn.getAttribute('data-v'),fb=document.getElementById('fb');if(v===x.answer){solved=true;correct++;btn.classList.add('correct');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='feedback show good';fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;document.getElementById('next').classList.add('show');progress()}else{lives--;hearts();btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),450);fb.className='feedback show bad';fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';if(lives<=0)document.getElementById('modal').classList.add('show')}}
function nextQ(){i++;render()}function reset(mix=true){i=0;lives=5;correct=0;build(mix);render()}function manualReset(){if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.'))reset(true)}function gameOverReset(){document.getElementById('modal').classList.remove('show');reset(true)}build(false);render();
</script>
</body></html>
