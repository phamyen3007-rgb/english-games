<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 12 - Unit 4 - Exercise 6 - Option C</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef9ff,#f6f1ff,#e9fff6);color:#153048}
.wrap{max-width:1180px;margin:auto}.hero{background:linear-gradient(120deg,#17344f,#216b7a,#6d59a8);color:white;padding:24px 28px;border-radius:28px 28px 0 0;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:18px}.icon{font-size:68px}h1{margin:0;color:#e6fff7;font-size:clamp(28px,4vw,42px)}.sub{margin-top:7px;font-weight:800;color:#eee9ff}
.sound{border:0;background:white;color:#234c61;padding:11px 15px;border-radius:12px;font-weight:900;cursor:pointer}
.game{background:#fbfeff;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 18px 48px #17344f22}.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 20px;background:#e2f3f4}
.track{height:13px;background:#c9dfe3;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#35b9b0,#7d68c7,#ffd07d);transition:.25s}.pill{background:white;border-radius:99px;padding:8px 12px;font-weight:900}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.reading{background:#f8fdff;border:2px solid #b7dce3;border-radius:18px;padding:20px;line-height:1.72;max-height:690px;overflow:auto}.reading h2{color:#1b6171}.reading h3{color:#6d59a8}.reading strong{color:#128c87}
.quiz{background:white;border:2px solid #d9e4e8;border-radius:18px;padding:20px}.tag{display:inline-block;background:linear-gradient(90deg,#216b7a,#6d59a8);color:white;padding:7px 12px;border-radius:10px;font-weight:900}.q{font-size:20px;line-height:1.5;margin:17px 0}
.answers{display:grid;gap:11px}.ans{border:2px solid #dae5ea;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;color:#153048;cursor:pointer}.ans:hover:not(:disabled){border-color:#4fa8b0;transform:translateX(4px)}.ans.correct{background:#e9fff1;border-color:#2fa866}.ans.wrong{background:#fff0f3;border-color:#d75065}
.fb{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.fb.good{display:block;background:#e9fff1;border-left:5px solid #2fa866}.fb.bad{display:block;background:#fff0f3;border-left:5px solid #d75065}
.next{display:none;float:right;margin-top:14px;border:0;border-radius:11px;padding:12px 20px;background:linear-gradient(90deg,#216b7a,#6d59a8);color:white;font-weight:900;cursor:pointer}
.result{display:none;background:#fbfeff;border-radius:28px;padding:35px;text-align:center}.result.show{display:block}.big{font-size:60px;font-weight:1000;color:#216b7a}.review{text-align:left;margin-top:22px}.r{padding:13px;margin:9px 0;background:#eef7fa;border-left:5px solid #6d59a8;border-radius:11px}.r.ok{border-color:#2fa866}.r.no{border-color:#d75065}.restart{border:0;border-radius:11px;padding:12px 20px;background:#216b7a;color:white;font-weight:900;cursor:pointer}
@media(max-width:900px){.main{grid-template-columns:1fr}.reading{max-height:430px}}@media(max-width:620px){.hero{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand"><div class="icon">🧭🌍</div><div><h1>Culture Compass Quest</h1><div class="sub">Grade 12 - Unit 4 - Exercise 6 - Option C</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div>
<div id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill">🧭 <span id="score">0</span>/6</div><div class="pill">✨ <span id="streak">0</span></div></div><div class="main"><div id="reading" class="reading"></div><div class="quiz"><div id="tag" class="tag"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="fb"></div><button id="next" class="next">NEXT →</button><div style="clear:both"></div></div></div></div>
<div id="result" class="result"><div style="font-size:80px">🧭🏆🌍</div><h2>Culture Quest Complete!</h2><div id="final" class="big"></div><p id="msg"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></div></div>
<script>
const Q=[{"q": "Try to become (1) ______ of how local people communicate and interact.", "o": ["familiar", "conscious", "aware", "knowledgeable"], "a": 2, "e": "<b>be/become aware of</b> = nhận thức/ý thức được. <i>Familiar</i> đi với <b>with</b>; <i>knowledgeable</i> thường đi với <b>about</b>."}, {"q": "Make an effort to reach (2) ______ to people around you.", "o": ["out", "over", "up", "through"], "a": 0, "e": "<b>reach out to sb</b> = chủ động liên hệ/kết nối với ai."}, {"q": "There may be occasions (3) ______ you feel frustrated or uncertain.", "o": ["which", "where", "whose", "when"], "a": 3, "e": "<b>occasions when + S + V</b> = những thời điểm/trường hợp khi..."}, {"q": "Identify what went wrong and (4) ______ adjustments to the way you communicate.", "o": ["perform", "make", "conduct", "do"], "a": 1, "e": "Collocation: <b>make adjustments to sth</b> = thực hiện những điều chỉnh đối với..."}, {"q": "The demands of your new environment begin to take a (5) ______ on your emotional well-being.", "o": ["burden", "pressure", "toll", "strain"], "a": 2, "e": "Idiom: <b>take a toll on sb/sth</b> = gây ảnh hưởng tiêu cực/gây tổn hại dần dần."}, {"q": "Their experience can help you deal with unfamiliar situations more (6) ______.", "o": ["effective", "effectiveness", "effectual", "effectively"], "a": 3, "e": "Sau <b>deal with</b> cần trạng từ mô tả cách thức → <b>effectively</b>."}],P="<h2>ADJUSTING TO LIFE ABROAD</h2><h3>Small Steps towards Feeling at Home</h3>\n<p>Moving to another country can be an exciting opportunity, but adapting to unfamiliar social expectations may take longer than expected. If you are finding the transition difficult, the following suggestions may help.</p>\n<h3>Make Your Adjustment Easier</h3>\n<ul>\n<li><b>Observe before judging:</b> Behaviours that initially seem unusual may simply reflect different cultural values. Rather than comparing everything with what you are familiar with, try to become <strong>(1) ______</strong> of how local people communicate and interact.</li>\n<li><b>Build social connections:</b> Regular contact with local residents and other newcomers can provide a sense of belonging. Instead of withdrawing when you feel uncomfortable, make an effort to reach <strong>(2) ______</strong> to people around you.</li>\n<li><b>Keep expectations realistic:</b> Adapting to a new environment rarely happens immediately. There may be occasions <strong>(3) ______</strong> you feel frustrated or uncertain, but these feelings usually become less intense over time.</li>\n</ul>\n<h3>Develop Cultural Confidence</h3>\n<ul>\n<li><b>Learn from misunderstandings:</b> Miscommunication is sometimes unavoidable. What matters is your willingness to identify what went wrong and <strong>(4) ______</strong> adjustments to the way you communicate.</li>\n<li><b>Maintain familiar routines:</b> Keeping some of your usual habits can provide stability while you adapt. This is particularly helpful when the demands of your new environment begin to take a <strong>(5) ______</strong> on your emotional well-being.</li>\n<li><b>Ask for guidance:</b> People who have lived in the country for a long time may offer practical advice. Their experience can help you deal with unfamiliar situations more <strong>(6) ______</strong> and gradually become more confident in your new surroundings.</li>\n</ul>",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,hist=[],soundOn=true,ctx;const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.035,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(620,.08);tone(820,.1,.07);tone(1050,.12,.14)}function bad(){tone(170,.2)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tone(450,.05)}
function render(){answered=false;let x=Q[i];$("tag").textContent="Checkpoint "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");let ok=n===x.a;if(ok){score++;streak++;$("fb").className="fb good";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("wrong");$("fb").className="fb bad";$("fb").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("fb").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";hist.push({n,ok});$("next").style.display="block"}
$("next").onclick=()=>{if(!answered)return;tone(450,.05);if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");let pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("msg").textContent=pct===100?"Perfect! You mastered every cultural checkpoint.":pct>=80?"Excellent work!":pct>=60?"Good work. Review the missed checkpoints below.":"Review the explanations and try again.";let h="<h3>🧳 Culture Review</h3>";Q.forEach((x,k)=>{let a=hist[k];h+='<div class="r '+(a.ok?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("reading").innerHTML=P;render();
</script></body></html>
