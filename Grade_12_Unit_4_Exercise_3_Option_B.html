<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 - Unit 4 - Exercise 3 - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:#352514;background:linear-gradient(#f6dfad,#e7b96f 52%,#a85b37);padding:22px}
.wrap{max-width:1180px;margin:auto}.top{background:linear-gradient(135deg,#401d12,#78371d,#b3692d);color:#fff5d6;padding:23px 26px;border:3px solid #e5bd68;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 45px #4b261d55}
.brand{display:flex;gap:17px;align-items:center}.lamp{font-size:66px}.top h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:.5px}.sub{margin-top:7px;color:#f8d98e;font-weight:bold}
.sound{border:1px solid #f2d08a;background:#fff1c9;color:#542b18;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
.game{background:#fff9e9;border:3px solid #d7a94d;border-top:0;border-radius:0 0 24px 24px;overflow:hidden;box-shadow:0 18px 45px #4b261d45}
.status{padding:13px 20px;background:#f2dba9;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.track{height:13px;background:#d6bc84;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#8e3f20,#d18a35);transition:.3s}.badge{background:#fff8df;border:1px solid #c69b4c;padding:8px 12px;border-radius:99px;font-weight:bold}
.main{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:20px}.passage,.quiz{border-radius:16px;padding:20px}.passage{background:#fff2c9;border:2px dashed #a76832;line-height:1.72;max-height:680px;overflow:auto}.passage h2{margin-top:0;color:#73351e}.passage strong{color:#a1301d}.quiz{background:#fffdf4;border:2px solid #d5b570}
.tag{display:inline-block;background:#6c331d;color:#fff2c7;padding:7px 12px;border-radius:9px;font-family:Arial,sans-serif;font-weight:900}.q{font-size:20px;line-height:1.55;margin:18px 0}.answers{display:grid;gap:11px}.ans{border:2px solid #d6bb82;background:#fffaf0;border-radius:12px;padding:14px;text-align:left;font-size:16px;color:#352514;cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateX(4px);border-color:#9a552c;background:#fff0ca}.ans.ok{background:#eaf7dc;border-color:#60933d}.ans.no{background:#fde3dc;border-color:#b84b3b}
.fb{display:none;margin-top:15px;padding:14px;border-radius:10px;line-height:1.55}.fb.ok{display:block;background:#edf8df;border-left:5px solid #60933d}.fb.no{display:block;background:#fde7df;border-left:5px solid #b84b3b}.ctrl{text-align:right;margin-top:14px}.next{display:none;border:0;background:#7b3c21;color:white;border-radius:10px;padding:12px 19px;font-weight:bold;cursor:pointer}
.result{display:none;background:#fff8e5;border:3px solid #d2a653;border-radius:24px;padding:35px;text-align:center;box-shadow:0 18px 45px #4b261d45}.result.show{display:block}.big{font-size:60px;font-weight:bold;color:#813d22}.review{text-align:left;margin-top:22px}.r{background:#fff0c9;border-left:5px solid #b36d31;border-radius:10px;padding:13px;margin:9px 0}.r.ok{border-color:#60933d}.r.no{border-color:#b84b3b}.restart{border:0;background:#79391f;color:white;border-radius:10px;padding:12px 19px;font-weight:bold;cursor:pointer}
.decor{position:fixed;opacity:.13;pointer-events:none;font-size:95px}.d1{left:1%;top:17%}.d2{right:1%;bottom:6%}
@media(max-width:900px){.main{grid-template-columns:1fr}.passage{max-height:410px}}@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head>
<body>
<div class="decor d1">🐉</div><div class="decor d2">🏯</div>
<div class="wrap">
<div class="top"><div class="brand"><div class="lamp">🏮</div><div><h1>Ancient Lantern Quest</h1><div class="sub">Grade 12 · Unit 4 · Exercise 3 · Option B</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div>
<div id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="badge">🏮 Score <span id="score">0</span>/5</div><div class="badge">🔥 Streak <span id="streak">0</span></div></div>
<div class="main"><section id="passage" class="passage"></section><section class="quiz"><div id="tag" class="tag"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="fb"></div><div class="ctrl"><button id="next" class="next">NEXT →</button></div></section></div></div>
<div id="result" class="result"><div style="font-size:80px">🏮🏆🏯</div><h2>Quest Complete!</h2><div id="final" class="big"></div><p id="msg"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></div>
</div>
<script>
const Q=[{"q": "However, when population growth (1) __________ the development of infrastructure, cities may struggle to provide adequate housing, transport, and public services.", "o": ["overtakes", "exceeds", "outpaces", "overcomes"], "a": 2, "e": "<b>outpace</b> = phát triển/tăng nhanh hơn cái gì. <i>Population growth outpaces infrastructure development</i> = dân số tăng nhanh hơn tốc độ phát triển cơ sở hạ tầng."}, {"q": "Existing road networks may no longer be capable (2) __________ the growing volume of traffic.", "o": ["to accommodate", "of accommodating", "for accommodating", "with accommodating"], "a": 1, "e": "Cấu trúc chuẩn: <b>be capable of + V-ing</b> = có khả năng làm gì. → <i>capable of accommodating the growing volume of traffic</i>."}, {"q": "The limited supply of affordable accommodation, combined with rapidly increasing demand, has (3) __________ property prices beyond the reach of many low-income residents.", "o": ["driven", "raised", "lifted", "risen"], "a": 0, "e": "<b>drive + something + beyond/up</b> = đẩy/khiến cái gì tăng đến một mức. <i>Driven property prices beyond the reach of...</i> tự nhiên nhất. <b>Rise</b> là nội động từ nên không thể dùng <i>has risen property prices</i>."}, {"q": "Local authorities need comprehensive policies (4) __________ at improving public transport, expanding affordable housing, and protecting green spaces.", "o": ["targeted", "intended", "aimed", "directed"], "a": 2, "e": "Cấu trúc: <b>be aimed at + V-ing/N</b>. Đây là mệnh đề quan hệ rút gọn: <i>policies (which are) aimed at improving...</i>"}, {"q": "Unless such measures are implemented effectively, the social and environmental costs of urbanisation may eventually (5) __________ its economic benefits.", "o": ["outweigh", "overtake", "outnumber", "overcome"], "a": 0, "e": "<b>outweigh</b> = lớn/quan trọng/nghiêm trọng hơn. Collocation: <i>costs outweigh benefits</i> = chi phí/tác hại lớn hơn lợi ích."}],P="\n<h2>🏯 Coping with Urban Expansion</h2>\n<p>Rapid urbanisation has transformed many developing cities as increasing numbers of people relocate in search of employment and better living standards. However, when population growth <strong>(1) ______</strong> the development of infrastructure, cities may struggle to provide adequate housing, transport, and public services. One particularly serious issue is traffic congestion. As private vehicle ownership increases, existing road networks may no longer be capable <strong>(2) ______</strong> the growing volume of traffic, resulting in longer commuting times and worsening air pollution.</p>\n<p>Housing presents another major challenge. The limited supply of affordable accommodation, combined with rapidly increasing demand, has <strong>(3) ______</strong> property prices beyond the reach of many low-income residents. Consequently, some people are forced to settle in overcrowded neighbourhoods with inadequate access to essential services. To address these problems, local authorities need comprehensive policies <strong>(4) ______</strong> at improving public transport, expanding affordable housing, and protecting green spaces. Unless such measures are implemented effectively, the social and environmental costs of urbanisation may eventually <strong>(5) ______</strong> its economic benefits.</p>\n",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,hist=[],soundOn=true,ctx;const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.035,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(523,.08);tone(659,.1,.07);tone(784,.13,.14)}function bad(){tone(150,.2)}function tap(){tone(350,.06)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tap()}
function render(){answered=false;let x=Q[i];$("tag").textContent="Question "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("ok");let yes=n===x.a;if(yes){score++;streak++;$("fb").className="fb ok";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("no");$("fb").className="fb no";$("fb").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("fb").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";hist.push({n,yes});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tap();if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.15,k*.08));let p=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+p+"%";$("msg").textContent=p===100?"Perfect! You collected all five lanterns.":p>=80?"Excellent work! The ancient gate is open.":p>=60?"Good work. Review the missed clues below.":"Review the clues and begin the quest again.";let h="<h3>📜 Quest Review</h3>";Q.forEach((x,k)=>{let a=hist[k];h+='<div class="r '+(a.yes?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.yes?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("passage").innerHTML=P;render();
</script></body></html>
