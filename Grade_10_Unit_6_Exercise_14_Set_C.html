let active=null,state=null,clock=null,filter='all',search='',modalResolve=null,lastFocus=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(DBKEY,JSON.stringify(db));}catch(_){}};
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const fmt=sec=>{sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;};

const letter=i=>String.fromCharCode(65+i);
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3500);}
function stopAudio(){for(const a of document.querySelectorAll('audio'))a.pause();}

function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Điền họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Mỗi lần chọn sai mất 1 tim; bạn được thử lại. Sau khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 tính theo lần chọn đầu</b>. Số câu đã nắm được sau khi thử lại được báo riêng. Đạt 5 câu đúng liên tiếp sẽ hồi 1 tim, tối đa 5 tim.</p><p>Khi làm lại, câu rời và đáp án được trộn. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu để dễ đối chiếu. Kết quả lưu trên trình duyệt đang dùng.</p><p>Set B củng cố kiến thức vừa học. Set C tăng độ khó khoảng 30% bằng ngữ cảnh, phương án gần nhau và suy luận. Exercise 12 là phần nâng cao tùy chọn.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}

function renderHome(){stopClock();stopAudio();active=null;state=null;document.title='Grade 10 Unit 6 - Gender Equality - Sets B & C';app.innerHTML=`<section class="hero"><div><p class="eyebrow">Grade 10 / Global Success / Unit 6</p><h1>Gender equality.<span>A world of possibilities.</span></h1><p class="lead">Luyện kiến thức vừa học, mở rộng góc nhìn. Chọn Set B để củng cố, rồi thử Set C với ngữ cảnh và câu hỏi cần suy nghĩ sâu hơn.</p><div class="pills"><span class="pill accent">Set B · Củng cố</span><span class="pill">Set C · Khó hơn khoảng 30%</span><span class="pill">Đáp án &amp; giải thích tiếng Việt</span></div></div><aside class="heroart" aria-label="Equal chances, different dreams"><div class="artcaption">Equal chances. Different dreams.</div><div class="artline">Your future.<br>Your choice.</div><div class="artsmall">Explore your interests.<br>Build your abilities.</div><div class="equal" aria-hidden="true">=</div></aside></section><div class="statsbar"><div class="stat"><strong>${LESSONS.length}</strong><span>Bài thực hành</span></div><div class="stat"><strong>${LESSONS.reduce((sum,l)=>sum+l.questions.length,0)}</strong><span>Câu có giải thích</span></div><div class="stat"><strong>4</strong><span>Bài nghe kèm audio</span></div><div class="stat"><strong id="completedCount">0</strong><span>Bài đã luyện tại đây</span></div></div><section aria-labelledby="catalogTitle"><div class="cataloghead"><div><p class="eyebrow" style="margin-bottom:6px">Choose your next step</p><h2 id="catalogTitle">Chọn bài luyện tập</h2><p>Exercise 1: 5 bài mỗi set, mỗi bài 15 câu cốt lõi.</p></div><div class="filters" role="group" aria-label="Lọc set"><button class="filter active" data-filter="all">Tất cả</button><button class="filter" data-filter="B">Set B</button><button class="filter" data-filter="C">Set C</button></div></div><input class="search" id="lessonSearch" type="search" placeholder="Tìm Exercise, số câu hoặc kỹ năng…" aria-label="Tìm bài luyện tập" value="${esc(search)}"><div class="cards" id="cards"></div></section><details class="catalog-note"><summary>Phạm vi và nguyên tắc của bộ bài</summary><p>Exercise 1: 1–15, 16–30, 31–45, 46–60, 61–75; mỗi bài đúng 15 câu cốt lõi, đánh số theo bộ rút gọn. Exercise 2–10 và 12–14 có đủ hai Set B/C; tài liệu nguồn không có Exercise 11.</p><p>Set B và C là hai bộ câu mới song song. Với Set C, mức tăng khoảng 30% là mục tiêu thiết kế: ngữ cảnh dài hơn, phân biệt cấu trúc, liên kết và suy luận. Không tăng độ khó bằng từ hiếm ngoài trọng tâm.</p><p>Exercise 2B: xác định trọng âm 1st/2nd. Exercise 2C: tìm từ có trọng âm khác. Exercise 12: nâng cao tùy chọn. Các trường học và tình huống dự án là ví dụ giả định phục vụ học tập.</p><p>Audio được đính kèm trong file, không cần mạng; có chỉnh tốc độ và transcript. Đây là giọng đọc tổng hợp. File dùng để tự luyện và ghi nhận kết quả trên thiết bị hiện tại.</p></details>${footer()}`;

name;save();startLesson(false);};window.scrollTo({top:0,behavior:'instant'});}
function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange'].includes(l.kind))qs=shuffle(qs);return qs;}
function startLesson(restart){stopClock();stopAudio();if(restart){db.restarts[active.id]=(db.restarts[active.id]||0)+1;save();}state={lesson:active,questions:makeQuestions(active),index:0,hearts:5,xp:0,combo:0,maxCombo:0,firstCorrect:0,startedAt:Date.now(),finished:false,transcriptSeen:false,plays:0,restarts:db.restarts[active.id]||0,answers:{}};for(const q of state.questions)state.answers[q.number]={attempts:0,firstCorrect:false,done:false,wrong:[],selected:null};renderWork();clock=setInterval(()=>{const el=document.getElementById('timer');if(el&&!state.finished)el.textContent=fmt(timeNow());},1000);}
function passageHTML(l){const lines=l.passage.split('\n').filter(Boolean);if(!lines.length)return '';const title=lines.shift();return `<h2>${esc(title)}</h2>`+lines.map(t=>'<p>'+esc(t).replace(/^\[(\d+)\]/,'<span class="paragraphnum">$1</span>').replace(/\((\d+)\) _____/g,(_,n)=>`<button type="button" class="blank" data-jump="${n}" aria-label="Đến chỗ trống ${n}">(${n}) _____</button>`)+ '</p>').join('');}

function renderWork(){const l=state.lesson;const withContext=!!(l.passage||l.transcript);app.innerHTML=`<section class="lessonintro"><p class="eyebrow">${TYPES[l.kind]} · Set ${l.level}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.topic)}</p></section><div class="toolbar"><span class="person">${esc(db.name)}</span><div class="metrics"><span class="metric" id="heartMetric"></span><span class="metric">XP <strong id="xp">0</strong></span><span class="metric">Combo <strong id="combo">0</strong></span><span class="metric">Thời gian <strong id="timer">00:00</strong></span></div></div><div class="progressbar" role="progressbar" id="progressBar" aria-label="Số câu đã trả lời đúng" aria-valuemin="0" aria-valuemax="${l.questions.length}" aria-valuenow="0"><div id="progressFill"></div></div><div class="workgrid ${withContext?'':'solo'}">${withContext?`<aside class="passagebox"><details id="contextDetails" open><summary>${l.transcript?'Bài nghe & transcript':'Đoạn văn · giữ nguyên thứ tự câu'}</summary>${l.passage?`<div id="passageText">${passageHTML(l)}</div>`:audioHTML(l)}</details></aside>`:''}<section><div class="questionbox" id="questionArea"></div><nav class="qnav" id="questionNav" aria-label="Chọn câu hỏi"></nav><p class="navhint">Viền xanh: câu đang xem · Nền xanh: đã đúng · Nền vàng: đã thử</p></section></div><div class="underactions"><button class="textbtn" id="restartBtn">Làm lại &amp; trộn bài</button><button class="secondary" id="submitBtn">Nộp bài / Xem kết quả</button></div>${footer()}`;
 document.getElementById('restartBtn').onclick=()=>ask('Làm lại từ đầu?','Lượt đang làm sẽ kết thúc mà không lưu điểm. Câu rời và đáp án sẽ được trộn; thứ tự bài đọc/nghe được giữ nguyên.',()=>startLesson(true),'Làm lại');document.getElementById('submitBtn').onclick=()=>{const un=state.questions.filter(q=>!state.answers[q.number].done).length;ask('Nộp bài?',un?`Còn ${un} câu chưa trả lời đúng. Điểm theo lần chọn đầu vẫn được lưu; câu chưa chọn tính 0 điểm.`:'Tất cả câu đã được trả lời đúng. Lưu kết quả lượt này?',()=>finish('submitted'));};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const idx=state.questions.findIndex(q=>q.number===Number(b.dataset.jump));if(idx>=0){state.index=idx;renderQuestion(true);}});
 if(l.transcript){const a=document.getElementById('listeningAudio');a.onplay=()=>state.plays++;a.onerror=()=>toast('Không phát được audio trên trình duyệt này. Thử mở file MP3 trong thư mục audio.');document.getElementById('audioSpeed').onchange=e=>a.playbackRate=Number(e.target.value);document.getElementById('transcript').ontoggle=e=>{if(e.target.open)state.transcriptSeen=true;};}
 renderQuestion();window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number];document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2><div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?'<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>Đọc kỹ ngữ cảnh hoặc nghe lại. Mỗi lần chọn sai mất 1 tim.</div>':''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||a.selected===null||a.wrong.includes(a.selected)?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};
 document.getElementById('questionNav').innerHTML=state.questions.map((x,i)=>{const r=state.answers[x.number];return `<button class="${i===state.index?'current':''} ${r.done?'done':''} ${r.attempts?'attempted':''}" data-nav="${i}" aria-label="Câu ${x.number}${r.done?', đã đúng':''}" ${i===state.index?'aria-current="step"':''}>${x.number}</button>`;}).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.nav);renderQuestion(true);});document.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('active',Number(b.dataset.jump)===q.number));updateMetrics();if(focus)document.getElementById('questionStem').focus({preventScroll:false});}
function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number];if(a.done||a.selected===null||a.wrong.includes(a.selected))return;const correct=a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Unit6_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio file. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}
window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
