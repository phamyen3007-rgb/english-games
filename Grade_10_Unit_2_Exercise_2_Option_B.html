<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 2 - Option B</title>
<style>
:root{--bg:#060709;--panel:#111318;--panel2:#181b22;--purple:#9a6cff;--green:#4fd39a;--red:#ff6575;--text:#f4f7fb;--muted:#aeb7c2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(154,108,255,.12),transparent 24%),linear-gradient(180deg,#030405,#090b0e 58%,#020203);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spider{position:absolute;font-size:36px;animation:crawl linear infinite}.s1{left:-50px;top:20%;animation-duration:14s}.s2{left:-80px;top:66%;animation-duration:20s;animation-delay:4s}@keyframes crawl{to{transform:translateX(115vw) rotate(18deg)}}.web{position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,.12);border-radius:50%}.w1{left:-120px;top:-120px}.w2{right:-120px;bottom:-120px}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}.hero{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;margin-bottom:16px}.icon{font-size:70px;text-align:center;filter:drop-shadow(0 0 18px rgba(154,108,255,.25))}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#f4f6fa,#a7b0bd,#9a6cff);-webkit-background-clip:text;color:transparent}.sub{margin:7px 0 0;color:#b8c0ca;font-weight:700}.sound{border:1px solid rgba(154,108,255,.35);background:#161820;color:#f4f6fa;border-radius:12px;padding:11px 14px;font-weight:900}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(154,108,255,.2);border-radius:24px;box-shadow:0 24px 65px rgba(0,0,0,.5);overflow:hidden}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:#0d0f14}.barbox{height:13px;background:#050608;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#b7c0cb,#7d8794,#9a6cff);transition:.3s}.chip{background:#1a1d24;padding:8px 12px;border-radius:999px;font-weight:900}.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.passage,.quiz{border:2px solid #282d36;border-radius:18px;padding:18px;background:#0d1015}.passage{max-height:560px;overflow:auto;line-height:1.75}.passage h3{margin-top:0}.tag{display:inline-block;background:#20242d;color:#dbe0e6;padding:7px 12px;border-radius:10px;font-weight:900}.question{font-size:23px;margin:16px 0}.options{display:grid;gap:12px}.option{padding:14px 15px;border:2px solid #303641;border-radius:14px;background:#1a1e26;color:#f4f7fb;text-align:left;font-size:17px;cursor:pointer}.option:hover:not(:disabled){border-color:#9a6cff}.correct{background:#14392f!important;border-color:var(--green)!important}.wrong{background:#47212a!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#0d1015;line-height:1.55}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#d2d8df,#a89cff);color:#20232b}.btn:disabled{opacity:.4}.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}.scorebig{font-size:58px;font-weight:1000;color:#b9adff}.review{text-align:left;margin-top:24px}.item{padding:12px 14px;background:#0d1015;border-left:5px solid #5f6671;border-radius:12px;margin:9px 0}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}@media(max-width:850px){.main{grid-template-columns:1fr}}@media(max-width:650px){.hero{grid-template-columns:70px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style></head><body>
<div class="bg"><div class="web w1"></div><div class="web w2"></div><div class="spider s1">🕷️</div><div class="spider s2">🕷️</div></div>
<div class="wrap"><div class="hero"><div class="icon">🕷️</div><div><h1>Spider Web Reading Challenge</h1><div class="sub">Grade 10 · Unit 2 · Exercise 2 · Option B</div></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></div>
<div class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="main"><div class="passage"><h3>🕸️ Green Future</h3><div id="passage"></div></div><div class="quiz"><div class="tag" id="tag"></div><div class="question" id="q"></div><div class="options" id="ops"></div><div class="feedback" id="fb"></div><div class="controls"><button class="btn" id="next" disabled>Next Web →</button></div></div></div></div><div class="result" id="result"><div style="font-size:74px">🕷️🕸️</div><h2>Spider Challenge Complete!</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="btn" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage="Green Future is an environmental organization that encourages young people to take action to protect nature. One of its main goals is to (1) ____________ endangered species and prevent the destruction of their natural habitats. Members regularly organize campaigns to (2) ____________ awareness of environmental problems in local communities. They also encourage families to (3) ____________ on the amount of electricity they use by switching off unnecessary lights and appliances. In addition, people are advised to (4) ____________ reusable products instead of single-use plastic ones. The organization also works with local schools to (5) ____________ environmental projects that help students develop greener habits. Anyone who wants to support these activities can volunteer or (6) ____________ money to the organization.";
const Q=[["Question 1", ["preserve", "survive", "disappear", "damage"], 0, "preserve endangered species = bảo tồn các loài có nguy cơ tuyệt chủng. Survive = sống sót; disappear = biến mất; damage = gây hại."], ["Question 2", ["rise", "raise", "grow", "lift"], 1, "raise awareness of/about sth = nâng cao nhận thức về vấn đề gì."], ["Question 3", ["break down", "take off", "cut down", "turn up"], 2, "cut down on sth = cắt giảm cái gì. → cut down on the amount of electricity = giảm lượng điện sử dụng."], ["Question 4", ["adopt", "destroy", "release", "prevent"], 0, "adopt reusable products/practices = áp dụng/lựa chọn sử dụng các sản phẩm hoặc cách làm có thể tái sử dụng."], ["Question 5", ["carry out", "give up", "run out", "put off"], 0, "carry out a project = thực hiện một dự án. Give up = từ bỏ; run out = cạn kiệt; put off = trì hoãn."], ["Question 6", ["provide", "donate", "spend", "charge"], 1, "donate money to an organization/charity = quyên góp tiền cho một tổ chức hoặc tổ chức từ thiện."]];
const L=["A","B","C","D"];let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine"){if(!on)return;let z=ac(),o=z.createOscillator(),g=z.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(z.destination);o.start();o.stop(z.currentTime+d)}
function ok(){tone(480,.08);setTimeout(()=>tone(720,.12,"triangle"),80)}function bad(){tone(150,.16,"sawtooth")}function go(){tone(330,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(on)go()};
function show(){a=false;$("next").disabled=true;$("fb").className="feedback";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🕷️ ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${o}`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Web 🕷️":"Next Web →"}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+c*2;c++;$("fb").className="feedback correct show";ok()}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");$("fb").className="feedback wrong show";bad()}$("fb").innerHTML=`<strong>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</strong><br>${q[3]}`;ans.push({n,right});$("score").textContent=`🕷️ ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};
function result(){$("quizArea").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct===6?"Perfect Spider Reader!":correct>=5?"Excellent!":"Hãy xem lại các câu sai.";let r="<h3>🕸️ Spider Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}: ${z&&z.right?"Đúng":"Sai"}</b><br>Em chọn: ${z?L[z.n]:"-"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`});$("review").innerHTML=r}
$("restart").onclick=()=>location.reload();$("passage").textContent=passage;show();
</script></body></html>
