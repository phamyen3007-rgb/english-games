<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 10 - Unit 2 - Exercise 1 (100-132) - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#bfeaff,#eefaff);color:#234;padding:18px;min-height:100vh}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}.bird{position:absolute;left:-60px;font-size:34px;animation:fly linear infinite}.b1{top:15%;animation-duration:16s}.b2{top:35%;animation-duration:22s;animation-delay:3s}@keyframes fly{to{transform:translateX(115vw) translateY(-30px)}}
.wrap{max-width:1000px;margin:auto;position:relative}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}h1{margin:0;color:#23689b}.sub{color:#567}.sound{padding:10px 14px;border:0;border-radius:12px;background:white;font-weight:bold}
.card{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 20px 50px #3573a333;overflow:hidden}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:16px;background:#effaff}.barbox{height:12px;background:#d7ebf7;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffd86a,#68c7ff,#2967a3)}.chip{background:white;padding:8px 12px;border-radius:99px;font-weight:bold}.content{padding:22px}.tag{display:inline-block;padding:7px 12px;background:#e9f8ff;border-radius:10px;font-weight:bold}h2{font-size:28px;line-height:1.4}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:15px;border:2px solid #d8ebf5;border-radius:14px;background:white;text-align:left;font-size:18px;cursor:pointer}.opt:hover{border-color:#68c7ff}.correct{background:#e6fff2!important;border-color:#43cc8b!important}.wrong{background:#fff0f3!important;border-color:#ff6677!important}#fb{display:none;margin-top:16px;padding:15px;border-left:5px solid #ffd166;background:#f9fdff;border-radius:12px;line-height:1.5}.next{margin-top:18px;float:right;padding:12px 20px;border:0;border-radius:12px;background:#bfeaff;font-weight:bold}#result{display:none;text-align:center;padding:30px}.review{text-align:left}.item{padding:12px;margin:8px 0;background:#f7fcff;border-left:5px solid #9ab4c6;border-radius:10px}@media(max-width:700px){.opts{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style></head><body>
<div class="sky"><div class="bird b1">🕊️</div><div class="bird b2">🐦</div></div>
<div class="wrap"><header><div><h1>Birds Learning Quest</h1><div class="sub">Grade 10 · Unit 2 · Exercise 1 (100–132) · Option B</div></div><button class="sound" id="sound">🔊</button></header>
<div class="card"><div id="quiz"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="content"><div class="tag" id="tag"></div><h2 id="q"></h2><div class="opts" id="ops"></div><div id="fb"></div><button class="next" id="next" disabled>Next Flight 🐦</button><div style="clear:both"></div></div></div><div id="result"><div style="font-size:70px">🏆🐦</div><h2>Bird Quest Complete</h2><h1 id="final"></h1><p id="msg"></p><button class="next" onclick="location.reload()">Fly Again</button><div style="clear:both"></div><div class="review" id="review"></div></div></div></div>
<script>
const Q=[["The government plans to ____________ stricter environmental laws next year.", ["collect", "adopt", "attract", "damage"], 1, "Adopt a law/policy = ban hành, áp dụng luật/chính sách."], ["We should avoid using plastic bags because they are not ____________.", ["eco-friendly", "harmful", "compulsory", "refillable"], 0, "Eco-friendly = thân thiện với môi trường."], ["Look at those dark clouds! It ____________ soon.", ["will rain", "rains", "is going to rain", "has rained"], 2, "Có dấu hiệu rõ ràng nên dùng be going to."], ["The old factory produced too much smoke and seriously ____________ the environment.", ["harmed", "sorted", "adopted", "raised"], 0, "Harm the environment = gây hại môi trường."], ["The school library ____________ by local volunteers next month.", ["repairs", "will repair", "will be repaired", "repaired"], 2, "Dùng tương lai bị động: will be repaired."], ["Everyone should help reduce ____________ by reusing paper and plastic bottles.", ["achievement", "waste", "attraction", "suggestion"], 1, "Reduce waste = giảm rác thải."], ["The science teacher asked us ____________ more about renewable energy.", ["learn", "learning", "to learn", "learned"], 2, "Ask somebody to do something."], ["My sister is very keen ____________ protecting endangered animals.", ["in", "on", "of", "for"], 1, "Be keen on + V-ing."], ["\"There's no milk left.\" \"I ____________ some after school.\"", ["am going to buy", "buy", "will buy", "bought"], 2, "Quyết định ngay lúc nói nên dùng will."], ["The students ____________ trees around the playground when the principal arrived.", ["planted", "were planting", "have planted", "had planted"], 1, "Dùng Past Continuous cho hành động đang diễn ra."], ["This old computer is still ____________ although it was bought eight years ago.", ["in use", "on use", "of use", "by use"], 0, "In use = vẫn đang được sử dụng."], ["Please remember ____________ all the lights before leaving the classroom.", ["turning off", "turn off", "to turn off", "turned off"], 2, "Remember to + V."], ["Our class hopes to ____________ enough money to buy more trees for the school garden.", ["raise", "sort", "recycle", "destroy"], 0, "Raise money = gây quỹ."], ["Many plastic bottles ____________ into useful products every year.", ["recycle", "recycled", "are recycled", "are recycling"], 2, "Dùng hiện tại đơn bị động: are recycled."], ["Winning first prize in the Green School Competition was a great ____________ for our class.", ["announcement", "achievement", "explosion", "appliance"], 1, "Achievement = thành tựu."]],L=["A","B","C","D"];let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function tone(f,d=.1){if(!on)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊":"🔇"};
function show(){a=false;$("next").disabled=true;$("fb").style.display="none";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🐦 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((x,n)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<b>${L[n]}.</b> ${x}`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)})}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".opt")],ok=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(ok){xp+=10+c*2;c++;tone(900)}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");tone(180)}ans.push({n,ok});$("fb").style.display="block";$("fb").innerHTML=`<b>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</b><br>${q[3]}`;$("score").textContent=`🐦 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{tone(550,.07);if(i<Q.length-1){i++;show()}else{$("quiz").style.display="none";$("result").style.display="block";let correct=ans.filter(x=>x.ok).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct>=12?"Excellent Flyer!":"Hãy xem lại các câu sai để tiến bộ hơn.";let r="<h3>Birds Review</h3>";Q.forEach((q,n)=>r+=`<div class="item"><b>Câu ${n+1}:</b> ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`);$("review").innerHTML=r}};show();
</script></body></html>
