<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 3 - Option C</title>
<style>
:root{--deep:#03192a;--panel:#07283d;--panel2:#0a3650;--cyan:#4be1ff;--blue:#3a8dff;--green:#4fd39a;--red:#ff6575;--text:#f2fbff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;color:var(--text);background:linear-gradient(180deg,#03111e,#02101b 55%,#01070c);padding:18px;overflow-x:hidden}
.sea{position:fixed;inset:0;pointer-events:none;overflow:hidden}.bubble{position:absolute;border-radius:50%;border:2px solid rgba(184,246,255,.28);animation:rise linear infinite}.b1{width:18px;height:18px;left:8%;bottom:-30px;animation-duration:8s}.b2{width:30px;height:30px;left:24%;bottom:-40px;animation-duration:12s;animation-delay:2s}.b3{width:22px;height:22px;right:12%;bottom:-30px;animation-duration:9s;animation-delay:1s}@keyframes rise{to{transform:translateY(-115vh);opacity:.04}}.fish{position:absolute;font-size:34px;animation:swim linear infinite}.f1{left:-70px;top:26%;animation-duration:18s}.f2{right:-70px;top:48%;animation-duration:22s;animation-direction:reverse}@keyframes swim{to{transform:translateX(115vw)}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}.hero{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;margin-bottom:16px}.icon{font-size:68px;text-align:center}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#dffbff,#4be1ff,#3a8dff);-webkit-background-clip:text;color:transparent}.sub{color:#a9cddd;font-weight:700}.sound{border:1px solid rgba(75,225,255,.35);background:#08283b;color:white;border-radius:12px;padding:11px 14px;font-weight:900}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.5)}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#051d2d}.barbox{height:13px;background:#020a11;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#b8f6ff,#4be1ff,#3a8dff)}.chip{background:#0b3047;padding:8px 12px;border-radius:999px;font-weight:900}.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.passage,.quiz{background:#061f31;border:2px solid #124a69;border-radius:18px;padding:18px}.passage{max-height:600px;overflow:auto;line-height:1.75}.tag{display:inline-block;background:#103b58;padding:7px 12px;border-radius:10px;font-weight:900}.question{font-size:23px;margin:16px 0}.options{display:grid;gap:12px}.option{padding:14px 15px;border:2px solid #1b5372;border-radius:14px;background:#0b3047;color:white;text-align:left;font-size:17px;cursor:pointer}.option:hover:not(:disabled){border-color:#4be1ff}.correct{background:#14392f!important;border-color:var(--green)!important}.wrong{background:#47212a!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#061f31;line-height:1.55}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#c9f7ff,#68ddff);color:#153849}.btn:disabled{opacity:.4}.result{display:none;text-align:center;padding:34px}.result.show{display:block}.scorebig{font-size:58px;font-weight:1000;color:#8eeeff}.review{text-align:left}.item{padding:12px 14px;background:#061f31;border-left:5px solid #527388;border-radius:12px;margin:9px 0}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}@media(max-width:850px){.main{grid-template-columns:1fr}}@media(max-width:650px){.hero{grid-template-columns:70px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style></head><body>
<div class="sea"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="fish f1">🐟</div><div class="fish f2">🐠</div></div>
<div class="wrap"><div class="hero"><div class="icon">🌊</div><div><h1>Deep Sea Green School Challenge</h1><div class="sub">Grade 10 · Unit 2 · Exercise 3 · Option C</div></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></div>
<div class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="main"><div class="passage"><h3>🌊 Small Changes for a Greener School</h3><div id="passage"></div></div><div class="quiz"><div class="tag" id="tag"></div><div class="question" id="q"></div><div class="options" id="ops"></div><div class="feedback" id="fb"></div><div class="controls"><button class="btn" id="next" disabled>Next Dive →</button></div></div></div></div>
<div class="result" id="result"><div style="font-size:74px">🌊🐠</div><h2>Deep Sea Challenge Complete!</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="btn" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage="Schools use a considerable amount of energy and produce waste every day. However, students can make a real (1) ____________ by changing some of their everyday habits. One effective way is to reduce the number of disposable products they use. Instead of buying bottled water each day, for example, students can (2) ____________ reusable bottles with them.\n\nSaving electricity is another important step. Students should make sure that lights and computers are switched (3) ____________ before leaving the classroom. This simple action can reduce unnecessary energy consumption. Schools can also encourage students to make better use of natural light (4) ____________ using electric lights throughout the day.\n\nWaste is another issue that needs to be (5) ____________. Schools can provide separate bins for paper, plastic, and other materials so that more waste can be recycled. (6) ____________, students should avoid throwing away food that can still be eaten. These actions may seem small, but their environmental benefits can gradually (7) ____________ up.\n\nTeachers also play an important role in helping students develop greener habits. Environmental activities can (8) ____________ students more aware of how their choices affect the planet. When students understand the consequences of their actions, they are more likely to take responsibility (9) ____________ protecting the environment.\n\nA greener school cannot be created overnight. It requires the whole school community to work together and (10) ____________ environmentally friendly habits into their daily lives.";
const Q=[["Question 1", ["progress", "difference", "result", "decision"], 1, "make a difference = tạo ra sự khác biệt/tác động tích cực. Đây là collocation cố định."], ["Question 2", ["hold", "deliver", "carry", "provide"], 2, "carry something with somebody = mang theo thứ gì bên mình. → carry reusable bottles with them = mang theo chai tái sử dụng."], ["Question 3", ["off", "away", "down", "out"], 0, "switch off lights/computers = tắt đèn/máy tính. Trong câu bị động: are switched off."], ["Question 4", ["because of", "despite", "except for", "instead of"], 3, "instead of + V-ing = thay vì làm gì. → tận dụng ánh sáng tự nhiên thay vì sử dụng đèn điện cả ngày."], ["Question 5", ["produced", "avoided", "addressed", "caused"], 2, "address an issue/problem = giải quyết/xử lý một vấn đề. → an issue that needs to be addressed = vấn đề cần được giải quyết."], ["Question 6", ["Otherwise", "In addition", "However", "As a result"], 1, "In addition = ngoài ra, dùng để bổ sung thêm một biện pháp bảo vệ môi trường."], ["Question 7", ["add", "bring", "take", "build"], 0, "add up = tích lũy/cộng dồn. Nhiều hành động nhỏ có thể cộng dồn và tạo ra lợi ích lớn hơn theo thời gian."], ["Question 8", ["allow", "encourage", "make", "keep"], 2, "make + somebody + adjective = làm cho ai trở nên... → make students more aware of = giúp học sinh nhận thức rõ hơn."], ["Question 9", ["with", "for", "about", "of"], 1, "take responsibility for + noun/V-ing = chịu trách nhiệm về việc gì. → take responsibility for protecting the environment."], ["Question 10", ["prevent", "replace", "introduce", "incorporate"], 3, "incorporate sth into sth = đưa/kết hợp cái gì vào cái gì. → incorporate environmentally friendly habits into their daily lives."]];
const L=["A","B","C","D"];let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine"){if(!on)return;let z=ac(),o=z.createOscillator(),g=z.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(z.destination);o.start();o.stop(z.currentTime+d)}
function ok(){tone(540,.08);setTimeout(()=>tone(790,.12,"triangle"),80)}function bad(){tone(150,.16,"sawtooth")}function go(){tone(350,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(on)go()};
function show(){a=false;$("next").disabled=true;$("fb").className="feedback";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🌊 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${o}`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Dive 🌊":"Next Dive →"}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+c*2;c++;$("fb").className="feedback correct show";ok()}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");$("fb").className="feedback wrong show";bad()}$("fb").innerHTML=`<strong>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</strong><br>${q[3]}`;ans.push({n,right});$("score").textContent=`🌊 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};
function result(){$("quizArea").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct===10?"Perfect Deep Sea Master!":correct>=8?"Excellent!":"Hãy xem lại các câu sai.";let r="<h3>🌊 Deep Sea Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}: ${z&&z.right?"Đúng":"Sai"}</b><br>Em chọn: ${z?L[z.n]:"-"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`});$("review").innerHTML=r}
$("restart").onclick=()=>location.reload();$("passage").textContent=passage;show();
</script></body></html>
