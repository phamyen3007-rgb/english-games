<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Grade 12 - Unit 4 - Exercise 2 - Option B</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial;background:linear-gradient(135deg,#fff0c4,#f5c889,#d99a57);color:#3b2918}.wrap{max-width:1150px;margin:auto}.head{padding:22px;border-radius:24px 24px 0 0;background:#593716;color:white;display:flex;gap:18px;align-items:center}.head .ico{font-size:65px}.head h1{margin:0;color:#ffd979}.head p{margin:6px 0 0}.game{background:#fffaf0;border-radius:0 0 24px 24px;box-shadow:0 18px 50px #59371633}.top{padding:14px 20px;background:#fff0c8;display:flex;gap:14px;align-items:center}.track{height:13px;background:#dfcaa8;border-radius:20px;flex:1;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#9c5e22,#e59b34);width:0}.badge{font-weight:bold;background:white;padding:8px 12px;border-radius:20px}.main{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:20px}.passage,.quiz{padding:20px;border-radius:18px}.passage{background:#fff1cc;border:2px dashed #b46f29;line-height:1.7;max-height:700px;overflow:auto}.passage h2{color:#8c501b}.passage b{color:#b84927}.quiz{background:white;border:2px solid #e4c49b}.tag{display:inline-block;background:#8d501d;color:white;padding:7px 12px;border-radius:9px;font-weight:bold}.q{font-size:20px;line-height:1.5;margin:18px 0}.answers{display:grid;gap:10px}.ans{padding:14px;text-align:left;border:2px solid #dfc8aa;background:#fffdf8;border-radius:13px;font-size:16px;cursor:pointer}.ans:hover:not(:disabled){border-color:#b46f29;transform:translateX(3px)}.ans.good{background:#eafff3;border-color:#22a66c}.ans.bad{background:#fff0f1;border-color:#db4e58}.fb{display:none;padding:14px;margin-top:15px;border-radius:11px;line-height:1.5}.fb.good{display:block;background:#eafff3;border-left:5px solid #22a66c}.fb.bad{display:block;background:#fff0f1;border-left:5px solid #db4e58}.next{display:none;float:right;margin-top:14px;padding:12px 20px;border:0;border-radius:11px;background:#593716;color:white;font-weight:bold;cursor:pointer}.result{display:none;text-align:center;background:#fffaf0;padding:35px;border-radius:24px}.result.show{display:block}.big{font-size:60px;font-weight:bold;color:#95561e}.review{text-align:left}.item{padding:12px;margin:8px 0;background:#fff1cc;border-radius:10px;border-left:5px solid #b97b35}.restart{padding:12px 20px;border:0;border-radius:11px;background:#e9a43b;font-weight:bold;cursor:pointer}@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:430px}}</style></head><body><div class="wrap"><div class="head"><div class="ico">🚂🧳</div><div><h1>Urban Express</h1><p>Grade 12 · Unit 4 · Exercise 2 · Option B</p></div></div><div class="game" id="game"><div class="top"><div class="track"><div class="bar" id="bar"></div></div><div class="badge">⭐ <span id="score">0</span>/8</div><div class="badge">🔥 <span id="streak">0</span></div></div><div class="main"><div class="passage" id="passage"></div><div class="quiz"><div class="tag" id="tag"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="fb" id="fb"></div><button class="next" id="next">NEXT →</button><div style="clear:both"></div></div></div></div><div class="result" id="result"><div style="font-size:75px">🚂🏆</div><h2>Journey Complete!</h2><div class="big" id="final"></div><p>Review your route below.</p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div class="review" id="review"></div></div></div><script>
const Q=[{"q": "Although this process can contribute considerably to economic growth, it also places increasing (1) __________ on housing, transportation, and public services.", "o": ["burden", "pressure", "weight", "force"], "a": 1, "e": "place pressure on sth = gây áp lực lên."}, {"q": "As demand for housing rises, property prices may increase beyond what many low-income residents can (2) __________.", "o": ["afford", "provide", "purchase", "consume"], "a": 0, "e": "can afford = có đủ khả năng tài chính để chi trả."}, {"q": "Rapid urban expansion can also occur at the (3) __________ of agricultural land and natural habitats.", "o": ["cost", "loss", "expense", "sacrifice"], "a": 2, "e": "at the expense of = đánh đổi bằng / gây thiệt hại cho."}, {"q": "Forests and farmland are often cleared to (4) __________ way for residential areas, industrial zones, and transport networks.", "o": ["get", "take", "make", "give"], "a": 2, "e": "make way for = nhường chỗ cho."}, {"q": "Governments need to (5) __________ effective measures to ensure that urban growth remains sustainable.", "o": ["adopt", "receive", "admit", "obtain"], "a": 0, "e": "adopt measures = áp dụng/thực hiện các biện pháp."}, {"q": "Greater investment in public transport can help (6) __________ traffic congestion.", "o": ["decline", "relieve", "reduce", "weaken"], "a": 2, "e": "reduce traffic congestion = giảm ùn tắc giao thông."}, {"q": "Authorities should also (7) __________ priority to protecting green spaces.", "o": ["make", "give", "set", "put"], "a": 1, "e": "give priority to sth = ưu tiên điều gì."}, {"q": "The benefits of urbanisation may eventually be (8) __________ by its social and environmental costs.", "o": ["outweighed", "outnumbered", "overcome", "overtaken"], "a": 0, "e": "be outweighed by = bị lấn át bởi / kém quan trọng hơn."}],P="<h2>Challenges of Rapid Urban Growth</h2><p>Rapid urbanisation has become one of the most significant trends in many developing countries. As people continue to move from rural areas to cities in search of better employment and educational opportunities, urban populations are expanding at an unprecedented rate. Although this process can contribute considerably to economic growth, it also places increasing <b>(1) ______</b> on housing, transportation, and public services.</p><p>One major challenge is the shortage of affordable accommodation. As demand for housing rises, property prices may increase beyond what many low-income residents can <b>(2) ______</b>. Consequently, some families are forced to live in overcrowded neighbourhoods where access to essential services may be limited.</p><p>Rapid urban expansion can also occur at the <b>(3) ______</b> of agricultural land and natural habitats. Forests and farmland are often cleared to <b>(4) ______</b> way for residential areas, industrial zones, and transport networks. Such development may have serious environmental consequences, including habitat loss and increased air pollution.</p><p>To deal with these challenges, governments need to <b>(5) ______</b> effective measures to ensure that urban growth remains sustainable. Greater investment in public transport can help <b>(6) ______</b> traffic congestion, while well-planned housing projects can provide residents with better living conditions. Authorities should also <b>(7) ______</b> priority to protecting green spaces rather than focusing exclusively on economic development. Without careful planning, the benefits of urbanisation may eventually be <b>(8) ______</b> by its social and environmental costs.</p>",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,hist=[];const $=x=>document.getElementById(x);$("passage").innerHTML=P;
function render(){answered=false;let x=Q[i];$("tag").textContent="Question "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("good");let ok=n===x.a;if(ok){score++;streak++;$("fb").className="fb good";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e}else{streak=0;b.classList.add("bad");$("fb").className="fb bad";$("fb").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e}$("fb").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";hist.push({n,ok});$("next").style.display="block"}
$("next").onclick=()=>{if(!answered)return;if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");$("final").textContent=score+"/"+Q.length+" · "+Math.round(score/Q.length*100)+"%";let h="<h3>🧳 Route Review</h3>";Q.forEach((x,k)=>{let a=hist[k];h+='<div class="item"><b>Question '+(k+1)+' — '+(a.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br><i>'+x.e+'</i></div>'});$("review").innerHTML=h}render();
</script></body></html>
