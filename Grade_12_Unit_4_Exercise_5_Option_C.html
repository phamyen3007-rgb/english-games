<title>Grade 12 - Unit 4 - Exercise 5 - Option C</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#3f342c;background:linear-gradient(#f6dfc1,#f4efe3);padding:22px}

.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.reading{background:#fffaf0;border:2px solid #bd956a;border-radius:18px;padding:21px;line-height:1.72;max-height:680px;overflow:auto;box-shadow:inset 0 0 0 5px #f0dfc6}.reading h2{margin-top:0;color:#8b4b2e}.reading strong{color:#a75431}.quiz{background:#fff;border:2px solid #d1b18c;border-radius:18px;padding:21px}.tag{display:inline-block;background:#80502e;color:white;border-radius:9px;padding:7px 12px;font-weight:900}.q{font-size:20px;line-height:1.5;margin:17px 0}.answers{display:grid;gap:11px}.ans{border:2px solid #ded3c4;background:#fff;border-radius:12px;padding:14px;text-align:left;font-size:16px;color:#3f342c;cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateX(4px);border-color:#bd8251;background:#fffaf2}.ans.correct{background:#eaffef;border-color:#3aa267}.ans.wrong{background:#fff0f1;border-color:#c84e59}.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.feedback.good{display:block;background:#eaffef;border-left:5px solid #3aa267}.feedback.bad{display:block;background:#fff0f1;border-left:5px solid #c84e59}.controls{text-align:right;margin-top:14px}.next{display:none;border:0;border-radius:11px;padding:12px 21px;background:linear-gradient(90deg,#80502e,#c2783c);color:white;font-weight:900;cursor:pointer}.result{display:none;background:#fff9ec;border-radius:26px;padding:35px;text-align:center;box-shadow:0 20px 55px #5e402b30}.result.show{display:block}.scoreBig{font-size:62px;font-weight:1000;color:#8b4b2e}.review{text-align:left;margin-top:24px}.reviewItem{padding:13px 15px;margin:9px 0;border-radius:11px;background:#eee2cf;border-left:5px solid #a36a3e}.reviewItem.ok{border-color:#3aa267}.reviewItem.no{border-color:#c84e59}.restart{border:0;border-radius:11px;padding:12px 21px;background:#80502e;color:#fff;font-weight:900;cursor:pointer}.deco{position:fixed;pointer-events:none;opacity:.15;font-size:90px}.d1{left:1%;top:18%}.d2{right:1%;bottom:5%}
@media(max-width:900px){.main{grid-template-columns:1fr}.reading{max-height:430px}}@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head><body><div class="deco d1">🗺️</div><div class="deco d2">🧭</div><div class="wrap">
<header class="hero"><div class="top"><div class="brand"><div class="icon">🏜️</div><div><h1>Desert Explorer Quest</h1><div class="sub">Grade 12 - Unit 4 - Exercise 5 - Option C</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div></header>
<section id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill">🏺 Score <span id="score">0</span>/6</div><div class="pill">⭐ Streak <span id="streak">0</span></div></div><div class="main"><article id="reading" class="reading"></article><section class="quiz"><div id="tag" class="tag"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="next" class="next">NEXT →</button></div></section></div></section>
<section id="result" class="result"><div style="font-size:80px">🏜️🏆🧭</div><h2>Expedition Complete!</h2><div id="final" class="scoreBig"></div><p id="message"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></section></div>
<script>
const Q=[{"q": "Over the past few decades, millions of people (1) ______ from rural communities to major cities in search of employment, education, and improved living standards.", "o": ["had relocated", "relocated", "have relocated", "are relocating"], "a": 2, "e": "<b>Over the past few decades</b> thường đi với Present Perfect khi quá trình bắt đầu trong quá khứ và có liên hệ đến hiện tại. → <b>have relocated</b>."}, {"q": "Demand for accommodation may increase faster than supply, making housing increasingly (2) ______ for low-income residents.", "o": ["unaffordable", "unavailable", "inadequate", "inconvenient"], "a": 0, "e": "<b>Unaffordable housing</b> = nhà ở quá đắt, vượt khả năng chi trả. Ngữ cảnh demand tăng nhanh hơn supply → giá nhà tăng."}, {"q": "The construction of roads and residential areas often takes place at the (3) ______ of farmland and natural habitats.", "o": ["loss", "sacrifice", "expense", "shortage"], "a": 2, "e": "Cụm cố định <b>at the expense of</b> = đánh đổi bằng / gây thiệt hại cho."}, {"q": "(4) ______, the growing number of private vehicles contributes to air pollution and severe traffic congestion.", "o": ["Otherwise", "Moreover", "Nevertheless", "Instead"], "a": 1, "e": "Hai ý cùng bổ sung các hậu quả tiêu cực của đô thị hoá. <b>Moreover</b> = hơn nữa / thêm vào đó."}, {"q": "City authorities need to ensure that essential services keep (5) ______ with population growth.", "o": ["track", "step", "speed", "pace"], "a": 3, "e": "Collocation chuẩn: <b>keep pace with</b> = theo kịp. → essential services keep pace with population growth."}, {"q": "Successful urbanisation depends on whether economic development can be achieved while residents' long-term well-being is adequately (6) ______.", "o": ["maintained", "reserved", "preserved", "protected"], "a": 3, "e": "<b>Protect residents' well-being</b> = bảo vệ phúc lợi của cư dân khỏi những tác động tiêu cực. → <b>protected</b> phù hợp nhất."}],PASSAGE="\n<h2>Responding to Rapid Urban Growth</h2>\n<p>Rapid urbanisation has significantly transformed the way people live and work. Over the past few decades, millions of people <strong>(1) ______</strong> from rural communities to major cities in search of employment, education, and improved living standards. Although this movement has contributed to economic growth, it has also placed considerable pressure on urban infrastructure.</p>\n<p>One major challenge is the shortage of affordable housing. As urban populations expand, demand for accommodation may increase faster than the supply of new homes, making housing increasingly <strong>(2) ______</strong> for low-income residents. Consequently, many families may be forced to live in overcrowded neighbourhoods or move considerable distances from their workplaces.</p>\n<p>Urban expansion can also have serious environmental consequences. The construction of roads and residential areas often takes place at the <strong>(3) ______</strong> of farmland and natural habitats. <strong>(4) ______</strong>, the growing number of private vehicles contributes to air pollution and severe traffic congestion.</p>\n<p>To deal with these challenges, city authorities need to invest in efficient public transport and ensure that essential services keep <strong>(5) ______</strong> with population growth. Such measures can help cities accommodate larger populations without placing excessive pressure on the environment. Ultimately, successful urbanisation depends on whether economic development can be achieved while residents' long-term well-being is adequately <strong>(6) ______</strong>.</p>\n",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,history=[],soundOn=true,audioCtx;const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.04,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(620,.08);tone(820,.1,.07);tone(1050,.12,.14)}function bad(){tone(165,.2)}$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tone(440,.05)}
function render(){answered=false;let x=Q[i];$("tag").textContent="Oasis "+(i+1)+" / "+Q.length;$("question").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");let ok=n===x.a;if(ok){score++;streak++;$("feedback").className="feedback good";$("feedback").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("feedback").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";history.push({n,ok});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tone(440,.05);if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.13,k*.08));let pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("message").textContent=pct===100?"Perfect expedition! Every oasis discovered.":pct>=80?"Excellent work! You crossed the desert successfully.":pct>=60?"Good work. Review the missed oases below.":"Review the explanations and begin the expedition again.";let h="<h3>🧭 Expedition Review</h3>";Q.forEach((x,k)=>{let a=history[k];h+='<div class="reviewItem '+(a.ok?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("reading").innerHTML=PASSAGE;render();
</script></body></html>
