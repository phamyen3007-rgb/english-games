<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 5 - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#eaffff;background:radial-gradient(circle at 15% 20%,#0c6b78 0,transparent 28%),radial-gradient(circle at 85% 15%,#064e3b 0,transparent 25%),linear-gradient(160deg,#03131b,#062b32 55%,#021014);padding:22px}.wrap{max-width:1000px;margin:auto}.head,.game,.result{background:#06242ddd;border:1px solid #38d9c655;border-radius:24px;box-shadow:0 0 35px #19cbb722}.head{padding:22px;margin-bottom:16px}.head h1{margin:0;color:#9fffe9;font-size:clamp(24px,4vw,38px)}.head p{color:#a9dcd6;margin:8px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{padding:11px;text-align:center;background:#ffffff0a;border-radius:14px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#9fcac6}.game{padding:22px}.bar{height:10px;background:#ffffff12;border-radius:10px;overflow:hidden;margin-bottom:20px}.bar div{height:100%;background:linear-gradient(90deg,#2dd4bf,#67e8f9);transition:.3s}.qtitle{font-size:23px;font-weight:800;margin-bottom:14px;color:#d8fffa}.sentences{padding:15px 18px;background:#ffffff08;border-radius:16px;line-height:1.7;margin-bottom:18px}.sentences div{margin:5px 0}.answers{display:grid;gap:11px}.ans{border:1px solid #53d8c455;background:#0a3540;color:white;border-radius:15px;padding:14px;text-align:left;font-size:16px;cursor:pointer;transition:.18s}.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#7fffe9}.ans.correct{background:#064e3b;border-color:#34d399}.ans.wrong{background:#5f1720;border-color:#fb7185}.feedback{display:none;margin-top:17px;padding:15px;border-radius:14px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#064e3b99;border:1px solid #34d399}.feedback.bad{background:#5f172099;border:1px solid #fb7185}.next{display:none;margin:18px 0 0 auto;border:0;border-radius:14px;padding:13px 20px;font-weight:800;background:#5eead4;color:#052b2b;cursor:pointer}.next.show{display:block}.result{display:none;text-align:center;padding:30px}.result.show{display:block}.result h2{font-size:32px;color:#9fffe9}.restart{border:0;border-radius:14px;padding:13px 22px;font-weight:800;background:#5eead4;color:#052b2b;cursor:pointer}.bonus{color:#fde68a;font-weight:800}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}body{padding:12px}.game{padding:16px}}
</style></head>
<body><div class="wrap">
<section class="head"><h1>🌊 Grade 10 – Unit 2 – Exercise 5 – Option B</h1><p>Eco Ocean Mission • Arrange the sentences into a meaningful exchange or text.</p><div class="stats"><div class="stat"><b id="num">1/5</b><span>QUESTION</span></div><div class="stat"><b id="hearts">❤️❤️❤️❤️❤️</b><span>HEARTS</span></div><div class="stat"><b id="score">0</b><span>XP</span></div><div class="stat"><b id="combo">0</b><span>COMBO</span></div></div></section>
<section class="game" id="game"><div class="bar"><div id="progress"></div></div><div class="qtitle" id="qtitle"></div><div class="sentences" id="sentences"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">NEXT →</button></section>
<section class="result" id="result"><h2>🌊 Mission Complete!</h2><p id="summary"></p><button class="restart" onclick="restart()">PLAY AGAIN</button></section>
</div><script>
const qs=[
{lines:["a. Good idea! We can put separate bins for plastic and paper in the classroom.","b. Our class produces a lot of rubbish every day.","c. Yes, especially plastic bottles and used paper.","d. Why don't we start recycling more at school?","e. Great! We can ask our teacher if we can start next week."],opts:["b – c – d – a – e","b – d – c – e – a","c – b – a – d – e","d – a – b – c – e"],ans:0,exp:"Nêu vấn đề → Yes + bổ sung → đề xuất → Good idea → hành động tiếp theo."},
{lines:["a. For example, we can turn off the lights when we leave a room.","b. Saving electricity is an easy way to protect the environment.","c. These simple actions can also help our families save money.","d. We can also unplug electrical devices when we are not using them.","e. If everyone does these things, we can reduce the amount of energy we use."],opts:["a – b – d – c – e","b – a – d – c – e","b – d – a – e – c","d – a – b – c – e"],ans:1,exp:"Ý chính → For example → also → These simple actions → kết quả."},
{lines:["a. You're right. Maybe we should walk to school instead.","b. There are too many motorbikes on the road every morning.","c. Yes, and they produce a lot of harmful emissions.","d. That's a good idea. Walking is good for our health too.","e. Let's try it tomorrow morning."],opts:["b – a – c – d – e","c – b – d – a – e","b – c – a – d – e","b – c – d – e – a"],ans:2,exp:"Vấn đề → Yes, and... → đề xuất → That's a good idea → hành động."},
{lines:["a. Then, we collected plastic bottles and cans around the school yard.","b. Last Saturday, our class joined a Green Day at school.","c. Finally, we put all the recyclable waste into separate bins.","d. First, we planted some trees near the school gate.","e. We were tired after the activities, but we were very happy with what we had done."],opts:["b – a – d – c – e","d – a – b – e – c","b – d – a – c – e","b – d – c – a – e"],ans:2,exp:"Last Saturday → First → Then → Finally → cảm nghĩ."},
{lines:["a. I agree. Plastic bags can stay in the environment for hundreds of years.","b. I think we use too many plastic bags when we go shopping.","c. That's a great idea. We can bring our own bags when we go shopping.","d. Why don't we start using reusable shopping bags?","e. If more people do that, we can reduce a lot of plastic waste."],opts:["b – d – a – c – e","a – b – d – e – c","b – a – d – c – e","b – a – c – d – e"],ans:2,exp:"Nêu vấn đề → I agree + giải thích → đề xuất → That's a great idea → kết quả."}
];
let i=0,hearts=5,xp=0,combo=0,wrong=0,locked=false;const maxH=5;
const $=id=>document.getElementById(id);
function render(){locked=false;$('num').textContent=`${i+1}/${qs.length}`;$('hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(maxH-hearts);$('score').textContent=xp;$('combo').textContent=combo;$('progress').style.width=`${i/qs.length*100}%`;$('qtitle').textContent=`Question ${i+1}`;$('sentences').innerHTML=qs[i].lines.map(x=>`<div>${x}</div>`).join('');$('answers').innerHTML=qs[i].opts.map((x,j)=>`<button class="ans" onclick="choose(${j},this)">${'ABCD'[j]}. ${x}</button>`).join('');$('feedback').className='feedback';$('feedback').innerHTML='';$('next').className='next';}
function choose(j,btn){if(locked)return;const q=qs[i];if(j===q.ans){locked=true;btn.classList.add('correct');document.querySelectorAll('.ans').forEach(b=>b.disabled=true);xp+=100+combo*20;combo++;$('score').textContent=xp;$('combo').textContent=combo;$('feedback').className='feedback show good';$('feedback').innerHTML=`✅ <b>Correct!</b><br>${q.exp}`;$('next').classList.add('show');$('next').textContent=i===qs.length-1?'VIEW RESULT →':'NEXT →';}else{btn.classList.add('wrong');btn.disabled=true;wrong++;combo=0;hearts--;$('combo').textContent=combo;$('hearts').textContent='❤️'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,maxH-hearts));$('feedback').className='feedback show bad';$('feedback').innerHTML='❌ Chưa đúng. Em hãy chọn lại đến khi đúng.';if(hearts<=0){setTimeout(()=>{alert('💀 Hết tim! Em sẽ làm lại từ câu 1.');restart();},450);}}}
$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};
function finish(){$('game').style.display='none';$('result').classList.add('show');$('progress').style.width='100%';$('summary').innerHTML=`You completed all <b>${qs.length} questions</b>.<br>XP: <b>${xp}</b> • Wrong attempts: <b>${wrong}</b> • Hearts left: <b>${hearts}</b>`;}
function restart(){i=0;hearts=5;xp=0;combo=0;wrong=0;$('result').classList.remove('show');$('game').style.display='block';render()}
render();
</script></body></html>
