<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 - Unit 4 - Exercise 2 - Option D</title>
<style>
:root{--ink:#1a1531;--purple:#6d4aff;--pink:#ff5c9d;--cream:#fff8e8;--gold:#ffc84a;--ok:#25b878;--bad:#e34d61}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--ink);background:#f3edff;padding:18px}
.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 15%,#ffd9ec 0 8%,transparent 23%),radial-gradient(circle at 90% 20%,#d9eaff 0 8%,transparent 25%),linear-gradient(145deg,#fff6df,#efe6ff 55%,#e4f7ff);z-index:-2}
.doodle{position:fixed;font-size:60px;opacity:.12;z-index:-1}.d1{left:4%;top:18%;transform:rotate(-12deg)}.d2{right:4%;bottom:12%;transform:rotate(10deg)}
.wrap{max-width:1140px;margin:auto}.hero{background:#251b4b;color:white;border-radius:25px 25px 0 0;padding:20px 24px;display:flex;justify-content:space-between;gap:15px;align-items:center}
.titlebox{display:flex;align-items:center;gap:16px}.mascot{font-size:68px}.hero h1{margin:0;font-size:clamp(28px,4vw,44px);color:#fff0a8}.sub{color:#e8dcff;font-weight:bold;margin-top:6px}
.sound{background:#fff;color:#34245f;border:0;border-radius:13px;padding:11px 15px;font-weight:900;cursor:pointer}
.shell{background:rgba(255,255,255,.94);box-shadow:0 22px 60px #4d37752b;border-radius:0 0 25px 25px;overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 20px;background:#fff9ef;border-bottom:1px solid #eee2cf}
.track{height:13px;background:#e7dcf4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));transition:.25s}
.badge{padding:8px 12px;background:#eee8ff;border-radius:99px;font-weight:900}
.main{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:20px}
.passage{padding:19px;background:var(--cream);border:2px dashed #d8bd75;border-radius:18px;line-height:1.7;max-height:700px;overflow:auto}.passage h2{color:#6841a6;margin-top:0}.passage strong{color:#bd3f78}
.quiz{padding:19px;background:#fbf9ff;border:2px solid #d9cff2;border-radius:18px}
.tag{display:inline-block;background:#6d4aff;color:#fff;border-radius:10px;padding:7px 12px;font-weight:900}.q{font-size:20px;line-height:1.52;margin:16px 0}
.answers{display:grid;gap:11px}.ans{background:white;border:2px solid #d6cbed;border-radius:14px;padding:14px;text-align:left;font-size:16px;color:#29203f;cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateX(4px);border-color:#7958dc}.ans.ok{border-color:var(--ok);background:#eafff5}.ans.no{border-color:var(--bad);background:#fff0f2}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.feedback.ok{display:block;background:#e9fff5;border-left:5px solid var(--ok)}.feedback.no{display:block;background:#fff0f2;border-left:5px solid var(--bad)}
.controls{text-align:right;margin-top:14px}.next{display:none;border:0;background:#251b4b;color:white;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}
.result{display:none;background:white;border-radius:25px;padding:34px;text-align:center;box-shadow:0 20px 60px #4935722c}.result.show{display:block}.big{font-size:60px;font-weight:1000;color:#6841a6}.review{text-align:left;margin-top:20px}.r{margin:9px 0;padding:12px 14px;border-radius:12px;background:#f7f3ff;border-left:5px solid #9d8ac4}.r.ok{border-color:var(--ok)}.r.no{border-color:var(--bad)}
.restart{border:0;background:#ffc84a;color:#332400;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}
@media(max-width:900px){.main{grid-template-columns:1fr}.passage{max-height:430px}}@media(max-width:620px){.hero{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style>
</head>
<body><div class="sky"></div><div class="doodle d1">🗺️</div><div class="doodle d2">🚇</div>
<div class="wrap">
<div class="hero"><div class="titlebox"><div class="mascot">🧭🏙️</div><div><h1>City Navigator</h1><div class="sub">Grade 12 · Unit 4 · Exercise 2 · Option D</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div>
<div class="shell" id="game">
<div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="badge">⭐ <span id="score">0</span>/8</div><div class="badge">🔥 <span id="streak">0</span></div></div>
<div class="main"><section class="passage" id="passage"></section><section class="quiz"><div class="tag" id="tag"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><div class="controls"><button class="next" id="next">NEXT →</button></div></section></div>
</div>
<div class="result" id="result"><div style="font-size:78px">🧭🏆</div><h2>City Navigator Mission Complete!</h2><div class="big" id="final"></div><p id="msg"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div class="review" id="review"></div></div>
</div>
<script>
const Q=[{"q": "As increasing numbers of people move to urban areas in search of employment and better living conditions, local authorities are struggling to (1) __________ the growing demand for housing, transport, and essential services.", "o": ["satisfy", "meet", "achieve", "reach"], "a": 1, "e": "meet the demand = đáp ứng nhu cầu. Đây là collocation tự nhiên nhất: meet the growing demand for housing, transport, and essential services."}, {"q": "One major concern is that urban expansion often takes place at the (2) __________ of agricultural land and natural habitats.", "o": ["cost", "loss", "expense", "price"], "a": 2, "e": "at the expense of + N = với cái giá phải trả là / gây tổn hại cho. → at the expense of agricultural land and natural habitats."}, {"q": "The rising cost of accommodation can make adequate housing financially (3) __________ for low-income residents, forcing some of them to settle in overcrowded areas.", "o": ["inaccessible", "unavailable", "unaffordable", "inadequate"], "a": 2, "e": "unaffordable = quá đắt, không đủ khả năng chi trả. Các từ khóa financially và low-income xác định rõ nghĩa này."}, {"q": "With effective planning, cities can (4) __________ advantage of technological developments to improve public transport and manage resources more efficiently.", "o": ["make", "get", "take", "gain"], "a": 2, "e": "take advantage of + N = tận dụng. → take advantage of technological developments."}, {"q": "Investment in green infrastructure can also help (5) __________ the negative effects of rapid urban growth by reducing pollution and providing residents with more public spaces.", "o": ["relieve", "weaken", "mitigate", "prevent"], "a": 2, "e": "mitigate the effects/impact/risks = giảm thiểu, làm nhẹ tác động. Prevent mang nghĩa ngăn chặn hoàn toàn nên quá mạnh trong ngữ cảnh này."}, {"q": "Urban policies must be carefully (6) __________ to the particular needs of each city rather than simply copied from elsewhere.", "o": ["adapted", "adopted", "adjusted", "converted"], "a": 0, "e": "adapt something to something = điều chỉnh cho phù hợp với. Ở dạng bị động: be adapted to the particular needs of each city."}, {"q": "Governments should also ensure that economic development does not come (7) __________ the expense of environmental protection or social equality.", "o": ["with", "at", "for", "on"], "a": 1, "e": "come at the expense of something = đạt được điều gì nhưng phải đánh đổi hoặc gây tổn hại cho điều khác."}, {"q": "Cities that adopt a more balanced approach are more likely to remain economically competitive while providing a (8) __________ quality of life for future generations.", "o": ["sustainable", "considerable", "reliable", "sufficient"], "a": 0, "e": "sustainable = bền vững. Future generations là dấu hiệu ngữ nghĩa rõ của sustainability."}],PASSAGE="<h2>Managing Rapid Urbanisation</h2>\n<p>Rapid urbanisation has transformed cities across the world, creating new economic opportunities while placing considerable pressure on existing infrastructure. As increasing numbers of people move to urban areas in search of employment and better living conditions, local authorities are struggling to <strong>(1) ______</strong> the growing demand for housing, transport, and essential services.</p>\n<p>One major concern is that urban expansion often takes place at the <strong>(2) ______</strong> of agricultural land and natural habitats. As land is converted for residential and industrial use, cities may become increasingly vulnerable to environmental problems. At the same time, the rising cost of accommodation can make adequate housing financially <strong>(3) ______</strong> for low-income residents, forcing some of them to settle in overcrowded areas.</p>\n<p>Nevertheless, urbanisation does not necessarily result in a lower quality of life. With effective planning, cities can <strong>(4) ______</strong> advantage of technological developments to improve public transport and manage resources more efficiently. Investment in green infrastructure can also help <strong>(5) ______</strong> the negative effects of rapid urban growth by reducing pollution and providing residents with more public spaces.</p>\n<p>For such measures to succeed, however, urban policies must be carefully <strong>(6) ______</strong> to the particular needs of each city rather than simply copied from elsewhere. Governments should also ensure that economic development does not come <strong>(7) ______</strong> the expense of environmental protection or social equality. Ultimately, cities that adopt a more balanced approach are more likely to remain economically competitive while providing a <strong>(8) ______</strong> quality of life for future generations.</p>",L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,hist=[],soundOn=true,ctx;
const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.035,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(600,.08);tone(880,.12,.07)}function bad(){tone(190,.18)}function tap(){tone(420,.06);tone(620,.07,.05)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tap()}
function render(){answered=false;let x=Q[i];$("tag").textContent="Question "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("fb").className="feedback";$("fb").style.display="none";$("next").style.display="none";
x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("ok");let yes=n===x.a;if(yes){score++;streak++;$("fb").className="feedback ok";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("no");$("fb").className="feedback no";$("fb").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("fb").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";hist.push({n,yes});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tap();if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.16,k*.08));let p=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+p+"%";$("msg").textContent=p>=90?"Excellent navigation through the urbanisation challenge!":p>=75?"Strong work! Review any missed items below.":p>=60?"Good progress — review the explanations.":"Review the key collocations and try the mission again.";let h="<h3>🗺️ Mission Review</h3>";Q.forEach((x,k)=>{let a=hist[k];h+='<div class="r '+(a.yes?"ok":"no")+'"><b>Question '+(k+1)+': '+(a.yes?"Correct":"Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br><i>'+x.e+'</i></div>'});$("review").innerHTML=h}
$("passage").innerHTML=PASSAGE;render();
</script></body></html>
