<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 4 - Exercise 1 (1-20) - Option B</title>
<style>
:root{
 --sky:#06111f;--panel:#0f2235;--panel2:#153654;--blue:#57c7ff;--teal:#5ee0cc;
 --gold:#ffd66f;--green:#4fd39a;--red:#ff6878;--white:#f4faff;--muted:#b4c7d9;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--white);
 background:
 radial-gradient(circle at 12% 12%,rgba(87,199,255,.12),transparent 24%),
 radial-gradient(circle at 85% 18%,rgba(94,224,204,.10),transparent 22%),
 linear-gradient(160deg,#040b14,#071827 58%,#03070d);
 padding:18px;overflow-x:hidden
}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.road{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:52%;height:48%;background:linear-gradient(180deg,#132333,#05090e);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.line{position:absolute;left:50%;transform:translateX(-50%);width:6px;height:70px;background:#ffd66f;bottom:5%;box-shadow:0 -110px 0 #ffd66f,0 -220px 0 #ffd66f;opacity:.75}
.tower{position:absolute;bottom:0;background:#081321;border-top:1px solid rgba(255,255,255,.04)}
.t1{left:3%;width:10%;height:35%}.t2{left:15%;width:9%;height:48%}.t3{right:18%;width:11%;height:41%}.t4{right:4%;width:10%;height:55%}
.wrap{max-width:1120px;margin:auto;position:relative;z-index:2}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.hero-left{display:flex;align-items:center;gap:14px}
.icon{font-size:64px;filter:drop-shadow(0 0 16px rgba(87,199,255,.24))}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#eafaff,#57c7ff,#5ee0cc,#ffd66f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:6px;color:var(--muted);font-weight:700}
.sound{border:1px solid rgba(87,199,255,.25);background:#102a43;color:white;padding:11px 14px;border-radius:12px;font-weight:900;cursor:pointer}
.shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(87,199,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.4)}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#0a1a2b}
.track{height:13px;background:#040a11;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal),var(--gold));transition:.25s}
.chip{background:#12334f;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}
.game{padding:22px}
.card{background:#0d2942;border:2px solid #1f5677;border-radius:20px;padding:20px;max-width:850px;margin:auto}
.qtag{display:inline-block;background:#173f60;color:#d8f6ff;padding:7px 12px;border-radius:10px;font-weight:900}
.question{font-size:22px;line-height:1.55;margin:18px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{padding:15px;border:2px solid #2a5977;border-radius:14px;background:#12314d;color:#fff;text-align:left;font-size:17px;cursor:pointer;transition:.15s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);box-shadow:0 0 18px rgba(87,199,255,.09)}
.option.correct{background:#154232!important;border-color:var(--green)!important}
.option.wrong{background:#482229!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#091b2b;line-height:1.55}
.feedback.show{display:block}.feedback.ok{border-color:var(--green)}.feedback.no{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#8de0ff,#9ef0dc,#ffe08d);color:#18314f;cursor:pointer}
.next:disabled{opacity:.4}
.result{display:none;text-align:center;padding:32px}.result.show{display:block}
.big{font-size:58px;font-weight:1000;color:#79ddff}
.review{text-align:left;margin-top:22px}
.item{padding:12px 14px;background:#0b2035;border-left:5px solid #58728b;border-radius:12px;margin:9px 0;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:700px){.options{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="bg">
 <div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div><div class="tower t4"></div>
 <div class="road"></div><div class="line"></div>
</div>

<div class="wrap">
 <div class="hero">
  <div class="hero-left">
   <div class="icon">🏙️🚇</div>
   <div>
    <h1>Urban Mobility Challenge</h1>
    <div class="sub">Grade 12 · Unit 4 · Exercise 1 (1–20) · Option B</div>
   </div>
  </div>
  <button class="sound" id="sound">🔊 Sound On</button>
 </div>

 <div class="shell">
  <div id="quizArea">
   <div class="status">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="chip" id="count"></div>
    <div class="chip" id="score"></div>
    <div class="chip" id="heart"></div>
   </div>

   <div class="game">
    <div class="card">
     <div class="qtag" id="qtag"></div>
     <div class="question" id="question"></div>
     <div class="options" id="options"></div>
     <div class="feedback" id="feedback"></div>
     <div class="controls"><button class="next" id="next" disabled>Next Stop →</button></div>
    </div>
   </div>
  </div>

  <div class="result" id="result">
   <div style="font-size:74px">🏙️🏆</div>
   <h2>Urban Mobility Mission Complete!</h2>
   <div class="big" id="final"></div>
   <p id="message"></p>
   <button class="next" id="restart">Play Again ↻</button>
   <div class="review" id="review"></div>
  </div>
 </div>
</div>

<script>
const Q=[{"q": "The rapid growth of the urban population has __________ considerable pressure on housing, healthcare, and public transportation.", "options": ["taken", "put", "made", "brought"], "answer": 1, "explanation": "Put pressure on = gây áp lực lên. → has put considerable pressure on housing, healthcare, and public transportation."}, {"q": "As housing prices continue to rise, affordable accommodation is becoming __________ difficult to find in major cities.", "options": ["much and much", "the most", "more than", "increasingly"], "answer": 3, "explanation": "Increasingly + adjective = ngày càng... → increasingly difficult = ngày càng khó."}, {"q": "The construction of new residential areas has resulted in a considerable __________ in the amount of agricultural land surrounding the city.", "options": ["reduction", "reducing", "reduced", "reduce"], "answer": 0, "explanation": "Sau a considerable cần danh từ. Reduction = sự giảm sút. → a considerable reduction in the amount of agricultural land."}, {"q": "The government has introduced several measures to make public transportation more __________ to people living on the outskirts of the city.", "options": ["affordable", "convenient", "accessible", "residential"], "answer": 2, "explanation": "Accessible to somebody = dễ tiếp cận đối với ai. → public transportation more accessible to people living on the outskirts."}, {"q": "The more employment opportunities a city offers, __________ to attract workers from rural areas.", "options": ["the more likely it is", "it is more likely", "the most likely it is", "the more it is likely"], "answer": 0, "explanation": "Cấu trúc so sánh kép: The more..., the more... → The more employment opportunities..., the more likely it is to attract workers."}, {"q": "Although the new metro system __________ only recently, it has already helped reduce traffic congestion in the city centre.", "options": ["has completed", "was completing", "has been completing", "was completed"], "answer": 3, "explanation": "Metro system là đối tượng được hoàn thành → dùng bị động. Có recently nhưng hành động hoàn thành tại một thời điểm quá khứ gần đây → was completed phù hợp nhất trong câu này."}, {"q": "Many residents have moved to suburban areas because they can no longer __________ the high cost of living in the city centre.", "options": ["provide", "afford", "invest", "consume"], "answer": 1, "explanation": "Afford the cost = có đủ khả năng chi trả chi phí. → can no longer afford the high cost of living."}, {"q": "Unless urban growth is carefully planned, essential public services may struggle to __________ the needs of a rapidly increasing population.", "options": ["reach", "achieve", "meet", "approach"], "answer": 2, "explanation": "Meet the needs = đáp ứng nhu cầu. Đây là collocation chuẩn."}, {"q": "Improved transport links have made it easier for people to __________ between suburban areas and the city centre on a daily basis.", "options": ["commute", "migrate", "reside", "urbanise"], "answer": 0, "explanation": "Commute = đi lại thường xuyên giữa nơi ở và nơi làm việc/học tập. → commute between suburban areas and the city centre."}, {"q": "__________ investment is made in public transportation, the more serious traffic congestion is likely to become.", "options": ["The fewer", "The smallest", "The least", "The less"], "answer": 3, "explanation": "Investment là danh từ không đếm được nên dùng less. Cấu trúc so sánh kép: The less investment..., the more serious traffic congestion..."}];
const L=["A","B","C","D"];
let i=0,xp=0,hearts=5,combo=0,answered=false,history=[],soundOn=true,ctx=null;
const $=id=>document.getElementById(id);

function ac(){
 if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
 if(ctx.state==="suspended")ctx.resume();
 return ctx;
}
function tone(f,d=.1,t="sine",v=.035,delay=0){
 if(!soundOn)return;
 const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
 o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(.0001,s);
 g.gain.exponentialRampToValueAtTime(v,s+.01);
 g.gain.exponentialRampToValueAtTime(.0001,s+d);
 o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03);
}
function good(){tone(640,.08,"triangle");tone(900,.11,"sine",.03,.08)}
function bad(){tone(160,.16,"sawtooth");tone(95,.2,"square",.018,.1)}
function nextSound(){tone(420,.06,"triangle",.018);tone(650,.07,"triangle",.015,.06)}
function win(){[523,659,784,1047].forEach((f,k)=>tone(f,.17,"triangle",.027,k*.09))}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";
 if(soundOn)nextSound();
};

function render(){
 answered=false;
 $("next").disabled=true;
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 const q=Q[i];

 $("qtag").textContent=`Question ${i+1}`;
 $("question").textContent=q.q;
 $("count").textContent=`${i+1}/${Q.length}`;
 $("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;
 $("heart").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${i/Q.length*100}%`;
 $("options").innerHTML="";

 q.options.forEach((op,n)=>{
  const b=document.createElement("button");
  b.className="option";
  b.innerHTML=`<strong>${L[n]}.</strong> ${op}`;
  b.onclick=()=>choose(n,b);
  $("options").appendChild(b);
 });

 $("next").textContent=i===Q.length-1?"Finish Route 🏙️":"Next Stop →";
}

function choose(n,btn){
 if(answered)return;
 answered=true;

 const q=Q[i];
 const buttons=[...document.querySelectorAll(".option")];
 const right=n===q.answer;

 buttons.forEach(b=>b.disabled=true);
 buttons[q.answer].classList.add("correct");

 if(right){
  xp+=10+combo*2;
  combo++;
  $("feedback").className="feedback ok show";
  $("feedback").innerHTML=`<strong>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;
  good();
 }else{
  hearts=Math.max(0,hearts-1);
  combo=0;
  btn.classList.add("wrong");
  $("feedback").className="feedback no show";
  $("feedback").innerHTML=`<strong>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;
  bad();
 }

 history.push({selected:n,correct:right});
 $("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;
 $("heart").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(i+1)/Q.length*100}%`;
 $("next").disabled=false;
}

$("next").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(i<Q.length-1){i++;render();}
 else finish();
};

function finish(){
 $("quizArea").style.display="none";
 $("result").classList.add("show");
 win();

 const correct=history.filter(x=>x.correct).length;
 $("final").textContent=`${correct}/${Q.length} · ${xp} XP`;

 if(correct===Q.length) $("message").textContent="Perfect Urban Mobility Master!";
 else if(correct>=8) $("message").textContent="Excellent! Em nắm rất chắc Urbanisation vocabulary & grammar.";
 else if(correct>=6) $("message").textContent="Good job! Hãy xem lại những câu chưa đúng.";
 else $("message").textContent="Hãy ôn lại collocations và cấu trúc so sánh kép rồi thử lại.";

 let html="<h3>🚇 Urban Mobility Review</h3>";
 Q.forEach((q,k)=>{
  const a=history[k];
  html+=`<div class="item ${a.correct?"ok":"no"}">
   <strong>Question ${k+1}: ${a.correct?"Correct":"Incorrect"}</strong><br>
   Your answer: ${L[a.selected]}. ${q.options[a.selected]}<br>
   Correct: ${L[q.answer]}. ${q.options[q.answer]}<br>
   <em>${q.explanation}</em>
  </div>`;
 });
 $("review").innerHTML=html;
}

$("restart").onclick=()=>location.reload();
render();
</script>
</body>
</html>
