.resource table{border-collapse:collapse;width:100%;font-size:14px}.resource td,.resource th{border:1px solid var(--line);padding:8px;text-align:left}.resource article{overflow-x:auto}</style></head><body><header class="top"><div class="wrap toprow"><a class="brand" href="#" id="brand"><span class="mark">=</span><span>THPT English Practice<span class="subbrand">Learn with purpose. Practise with confidence.</span></span></a><nav class="toplinks" aria-label="Điều hướng"><button class="textbtn" id="homeBtn">Danh mục lớp 10</button><button class="textbtn" id="helpBtn">Cách học</button></nav></div></header><main id="app" class="wrap"></main><div class="printsheet" id="printsheet"></div><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalText"></div><div class="modalactions"><button class="secondary" id="modalCancel">Tiếp tục làm</button><button class="primary" id="modalConfirm">Xác nhận</button></div></div></div><script id="lesson-data" type="application/json">[{"id":"g10_u7_ex7_D","unit":7,"unitName":"Viet Nam in the International Community","exercise":7,"level":"D","title":"Grade 10 Unit 7 - Exercise 7 - Set D","topic":"A hypothetical ASEAN investigation: inclusion, comparisons and evidence","kind":"reading","questions":[{"number":1,"stem":"What is the main message of the passage?","options":["Recorded reports are preferable to live meetings in every international project.","A common environmental goal makes differences between schools unimportant.","The quality of a regional project can be judged mainly by its final report.","Useful cooperation needs accessible arrangements, attention to local conditions and evidence of results."],"answer":3,"explanation":"Đoạn 2–5 lần lượt nêu điều kiện địa phương, cách tham gia phù hợp và bằng chứng kết quả; không tuyệt đối hóa một hình thức liên lạc."},{"number":2,"stem":"In paragraph 5, “excludes” is closest in meaning to _____.","options":["encourages people to change their goals","makes everyone work more slowly","prevents some people from taking part","requires participants to collect evidence"],"answer":2,"explanation":"Excludes gắn với lịch họp khiến hai lớp không thể tham gia; nghĩa là loại/cản một số người tham gia."},{"number":3,"stem":"What does “Its” in “Its first observation” in paragraph 4 refer to?","options":["the future campaign","the Vietnamese class","the partner’s report","the running tap"],"answer":1,"explanation":"Đoạn 4 chủ thể quan sát là the Vietnamese class; Its chỉ quan sát đầu tiên của lớp đó."},{"number":4,"stem":"Why do the students avoid using total water consumption as a simple ranking?","options":["School size and activities can affect the total independently of wasteful behaviour.","They cannot discuss water use without an international expert.","The partners have refused to provide information about their schools.","They have already proved that all schools waste equal amounts."],"answer":0,"explanation":"Đoạn 2 nói trường có vườn hoặc đông học sinh tự nhiên dùng nhiều nước hơn, nên tổng lượng nước chưa đủ để xếp hạng."},{"number":5,"stem":"Which outcome is NOT established in the passage?","options":["The reminder campaign has reduced the amount of water used.","Some classes cannot attend the original live meeting.","The Vietnamese class identifies running taps as a concern.","The partners keep a shared purpose after changing communication methods."],"answer":0,"explanation":"Đoạn 4 mới có quan sát ban đầu và kế hoạch theo dõi chiến dịch; chưa có bằng chứng lượng nước đã giảm."},{"number":6,"stem":"What can reasonably be inferred about evaluating the reminder campaign?","options":["A campaign cannot be useful unless every partner school introduces it.","Observations made before the campaign cannot help evaluate it.","Any fall in water use must have been caused only by the campaign.","A change in water use should be considered together with other possible influences."],"answer":3,"explanation":"Đoạn 4 yêu cầu ghi nhận cả thay đổi khác có thể tác động đến việc dùng nước; không quy toàn bộ kết quả cho chiến dịch."},{"number":7,"stem":"Which best paraphrases “a shared concern is a starting place for cooperation, not a complete plan for it”?","options":["An agreed issue is sufficient to organise every stage of joint work.","Partners must prepare identical plans before they can identify a common issue.","A common issue gives partners a reason to cooperate, but they still need to decide how.","A joint plan works only when partners have the same local conditions."],"answer":2,"explanation":"Đoạn 1 phân biệt lý do hợp tác với kế hoạch triển khai; các đoạn sau minh họa việc cần thống nhất phương pháp và cách tham gia."},{"number":8,"stem":"Where in paragraph 3 does this sentence best fit? “Partners post questions and comments below each recording.”","options":["[I]","[III]","[IV]","[II]"],"answer":1,"explanation":"Sau recorded reports cần giải thích việc đăng bình luận; These comments ngay sau đó quy chiếu trực tiếp questions and comments. Trước [III] chưa có các bình luận này."}],"range":"","passage":"KEEPING A SHARED PROJECT OPEN TO EVERY CLASS\n[1] ASEAN provides opportunities for cooperation in education and environmental protection. To explore what cooperation might mean for young people, imagine a project involving a Vietnamese class and partner classes elsewhere in Southeast Asia. Their shared goal is to understand how students use water at school. This fictional project illustrates a wider point: a shared concern is a starting place for cooperation, not a complete plan for it.\n[2] The classes first discuss what to record. Some students want to compare the total amount of water used. Others note that a school with a garden or more pupils may naturally use more. The groups agree instead to describe particular uses and identify one practice they could examine locally. This keeps the discussion focused without treating different schools as if their conditions were identical.\n[3] [I] At first, everyone is expected to join a live meeting. [II] Two classes cannot attend because of their school timetables, so teachers introduce recorded reports instead. [III] These comments can then be answered outside the original meeting time. [IV] The new arrangement is slower, but it allows those classes to remain involved. It changes how the students communicate without changing the purpose of their joint investigation.\n[4] After reading a partner's report, the Vietnamese class decides to check for taps left running after lunch. Its first observation identifies a problem worth examining; it does not establish how much water a future reminder campaign will save. Students plan further observations before and after the campaign and agree to mention other changes that could affect water use.\n[5] The project therefore offers more than contact with another country. It gives students a reason to explain local conditions, question an easy comparison and revise an arrangement that excludes some partners. Yet neither participation nor an attractive final report guarantees an environmental improvement. That conclusion requires evidence from what happens in the schools themselves.","transcript":"","wordbank":[],"note":"Các lớp, hoạt động và kết quả dự án trong bài là tình huống giả định phục vụ học tập.","filename":"Grade_10_Unit_7_Exercise_7_Set_D.html","audio":""}]</script><script>

const APPENDIX_HTML="<article><h2>1. So sánh bằng, hơn và nhất<\/h2>\n<p><b>as + tính từ / trạng từ + as:<\/b> The two projects are as useful as each other.<br>\n<b>not as/so ... as:<\/b> The first plan is not as expensive as the second.<br>\n<b>tính từ ngắn-er + than / more + tính từ dài + than:<\/b> clearer than; more practical than.<br>\n<b>the ...-est / the most ...:<\/b> the largest room; the most effective method.<br>\n<b>one of the most + tính từ + danh từ số nhiều:<\/b> one of the most useful activities.<br>\n<b>less ... than / the least ...:<\/b> less expensive than; the least expensive design.<br>\n<b>Bất quy tắc:<\/b> good/well - better - best; bad/badly - worse - worst.<br>\n<b>Trạng từ:<\/b> as carefully as; more clearly than; more widely shared.<br>\n<b>Nhấn mạnh:<\/b> much/far easier; much/far more useful.<\/p>\n<p>Giữ đúng chiều so sánh: A is cheaper than B tương đương B is more expensive than A.\nNếu chỉ so sánh chi phí, chưa đủ thông tin để kết luận dự án nào tốt hơn về mọi mặt.<\/p><\/article>\n<article><h2>2. Số lượng, hệ số và phần mở rộng nhẹ<\/h2>\n<p><b>Danh từ đếm được số nhiều:<\/b> more/fewer books; as many students as.<br>\n<b>Danh từ không đếm được:<\/b> more/less money; as much equipment as.<br>\n<b>Hệ số:<\/b> twice as large as; three times as many places as; half as much money as.<br>\n<b>Tăng tiến:<\/b> stronger and stronger; more and more useful.<br>\n<b>Song hành:<\/b> The more carefully we plan, the more effective our support is likely to be.<\/p>\n<p>So sánh tăng tiến và song hành chỉ là phần mở rộng nhẹ. Trọng tâm Unit 7 vẫn là so sánh bằng, hơn và nhất.\nKhông xem hai cách nói hợp lệ như not as và not so là một cặp đúng/sai.<\/p><\/article>\n<article><h2>3. Cụm từ và từ vựng cần nhớ<\/h2>\n<p><b>participate in / take part in<\/b> nhưng <b>join an organisation<\/b>.<br>\n<b>aim to do / aim at doing; be committed to doing<\/b>.<br>\n<b>provide somebody with something / provide something for somebody<\/b>.<br>\n<b>have access to; focus on; educate somebody about<\/b>.<br>\n<b>carry out a project/survey; in response to; drop out of school<\/b>.<br>\n<b>earn a living; be open to ideas; sign/reach an agreement; make a donation; gain experience<\/b>.<br>\n<b>economy<\/b>: nền kinh tế; <b>economic<\/b>: thuộc kinh tế; <b>economical<\/b>: tiết kiệm.<br>\n<b>donation<\/b>: khoản cho tặng; <b>loan<\/b>: khoản vay cần hoàn trả.<br>\n<b>agriculture / agricultural; create / creativity / creative; produce / production; compete / competitive<\/b>.<\/p><\/article>\n<article><h2>4. Trọng âm từ dài trong tài liệu<\/h2>\n<p>Phần chữ in hoa chỉ âm tiết mang trọng âm chính. Không áp dụng một quy tắc tuyệt đối cho mọi từ dài.<\/p>\n<table><thead><tr><th>Từ<\/th><th>IPA Anh-Anh<\/th><th>Gợi nhớ trọng âm<\/th><th>Âm tiết chính<\/th><\/tr><\/thead><tbody><tr><td>application<\/td><td>/ˌæp.lɪˈkeɪ.ʃən/<\/td><td><b>ap-pli-CA-tion<\/b><\/td><td>3<\/td><\/tr><tr><td>communication<\/td><td>/kəˌmjuː.nɪˈkeɪ.ʃən/<\/td><td><b>com-mu-ni-CA-tion<\/b><\/td><td>4<\/td><\/tr><tr><td>economic<\/td><td>/ˌiː.kəˈnɒm.ɪk/<\/td><td><b>e-co-NO-mic<\/b><\/td><td>3<\/td><\/tr><tr><td>explanation<\/td><td>/ˌek.spləˈneɪ.ʃən/<\/td><td><b>ex-pla-NA-tion<\/b><\/td><td>3<\/td><\/tr><tr><td>population<\/td><td>/ˌpɒp.jəˈleɪ.ʃən/<\/td><td><b>pop-u-LA-tion<\/b><\/td><td>3<\/td><\/tr><tr><td>independent<\/td><td>/ˌɪn.dɪˈpen.dənt/<\/td><td><b>in-de-PEN-dent<\/b><\/td><td>3<\/td><\/tr><tr><td>possibility<\/td><td>/ˌpɒs.əˈbɪl.ə.ti/<\/td><td><b>pos-si-BIL-i-ty<\/b><\/td><td>3<\/td><\/tr><tr><td>participation<\/td><td>/pɑːˌtɪs.ɪˈpeɪ.ʃən/<\/td><td><b>par-ti-ci-PA-tion<\/b><\/td><td>4<\/td><\/tr><\/tbody><\/table>\n<p>Tra cách phát âm theo từng từ; số âm tiết chỉ tính theo cách đọc, không theo số chữ cái.<\/p><\/article>";

function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Nhập họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Sai mất 1 tim, được thử lại; phương án đã sai không chọn lại được. Khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 = số câu đúng lần đầu / tổng số câu × 10.</b> Sửa đúng không cộng lại điểm. Số câu đã nắm được sau luyện ghi riêng. Đúng lần đầu được 10 XP, sửa đúng được 5 XP. Cứ 5 câu đúng lần đầu liên tiếp hồi 1 tim, tối đa 5; hết tim kết thúc lượt.</p><p>Câu rời, câu sắp xếp và phương án được trộn khi bắt đầu/làm lại. Bài đọc, điền đoạn và nghe giữ thứ tự câu; True/False giữ thứ tự phương án.</p><p>Set B củng cố; Set C tăng yêu cầu khoảng 30% theo mục tiêu thiết kế; Set D vận dụng B1+/B2 nhẹ theo hướng THPT. Các mức độ chưa hiệu chuẩn bằng dữ liệu thi thử. Ngữ pháp chính: so sánh bằng, hơn và nhất; số lượng và hệ số; tăng tiến/song hành là mở rộng nhẹ.</p><p>Đồng hồ không giới hạn thời gian. Có thể nộp khi chưa làm hết; câu chưa chọn tính 0 điểm. Chỉ lượt đã nộp hoặc kết thúc mới lưu. Làm lại/rời bài bỏ lượt chưa nộp.</p><p>Audio mới được nhúng sẵn để dùng không cần mạng; có transcript để tự học. Kết quả lưu trong trình duyệt. Nếu giáo viên thu bài, tải CSV và gửi cho giáo viên.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}

function latest(l){const attempts=db.attempts[l.id]||[];return attempts.length?attempts[attempts.length-1]:null;}
function renderHome(){stopClock();stopAudio();active=null;state=null;document.title='Grade 10 Unit 7 - Sets B, C & D';app.innerHTML=`<section class="hero"><div><p class="eyebrow">Grade 10 / Global Success / Unit 7</p><h1>Connect with the world.<span>Learn to work together.</span></h1><p class="lead">Viet Nam in the International Community.<br>Hợp tác quốc tế, từ vựng và các dạng so sánh.<br>Chọn Set B, C hoặc D để luyện theo từng bước.</p><div class="pills"><span class="pill accent">Exercise 1 · 15 câu cốt lõi/bài</span><span class="pill">3 set · B / C / D</span><span class="pill">Giải thích tiếng Việt</span></div></div><aside class="heroart"><div class="artcaption">Connect. Compare. Cooperate.</div><div class="artline">Different countries.<br>Shared goals.</div><div class="artsmall">Read carefully.<br>Compare accurately.</div><div class="equal" aria-hidden="true">U7</div></aside></section><div class="statsbar"><div class="stat"><strong>${LESSONS.length}</strong><span>Bài thực hành</span></div><div class="stat"><strong>${LESSONS.reduce((n,l)=>n+l.questions.length,0)}</strong><span>Câu có giải thích</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.transcript).length}</strong><span>Audio nghe không cần mạng</span></div><div class="stat"><strong id="completedCount">0</strong><span>Bài đã luyện tại đây</span></div></div><section aria-labelledby="catalogTitle"><div class="cataloghead"><div><p class="eyebrow" style="margin-bottom:6px">Choose your next step</p><h2 id="catalogTitle">Chọn bài luyện tập</h2><p>Exercise 1 có 5 bài/set, mỗi bài đúng 15 câu cốt lõi.</p></div><div class="filters" role="group" aria-label="Lọc set"><button class="filter" data-filter="all">Tất cả</button><button class="filter" data-filter="B">Set B</button><button class="filter" data-filter="C">Set C</button><button class="filter" data-filter="D">Set D</button></div></div><input class="search" id="lessonSearch" type="search" placeholder="Tìm Exercise, số câu hoặc kỹ năng…" aria-label="Tìm bài luyện tập" value="${esc(search)}"><div class="cards" id="cards"></div></section><details class="catalog-note"><summary>Phạm vi và mức độ của từng set</summary><p>Đủ Exercise 1–11 theo tài liệu đính kèm. Mỗi set có 15 bài, 132 câu. Exercise 1 có 75 câu mới/set, chia 5 bài × 15 câu; các trọng tâm trong 80 câu mẫu được tuyển chọn và tái nhóm. Số trong tên bài thuộc bộ luyện mới.</p><p>Set B củng cố; Set C tăng độ khó khoảng 30% theo mục tiêu thiết kế; Set D tăng yêu cầu vận dụng, giữ đúng ý và giới hạn thông tin, với mức B1+/B2 nhẹ phù hợp lớp 10. Độ khó chưa hiệu chuẩn bằng dữ liệu thi thử.</p><p>Exercise 2–11 giữ số câu và dạng tương ứng nguồn: điền đoạn, sắp xếp, hoàn thành đoạn, đọc, nghe Đúng/Sai, nghe trắc nghiệm và giao tiếp. So sánh tăng tiến/song hành là phần mở rộng nhẹ.</p><p>Các tình huống dự án cụ thể trong bộ bài là giả định. Sáu audio mới dùng giọng tổng hợp, không phải bản ghi gốc của tài liệu. Mở phần ôn nhanh để xem lại cấu trúc và trọng âm.</p></details><div class="catalog-note"><b>Ôn nhanh trước khi luyện</b><p>So sánh đúng đối tượng, giữ đúng chiều và phạm vi so sánh; ôn cụm từ và trọng âm từ dài.</p><button class="secondary" id="appendixBtn">Ôn nhanh so sánh và trọng âm</button></div>${footer()}`;

function renderCards(){const chosen=LESSONS.filter(l=>String(l.unit)===unitFilter&&(filter==='all'||l.level===filter)&&(`${l.title} ${l.topic} ${TYPES[l.kind]}`.toLowerCase().includes(search.trim().toLowerCase())));document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter);});document.querySelectorAll('[data-unit]').forEach(b=>{b.classList.toggle('active',b.dataset.unit===unitFilter);b.setAttribute('aria-pressed',b.dataset.unit===unitFilter);});document.getElementById('completedCount').textContent=LESSONS.filter(l=>latest(l)).length;document.getElementById('cards').innerHTML=chosen.map(l=>{const prev=latest(l);return `<button class="card" data-lesson="${l.id}"><div class="cardtop"><span class="settag ${l.level==='D'?'d':l.level==='C'?'c':''}">Unit ${l.unit} · Set ${l.level}</span><span class="typeicon" aria-hidden="true">${ICONS[l.kind]}</span></div><h3>Exercise ${l.exercise}${l.range?` <span>(${l.range})</span>`:''}</h3><p class="topic">${esc(l.topic)}</p><div class="cardfoot"><span>${l.questions.length} câu · ${TYPES[l.kind]}</span><strong>${prev?prev.score.toFixed(2)+'/10':'Bắt đầu'}</strong></div>${prev?`<span class="savednote">Lần gần nhất: ${esc(prev.name)} · ${prev.mastered}/${prev.total} câu đã đúng</span>`:''}</button>`;}).join('')||'<p class="empty">Không có bài phù hợp. Thử số Exercise hoặc chọn Tất cả.</p>';document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>chooseLesson(b.dataset.lesson));}
function goHome(){if(state&&!state.finished){ask('Rời bài đang làm?','Lượt này chưa nộp. Bạn có thể nộp để lưu điểm, hoặc rời bài và bắt đầu lại từ đầu.',()=>{stopClock();stopAudio();if(ALL_IN_ONE)renderHome();else location.href='Grade_10_Unit_7_Mo_Truc_Tiep.html';},'Rời bài');return;}stopClock();stopAudio();if(ALL_IN_ONE)renderHome();else location.href='Grade_10_Unit_7_Mo_Truc_Tiep.html';}
function chooseLesson(id){stopClock();stopAudio();state=null;active=LESSONS.find(l=>l.id===id);if(!active)return;document.title=active.title;app.innerHTML=`<section class="lessonintro"><button class="back" id="introBack">Danh mục lớp 10</button><p class="eyebrow">Unit ${active.unit}: ${esc(active.unitName)} · ${TYPES[active.kind]}</p><h1>${esc(active.title)}</h1><p class="lead">${esc(active.topic)}</p></section><section class="startcard"><span class="settag ${active.level==='D'?'d':active.level==='C'?'c':''}">Set ${active.level} · ${active.level==='D'?(active.transcript?'Nghe vận dụng nâng cao':'Vận dụng theo hướng THPT 2026'):active.level==='C'?'Vận dụng nâng cao':'Luyện tập củng cố'}</span><h2 style="margin-top:18px">Sẵn sàng cho bước tiếp theo?</h2><p class="finenote">${active.questions.length} câu · Không giới hạn thời gian · Điểm theo lần chọn đầu</p>${active.note?`<p class="finenote">${esc(active.note)}</p>`:''}<ul class="startfacts"><li>5 tim, sai được chọn lại</li><li>Giải thích sau khi trả lời đúng</li><li>Trộn đáp án mỗi lần làm lại</li><li>Ghi nhận họ tên, điểm và thời gian</li></ul><form id="startForm"><label for="studentName">Họ và tên</label><input class="nameinput" id="studentName" placeholder="Nhập họ và tên của em" maxlength="70" autocomplete="name" required value="${esc(db.name)}"><div class="error" id="nameError" role="alert"></div><div class="actionrow"><button class="primary" type="submit">Bắt đầu luyện tập</button><button class="secondary" id="printIntro" type="button">In đề học sinh</button></div></form><p class="finenote">${active.transcript?'Audio đã được nhúng sẵn. Em có thể nghe lại và điều chỉnh tốc độ.':'Hãy đọc kỹ ngữ cảnh trước khi chọn. Câu đã trả lời đúng sẽ được khóa.'}</p></section>${footer()}`;document.getElementById('introBack').onclick=goHome;document.getElementById('printIntro').onclick=()=>printLesson(active);document.getElementById('startForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('studentName').value.trim().replace(/\s+/g,' ');if(!name){document.getElementById('nameError').textContent='Em hãy nhập họ tên trước khi bắt đầu.';return;}db.name=name;save();startLesson(false);};window.scrollTo({top:0,behavior:'instant'});}
function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange','wordform','verbform'].includes(l.kind))qs=shuffle(qs);return qs;}
function startLesson(restart){stopClock();stopAudio();if(restart){db.restarts[active.id]=(db.restarts[active.id]||0)+1;save();}state={lesson:active,questions:makeQuestions(active),index:0,hearts:5,xp:0,combo:0,maxCombo:0,firstCorrect:0,startedAt:Date.now(),finished:false,transcriptSeen:false,plays:0,restarts:db.restarts[active.id]||0,answers:{}};for(const q of state.questions)state.answers[q.number]={attempts:0,firstCorrect:false,done:false,wrong:[],selected:null};renderWork();clock=setInterval(()=>{const el=document.getElementById('timer');if(el&&!state.finished)el.textContent=fmt(timeNow());},1000);}
function passageHTML(l){const lines=l.passage.split('\n').filter(Boolean);if(!lines.length)return '';const title=lines.shift();return `<h2>${esc(title)}</h2>`+lines.map(t=>'<p>'+esc(t).replace(/^\[(\d+)\]/,'<span class="paragraphnum">$1</span>').replace(/\((\d+)\) _____/g,(_,n)=>`<button type="button" class="blank" data-jump="${n}" aria-label="Đến chỗ trống ${n}">(${n}) _____</button>`)+ '</p>').join('');}
function audioHTML(l){return `<div class="audiobox"><h3>Audio luyện nghe</h3><audio id="listeningAudio" controls preload="metadata" src="${l.audio}"></audio><div class="audiorow"><span>Giọng đọc tổng hợp · Nghe lại tùy nhu cầu</span><label>Tốc độ <select id="audioSpeed" aria-label="Tốc độ nghe"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option></select></label></div></div><details class="transcript" id="transcript"><summary>Mở transcript để tự học</summary><p class="finenote">Để luyện nghe, em hãy trả lời trước khi mở transcript.</p>${l.transcript.split('\n').filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}</details>`;}
function renderWork(){const l=state.lesson;const withContext=!!(l.passage||l.transcript||l.wordbank.length);app.innerHTML=`<section class="lessonintro"><p class="eyebrow">Unit ${l.unit} · ${TYPES[l.kind]} · Set ${l.level}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.topic)}</p>${l.note?`<p class="finenote">${esc(l.note)}</p>`:''}</section><div class="toolbar"><span class="person">${esc(db.name)}</span><div class="metrics"><span class="metric" id="heartMetric"></span><span class="metric">XP <strong id="xp">0</strong></span><span class="metric">Combo <strong id="combo">0</strong></span><span class="metric">Thời gian <strong id="timer">00:00</strong></span></div></div><div class="progressbar" role="progressbar" id="progressBar" aria-label="Số câu đã trả lời đúng" aria-valuemin="0" aria-valuemax="${l.questions.length}" aria-valuenow="0"><div id="progressFill"></div></div><div class="workgrid ${withContext?'':'solo'}">${withContext?`<aside class="passagebox"><details id="contextDetails" open><summary>${l.transcript?'Bài nghe & transcript':l.passage?'Đoạn văn · giữ nguyên thứ tự câu':'Ngân hàng từ'}</summary>${l.wordbank.length?`<div class="wordchips">${l.wordbank.map(w=>`<span class="wordchip">${esc(w)}</span>`).join('')}</div><p class="finenote">${l.kind==='wordform'?'Dùng dạng phù hợp của từ gốc.':'Dùng mỗi mục phù hợp một lần; giữ đúng cụm từ nếu có.'}</p>`:''}${l.passage?`<div id="passageText">${passageHTML(l)}</div>`:l.transcript?audioHTML(l):''}</details></aside>`:''}<section><div class="questionbox" id="questionArea"></div><nav class="qnav" id="questionNav" aria-label="Chọn câu hỏi"></nav><p class="navhint">Viền xanh: câu đang xem · Nền xanh: đã đúng · Nền vàng: đã thử</p></section></div><div class="underactions"><button class="textbtn" id="restartBtn">Làm lại &amp; trộn bài</button><button class="secondary" id="submitBtn">Nộp bài / Xem kết quả</button></div>${footer()}`;
 document.getElementById('restartBtn').onclick=()=>ask('Làm lại từ đầu?','Lượt đang làm sẽ kết thúc mà không lưu điểm. Câu rời và đáp án được trộn; thứ tự bài đọc/nghe được giữ nguyên.',()=>startLesson(true),'Làm lại');document.getElementById('submitBtn').onclick=()=>{const un=state.questions.filter(q=>!state.answers[q.number].done).length;ask('Nộp bài?',un?`Còn ${un} câu chưa trả lời đúng. Điểm lần chọn đầu vẫn được lưu; câu chưa trả lời tính 0 điểm.`:'Tất cả câu đã được trả lời đúng. Lưu kết quả lượt này?',()=>finish('submitted'));};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const idx=state.questions.findIndex(q=>q.number===Number(b.dataset.jump));if(idx>=0){state.index=idx;renderQuestion(true);}});
 if(l.transcript){const a=document.getElementById('listeningAudio');a.onplay=()=>state.plays++;a.onerror=()=>toast('Không phát được audio trên trình duyệt này. Thử mở MP3 trong thư mục audio của gói ZIP.');document.getElementById('audioSpeed').onchange=e=>a.playbackRate=Number(e.target.value);document.getElementById('transcript').ontoggle=e=>{if(e.target.open)state.transcriptSeen=true;};}renderQuestion();window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;const ready=typed?String(a.selected||'').trim().length>0:a.selected!==null&&!a.wrong.includes(a.selected);document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2>${typed?`<label class="finenote" for="typedAnswer">${state.lesson.kind==='ordering'?'Nhập chuỗi chữ cái theo thứ tự':'Nhập từ hoặc cụm từ phù hợp'}</label><input class="answerinput" id="typedAnswer" aria-labelledby="questionStem" value="${esc(a.selected||'')}" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" ${a.done?'disabled':''}><p class="finenote">Không phân biệt chữ hoa/thường. Có thể bấm Enter để kiểm tra.</p>`:`<div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?`<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>${typed?`Lần nhập trước: “${esc(a.wrong[a.wrong.length-1])}”. Chú ý dạng từ, cấu trúc và ngữ cảnh.`:'Đọc kỹ ngữ cảnh hoặc nghe lại trước khi chọn.'} Mỗi lần sai mất 1 tim.</div>`:''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||!ready?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 if(typed){const input=document.getElementById('typedAnswer');input.oninput=()=>{a.selected=input.value;document.getElementById('checkBtn').disabled=!input.value.trim();};input.onkeydown=e=>{if(e.key==='Enter'&&!a.done&&input.value.trim()){e.preventDefault();checkAnswer();}};}else{document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});}
 document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};
 document.getElementById('questionNav').innerHTML=state.questions.map((x,i)=>{const r=state.answers[x.number];return `<button class="${i===state.index?'current':''} ${r.done?'done':''} ${r.attempts?'attempted':''}" data-nav="${i}" aria-label="Câu ${x.number}${r.done?', đã đúng':''}" ${i===state.index?'aria-current="step"':''}>${x.number}</button>`;}).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.nav);renderQuestion(true);});document.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('active',Number(b.dataset.jump)===q.number));updateMetrics();if(focus)document.getElementById('questionStem').focus({preventScroll:false});}
function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;if(a.done||a.selected===null)return;if(typed&&!String(a.selected).trim())return;if(!typed&&a.wrong.includes(a.selected))return;const correct=typed?q.accepted.some(x=>normalise(x,state.lesson.kind)===normalise(a.selected,state.lesson.kind)):a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='D'?'d':s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(correctText(q))}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Grade10_Unit7_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.wordbank.length?`<p><b>Word box:</b> ${l.wordbank.map(esc).join(' · ')}</p>`:''}${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.accepted?'Answer: __________________________________________':q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}

function correctText(q){return q.accepted?q.accepted[0]:q.options[q.answer];}
function normalise(text,kind){let t=String(text).normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'");if(kind==='ordering')return t.replace(/[^a-z]/g,'');return t.replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function renderAppendix(){stopClock();stopAudio();active=null;state=null;app.innerHTML=`<section class="lessonintro"><button class="back" id="appendixBack">Danh mục lớp 10</button><p class="eyebrow">Phần tham khảo bổ sung · Không tính điểm</p><h1>Ôn nhanh · Unit 7</h1></section><section class="resource">${APPENDIX_HTML}</section>${footer()}`;document.getElementById('appendixBack').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}

window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script></body></html>
