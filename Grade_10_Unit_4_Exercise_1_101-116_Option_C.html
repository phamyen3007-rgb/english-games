<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 4 - Exercise 1 (101-116) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 4 - Exercise 1 (101-116) - Option C</h1>
    <div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "While the volunteers were checking the emergency supplies, they ________ a strange noise coming from the storage room.", "options": ["were hearing", "heard", "have heard", "hear"], "answer": "heard", "explanation": "<em>Heard</em> diễn tả việc nghe thấy tiếng động tại một thời điểm trong quá khứ, khi hoạt động kiểm tra đang diễn ra."}, {"q": "During yesterday’s planning meeting, we ________ to provide free transport after we learned that several elderly residents could not reach the clinic.", "options": ["decide", "have decided", "are deciding", "decided"], "answer": "decided", "explanation": "Quyết định đã được đưa ra trong cuộc họp hôm qua nên dùng quá khứ đơn."}, {"q": "At the exact moment the photographer entered, the students ________ a large banner across the entrance.", "options": ["were hanging", "hang", "have hung", "are hanging"], "answer": "were hanging", "explanation": "Hành động treo biểu ngữ đang diễn ra tại thời điểm nhiếp ảnh gia bước vào nên dùng quá khứ tiếp diễn."}, {"q": "We ________ outside the community hall when a delivery driver ________ us to help unload some boxes.", "options": ["waited – was asking", "are waiting – asks", "were waiting – asked", "were waiting – ask"], "answer": "were waiting – asked", "explanation": "Việc chờ đang diễn ra (<em>were waiting</em>); lời nhờ giúp đỡ xen vào (<em>asked</em>)."}, {"q": "When the guests arrived at noon yesterday, the kitchen team ________ lunch, so the guests had to wait another twenty minutes.", "options": ["prepares", "was still preparing", "has already prepared", "is still preparing"], "answer": "was still preparing", "explanation": "<em>Was still preparing</em> cho biết việc chuẩn bị bữa trưa chưa hoàn tất khi khách đến. <em>Team</em> được dùng như một tập thể số ít."}, {"q": "At 10 a.m. last Saturday, some students ________ visitors around the exhibition while others ________ tickets at the entrance.", "options": ["guide – sell", "were guiding – are selling", "guided – sell", "were guiding – were selling"], "answer": "were guiding – were selling", "explanation": "Hai hoạt động đang diễn ra song song tại một thời điểm xác định trong quá khứ nên đều dùng quá khứ tiếp diễn."}, {"q": "As Minh ________ a damaged bookshelf, a small envelope ________ from behind it.", "options": ["was moving – fell", "moved – was falling", "is moving – falls", "was moving – fall"], "answer": "was moving – fell", "explanation": "Minh đang di chuyển giá sách thì phong bì rơi ra: hành động nền dùng quá khứ tiếp diễn, sự việc xen vào dùng quá khứ đơn."}, {"q": "This time yesterday, I ________ local residents about the new recycling scheme; I had not finished the interviews yet.", "options": ["interview", "have interviewed", "was interviewing", "am interviewing"], "answer": "was interviewing", "explanation": "<em>This time yesterday</em> xác định một thời điểm trong quá khứ; việc phỏng vấn vẫn đang tiếp diễn lúc đó."}, {"q": "At eight yesterday evening, ________ the donated toys, or had you already finished that task?", "options": ["did you sort", "were you sorting", "have you sorted", "do you sort"], "answer": "were you sorting", "explanation": "Câu hỏi muốn biết việc phân loại có đang diễn ra tại thời điểm đó không. Cấu trúc: <em>Were + S + V-ing?</em>"}, {"q": "When I phoned Lan yesterday, she ________ at the charity shop; she was attending a first-aid course instead.", "options": ["doesn't work", "hasn't worked", "isn't working", "wasn't working"], "answer": "wasn't working", "explanation": "<em>Wasn’t working</em> phủ định hành động đang diễn ra tại thời điểm cuộc gọi trong quá khứ."}, {"q": "After the workshop ended yesterday, the volunteers ________ the equipment, ________ the windows and left the building.", "options": ["packed – closed", "were packing – were closing", "pack – close", "have packed – have closed"], "answer": "packed – closed", "explanation": "Các hành động đã hoàn tất và diễn ra nối tiếp nhau nên dùng quá khứ đơn."}, {"q": "The lights ________ out just as the speaker ________ how to use the emergency radio.", "options": ["were going – explained", "go – is explaining", "went – was explaining", "have gone – explains"], "answer": "went – was explaining", "explanation": "Đèn tắt đột ngột (<em>went out</em>) trong khi người nói đang hướng dẫn (<em>was explaining</em>)."}, {"q": "At that moment, the younger children were practising a song ________ the older students were decorating the stage.", "options": ["during", "while", "because of", "meanwhile"], "answer": "while", "explanation": "<em>While</em> nối hai mệnh đề diễn tả các hành động đang diễn ra đồng thời. <em>During</em> đi với danh từ."}, {"q": "We were loading the last box onto the van ________ its back door suddenly broke.", "options": ["during", "meanwhile", "at", "when"], "answer": "when", "explanation": "<em>When</em> giới thiệu sự việc bất ngờ xen vào một hành động đang diễn ra."}, {"q": "While I ________ the delivery route, I suddenly ________ that the address on one package was incorrect.", "options": ["was checking – realised", "checked – was realising", "am checking – realise", "was checking – realising"], "answer": "was checking – realised", "explanation": "Việc kiểm tra đang diễn ra dùng <em>was checking</em>; việc bất chợt nhận ra dùng <em>realised</em>."}];
const START=101;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
