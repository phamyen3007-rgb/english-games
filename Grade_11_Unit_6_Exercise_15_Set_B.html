<script id="lesson-data" type="application/json">[{"id":"u6_ex15_B","unit":6,"unitName":"Protecting Our Heritage","exercise":15,"level":"B","title":"Grade 11 Unit 6 - Exercise 15 - Set B","topic":"Listening: a simulated natural-heritage audit","kind":"listening","questions":[{"number":1,"stem":"How many of the thirty areas were identified as facing serious pressure in the simulated audit?","explanation":"Bản tin nói “twelve of the thirty areas”; số liệu là giả định cho bài nghe.","options":["Eighteen","Three","Thirty","Twelve"],"answer":3},{"number":2,"stem":"Which activity is NOT listed as a source of pressure?","explanation":"Road building, extraction of stone và dumping waste được liệt kê; guided nature walks không nằm trong danh sách.","options":["Guided nature walks","Stone extraction","Road building","Waste dumping"],"answer":0},{"number":3,"stem":"Which type of area is highlighted for providing shelter for birds?","explanation":"Bài nêu wetland provides shelter for birds; không có khẳng định khu vực thật hay số loài thực tế.","options":["An indoor exhibition hall","A wetland","A paved car park","A factory yard"],"answer":1},{"number":4,"stem":"Who is asked to share responsibility for protection?","explanation":"Transcript liệt kê nhiều bên; bảo vệ không được xem là trách nhiệm độc quyền của một nhóm.","options":["Only the school that wrote the briefing","Only people who own a camera","Authorities, businesses, residents and visitors","Only tourists from other countries"],"answer":2},{"number":5,"stem":"Why does the briefing connect conservation with livelihoods?","explanation":"Phần cuối nối môi trường với nước/tài nguyên/hoạt động của người dân; không đưa bảo đảm thu nhập.","options":["Visitors always cause more harm than industrial activities.","Income matters only when an area has no natural value.","Every conservation project guarantees the same income.","Damage can affect both ecosystems and people who depend on local resources."],"answer":3}],"range":"","passage":"","transcript":"For this classroom exercise, imagine that a school research group has reviewed thirty natural areas. The figures in this simulated briefing are invented for learning, not taken from a current conservation report. The group identifies twelve of the thirty areas as facing serious pressure.\nThe listed pressures include road building, extraction of stone and dumping waste. A wetland is highlighted because it provides shelter for birds and supports a wider local ecosystem. The briefing does not claim that protecting one species is the only reason the area matters.\nThe group asks local authorities, businesses, residents and visitors to share responsibility. Appropriate decisions require information about what is happening and who may be affected. Conservation is not separate from everyday life: damage to ecosystems can also affect people who depend on water and other local resources.\nThe message is to examine pressures early and coordinate action, rather than wait until harm is difficult to reverse.","wordbank":[],"note":"Bản tin mô phỏng, số liệu giả định để luyện nghe; không phải số liệu hiện tại của WWF.","filename":"Grade_11_Unit_6_Exercise_15_Set_B.html","audio":"data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAJ7wAHdAAAAwUICgwQEhUXGRwfISQmKSsuMTM2ODo+QEJFR0pNT1JUV1lcX2FjZmhrbnBzdXh7fYCChIiKjI+RlJeZnJ6ho6apq62wsra4ur2/wsXHyszO0dTX2dve4OPm6Ovt8PP1+Pr8AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQCagAAAAAAB3QAi7JqZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//OExAAioyn8BnmLdQDgP9yE8AODhG+IWSdsQ8t6Fx2BDGSseyccH+2NzYJokPfpq970pl+/j7gJxHwKJyLZ5D3hgeIOTTPTtwGvshER31jCBY+2z8+kGWQcpDs9mBEkyd99B02Qy7P0nrPcSm8gML0xCCGfwYh++20GIPZ+37aIgsmqz0wEBDztId2zkY76v/xTUPpBH9UCIaZ2WjDhgJgYArC/MQrXA4gLAOjTChaSFweDhonVQo3w2MIzhBlB//OExCgk6r4cBMPSIt+isCxgVox4CRUZjJ7bCtxWZRaXYaXIkKUZChhdYkRoScSTqLTmtQDFxIkMoCgUERIJE0oKLrQksY7nkhx/lhAQHoI0LCUzcIUqY3Uk19jvnL8xTLRsjWgQMtuUjhAGCcvKDGVbAcWfMf2wggMDBAgo7wkEE7Mg3lya6QgKUMAo9cKiFO const APPENDIX_HTML="<article><h2>Ngữ điệu trọng tâm<\/h2><p><b>Unit 6:<\/b> câu trần thuật và mệnh lệnh thông thường xuống giọng ở cuối. Với danh sách, các mục chưa kết thúc thường lên giọng nhẹ; mục cuối xuống giọng.<\/p><p>Our class will visit the museum. [fall]<br>Keep to the marked path. [fall]<br>We saw old houses [level-rise], workshops [level-rise] and a wooden bridge [fall].<\/p><p><b>Unit 7:<\/b> câu hỏi Yes/No thường lên giọng; câu hỏi Wh- thông thường xuống giọng. Đây là mẫu cốt lõi; sắc thái giao tiếp có thể làm thay đổi ngữ điệu.<\/p><p>Does the course include practice? [rise]<br>When does the course begin? [fall]<\/p><\/article>\n<article><h2>Making appointments<\/h2><p><b>Set B:<\/b> Ask to meet a course adviser. Suggest a time, ask for confirmation and thank the adviser.<br><b>Useful language:<\/b> Could I make an appointment ...? / Would Tuesday morning suit you? / What time would be convenient? / Thank you. I will see you then.<\/p><p><b>Set C:<\/b> The first proposed time is unavailable. Respond politely, suggest another time and confirm both the purpose and the arrangement.<br><b>Useful language:<\/b> I'm afraid I can't manage that time. / Would ... be possible instead? / I would like to discuss ... / May I confirm that ...?<\/p><\/article><article><span class=\"settag\">Set B · Writing<\/span><h2>A formal request for course information<\/h2><p>Write a formal letter of 140–170 words to a vocational school. Request information about a technical course. Ask about entry requirements, duration, timetable, fees and practical training. Explain briefly why the details would help you.<\/p><p class=\"finenote\">Tự kiểm tra: mục đích rõ; yêu cầu đủ chi tiết; bố cục mở–thân–kết; giọng lịch sự; ngữ pháp và chính tả. Bài viết tự luận không được chấm điểm tự động.<\/p><details><summary>Bài mẫu tham khảo · 162 từ<\/summary><p>Dear Course Adviser,\n\nI am writing to request further information about your technical maintenance course. I will finish secondary school this year and would like to develop practical skills before deciding on my next stage of education.\n\nCould you please tell me the entry requirements and the next application deadline? I would also appreciate details of the course duration, weekly timetable and tuition fees. In particular, I would like to know whether equipment is provided or whether learners must buy it separately.\n\nYour brochure mentions practical training. Could you explain where this takes place, who supervises the tasks and how learners receive feedback? Information about any apprenticeship opportunities would also be useful.\n\nFinally, please let me know whether there are opportunities for further study after completing the course. These details would help me compare the programme with other options and discuss the total costs with my family.\n\nThank you for your time. I look forward to your reply.\n\nYours faithfully,\nLinh Nguyen<\/p><\/details><\/article><article><span class=\"settag\">Set C · Writing<\/span><h2>A formal request for course information<\/h2><p>Write a formal letter of 140–170 words after reading an incomplete course advertisement. Ask for clarification about supervised practice, assessment, total costs and possible progression. Distinguish a possible opportunity from guaranteed entry, and explain your own planning needs.<\/p><p class=\"finenote\">Tự kiểm tra: mục đích rõ; yêu cầu đủ chi tiết; bố cục mở–thân–kết; giọng lịch sự; ngữ pháp và chính tả. Bài viết tự luận không được chấm điểm tự động.<\/p><details><summary>Bài mẫu tham khảo · 162 từ<\/summary><p>Dear Course Adviser,\n\nHaving read the summary of your programme, I would be grateful for clarification before submitting an application. I am interested in practical training, but I also hope to keep suitable opportunities for further study open.\n\nThe brochure refers to supervised experience without explaining how it is organised. Could you specify the balance between demonstrations, independent practice and workplace tasks? I would also like to know how progress is assessed and what support is available when a learner needs additional practice.\n\nPlease could you provide the entry requirements, application deadline and full fee information, including any separate equipment costs? As I may need to travel, a weekly timetable would help me estimate the total commitment.\n\nFinally, does completing the programme create any progression opportunities, and what additional conditions would apply? I understand that a possible route is not the same as guaranteed admission.\n\nThank you for considering my questions. I look forward to receiving the information.\n\nYours faithfully,\nMinh Tran<\/p><\/details><\/article>";

function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Điền họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Mỗi lần chọn sai mất 1 tim; bạn được thử lại. Sau khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 tính theo lần chọn đầu</b>. Số câu đã nắm được sau khi thử lại được báo riêng. Đạt 5 câu đúng liên tiếp sẽ hồi 1 tim, tối đa 5 tim.</p><p>Khi làm lại, câu rời và đáp án được trộn. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu để dễ đối chiếu. Kết quả lưu trên trình duyệt đang dùng.</p><p>Set B củng cố kiến thức vừa học. Set C tăng độ khó khoảng 30% bằng ngữ cảnh, phương án gần nhau và suy luận. Unit 6 luyện to-infinitive; Unit 7 luyện perfect gerunds và perfect participle clauses.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}

function closeModal(ok){document.getElementById('modal').classList.add('hidden');const fn=modalResolve;modalResolve=null;lastFocus?.focus();if(ok&&fn)fn();}
function ask(title,text,fn,confirm='Nộp bài'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').innerHTML=`<p>${esc(text)}</p>`;document.getElementById('modalCancel').classList.remove('hidden');document.getElementById('modalConfirm').textContent=confirm;openModal(fn);}

document.addEventListener('keydown',e=>{if(document.getElementById('modal').classList.contains('hidden'))return;const focusable=[...document.getElementById('modal').querySelectorAll('button')].filter(x=>!x.classList.contains('hidden'));if(e.key==='Escape'){closeModal(false);e.preventDefault();}if(e.key==='Tab'&&focusable.length){const a=focusable[0],b=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}});
function latest(l){const attempts=db.attempts[l.id]||[];return attempts.length?attempts[attempts.length-1]:null;}
function renderHome(){stopClock();stopAudio();active=null;state=null;document.title='Grade 11 Units 6 & 7 - Sets B & C';app.innerHTML=`<section class="hero"><div><p class="eyebrow">Grade 11 / Global Success / Units 6 &amp; 7</p><h1>Learn with purpose.<span>Think a step further.</span></h1><p class="lead">Unit 6: Protecting Our Heritage.<br>Unit 7: Education and Career Pathways.<br>Luyện Set B để củng cố, rồi thử Set C với ngữ cảnh và suy luận sâu hơn.</p><div class="pills"><span class="pill accent">Exercise 1 · 15 câu cốt lõi/bài</span><span class="pill">Set C · Khó hơn khoảng 30%</span><span class="pill">Giải thích tiếng Việt</span></div></div><aside class="heroart"><div class="artcaption">Heritage. Choices. Possibilities.</div><div class="artline">Understand the past.<br>Plan your next step.</div><div class="artsmall">Read carefully.<br>Practise with confidence.</div><div class="equal" aria-hidden="true">6 · 7</div></aside></section><div class="statsbar"><div class="stat"><strong>${LESSONS.length}</strong><span>Bài thực hành</span></div><div class="stat"><strong>${LESSONS.reduce((n,l)=>n+l.questions.length,0)}</strong><span>Câu có giải thích</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.transcript).length}</strong><span>Audio nhúng sẵn</span></div><div class="stat"><strong id="completedCount">0</strong><span>Bài đã luyện tại đây</span></div></div><section aria-labelledby="catalogTitle"><div class="unitfilters" role="group" aria-label="Chọn Unit"><button class="filter" data-unit="6">Unit 6 · Di sản</button><button class="filter" data-unit="7">Unit 7 · Học tập &amp; nghề nghiệp</button></div><div class="cataloghead"><div><p class="eyebrow" style="margin-bottom:6px">Choose your next step</p><h2 id="catalogTitle">Chọn bài luyện tập</h2><p>Mỗi unit có 5 bài Exercise 1/set, mỗi bài 15 câu cốt lõi.</p></div><div class="filters" role="group" aria-label="Lọc set"><button class="filter" data-filter="all">Tất cả</button><button class="filter" data-filter="B">Set B</button><button class="filter" data-filter="C">Set C</button></div></div><input class="search" id="lessonSearch" type="search" placeholder="Tìm Exercise, số câu hoặc kỹ năng…" aria-label="Tìm bài luyện tập" value="${esc(search)}"><div class="cards" id="cards"></div></section><details class="catalog-note"><summary>Phạm vi và nguyên tắc của bộ bài</summary><p>Unit 6: Exercise 1–16. Unit 7: Exercise 1–10. Exercise 1 của mỗi unit có 75 câu/set, chia 1–15, 16–30, 31–45, 46–60, 61–75.</p><p>Set B và C là hai bộ ngữ liệu mới song song. Set C tăng độ khó khoảng 30% theo mục tiêu thiết kế: xử lý ngữ cảnh, cấu trúc, liên kết và suy luận; không dựa vào từ hiếm để gây khó.</p><p>Có cả trắc nghiệm và nhập đáp án. Dạng nhập không phân biệt chữ hoa/thường; chuỗi sắp xếp có thể gõ bằng chữ cái và dấu gạch nối. Bài đọc/nghe giữ thứ tự câu.</p><p>Các trường hợp, dự án, chương trình và số liệu khảo sát mới là giả định phục vụ học tập. Audio là giọng tổng hợp và đã nhúng trong HTML để dùng không cần mạng.</p></details><div class="catalog-note"><b>Giao tiếp, viết và ngữ điệu</b><p>Phần tham khảo bổ sung: đặt lịch hẹn, viết thư yêu cầu thông tin, và ngữ điệu trọng tâm.</p><button class="secondary" id="appendixBtn">Mở phần bổ sung</button></div>${footer()}`;
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderCards();});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unitFilter=b.dataset.unit;renderCards();});document.getElementById('lessonSearch').oninput=e=>{search=e.target.value;renderCards();};document.getElementById('appendixBtn').onclick=renderAppendix;renderCards();window.scrollTo({top:0,behavior:'instant'});}
function renderCards(){const chosen=LESSONS.filter(l=>String(l.unit)===unitFilter&&(filter==='all'||l.level===filter)&&(`${l.title} ${l.topic} ${TYPES[l.kind]}`.toLowerCase().includes(search.trim().toLowerCase())));document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter);});document.querySelectorAll('[data-unit]').forEach(b=>{b.classList.toggle('active',b.dataset.unit===unitFilter);b.setAttribute('aria-pressed',b.dataset.unit===unitFilter);});document.getElementById('completedCount').textContent=LESSONS.filter(l=>latest(l)).length;document.getElementById('cards').innerHTML=chosen.map(l=>{const prev=latest(l);return `<button class="card" data-lesson="${l.id}"><div class="cardtop"><span class="settag ${l.level==='C'?'c':''}">Unit ${l.unit} · Set ${l.level}</span><span class="typeicon" aria-hidden="true">${ICONS[l.kind]}</span></div><h3>Exercise ${l.exercise}${l.range?` <span>(${l.range})</span>`:''}</h3><p class="topic">${esc(l.topic)}</p><div class="cardfoot"><span>${l.questions.length} câu · ${TYPES[l.kind]}</span><strong>${prev?prev.score.toFixed(2)+'/10':'Bắt đầu'}</strong></div>${prev?`<span class="savednote">Lần gần nhất: ${esc(prev.name)} · ${prev.mastered}/${prev.total} câu đã đúng</span>`:''}</button>`;}).join('')||'<p class="empty">Không có bài phù hợp. Thử số Exercise hoặc chọn Tất cả.</p>';document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>chooseLesson(b.dataset.lesson));}
function goHome(){if(state&&!state.finished){ask('Rời bài đang làm?','Lượt này chưa nộp. Bạn có thể nộp để lưu điểm, hoặc rời bài và bắt đầu lại từ đầu.',()=>{stopClock();stopAudio();if(ALL_IN_ONE)renderHome();else location.href='Grade_11_Unit_6_7_Mo_Truc_Tiep.html';},'Rời bài');return;}stopClock();stopAudio();if(ALL_IN_ONE)renderHome();else location.href='Grade_11_Unit_6_7_Mo_Truc_Tiep.html';}
function chooseLesson(id){stopClock();stopAudio();state=null;active=LESSONS.find(l=>l.id===id);if(!active)return;document.title=active.title;app.innerHTML=`<section class="lessonintro"><button class="back" id="introBack">Danh mục lớp 11</button><p class="eyebrow">Unit ${active.unit}: ${esc(active.unitName)} · ${TYPES[active.kind]}</p><h1>${esc(active.title)}</h1><p class="lead">${esc(active.topic)}</p></section><section class="startcard"><span class="settag ${active.level==='C'?'c':''}">Set ${active.level} · ${active.level==='C'?'Vận dụng nâng cao':'Luyện tập củng cố'}</span><h2 style="margin-top:18px">Sẵn sàng cho bước tiếp theo?</h2><p class="finenote">${active.questions.length} câu · Không giới hạn thời gian · Điểm theo lần chọn đầu</p>${active.note?`<p class="finenote">${esc(active.note)}</p>`:''}<ul class="startfacts"><li>5 tim, sai được chọn lại</li><li>Giải thích sau khi trả lời đúng</li><li>Trộn đáp án mỗi lần làm lại</li><li>Ghi nhận họ tên, điểm và thời gian</li></ul><form id="startForm"><label for="studentName">Họ và tên</label><input class="nameinput" id="studentName" placeholder="Nhập họ và tên của em" maxlength="70" autocomplete="name" required value="${esc(db.name)}"><div class="error" id="nameError" role="alert"></div><div class="actionrow"><button class="primary" type="submit">Bắt đầu luyện tập</button><button class="secondary" id="printIntro" type="button">In đề học sinh</button></div></form><p class="finenote">${active.transcript?'Audio đã được nhúng sẵn. Em có thể nghe lại và điều chỉnh tốc độ.':'Hãy đọc kỹ ngữ cảnh trước khi chọn. Câu đã trả lời đúng sẽ được khóa.'}</p></section>${footer()}`;document.getElementById('introBack').onclick=goHome;document.getElementById('printIntro').onclick=()=>printLesson(active);document.getElementById('startForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('studentName').value.trim().replace(/\s+/g,' ');if(!name){document.getElementById('nameError').textContent='Em hãy nhập họ tên trước khi bắt đầu.';return;}db.name=name;save();startLesson(false);};window.scrollTo({top:0,behavior:'instant'});}
function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange','wordform','verbform'].includes(l.kind))qs=shuffle(qs);return qs;}
function startLesson(restart){stopClock();stopAudio();if(restart){db.restarts[active.id]=(db.restarts[active.id]||0)+1;save();}state={lesson:active,questions:makeQuestions(active),index:0,hearts:5,xp:0,combo:0,maxCombo:0,firstCorrect:0,startedAt:Date.now(),finished:false,transcriptSeen:false,plays:0,restarts:db.restarts[active.id]||0,answers:{}};for(const q of state.questions)state.answers[q.number]={attempts:0,firstCorrect:false,done:false,wrong:[],selected:null};renderWork();clock=setInterval(()=>{const el=document.getElementById('timer');if(el&&!state.finished)el.textContent=fmt(timeNow());},1000);}
function passageHTML(l){const lines=l.passage.split('\n').filter(Boolean);if(!lines.length)return '';const title=lines.shift();return `<h2>${esc(title)}</h2>`+lines.map(t=>'<p>'+esc(t).replace(/^\[(\d+)\]/,'<span class="paragraphnum">$1</span>').replace(/\((\d+)\) _____/g,(_,n)=>`<button type="button" class="blank" data-jump="${n}" aria-label="Đến chỗ trống ${n}">(${n}) _____</button>`)+ '</p>').join('');}
function audioHTML(l){return `<div class="audiobox"><h3>Audio luyện nghe</h3><audio id="listeningAudio" controls preload="metadata" src="${l.audio}"></audio><div class="audiorow"><span>Giọng đọc tổng hợp · Nghe lại tùy nhu cầu</span><label>Tốc độ <select id="audioSpeed" aria-label="Tốc độ nghe"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option></select></label></div></div><details class="transcript" id="transcript"><summary>Mở transcript để tự học</summary><p class="finenote">Để luyện nghe, em hãy trả lời trước khi mở transcript.</p>${l.transcript.split('\n').filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}</details>`;}
function renderWork(){const l=state.lesson;const withContext=!!(l.passage||l.transcript||l.wordbank.length);app.innerHTML=`<section class="lessonintro"><p class="eyebrow">Unit ${l.unit} · ${TYPES[l.kind]} · Set ${l.level}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.topic)}</p>${l.note?`<p class="finenote">${esc(l.note)}</p>`:''}</section><div class="toolbar"><span class="person">${esc(db.name)}</span><div class="metrics"><span class="metric" id="heartMetric"></span><span class="metric">XP <strong id="xp">0</strong></span><span class="metric">Combo <strong id="combo">0</strong></span><span class="metric">Thời gian <strong id="timer">00:00</strong></span></div></div><div class="progressbar" role="progressbar" id="progressBar" aria-label="Số câu đã trả lời đúng" aria-valuemin="0" aria-valuemax="${l.questions.length}" aria-valuenow="0"><div id="progressFill"></div></div><div class="workgrid ${withContext?'':'solo'}">${withContext?`<aside class="passagebox"><details id="contextDetails" open><summary>${l.transcript?'Bài nghe & transcript':l.passage?'Đoạn văn · giữ nguyên thứ tự câu':'Ngân hàng từ'}</summary>${l.wordbank.length?`<div class="wordchips">${l.wordbank.map(w=>`<span class="wordchip">${esc(w)}</span>`).join('')}</div><p class="finenote">${l.kind==='wordform'?'Dùng dạng phù hợp của từ gốc.':'Dùng mỗi mục phù hợp một lần; giữ đúng cụm từ nếu có.'}</p>`:''}${l.passage?`<div id="passageText">${passageHTML(l)}</div>`:l.transcript?audioHTML(l):''}</details></aside>`:''}<section><div class="questionbox" id="questionArea"></div><nav class="qnav" id="questionNav" aria-label="Chọn câu hỏi"></nav><p class="navhint">Viền xanh: câu đang xem · Nền xanh: đã đúng · Nền vàng: đã thử</p></section></div><div class="underactions"><button class="textbtn" id="restartBtn">Làm lại &amp; trộn bài</button><button class="secondary" id="submitBtn">Nộp bài / Xem kết quả</button></div>${footer()}`;
 document.getElementById('restartBtn').onclick=()=>ask('Làm lại từ đầu?','Lượt đang làm sẽ kết thúc mà không lưu điểm. Câu rời và đáp án được trộn; thứ tự bài đọc/nghe được giữ nguyên.',()=>startLesson(true),'Làm lại');document.getElementById('submitBtn').onclick=()=>{const un=state.questions.filter(q=>!state.answers[q.number].done).length;ask('Nộp bài?',un?`Còn ${un} câu chưa trả lời đúng. Điểm lần chọn đầu vẫn được lưu; câu chưa trả lời tính 0 điểm.`:'Tất cả câu đã được trả lời đúng. Lưu kết quả lượt này?',()=>finish('submitted'));};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const idx=state.questions.findIndex(q=>q.number===Number(b.dataset.jump));if(idx>=0){state.index=idx;renderQuestion(true);}});
 if(l.transcript){const a=document.getElementById('listeningAudio');a.onplay=()=>state.plays++;a.onerror=()=>toast('Không phát được audio trên trình duyệt này. Thử mở MP3 trong thư mục audio của gói ZIP.');document.getElementById('audioSpeed').onchange=e=>a.playbackRate=Number(e.target.value);document.getElementById('transcript').ontoggle=e=>{if(e.target.open)state.transcriptSeen=true;};}renderQuestion();window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;const ready=typed?String(a.selected||'').trim().length>0:a.selected!==null&&!a.wrong.includes(a.selected);document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2>${typed?`<label class="finenote" for="typedAnswer">${state.lesson.kind==='ordering'?'Nhập chuỗi chữ cái theo thứ tự':'Nhập từ hoặc cụm từ phù hợp'}</label><input class="answerinput" id="typedAnswer" aria-labelledby="questionStem" value="${esc(a.selected||'')}" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" ${a.done?'disabled':''}><p class="finenote">Không phân biệt chữ hoa/thường. Có thể bấm Enter để kiểm tra.</p>`:`<div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?`<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>${typed?`Lần nhập trước: “${esc(a.wrong[a.wrong.length-1])}”. Chú ý dạng từ, cấu trúc và ngữ cảnh.`:'Đọc kỹ ngữ cảnh hoặc nghe lại trước khi chọn.'} Mỗi lần sai mất 1 tim.</div>`:''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||!ready?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 if(typed){const input=document.getElementById('typedAnswer');input.oninput=()=>{a.selected=input.value;document.getElementById('checkBtn').disabled=!input.value.trim();};input.onkeydown=e=>{if(e.key==='Enter'&&!a.done&&input.value.trim()){e.preventDefault();checkAnswer();}};}else{document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});}
 document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};
 document.getElementById('questionNav').innerHTML=state.questions.map((x,i)=>{const r=state.answers[x.number];return `<button class="${i===state.index?'current':''} ${r.done?'done':''} ${r.attempts?'attempted':''}" data-nav="${i}" aria-label="Câu ${x.number}${r.done?', đã đúng':''}" ${i===state.index?'aria-current="step"':''}>${x.number}</button>`;}).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.nav);renderQuestion(true);});document.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('active',Number(b.dataset.jump)===q.number));updateMetrics();if(focus)document.getElementById('questionStem').focus({preventScroll:false});}
function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;if(a.done||a.selected===null)return;if(typed&&!String(a.selected).trim())return;if(!typed&&a.wrong.includes(a.selected))return;const correct=typed?q.accepted.some(x=>normalise(x,state.lesson.kind)===normalise(a.selected,state.lesson.kind)):a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(correctText(q))}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Unit6_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.wordbank.length?`<p><b>Word box:</b> ${l.wordbank.map(esc).join(' · ')}</p>`:''}${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.accepted?'Answer: __________________________________________':q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}

function correctText(q){return q.accepted?q.accepted[0]:q.options[q.answer];}
function normalise(text,kind){let t=String(text).normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'");if(kind==='ordering')return t.replace(/[^a-z]/g,'');return t.replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function renderAppendix(){stopClock();stopAudio();active=null;state=null;app.innerHTML=`<section class="lessonintro"><button class="back" id="appendixBack">Danh mục lớp 11</button><p class="eyebrow">Phần tham khảo bổ sung · Không tính điểm</p><h1>Giao tiếp, viết &amp; ngữ điệu</h1></section><section class="resource">${APPENDIX_HTML}</section>${footer()}`;document.getElementById('appendixBack').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}

window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
</body>
</html>
