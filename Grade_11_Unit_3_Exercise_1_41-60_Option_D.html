<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (41-60) - Option D</title>
<style>
*{box-sizing:border-box}
:root{
 --ink:#fff6e9;--deep:#2b120c;--amber:#ffb347;--orange:#ff7a2f;--cream:#fff5df;
 --green:#49b36e;--red:#e45b62;--brown:#7b3d24;
}
body{
 margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#4a2517;
 background:
 radial-gradient(circle at 16% 12%,rgba(255,255,255,.65),transparent 15%),
 radial-gradient(circle at 85% 15%,rgba(255,202,116,.38),transparent 20%),
 linear-gradient(145deg,#f8d99d,#f7b96a 48%,#cf7a3d);
}
.wrap{max-width:1120px;margin:auto}
.hero{
 position:relative;overflow:hidden;
 background:linear-gradient(120deg,#4a1f16,#8a3f25 58%,#d1682f);
 color:white;border-radius:30px 30px 0 0;padding:25px 29px;
 box-shadow:0 18px 50px #3b170d66
}
.hero:before{content:"🎈";position:absolute;left:4%;bottom:-42px;font-size:120px;opacity:.13}
.hero:after{content:"🏜️";position:absolute;right:4%;top:-10px;font-size:135px;opacity:.13}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}
h1{margin:0;color:#ffe6a8;font-size:clamp(28px,4vw,43px);text-shadow:0 3px 10px #32130b}
.sub{font-weight:900;color:#fff5e9;margin-top:7px}
.sound{border:1px solid #ffd59f;background:#fff7e6;color:#7a3a22;border-radius:18px;padding:11px 15px;font-weight:900;cursor:pointer}

.game{background:#fffaf2;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 20px 55px #3b170d55}
.status{
 display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
 padding:14px 20px;background:#f6dfbd;border-bottom:1px solid #ddb37f
}
.track{height:13px;background:#dfc39d;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff7a2f,#c64a3e);transition:.3s}
.pill{background:#fff;border:1px solid #dcb383;border-radius:99px;padding:8px 13px;font-weight:900;white-space:nowrap}
.hearts{font-size:20px;letter-spacing:2px}
.main{padding:22px}
.quiz{background:#fffdf8;border:2px solid #e4c49e;border-radius:22px;padding:23px;box-shadow:inset 0 0 28px #f6ddbf66}
.tag{display:inline-block;background:linear-gradient(90deg,#8a3f25,#d1682f);color:white;padding:8px 14px;border-radius:14px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:19px 0;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{
 border:2px solid #e6cdb2;background:#fffaf2;color:#4a2517;border-radius:16px;padding:15px;text-align:left;
 font-size:16px;cursor:pointer;transition:.15s
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#e58b4b;background:#fff2df}
.ans.correct{background:#eaffef;border-color:#49b36e}
.ans.wrong{background:#fff0f2;border-color:#e45b62}
.fb{display:none;margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.fb.good{display:block;background:#eaffef;border-left:5px solid #49b36e}
.fb.bad{display:block;background:#fff0f2;border-left:5px solid #e45b62}
.bonus{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff3c4;border-left:5px solid #e1a233;font-weight:900}
.next{display:none;float:right;margin-top:15px;border:0;border-radius:16px;padding:12px 22px;background:linear-gradient(90deg,#8a3f25,#d1682f);color:#fff;font-weight:900;cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:#2b120ce6;z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.box{max-width:520px;width:100%;background:#fff8ea;border:3px solid #d26d3b;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #0006}
.restart{border:0;border-radius:16px;padding:13px 22px;background:#a9492d;color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#fffaf2;border-radius:30px;padding:36px;text-align:center;box-shadow:0 20px 55px #3b170d55}
.result.show{display:block}
.big{font-size:60px;font-weight:1000;color:#9a4928}
.review{text-align:left;margin-top:24px}
.r{padding:13px 15px;margin:9px 0;border-radius:14px;background:#f6e5ce;border-left:5px solid #d1682f;line-height:1.55}
@media(max-width:820px){
 .answers{grid-template-columns:1fr}
 .heroRow{flex-direction:column;align-items:flex-start}
 .status{grid-template-columns:1fr 1fr}
 .track{grid-column:1/-1;order:4}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="heroRow">
  <div class="brand">
   <div class="icon">🎈🏜️</div>
   <div>
    <h1>Desert Balloon Expedition</h1>
    <div class="sub">Grade 11 - Unit 3 - Exercise 1 (41-60) - Option D</div>
   </div>
  </div>
  <button id="sound" class="sound">🔊 Expedition Sound On</button>
 </div>
</header>

<section id="game" class="game">
 <div class="status">
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div>
  <div class="pill">🎯 Streak <span id="streak">0</span></div>
  <div class="pill">🔁 Restarts <span id="restarts">0</span></div>
 </div>

 <main class="main">
  <section class="quiz">
   <div id="tag" class="tag"></div>
   <div id="q" class="q"></div>
   <div id="answers" class="answers"></div>
   <div id="fb" class="fb"></div>
   <div id="bonus" class="bonus"></div>
   <button id="next" class="next">NEXT OASIS →</button>
   <div style="clear:both"></div>
  </section>
 </main>
</section>

<section id="result" class="result">
 <div style="font-size:82px">🎈🏆🏜️</div>
 <h2>Expedition Complete!</h2>
 <div id="final" class="big"></div>
 <p id="msg"></p>
 <div id="review" class="review"></div>
</section>
</div>

<div id="overlay" class="overlay">
 <div class="box">
  <div style="font-size:80px">🌵💔</div>
  <h2>Out of Hearts!</h2>
  <p>Hết 5 tim. Học sinh phải quay lại làm từ Question 1.</p>
  <p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p>
  <button id="restartBtn" class="restart">RETURN TO BASE CAMP ↻</button>
 </div>
</div>

<script>
const Q=[{"q": "Despite substantial investment, residents remain dissatisfied with the overall ______ of essential public services, particularly waste collection and water supply.", "o": ["access", "quality", "extent", "quantity"], "a": 1, "e": "Collocation: <b>quality of public services</b> = chất lượng dịch vụ công."}, {"q": "Producing vegetables on unused rooftops can ______ the distance food travels before reaching consumers, thereby reducing transport-related emissions.", "o": ["shorten", "decline", "narrow", "shrink"], "a": 0, "e": "<b>shorten the distance</b> = rút ngắn khoảng cách."}, {"q": "The council has constructed a network of ______ routes so that cyclists can travel across the city without sharing busy lanes with motor vehicles.", "o": ["pedestrian", "motorway", "dedicated cycling", "crossing"], "a": 2, "e": "<b>dedicated cycling routes</b> = các tuyến đường dành riêng cho xe đạp."}, {"q": "Although the renovated building retains much of its original structure, its redesigned exterior ______ considerably more contemporary.", "o": ["remains", "becomes", "appears", "maintains"], "a": 2, "e": "Cấu trúc <b>appear + adjective</b> → <i>appears considerably more contemporary</i>."}, {"q": "Additional trains are put into service during ______ travel periods to prevent overcrowding on major metro lines.", "o": ["intensive", "peak", "dense", "maximum"], "a": 1, "e": "Collocation: <b>peak travel periods</b> = thời gian đi lại cao điểm."}, {"q": "For a smart building to operate efficiently, its sensors must be capable of ______ with one another and responding to changes in real time.", "o": ["communicating", "connecting", "combining", "corresponding"], "a": 0, "e": "Cấu trúc: <b>communicate with one another</b> = truyền/giao tiếp thông tin với nhau."}, {"q": "Creating pedestrian-friendly public spaces can encourage greater social ______ among residents who would otherwise have few opportunities to meet.", "o": ["involvement", "contact", "interaction", "participation"], "a": 2, "e": "Collocation: <b>social interaction</b> = sự tương tác xã hội."}, {"q": "Property developers increasingly ______ the commercial value of incorporating rooftop gardens into residential projects.", "o": ["predict", "recognize", "are knowing", "are believing"], "a": 1, "e": "<b>recognize the value of sth</b> = nhận ra/công nhận giá trị của điều gì."}, {"q": "Replacing diesel buses with electric trams could substantially reduce both noise pollution and vehicle ______ in densely populated districts.", "o": ["fumes", "exhausts", "emissions", "releases"], "a": 2, "e": "Collocation: <b>vehicle emissions</b> = khí thải phương tiện."}, {"q": "When motion is detected, the lighting system automatically ______ the brightness to match the level required in that particular area.", "o": ["transforms", "adjusts", "develops", "converts"], "a": 1, "e": "Collocation: <b>adjust the brightness</b> = điều chỉnh độ sáng."}, {"q": "Demand for high-rise ______ has increased among young professionals who value security and convenient access to public transport.", "o": ["accommodation", "residence", "construction", "infrastructure"], "a": 0, "e": "<b>high-rise accommodation</b> = chỗ ở trong các tòa nhà cao tầng."}, {"q": "Real-time applications enable drivers to identify ______ parking spaces before entering heavily congested areas.", "o": ["accessible", "convenient", "vacant", "sparely"], "a": 2, "e": "<b>vacant parking spaces</b> = chỗ đậu xe còn trống."}, {"q": "Despite evidence that autonomous buses have become considerably safer, many passengers remain ______ to rely entirely on driverless technology.", "o": ["uncertain", "unwilling", "hesitant", "reluctant"], "a": 3, "e": "Cấu trúc: <b>be reluctant to do sth</b> = ngần ngại/miễn cưỡng làm gì."}, {"q": "Expanding bicycle-sharing networks is expected to have a ______ effect on public health by encouraging residents to become more physically active.", "o": ["favourable", "productive", "successful", "valuable"], "a": 0, "e": "Collocation: <b>have a favourable effect on sth</b> = có tác động tích cực đến..."}, {"q": "With land becoming increasingly scarce, city planners must ______ sufficient space for affordable housing without sacrificing public green areas.", "o": ["make up", "set off", "put aside", "allocate"], "a": 3, "e": "<b>allocate space/land/resources</b> = phân bổ không gian/đất/tài nguyên."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;
const $=x=>document.getElementById(x);

function tone(f,d=.1){
 if(!soundOn)return;
 if(!ctx)ctx=new(AudioContext||webkitAudioContext)();
 if(ctx.state==="suspended")ctx.resume();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.value=f;o.type="triangle";g.gain.value=.03;
 o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)
}
$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Expedition Sound On":"🔇 Sound Off"
};

function update(){
 $("hearts").textContent="❤️".repeat(hearts)+"🤎".repeat(MAX-hearts);
 $("streak").textContent=streak;
 $("restarts").textContent=restarts;
 $("bar").style.width=(i/Q.length*100)+"%";
}

function render(){
 const x=Q[i];
 $("tag").textContent="Oasis "+(i+1)+" / "+Q.length;
 $("q").textContent=x.q;
 $("answers").innerHTML="";
 $("fb").className="fb";
 $("fb").style.display="none";
 $("bonus").style.display="none";
 $("next").style.display="none";
 update();

 x.o.forEach((v,n)=>{
   const b=document.createElement("button");
   b.className="ans";
   b.innerHTML="<b>"+L[n]+".</b> "+v;
   b.onclick=()=>choose(n,b);
   $("answers").appendChild(b);
 });
}

function choose(n,b){
 const x=Q[i];
 attempts[i]++;

 if(n!==x.a){
   hearts--;
   streak=0;
   b.classList.add("wrong");
   b.disabled=true;

   $("fb").className="fb bad";
   $("fb").style.display="block";
   $("fb").innerHTML="<b>❌ Chưa đúng.</b> Mất 1 ❤️. Em phải chọn lại đến khi đúng mới được đi tiếp.";
   tone(170,.2);
   update();

   if(hearts<=0){
     restarts++;
     $("restarts").textContent=restarts;
     $("restartBox").textContent=restarts;
     setTimeout(()=>$("overlay").classList.add("show"),250);
   }
   return;
 }

 streak++;
 if(attempts[i]===1) firstTry++;

 document.querySelectorAll(".ans").forEach(z=>z.disabled=true);
 b.classList.add("correct");

 $("fb").className="fb good";
 $("fb").style.display="block";
 $("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;
 tone(820,.11);

 const qn=i+1;
 if(BONUS.includes(qn)){
   const before=hearts;
   hearts=Math.min(MAX,hearts+1);
   $("bonus").style.display="block";
   $("bonus").innerHTML=hearts>before
     ?"🎁 BONUS HEART! +1 ❤️"
     :"🎁 BONUS OASIS! Em đang đủ 5 ❤️ nên số tim giữ nguyên.";
   tone(1120,.12);
 }

 update();
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("next").style.display="inline-block";
 $("next").textContent=i===Q.length-1?"FINISH EXPEDITION →":"NEXT OASIS →";
}

$("next").onclick=()=>{
 if(i<Q.length-1){i++;render()}
 else finish();
};

$("restartBtn").onclick=()=>{
 $("overlay").classList.remove("show");
 i=0;
 hearts=MAX;
 streak=0;
 firstTry=0;
 attempts=Array(Q.length).fill(0);
 render();
};

function finish(){
 $("game").style.display="none";
 $("result").classList.add("show");
 $("final").textContent="15 / 15";
 $("msg").innerHTML=
   "Hoàn thành với <b>"+restarts+"</b> lần làm lại.<br>"+
   "Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";

 let h="<h3>🗺️ Expedition Review</h3>";
 Q.forEach((x,k)=>{
   h+='<div class="r"><b>Question '+(k+1)+'</b> — Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>';
 });
 $("review").innerHTML=h;
}

render();
</script>
</body>
</html>
