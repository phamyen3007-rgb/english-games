<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 2 - Exercise 9 - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#cdefff 0 62%,#b6e8a7 62%);color:#55394a;padding:18px;min-height:100vh}.wrap{max-width:1100px;margin:auto}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.pig{font-size:70px}.title h1{margin:0;color:#d65389}.title p{margin:6px 0;color:#6d5a66;font-weight:bold}.sound{border:0;border-radius:12px;background:white;padding:10px 14px;font-weight:bold}.card{background:rgba(255,255,255,.97);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px #69465d22}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:16px;background:linear-gradient(90deg,#fff2f7,#eef9ff)}.barbox{height:12px;background:#f1e5ed;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff9fc6,#ff6fa8,#8ed6ff)}.chip{background:#fff;padding:8px 12px;border-radius:99px;font-weight:bold}.main{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:20px}.passage,.quiz{border-radius:18px;padding:18px}.passage{background:#f7fcff;border:2px solid #d8eef9;line-height:1.7;max-height:560px;overflow:auto}.quiz{background:#fff8fb;border:2px solid #f3dbe7}.tag{display:inline-block;background:#ffe5f0;color:#c64e7c;padding:7px 12px;border-radius:10px;font-weight:bold}.q{font-size:23px;line-height:1.5;margin:16px 0}.input{width:100%;padding:14px;border:2px solid #e5d4df;border-radius:14px;font-size:18px}.note{font-size:14px;color:#8d7181;margin-top:8px}.buttons{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.check{background:#ffd0e0}.next{background:#ffe27a}.btn:disabled{opacity:.4}.fb{display:none;margin-top:16px;padding:15px;background:#fff;border-left:5px solid;border-radius:12px;line-height:1.55}.fb.show{display:block}.ok{border-color:#4fcf91}.no{border-color:#ff6b7d}.result{display:none;text-align:center;padding:30px}.result.show{display:block}.scorebig{font-size:56px;font-weight:bold;color:#ff6fa8}.review{text-align:left}.item{padding:12px;margin:8px 0;background:#fff9fc;border-left:5px solid #b9a8b2;border-radius:10px}.item.ok{border-left-color:#4fcf91}.item.no{border-left-color:#ff6b7d}@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}@media(max-width:650px){.hero{align-items:flex-start}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="wrap"><div class="hero"><div class="pig">🐷</div><div class="title"><h1>Peppa Pig Family Reading Quest</h1><p>Grade 11 · Unit 2 · Exercise 9 · Option B</p></div><button class="sound" id="sound">🔊</button></div>
<div class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="main"><div class="passage"><h3>📖 Building Strong Family Relationships</h3><div id="passage"></div></div><div class="quiz"><div class="tag" id="tag"></div><div class="q" id="q"></div><input class="input" id="input" placeholder="Type your answer..."><div class="note">NO MORE THAN TWO WORDS from the text.</div><div class="buttons"><button class="btn check" id="check">Check Answer 🐷</button><button class="btn next" id="next" disabled>Next Question →</button></div><div class="fb" id="fb"></div></div></div></div><div class="result" id="result"><div style="font-size:70px">🐷💖</div><h2>Family Quest Complete!</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="btn check" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage=`Every family has members of different ages, personalities, and interests. These differences can sometimes cause misunderstandings, but they also give family members opportunities to learn from one another. Instead of focusing on disagreements, families should work together to build stronger relationships through respect and communication.

One important way to strengthen family ties is to spend quality time together. Even simple activities such as sharing meals, taking a walk, or watching a movie can help family members understand each other better. These moments also create happy memories that last for many years.

Another important factor is effective communication. Parents should encourage their children to express their thoughts and feelings honestly without fear of being judged. Likewise, children should respect their parents' opinions, even if they do not completely agree with them. Listening carefully is often more valuable than trying to win an argument.

Finally, trust plays a key role in every happy family. Trust grows when family members keep their promises, support one another during difficult times, and solve problems together. A family built on trust and respect can overcome challenges and maintain close relationships for many years.`;
const Q=[
["Family members should focus on building stronger relationships through respect and ____________.","communication","The passage says families should build stronger relationships through respect and communication."],
["Spending ____________ together helps families understand each other better.","quality time","The passage says an important way to strengthen family ties is to spend quality time together."],
["Parents should encourage children to express their thoughts and ____________ honestly.","feelings","The passage says children should express their thoughts and feelings honestly."],
["Children should respect their parents' ____________ even when they disagree.","opinions","The passage says children should respect their parents' opinions even if they do not completely agree."],
["____________ is an important quality that helps families overcome challenges and stay close.","Trust","The final paragraph says trust plays a key role and helps families overcome challenges and maintain close relationships."]];
let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function norm(s){return s.toLowerCase().trim().replace(/[.,!?;:'\"]/g,"").replace(/\s+/g," ")}function wc(s){return norm(s).split(" ").filter(Boolean).length}
function tone(f,d=.1,t="sine"){if(!on)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function ok(){tone(620,.08);setTimeout(()=>tone(900,.13,"triangle"),80)}function bad(){tone(180,.16,"sawtooth")}function go(){tone(500,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊":"🔇";if(on)go()};
function show(){a=false;$("input").disabled=false;$("input").value="";$("check").disabled=false;$("next").disabled=true;$("fb").className="fb";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🐷 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("next").textContent=i===Q.length-1?"Finish Quest 💖":"Next Question →";$("input").focus()}
function check(){if(a)return;let raw=$("input").value.trim();if(!raw)return;a=true;let q=Q[i],long=wc(raw)>2,right=!long&&norm(raw)===norm(q[1]);$("input").disabled=true;$("check").disabled=true;$("next").disabled=false;if(right){xp+=10+c*2;c++;$("fb").className="fb ok show";$("fb").innerHTML=`<b>🐷 Chính xác! Đáp án: ${q[1]}</b><br>${q[2]}`;ok()}else{h=Math.max(0,h-1);c=0;$("fb").className="fb no show";$("fb").innerHTML=`<b>Chưa đúng. Đáp án: ${q[1]}</b><br>${long?"Câu trả lời vượt quá TWO WORDS.<br>":""}${q[2]}`;bad()}ans.push({raw,right});$("score").textContent=`🐷 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`}
$("check").onclick=check;$("input").addEventListener("keydown",e=>{if(e.key==="Enter")check()});$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};
function result(){$("quizArea").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct===5?"Perfect Family Reader!":correct>=4?"Excellent reading!":correct>=3?"Good job! Hãy xem lại các câu sai.":"Đọc lại đoạn văn rồi thử lại nhé.";let r="<h3>🐷 Family Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}: ${z&&z.right?"Đúng":"Sai"}</b><br>Em trả lời: ${z?z.raw:"Chưa trả lời"}<br>Đáp án đúng: ${q[1]}<br><i>${q[2]}</i></div>`});$("review").innerHTML=r}
$("restart").onclick=()=>location.reload();$("passage").innerHTML=passage.split("\n\n").map(p=>`<p>${p}</p>`).join("");show();
</script></body></html>
