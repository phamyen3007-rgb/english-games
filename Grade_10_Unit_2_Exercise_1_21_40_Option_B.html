<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 1 (21-40) - Option B</title>
<style>
:root{--bg:#07080d;--panel:#11141f;--red:#ff3b4f;--orange:#ff8a2a;--yellow:#ffd84d;--green:#42e58c;--text:#f8fafc;--muted:#aeb8ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;color:var(--text);background:radial-gradient(circle at 15% 20%,rgba(255,59,79,.18),transparent 28%),radial-gradient(circle at 82% 18%,rgba(255,138,42,.14),transparent 25%),linear-gradient(160deg,#05060a,#0b0f18 60%,#05060a);padding:18px}.wrap{width:min(1040px,100%);margin:auto}.hero{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}.fighter{width:100px;height:100px;position:relative;filter:drop-shadow(0 0 18px rgba(255,59,79,.35))}.aura{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,77,.3),rgba(255,59,79,.08) 55%,transparent 70%);animation:aura 1.6s ease-in-out infinite}@keyframes aura{50%{transform:scale(1.12);opacity:.6}}.hair{position:absolute;left:15px;top:2px;width:70px;height:58px;background:linear-gradient(145deg,#f6e27a,#ff9f1c);clip-path:polygon(0 62%,15% 15%,28% 40%,44% 0,56% 36%,74% 8%,83% 43%,100% 25%,88% 100%,18% 100%);z-index:2}.face{position:absolute;left:25px;top:31px;width:53px;height:54px;background:linear-gradient(#f0c6ae,#d99a80);border-radius:46%;z-index:3}.eye{position:absolute;top:54px;width:13px;height:5px;background:#111;z-index:4;box-shadow:0 0 8px var(--red)}.eye.l{left:35px}.eye.r{right:29px}.band{position:absolute;left:20px;top:37px;width:64px;height:8px;background:var(--red);z-index:5;transform:rotate(-5deg);box-shadow:0 0 10px var(--red)}h1{margin:0;font-size:clamp(28px,4vw,46px);background:linear-gradient(90deg,#fff,var(--yellow),var(--orange),var(--red));-webkit-background-clip:text;color:transparent}.subtitle{margin:7px 0 0;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(255,138,42,.45);background:#171b26;color:#fff;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.card{background:linear-gradient(180deg,#1a2030,var(--panel));border:1px solid rgba(255,138,42,.28);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:18px 22px 13px;background:#0c1018}.barbox{height:13px;background:#07090f;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--red));transition:.3s}.chip{background:#171d29;border-radius:999px;padding:8px 13px;font-weight:900;white-space:nowrap}.content{padding:24px 22px 26px}.tag{display:inline-block;padding:7px 13px;border-radius:9px;background:rgba(255,59,79,.1);border:1px solid rgba(255,59,79,.5);color:#ff9ba7;font-weight:900;margin-bottom:13px}.question{margin:0 0 22px;font-size:clamp(22px,2.8vw,31px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{min-height:72px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,#1b2230,#10141d);color:white;display:flex;align-items:center;gap:13px;padding:16px 17px;font-size:18px;text-align:left;cursor:pointer;transition:.16s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--orange)}.letter{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;font-weight:1000;color:#160b00;background:linear-gradient(135deg,var(--yellow),var(--orange))}.option.correct{background:linear-gradient(135deg,#145238,#0a2d22)!important;border-color:var(--green)!important}.option.wrong{background:linear-gradient(135deg,#651e2b,#310d15)!important;border-color:var(--red)!important}.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:15px;background:#0b0f16;border-left:5px solid;line-height:1.6}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--yellow)}.controls{display:flex;justify-content:flex-end;margin-top:20px}.action{border:0;border-radius:12px;padding:13px 23px;font-size:17px;font-weight:1000;color:#1a0900;cursor:pointer;background:linear-gradient(90deg,var(--yellow),var(--orange))}.action:disabled{opacity:.35;cursor:not-allowed}.result{display:none;text-align:center;padding:38px 24px}.result.show{display:block}.score-big{font-size:58px;font-weight:1000;color:var(--orange)}.review{text-align:left;margin-top:25px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}.review-item{padding:13px 14px;margin-bottom:10px;border-radius:12px;background:#0d121b;border-left:5px solid #64748b}.review-item.ok{border-left-color:var(--green)}.review-item.no{border-left-color:var(--red)}@media(max-width:760px){.hero{grid-template-columns:80px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.options{grid-template-columns:1fr}.content{padding:18px 15px}.fighter{transform:scale(.78);transform-origin:left center;width:80px}}
</style>
</head><body>
<main class="wrap"><header class="hero"><div class="fighter"><div class="aura"></div><div class="hair"></div><div class="face"></div><div class="band"></div><div class="eye l"></div><div class="eye r"></div></div><div><h1>Fighting Anime Grammar Battle</h1><p class="subtitle">Grade 10 · Unit 2 · Exercise 1 (21–40) · Option B</p></div><button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button></header>
<section class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="counter"></div><div class="chip" id="scoreChip"></div><div class="chip" id="heartChip"></div></div><div class="content"><div class="tag" id="tag"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action" id="nextBtn" disabled>Next Attack ⚔</button></div></div></div><div class="result" id="resultArea"><div style="font-size:72px" id="resultIcon">🔥</div><h2>Battle Complete</h2><div class="score-big" id="finalScore"></div><p id="message"></p><button class="action" id="restartBtn">Fight Again ↻</button><div class="review" id="review"></div></div></section></main>
<script>
const questions=[
["Using reusable shopping bags helps protect ____________.",["greenhouse gases","natural resources","pollution","rubbish"],1,"Natural resources là tài nguyên thiên nhiên. Dùng túi tái sử dụng giúp bảo vệ tài nguyên thiên nhiên."],
["What time ____________ the train tomorrow morning?",["will leave","is leaving","does leave","do leave"],2,"Dùng hiện tại đơn với lịch trình cố định: What time does the train leave...?"],
["The old computers ____________ to local schools last month.",["donated","were donated","are donating","donate"],1,"Câu bị động ở quá khứ đơn: were donated. Last month là dấu hiệu của quá khứ đơn."],
["The news quickly caught everyone's ____________.",["attention","pollution","report","damage"],0,"catch someone's attention = thu hút sự chú ý của ai."],
["Plastic waste causes serious environmental ____________.",["achievement","calculation","damage","celebration"],2,"environmental damage = thiệt hại môi trường."],
["Scientists are studying the environmental ____________ caused by air pollution.",["prevention","recycling","estimate","damage"],3,"environmental damage = thiệt hại môi trường."],
["Burning coal can ____________ serious air pollution.",["cause","build","collect","produce"],0,"cause serious air pollution = gây ra ô nhiễm không khí nghiêm trọng."],
["We should ____________ the amount of plastic we use every day.",["turn on","cut down on","throw away","break down"],1,"cut down on = cắt giảm."],
["Please ____________ before putting the bottles into the recycling bin.",["recycle plastic bottles","bottles recycle plastic","recycle bottles plastic","plastic recycle bottles"],0,"Cụm đúng là recycle plastic bottles."],
["Many factories now ____________ paper and glass instead of throwing them away.",["waste","collect","recycle","emit"],2,"recycle paper and glass = tái chế giấy và thủy tinh."],
["I hope we ____________ more trees together next month.",["planted","plant","are planting","will plant"],3,"Sau hope, dùng will + V để nói về mong muốn trong tương lai. Next month là dấu hiệu tương lai."],
["The amount of carbon dioxide was ____________ after the survey.",["recycled","calculated","collected","suggested"],1,"was calculated = được tính toán."],
["Experts are trying to ____________ the amount of water used in each household.",["estimate","remind","raise","destroy"],0,"estimate the amount = ước tính số lượng."],
["On ____________, students spend about two hours doing homework every evening.",["electricity","pollution","average","damage"],2,"on average = trung bình."],
["Solar panels produce clean ____________ for homes and schools.",["electricity","emissions","carbon footprint","energy bill"],0,"produce clean electricity = tạo ra điện sạch."]];
const L=["A","B","C","D"];let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;const $=id=>document.getElementById(id);
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}
function hit(freq,duration,type="square",volume=.05,delay=0){if(!soundOn)return;const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(volume,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+duration);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03)}
function soundCorrect(){hit(220,.06,"square",.035);hit(520,.08,"sawtooth",.04,.05);hit(900,.14,"triangle",.05,.12)}function soundWrong(){hit(130,.18,"sawtooth",.05);hit(90,.24,"square",.03,.12)}function soundNext(){hit(330,.05,"triangle",.025);hit(500,.06,"triangle",.02,.05)}function soundFinish(){[220,330,440,660,880].forEach((f,i)=>hit(f,.18,"sawtooth",.03,i*.09))}
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(soundOn)soundNext()};
function render(){answered=false;$("nextBtn").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";const q=questions[current];$("tag").textContent=`Question ${current+1}`;$("question").textContent=q[0];$("counter").textContent=`Câu ${current+1}/${questions.length}`;$("scoreChip").textContent=`🔥 ${score} XP · Combo ${combo}`;$("heartChip").textContent=`❤️ ${hearts}`;$("bar").style.width=`${current/questions.length*100}%`;$("options").innerHTML="";q[1].forEach((op,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${L[i]}</span><span>${op}</span>`;b.onclick=()=>choose(i);$("options").appendChild(b)});$("nextBtn").textContent=current===questions.length-1?"Finish Battle 🔥":"Next Attack ⚔"}
function choose(i){if(answered)return;answered=true;const q=questions[current],btns=[...document.querySelectorAll(".option")],right=i===q[2];btns.forEach(b=>b.disabled=true);btns[q[2]].classList.add("correct");if(right){score+=10+combo*2;combo++;btns[i].classList.add("correct");$("feedback").className="feedback correct show";$("feedback").innerHTML=`<strong>🔥 Critical Hit! Chính xác.</strong>${q[3]}`;soundCorrect()}else{hearts=Math.max(0,hearts-1);combo=0;btns[i].classList.add("wrong");$("feedback").className="feedback wrong show";$("feedback").innerHTML=`<strong>⚠ Attack Missed. Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}`;soundWrong()}answers.push({selected:i,right});$("scoreChip").textContent=`🔥 ${score} XP · Combo ${combo}`;$("heartChip").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(current+1)/questions.length*100}%`;$("nextBtn").disabled=false}
function showResult(){$("quizArea").style.display="none";$("resultArea").classList.add("show");const correct=answers.filter(a=>a.right).length;$("finalScore").textContent=`${score} XP · ${correct}/${questions.length}`;soundFinish();const p=correct/questions.length*100;if(p===100){$("resultIcon").textContent="🏆🔥";$("message").textContent="Ultimate Champion! Em đã trả lời đúng toàn bộ câu hỏi."}else if(p>=80){$("resultIcon").textContent="⚔️✨";$("message").textContent="Elite Fighter! Em đã nắm khá chắc kiến thức."}else if(p>=60){$("resultIcon").textContent="🥊💥";$("message").textContent="Good Battle! Xem lại các câu sai để tăng sức mạnh."}else{$("resultIcon").textContent="📘🔥";$("message").textContent="Training Mode! Ôn lại kiến thức rồi chiến đấu lần nữa."}let h="<h3>Battle Review</h3>";questions.forEach((q,n)=>{const a=answers[n];h+=`<div class="review-item ${a&&a.right?"ok":"no"}"><strong>Câu ${n+1}: ${a&&a.right?"Đúng":"Sai"}</strong><br>Em chọn: ${a?`${L[a.selected]}. ${q[1][a.selected]}`:"Chưa trả lời"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><em>${q[3]}</em></div>`});$("review").innerHTML=h}
$("nextBtn").onclick=()=>{if(!answered)return;soundNext();if(current<questions.length-1){current++;render()}else showResult()};$("restartBtn").onclick=()=>{current=0;score=0;hearts=5;combo=0;answered=false;answers=[];$("resultArea").classList.remove("show");$("quizArea").style.display="block";render();soundNext()};render();
</script></body></html>
