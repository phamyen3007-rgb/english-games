<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 Unit 4 Exercise 1 (21-40) Option C</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#08121d;color:#f5f8ff;min-height:100vh;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,#263d60 0,#0c1b2b 35%,#050a10 75%)}
.city{position:fixed;left:0;right:0;bottom:0;height:31vh;pointer-events:none;opacity:.6;background:
linear-gradient(90deg,transparent 0 3%,#172839 3% 10%,transparent 10% 12%,#20384c 12% 20%,transparent 20% 23%,#142536 23% 31%,transparent 31% 34%,#24425a 34% 44%,transparent 44% 48%,#182c40 48% 55%,transparent 55% 58%,#203a50 58% 68%,transparent 68% 71%,#162b3d 71% 80%,transparent 80% 83%,#213b50 83% 94%,transparent 94%)}
.road{position:fixed;left:0;right:0;bottom:6vh;height:6px;background:repeating-linear-gradient(90deg,#ffd86b 0 50px,transparent 50px 90px);opacity:.5}
.wrap{max-width:1080px;margin:auto;padding:20px;position:relative;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:8px 0 18px}
.brand{display:flex;gap:14px;align-items:center}.logo{font-size:58px}
h1{margin:0;font-size:clamp(27px,4vw,44px);background:linear-gradient(90deg,#72e7ff,#a9c5ff,#ffd36b);color:transparent;background-clip:text}
.sub{color:#b8c8d8;margin-top:6px;font-weight:bold}.sound{border:1px solid #35516d;background:#13273a;color:white;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:bold}
.panel{background:rgba(12,29,44,.95);border:1px solid #294860;border-radius:24px;box-shadow:0 25px 70px #0008;overflow:hidden}
.top{padding:16px 20px;background:#0a1928;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.progress{height:12px;background:#03080d;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#56d8ff,#8ca8ff,#ffd66e);transition:.3s}
.badge{padding:8px 12px;background:#142d43;border-radius:99px;font-weight:bold}
.game{padding:22px}.case{max-width:860px;margin:auto;background:#102b40;border:2px solid #28516d;border-radius:18px;padding:21px;position:relative}
.case:before{content:"CASE FILE";position:absolute;right:18px;top:15px;font-size:12px;letter-spacing:2px;color:#76dfff;font-weight:bold}
.qno{display:inline-block;background:#173d58;border-radius:8px;padding:7px 11px;font-weight:bold;color:#bdefff}
.question{font-size:22px;line-height:1.55;margin:19px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid #315b76;background:#122f46;color:white;border-radius:13px;padding:15px;text-align:left;font-size:17px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#6fe5ff}.opt.correct{background:#164536;border-color:#56d79d}.opt.wrong{background:#51242b;border-color:#ff7280}
.feedback{display:none;margin-top:16px;padding:15px;background:#091c2b;border-radius:11px;border-left:5px solid;line-height:1.55}.feedback.show{display:block}.feedback.ok{border-color:#56d79d}.feedback.no{border-color:#ff7280}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.clue{color:#9db2c4;font-size:14px}.next{border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(90deg,#77e7ff,#aabaff,#ffd87b);color:#14283b;font-weight:900;cursor:pointer}.next:disabled{opacity:.4}
.result{display:none;text-align:center;padding:34px}.result.show{display:block}.big{font-size:60px;font-weight:900;color:#7ce5ff}.review{text-align:left;margin-top:24px}.review div{background:#0c2234;border-left:5px solid #61798e;border-radius:10px;padding:12px;margin:9px 0;line-height:1.5}.review .ok{border-color:#56d79d}.review .no{border-color:#ff7280}
@media(max-width:680px){header{align-items:flex-start;flex-direction:column}.options{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr}.progress{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="sky"></div><div class="city"></div><div class="road"></div>
<div class="wrap">
<header><div class="brand"><div class="logo">🏙️🔎</div><div><h1>Urban Case Files</h1><div class="sub">Grade 12 · Unit 4 · Exercise 1 (21–40) · Option C</div></div></div><button id="sound" class="sound">🔊 Sound On</button></header>
<div class="panel">
<div id="quiz">
<div class="top"><div class="progress"><div class="fill" id="fill"></div></div><div class="badge" id="status"></div><div class="badge" id="xp"></div></div>
<div class="game"><div class="case"><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span class="clue" id="clue">🔍 Find the correct clue.</span><button class="next" id="next" disabled>Next Case →</button></div></div></div>
</div>
<div class="result" id="result"><div style="font-size:76px">🕵️‍♀️🏙️</div><h2>Urban Investigation Complete!</h2><div class="big" id="final"></div><p id="msg"></p><button class="next" onclick="location.reload()">Investigate Again ↻</button><div class="review" id="review"></div></div>
</div></div>
<script>
const Q=[{"q": "The construction of new metro lines has made it more ____________ for residents in the suburbs to travel to the city centre.", "options": ["affordable", "convenient", "residential", "overcrowded"], "answer": 1, "explanation": "Convenient = thuận tiện. Cấu trúc make it + adjective + for somebody + to V → made it more convenient for residents to travel."}, {"q": "Many young people leave the countryside and settle in large cities in search of better employment ____________.", "options": ["opportunities", "conveniences", "residences", "infrastructures"], "answer": 0, "explanation": "Employment opportunities = cơ hội việc làm. Đây là collocation tự nhiên trong chủ đề urbanisation."}, {"q": "The city council ____________ a number of measures to reduce traffic congestion over the past few years.", "options": ["introduced", "introduces", "has introduced", "had introduced"], "answer": 2, "explanation": "Over the past few years → Present Perfect. Vì vậy dùng has introduced."}, {"q": "Unless more affordable housing is provided, the ____________ between the demand for homes and their availability is likely to become even greater.", "options": ["shortage", "expansion", "development", "gap"], "answer": 3, "explanation": "The gap between A and B = khoảng cách/chênh lệch giữa A và B. Ở đây là chênh lệch giữa nhu cầu nhà ở và nguồn cung."}, {"q": "As the population continues to increase, public facilities are becoming ____________ crowded, especially during peak hours.", "options": ["more and more", "much and much", "the more", "most and most"], "answer": 0, "explanation": "More and more + adjective = ngày càng... → more and more crowded = ngày càng đông đúc."}, {"q": "Local authorities are planning to ____________ several old neighbourhoods by improving roads, public spaces, and essential services.", "options": ["attract", "modernise", "reside", "afford"], "answer": 1, "explanation": "Modernise = hiện đại hóa. Việc cải thiện đường sá, không gian công cộng và dịch vụ thiết yếu nhằm hiện đại hóa các khu dân cư cũ."}, {"q": "____________ the cost of living becomes, ____________ difficult it is for low-income workers to remain in the city centre.", "options": ["The higher / the more", "Higher / more", "The highest / the most", "The more high / the more"], "answer": 0, "explanation": "So sánh kép: The + comparative..., the + comparative... → The higher..., the more difficult..."}, {"q": "Thousands of residents have been forced to move to the outskirts because housing prices in the city centre have ____________ sharply.", "options": ["gone through", "taken off", "gone up", "brought about"], "answer": 2, "explanation": "Go up = tăng lên. Housing prices have gone up sharply = giá nhà đã tăng mạnh."}, {"q": "Rapid population growth can ____________ considerable pressure on schools, hospitals, and transportation networks.", "options": ["make", "put", "take", "bring"], "answer": 1, "explanation": "Put pressure on somebody/something = gây áp lực lên ai/cái gì. → put considerable pressure on public services."}, {"q": "This is the first time the local government ____________ such a large amount of money in improving public transportation.", "options": ["invests", "invested", "had invested", "has invested"], "answer": 3, "explanation": "This is the first time + S + have/has + V3. → has invested."}], L=["A","B","C","D"];let i=0,score=0,combo=0,answered=false,hist=[],sound=true,ctx;
const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!sound)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.035,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function okSound(){tone(600,.08);tone(850,.12,.08)} function noSound(){tone(180,.15);tone(110,.18,.1)}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Sound On":"🔇 Sound Off";if(sound)tone(520,.08)}
function render(){answered=false;$("next").disabled=true;$("feedback").className="feedback";let q=Q[i];$("qno").textContent="CASE "+(i+1);$("question").textContent=q.q;$("status").textContent=(i+1)+"/"+Q.length+" · Combo "+combo;$("xp").textContent="⭐ "+score+" XP";$("fill").style.width=(i/Q.length*100)+"%";$("options").innerHTML="";q.options.forEach((x,n)=>{let b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+L[n]+".</b> "+x;b.onclick=()=>pick(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Close Case ✓":"Next Case →"}
function pick(n,b){if(answered)return;answered=true;let q=Q[i],bs=[...document.querySelectorAll(".opt")],good=n===q.answer;bs.forEach(x=>x.disabled=true);bs[q.answer].classList.add("correct");if(good){score+=10+combo*2;combo++;$("feedback").className="feedback ok show";$("feedback").innerHTML="<b>✅ Evidence confirmed: "+L[q.answer]+". "+q.options[q.answer]+"</b><br>"+q.explanation;okSound()}else{combo=0;b.classList.add("wrong");$("feedback").className="feedback no show";$("feedback").innerHTML="<b>❌ Incorrect clue. Correct: "+L[q.answer]+". "+q.options[q.answer]+"</b><br>"+q.explanation;noSound()}hist.push({n,good});$("status").textContent=(i+1)+"/"+Q.length+" · Combo "+combo;$("xp").textContent="⭐ "+score+" XP";$("fill").style.width=((i+1)/Q.length*100)+"%";$("next").disabled=false}
$("next").onclick=()=>{if(!answered)return;tone(430,.06);if(++i<Q.length)render();else finish()}
function finish(){$("quiz").style.display="none";$("result").classList.add("show");let c=hist.filter(x=>x.good).length;$("final").textContent=c+"/"+Q.length+" · "+score+" XP";$("msg").textContent=c===10?"Perfect! All urban cases solved.":c>=8?"Excellent investigation!":c>=6?"Good work. Review the missed clues below.":"Review the evidence and investigate again.";let h="<h3>📁 Case Review</h3>";Q.forEach((q,k)=>{let a=hist[k];h+='<div class="'+(a.good?"ok":"no")+'"><b>Case '+(k+1)+": "+(a.good?"SOLVED":"REOPEN")+"</b><br>Your answer: "+L[a.n]+". "+q.options[a.n]+"<br>Correct: "+L[q.answer]+". "+q.options[q.answer]+"<br><i>"+q.explanation+"</i></div>"});$("review").innerHTML=h;tone(523,.12);tone(659,.12,.1);tone(784,.18,.2)}
render();
</script></body></html>
