<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 3 - Exercise 7 - Option C</title>
<style>
:root{
 --night:#08131f;--panel:#0f2233;--panel2:#15324a;--cyan:#6ce7ff;--blue:#6f9cff;
 --mint:#83efc1;--gold:#ffd970;--green:#4fd39a;--red:#ff6a78;--white:#f5fbff;--muted:#b5c8d9;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--white);
 background:
 radial-gradient(circle at 15% 12%,rgba(108,231,255,.12),transparent 22%),
 radial-gradient(circle at 85% 18%,rgba(111,156,255,.11),transparent 24%),
 linear-gradient(160deg,#06101a,#0a1b2b 58%,#050d15);
 padding:18px;overflow-x:hidden
}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(30px);opacity:.18}
.g1{width:260px;height:260px;background:#6ce7ff;left:-80px;top:8%}
.g2{width:300px;height:300px;background:#6f9cff;right:-100px;bottom:4%}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:white;opacity:.7;animation:twinkle 2.5s ease-in-out infinite}
.s1{left:12%;top:18%}.s2{left:35%;top:9%;animation-delay:.8s}.s3{right:18%;top:22%;animation-delay:1.4s}.s4{right:35%;bottom:12%;animation-delay:2s}
@keyframes twinkle{50%{opacity:.15;transform:scale(.5)}}
.wrap{max-width:1180px;margin:auto;position:relative;z-index:2}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.hero-left{display:flex;align-items:center;gap:14px}
.icon{font-size:64px;filter:drop-shadow(0 0 16px rgba(108,231,255,.28))}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#dffbff,#6ce7ff,#83efc1,#ffd970);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:6px;color:var(--muted);font-weight:700}
.sound{border:1px solid rgba(108,231,255,.28);background:#10283b;color:white;padding:11px 14px;border-radius:12px;font-weight:900;cursor:pointer}
.shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(108,231,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.38)}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#0b1a28}
.barbox{height:13px;background:#050b12;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--mint),var(--gold));transition:.25s}
.chip{background:#122c40;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#0b1f30;border:2px solid #1b4865;border-radius:18px;padding:18px;max-height:660px;overflow:auto;line-height:1.75}
.passage h2{margin-top:0;color:#dff9ff}
.section-label{font-weight:900;color:#7edff3}
.quiz{background:#0e2538;border:2px solid #1b4865;border-radius:18px;padding:18px}
.qtag{display:inline-block;background:#153954;color:#d6f7ff;padding:7px 12px;border-radius:10px;font-weight:900}
.question{font-size:22px;line-height:1.5;margin:16px 0}
.options{display:grid;gap:11px}
.option{padding:14px 15px;border:2px solid #24516d;border-radius:14px;background:#102d43;color:white;text-align:left;font-size:17px;cursor:pointer;transition:.15s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:#6ce7ff;box-shadow:0 0 18px rgba(108,231,255,.1)}
.option.correct{background:#154232!important;border-color:var(--green)!important}
.option.wrong{background:#482229!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:15px;padding:15px;border-left:5px solid;border-radius:12px;background:#091a28;line-height:1.55}
.feedback.show{display:block}.feedback.ok{border-color:var(--green)}.feedback.no{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#8cecff,#a5f2c8,#ffe18a);color:#19374a;cursor:pointer}
.next:disabled{opacity:.4}
.result{display:none;text-align:center;padding:32px}.result.show{display:block}
.big{font-size:58px;font-weight:1000;color:#8cecff}
.review{text-align:left;margin-top:22px}
.item{padding:12px 14px;background:#0b1f30;border-left:5px solid #54758a;border-radius:12px;margin:9px 0;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.passage{max-height:430px}}
@media(max-width:620px){.hero{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="bg">
 <div class="glow g1"></div><div class="glow g2"></div>
 <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-left">
      <div class="icon">🏡✨</div>
      <div>
        <h1>Green Home Reading Quest</h1>
        <div class="sub">Grade 12 · Unit 3 · Exercise 7 · Option C</div>
      </div>
    </div>
    <button class="sound" id="sound">🔊 Sound On</button>
  </div>

  <div class="shell">
    <div id="game">
      <div class="status">
        <div class="barbox"><div class="bar" id="bar"></div></div>
        <div class="chip" id="count"></div>
        <div class="chip" id="score"></div>
        <div class="chip" id="heart"></div>
      </div>

      <div class="grid">
        <section class="passage">
          <h2>SIMPLE WAYS TO MAKE YOUR HOME GREENER</h2>
          <div id="passage"></div>
        </section>

        <section class="quiz">
          <div class="qtag" id="qtag"></div>
          <div class="question" id="question"></div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
          <div class="controls"><button class="next" id="next" disabled>Next Question →</button></div>
        </section>
      </div>
    </div>

    <div id="result" class="result">
      <div style="font-size:72px">🏡🏆</div>
      <h2>Green Home Quest Complete!</h2>
      <div class="big" id="final"></div>
      <p id="msg"></p>
      <button class="next" id="restart">Play Again ↻</button>
      <div class="review" id="review"></div>
    </div>
  </div>
</div>

<script>
const passage="Developing environmentally friendly habits at home does not necessarily involve expensive technology or major lifestyle changes. In fact, a few simple adjustments to the way we use energy can significantly reduce both household expenses and environmental impact.\n\nA. One practical step is to choose electrical appliances carefully. When replacing an old refrigerator, washing machine, or air conditioner, consumers should look beyond the initial purchase price and consider how efficiently the appliance uses electricity. Models with high energy-efficiency ratings may be more expensive at first, but they generally consume considerably less power over time. Replacing traditional light bulbs with LED ones is another worthwhile option. Not only do LEDs require less electricity, but they also last much longer, meaning that they need to be replaced less frequently.\n\nB. Households can also make better use of natural light and ventilation. Instead of immediately switching on lights during the daytime, residents can open curtains and arrange furniture in ways that allow more sunlight to enter. Mirrors can also be positioned strategically to enhance the amount of light available in darker areas. Similarly, opening windows when outdoor temperatures are comfortable can reduce dependence on air conditioning. These simple practices can lower energy consumption without compromising comfort.\n\nC. Another habit that is frequently overlooked is unplugging electronic devices. Many appliances continue to draw electricity even after they have been switched off. Chargers, televisions, computers, and other devices left connected to electrical outlets can consume small amounts of standby power. Individually, this consumption may appear insignificant; however, when several devices remain plugged in for long periods, their combined energy use can become considerable. Unplugging unnecessary devices can therefore have a positive effect on electricity consumption and help reduce household energy bills over time.";
const Q=[{"q": "Which of the following is NOT mentioned as a way to save energy in the passage?", "options": ["Purchasing appliances that consume electricity efficiently", "Positioning mirrors to make better use of available light", "Disconnecting devices that are not being used", "Adjusting air conditioners to a higher temperature during the day"], "answer": 3, "explanation": "The passage mentions energy-efficient appliances, mirrors, and unplugging unused devices. Adjusting the air conditioner to a higher temperature is not mentioned."}, {"q": "The word “effect” in paragraph C is closest in meaning to ______.", "options": ["consequence", "influence", "purpose", "limitation"], "answer": 1, "explanation": "effect ≈ influence = tác động/ảnh hưởng. In this context, “have a positive effect on electricity consumption” means to have a positive influence on it."}, {"q": "The word “their” in paragraph C refers to ______.", "options": ["small amounts of standby power", "electrical outlets", "several devices", "long periods"], "answer": 2, "explanation": "“their combined energy use” refers back to “several devices” in the previous part of the sentence."}, {"q": "The word “enhance” in paragraph B could best be replaced by ______.", "options": ["restrict", "improve", "maintain", "measure"], "answer": 1, "explanation": "enhance = improve = cải thiện / tăng cường."}, {"q": "Which of the following is TRUE according to the passage?", "options": ["Appliances with high energy-efficiency ratings always cost less than conventional models when purchased.", "Using natural ventilation may decrease the need for air conditioning while maintaining household comfort.", "Electronic devices consume electricity only when they are actively operating.", "LED bulbs save energy mainly because they produce a greater amount of light than traditional bulbs."], "answer": 1, "explanation": "Paragraph B says opening windows can reduce dependence on air conditioning, and these practices can lower energy use without compromising comfort."}, {"q": "In which paragraph does the writer discuss how devices may continue consuming electricity despite being switched off?", "options": ["Paragraph A", "Paragraph B", "Paragraph C", "None of the above"], "answer": 2, "explanation": "Paragraph C states that many appliances continue to draw electricity even after they have been switched off."}, {"q": "In which paragraph does the writer mention a method of improving indoor lighting without using additional electricity?", "options": ["Paragraph A", "Paragraph B", "Paragraph C", "None of the above"], "answer": 1, "explanation": "Paragraph B mentions opening curtains and positioning mirrors to increase available natural light without using more electricity."}];
const L=["A","B","C","D"];
let i=0,xp=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,ctx=null;
const $=id=>document.getElementById(id);

function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine",v=.035,delay=0){
 if(!soundOn)return;
 const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
 o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);
 o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)
}
function okSound(){tone(640,.08,"triangle");tone(900,.11,"sine",.03,.08)}
function badSound(){tone(160,.16,"sawtooth");tone(95,.2,"square",.018,.1)}
function nextSound(){tone(420,.06,"triangle",.018);tone(660,.07,"triangle",.015,.06)}
function winSound(){[523,659,784,988].forEach((f,n)=>tone(f,.17,"triangle",.028,n*.09))}

$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)nextSound()}

function render(){
 answered=false;$("next").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";
 const q=Q[i];
 $("qtag").textContent=`Question ${i+1}`;
 $("question").textContent=q.q;
 $("count").textContent=`${i+1}/${Q.length}`;
 $("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;
 $("heart").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${i/Q.length*100}%`;
 $("options").innerHTML="";
 q.options.forEach((op,n)=>{
   const b=document.createElement("button");
   b.className="option";
   b.innerHTML=`<strong>${L[n]}.</strong> ${op}`;
   b.onclick=()=>choose(n,b);
   $("options").appendChild(b);
 });
 $("next").textContent=i===Q.length-1?"Finish Quest 🏡":"Next Question →";
}

function choose(n,btn){
 if(answered)return;answered=true;
 const q=Q[i],buttons=[...document.querySelectorAll(".option")],right=n===q.answer;
 buttons.forEach(b=>b.disabled=true);
 buttons[q.answer].classList.add("correct");

 if(right){
   xp+=10+combo*2;combo++;
   $("feedback").className="feedback ok show";
   $("feedback").innerHTML=`<strong>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;
   okSound();
 }else{
   hearts=Math.max(0,hearts-1);combo=0;btn.classList.add("wrong");
   $("feedback").className="feedback no show";
   $("feedback").innerHTML=`<strong>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;
   badSound();
 }

 answers.push({selected:n,correct:right});
 $("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;
 $("heart").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(i+1)/Q.length*100}%`;
 $("next").disabled=false;
}

$("next").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(i<Q.length-1){i++;render()}else finish()
}

function finish(){
 $("game").style.display="none";$("result").classList.add("show");winSound();
 const correct=answers.filter(a=>a.correct).length;
 $("final").textContent=`${xp} XP · ${correct}/${Q.length}`;
 $("msg").textContent=correct===7?"Perfect reading score!":correct>=6?"Excellent reading comprehension!":correct>=5?"Good job — review the missed items.":"Read the passage again and try once more.";
 let html="<h3>📘 Reading Review</h3>";
 Q.forEach((q,n)=>{
   const a=answers[n];
   html+=`<div class="item ${a&&a.correct?"ok":"no"}"><strong>Question ${n+1}: ${a&&a.correct?"Correct":"Incorrect"}</strong><br>Your answer: ${a?L[a.selected]:"-"} ${a?q.options[a.selected]:""}<br>Correct answer: ${L[q.answer]}. ${q.options[q.answer]}<br><em>${q.explanation}</em></div>`;
 });
 $("review").innerHTML=html;
}
$("restart").onclick=()=>location.reload();

$("passage").innerHTML=passage
 .replace(/^A\./m,'<span class="section-label">A.</span>')
 .replace(/^B\./m,'<span class="section-label">B.</span>')
 .replace(/^C\./m,'<span class="section-label">C.</span>')
 .split("\\n\\n").map(p=>`<p>${p}</p>`).join("");

render();
</script>
</body>
</html>
