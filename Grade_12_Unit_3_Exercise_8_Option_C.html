<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 - Unit 3 - Exercise 8 - Option C</title>
<style>
:root{--sky:#dff5ff;--blue:#78c8ff;--deep:#183a66;--gold:#ffd77a;--white:#fff;--ink:#18314f;--ok:#46b97b;--bad:#ed6b75}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(#9bd9ff 0,#dff5ff 42%,#fff8dc 100%);padding:18px}
.cloud{position:fixed;font-size:70px;opacity:.45;animation:drift 25s linear infinite;pointer-events:none}.c1{top:6%;left:-120px}.c2{top:44%;left:-180px;animation-duration:34s}
@keyframes drift{to{transform:translateX(120vw)}} .wrap{max-width:1200px;margin:auto;position:relative;z-index:2}
.hero{background:rgba(255,255,255,.82);border:2px solid white;border-radius:28px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 16px 45px #5a9dca33;margin-bottom:15px}
.title{display:flex;align-items:center;gap:15px}.angel{font-size:70px;filter:drop-shadow(0 6px 8px #5c9ec744)}h1{margin:0;color:#315f96;font-size:clamp(27px,4vw,43px)}.sub{font-weight:800;color:#6783a4;margin-top:5px}
.sound,.next,.restart{border:0;border-radius:14px;padding:12px 17px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#8fd7ff,#ffe09a);color:#23496f}
.shell{background:rgba(255,255,255,.88);border:2px solid white;border-radius:26px;box-shadow:0 18px 55px #4c8ab333;overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:14px 18px;background:#edf9ff}.track{height:13px;background:#cfe8f5;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#6dcaff,#ffd87d);transition:.3s}.chip{background:white;border:1px solid #d4eaf6;border-radius:999px;padding:8px 11px;font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:17px;padding:18px}.passage,.quiz{background:#fff;border:2px solid #d9edf8;border-radius:20px;padding:18px}.passage{max-height:680px;overflow:auto;line-height:1.75}.passage h2{color:#386a9d;margin-top:0}.qtag{display:inline-block;background:#e3f5ff;padding:7px 11px;border-radius:10px;font-weight:900;color:#4777a8}.question{font-size:21px;line-height:1.5;margin:15px 0}.options{display:grid;gap:10px}.option{background:#f6fbff;border:2px solid #d5eaf6;border-radius:14px;padding:14px;text-align:left;font-size:16px;color:#203c5d;cursor:pointer}.option:hover:not(:disabled){border-color:#75c9fa;transform:translateY(-1px)}.option.correct{background:#e7faef;border-color:var(--ok)}.option.wrong{background:#fff0f1;border-color:var(--bad)}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:13px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#edfff4;border-left:5px solid var(--ok)}.feedback.no{background:#fff2f3;border-left:5px solid var(--bad)}.controls{text-align:right;margin-top:13px}.next:disabled{opacity:.4}
.result{display:none;text-align:center;padding:30px}.result.show{display:block}.scorebig{font-size:56px;font-weight:1000;color:#3d78ae}.review{text-align:left;margin-top:20px}.item{background:white;border-left:5px solid #8ab7d2;border-radius:12px;padding:12px;margin:9px 0;line-height:1.45}.item.ok{border-left-color:var(--ok)}.item.no{border-left-color:var(--bad)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.passage{max-height:420px}} @media(max-width:620px){.hero{align-items:flex-start;flex-direction:column;gap:12px}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style></head>
<body>
<div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>
<div class="wrap">
<div class="hero"><div class="title"><div class="angel">👼🏻</div><div><h1>Angel Reading Mission</h1><div class="sub">Grade 12 · Unit 3 · Exercise 8 · Option C</div></div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="shell">
<div id="game">
<div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="xp"></div><div class="chip" id="life"></div></div>
<div class="grid">
<section class="passage"><h2>RETHINKING OUR EVERYDAY ENVIRONMENTAL CHOICES</h2><div id="passage"></div></section>
<section class="quiz"><div class="qtag" id="qtag"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next" disabled>Next →</button></div></section>
</div></div>
<div class="result" id="result"><div style="font-size:78px">👼🏻✨</div><h2>Angel Mission Complete!</h2><div class="scorebig" id="final"></div><p id="message"></p><button class="restart" id="restart">Play Again ↻</button><div class="review" id="review"></div></div>
</div></div>
<script>
const passage="As concern about environmental degradation grows, sustainable living is increasingly viewed as a shared responsibility rather than merely a personal choice. It involves reconsidering everyday decisions that may place unnecessary pressure on natural resources. People can contribute by consuming fewer disposable products, conserving energy and water, and selecting goods whose production causes less environmental damage. Although a single household may have only a modest impact, the combined efforts of millions of individuals can bring about substantial environmental improvements.\n\nResponsible consumption is a particularly important component of sustainable living. Consumers can reduce waste by choosing durable products rather than items intended for short-term use. They may also purchase goods produced closer to where they live. Shorter transportation distances generally require less fuel, thereby reducing emissions associated with delivering products. Furthermore, consumers who favour businesses committed to environmentally responsible production can reinforce the demand for greener goods. Such purchasing decisions may gradually encourage other companies to reconsider their manufacturing practices.\n\nChanges in household behaviour can be equally beneficial. Energy-efficient appliances consume less electricity while providing similar levels of performance, allowing households to reduce both energy expenses and greenhouse gas emissions. Water conservation is another essential practice. Fixing leaking pipes, collecting rainwater, and avoiding unnecessary water use can prevent valuable resources from being wasted. Although the environmental contribution of each action may appear negligible when considered separately, their cumulative impact can be considerable when such practices are adopted by large numbers of households.\n\nNevertheless, individual willingness alone may not be sufficient to produce lasting changes in behaviour. Schools and community organizations can provide practical guidance on sustainable consumption, while public campaigns can demonstrate how ordinary choices affect the environment. Digital platforms can also distribute reliable information to large audiences and enable people to exchange experiences. By helping citizens become better informed, these educational efforts can encourage more responsible decisions and ultimately contribute to long-term environmental protection.",Q=[{"q": "Which of the following is NOT mentioned as a sustainable practice in the passage?", "options": ["Selecting products intended to remain useful for a longer period", "Obtaining goods produced relatively close to consumers", "Collecting rainwater instead of allowing it to go unused", "Replacing privately owned vehicles with public transportation"], "answer": 3, "explanation": "A = durable products; B = goods produced closer to where consumers live; C = collecting rainwater. Public transportation is not mentioned."}, {"q": "The word “reinforce” in paragraph 2 is OPPOSITE in meaning to ______.", "options": ["strengthen", "stimulate", "undermine", "maintain"], "answer": 2, "explanation": "reinforce = củng cố, làm mạnh hơn; undermine = làm suy yếu. Therefore, undermine is the opposite."}, {"q": "The word “their” in paragraph 3 refers to ______.", "options": ["similar levels of performance", "energy-efficient appliances", "households", "greenhouse gas emissions"], "answer": 2, "explanation": "The people/entities reducing energy expenses and emissions are households. Therefore, “their” refers to households."}, {"q": "The word “negligible” in paragraph 3 could best be replaced by ______.", "options": ["insignificant", "unavoidable", "noticeable", "beneficial"], "answer": 0, "explanation": "negligible = so small or unimportant that it is not worth considering ≈ insignificant."}, {"q": "Which of the following best paraphrases the underlined sentence in paragraph 1?", "options": ["While the environmental influence of one household may be limited, collective action by a large number of people can result in significant positive changes.", "Since individual households have little influence on the environment, meaningful improvements can only be achieved through government action.", "Environmental improvements become less significant when a large number of individuals adopt similar sustainable practices.", "Each household can create substantial environmental change independently, regardless of whether other people take similar action."], "answer": 0, "explanation": "A preserves the contrast: one household has limited influence, but collective action by many people can create substantial improvements."}, {"q": "Which of the following is TRUE according to the passage?", "options": ["Buying locally produced goods eliminates the environmental impact of transporting products.", "Energy-efficient appliances can reduce electricity consumption without necessarily reducing their level of performance.", "Sustainable behaviour can produce lasting environmental changes without education or public support.", "The environmental value of individual actions depends mainly on how expensive those actions are."], "answer": 1, "explanation": "Paragraph 3 states that energy-efficient appliances consume less electricity while providing similar levels of performance."}, {"q": "In which paragraph does the writer mention a present causal relationship between consumers' choices and changes in business behaviour?", "options": ["Paragraph 1", "Paragraph 2", "Paragraph 3", "Paragraph 4"], "answer": 1, "explanation": "Paragraph 2: consumers favour greener businesses → stronger demand for greener goods → other companies may reconsider manufacturing practices."}, {"q": "In which paragraph does the writer discuss several channels through which people can acquire knowledge and guidance about sustainable living?", "options": ["Paragraph 1", "Paragraph 2", "Paragraph 3", "Paragraph 4"], "answer": 3, "explanation": "Paragraph 4 mentions schools, community organizations, public campaigns, and digital platforms."}],L=["A","B","C","D"];let i=0,xp=0,life=5,combo=0,done=false,history=[],sound=true,ctx;
const $=x=>document.getElementById(x);
function tone(f,d=.1,type="sine",vol=.03,delay=0){if(!sound)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(659,.08,"triangle");tone(988,.13,"sine",.025,.07)} function bad(){tone(180,.15,"sawtooth");tone(120,.18,"square",.015,.09)}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Sound On":"🔇 Sound Off";if(sound)tone(740,.08)}
$("passage").innerHTML=passage.split("\n\n").map(x=>`<p>${x}</p>`).join("");
function render(){done=false;$("next").disabled=true;$("feedback").className="feedback";let q=Q[i];$("count").textContent=`${i+1}/${Q.length}`;$("xp").textContent=`⭐ ${xp} XP · ×${combo}`;$("life").textContent=`💖 ${life}`;$("bar").style.width=`${i/Q.length*100}%`;$("qtag").textContent=`Question ${i+1}`;$("question").textContent=q.q;$("options").innerHTML="";q.options.forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${o}`;b.onclick=()=>pick(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish ✨":"Next →"}
function pick(n,b){if(done)return;done=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],ok=n===q.answer;bs.forEach(x=>x.disabled=true);bs[q.answer].classList.add("correct");if(ok){xp+=10+combo*2;combo++;good();$("feedback").className="feedback ok show";$("feedback").innerHTML=`<b>✨ Correct — ${L[q.answer]}. ${q.options[q.answer]}</b><br>${q.explanation}`}else{life=Math.max(0,life-1);combo=0;b.classList.add("wrong");bad();$("feedback").className="feedback no show";$("feedback").innerHTML=`<b>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</b><br>${q.explanation}`}history.push({n,ok});$("xp").textContent=`⭐ ${xp} XP · ×${combo}`;$("life").textContent=`💖 ${life}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!done)return;if(i<Q.length-1){i++;tone(520,.06,"triangle",.018);render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.18,"triangle",.025,k*.09));let c=history.filter(x=>x.ok).length;$("final").textContent=`${c}/${Q.length} · ${xp} XP`;$("message").textContent=c===8?"Perfect! Your angel wings are shining!":c>=7?"Excellent reading comprehension!":c>=6?"Very good — review the missed clues below.":"Review the passage and try the mission again.";let h="<h3>📖 Mission Review</h3>";Q.forEach((q,k)=>{let a=history[k];h+=`<div class="item ${a.ok?"ok":"no"}"><b>Question ${k+1}: ${a.ok?"Correct":"Incorrect"}</b><br>Your answer: ${L[a.n]}. ${q.options[a.n]}<br>Correct: ${L[q.answer]}. ${q.options[q.answer]}<br><i>${q.explanation}</i></div>`});$("review").innerHTML=h}
$("restart").onclick=()=>location.reload();render();
</script></body></html>
