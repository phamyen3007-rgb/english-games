<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 11 - Unit 2 - Exercise 8 - Option C</title>
<style>
:root{
  --red:#ff5d73;--orange:#ff9f43;--yellow:#ffd93d;--green:#5fd37a;--blue:#53b7ff;
  --indigo:#6d76e8;--violet:#b56cff;--text:#3f3a56;--muted:#746f87;--panel:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 12% 16%,rgba(255,93,115,.13),transparent 24%),
    radial-gradient(circle at 88% 16%,rgba(83,183,255,.15),transparent 24%),
    linear-gradient(180deg,#eef8ff 0 62%,#f7fbff 62% 100%);
  padding:18px;overflow-x:hidden
}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:white;border-radius:999px;opacity:.9;filter:drop-shadow(0 8px 15px rgba(80,110,150,.08))}
.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}
.c1{width:120px;height:36px;left:6%;top:10%}.c1:before{width:52px;height:52px;left:18px;top:-24px}.c1:after{width:60px;height:60px;right:12px;top:-28px}
.c2{width:95px;height:30px;right:8%;top:17%}.c2:before{width:42px;height:42px;left:14px;top:-18px}.c2:after{width:48px;height:48px;right:8px;top:-22px}
.sparkle{position:absolute;font-size:24px;animation:float 6s ease-in-out infinite;opacity:.65}
.s1{left:10%;bottom:12%;color:var(--yellow)}.s2{right:12%;bottom:18%;color:var(--violet);animation-delay:2s}.s3{left:48%;top:6%;color:var(--blue);animation-delay:1s}
@keyframes float{50%{transform:translateY(-14px) rotate(12deg)}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.rainbow-icon{width:110px;height:110px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 10px 16px rgba(93,90,130,.16))}
.rainbow{
  width:92px;height:58px;border-radius:92px 92px 0 0;
  background:conic-gradient(from 180deg at 50% 100%,var(--red) 0 14%,var(--orange) 14% 28%,var(--yellow) 28% 42%,var(--green) 42% 56%,var(--blue) 56% 70%,var(--indigo) 70% 84%,var(--violet) 84% 100%);
  position:relative;overflow:hidden
}
.rainbow:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:34px;border-radius:70px 70px 0 0;background:#eef8ff}
.mini-cloud{position:absolute;bottom:22px;width:34px;height:18px;border-radius:999px;background:#fff;box-shadow:0 5px 12px rgba(80,90,120,.08)}
.mc1{left:4px}.mc2{right:4px}
h1{
  margin:0;font-size:clamp(28px,4vw,44px);
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{margin:7px 0 0;color:#667085;font-weight:700}
.sound{border:1px solid rgba(83,183,255,.35);background:white;color:#4d5c7a;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:rgba(255,255,255,.98);border:1px solid rgba(109,118,232,.18);border-radius:24px;box-shadow:0 24px 65px rgba(80,80,120,.14);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:linear-gradient(90deg,#fff4f5,#fff9e7,#effdf1,#eef8ff,#f6f0ff)}
.barbox{height:13px;background:#ececf5;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue),var(--violet));transition:.3s}
.chip{background:white;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(80,80,110,.08)}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#fbfdff;border:2px solid #dce9f5;border-radius:18px;padding:18px;max-height:560px;overflow:auto;line-height:1.75}
.passage h3{margin:0 0 10px;color:#5266a3}
.quizbox{background:linear-gradient(180deg,#fff,#fcfbff);border:2px solid #e4def3;border-radius:18px;padding:18px}
.tag{display:inline-block;background:linear-gradient(90deg,#ffe5e9,#fff2d8,#ecffe9,#e7f5ff,#f0e8ff);color:#57506e;padding:7px 12px;border-radius:10px;font-weight:900}
.question{font-size:23px;line-height:1.5;margin:16px 0}
.answer-input{width:100%;padding:14px 16px;border:2px solid #deddeb;border-radius:14px;font-size:18px;outline:none;background:white;color:var(--text)}
.answer-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(83,183,255,.12)}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.buttons{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}
.check{background:linear-gradient(90deg,#ffccd4,#ffe5ad,#c9f2d0,#c9e9ff,#decfff);color:#4a4660}
.next{background:linear-gradient(90deg,#cdeeff,#d8d6ff);color:#414b6d}
.btn:disabled{opacity:.4;cursor:not-allowed}
.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#fff;line-height:1.55}
.feedback.show{display:block}.feedback.correct{border-color:#43c779}.feedback.wrong{border-color:#ff6677}
.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}
.scorebig{font-size:58px;font-weight:1000;background:linear-gradient(90deg,var(--red),var(--orange),var(--green),var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.review{text-align:left;margin-top:24px;border-top:1px solid #e2e4ef;padding-top:16px}
.item{padding:12px 14px;background:#fbfcff;border-radius:12px;margin:9px 0;border-left:5px solid #aab2c5;line-height:1.5}
.item.ok{border-left-color:#43c779}.item.no{border-left-color:#ff6677}
@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}
@media(max-width:650px){.hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.rainbow-icon{transform:scale(.78);transform-origin:left center;width:85px}}
</style>
</head>
<body>
<div class="bg">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="sparkle s1">✦</div><div class="sparkle s2">✦</div><div class="sparkle s3">✧</div>
</div>

<main class="wrap">
<header class="hero">
  <div class="rainbow-icon">
    <div class="rainbow"></div><div class="mini-cloud mc1"></div><div class="mini-cloud mc2"></div>
  </div>
  <div>
    <h1>Rainbow Family Reading Quest</h1>
    <p class="subtitle">Grade 11 · Unit 2 · Exercise 8 · Option C</p>
  </div>
  <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
  <div class="status">
    <div class="barbox"><div class="bar" id="bar"></div></div>
    <div class="chip" id="counter"></div>
    <div class="chip" id="scoreChip"></div>
    <div class="chip" id="heartChip"></div>
  </div>

  <div class="main">
    <div class="passage">
      <h3>🌈 Respecting Differences in the Family</h3>
      <div id="passageText"></div>
    </div>

    <div class="quizbox">
      <div class="tag" id="tag"></div>
      <div class="question" id="question"></div>
      <input id="answerInput" class="answer-input" type="text" autocomplete="off" placeholder="Type your answer...">
      <div class="note">NO MORE THAN TWO WORDS from the text.</div>
      <div class="buttons">
        <button id="checkBtn" class="btn check">Check Answer 🌈</button>
        <button id="nextBtn" class="btn next" disabled>Next Question →</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
</div>

<div id="resultArea" class="result">
  <div style="font-size:74px">🌈✨</div>
  <h2>Rainbow Quest Complete!</h2>
  <div id="finalScore" class="scorebig"></div>
  <p id="message"></p>
  <button id="restartBtn" class="btn check">Play Again ↻</button>
  <div id="review" class="review"></div>
</div>
</section>
</main>

<script>
const passage = "No two people in a family are exactly the same. Parents and teenagers often have different hobbies, opinions, and ways of solving problems. These differences may sometimes lead to arguments, but they can also help family members understand each other better if everyone is willing to communicate.\n\nOne important way to reduce family conflicts is to listen with patience. Instead of interrupting or judging each other, family members should try to understand different points of view. Teenagers should explain their ideas calmly, while parents should avoid making decisions without discussing them first.\n\nAnother useful habit is sharing household responsibilities. When everyone contributes to family life, children learn valuable life skills and become more responsible. Working together also creates a stronger sense of teamwork and respect within the family.\n\nMost importantly, family members should appreciate each other's efforts. A simple \"thank you\" or a few encouraging words can make someone feel valued and improve relationships. Building a happy family takes time, but mutual respect and honest communication can make a big difference.";
const questions = [{"q": "Different hobbies and opinions may sometimes lead to ____________.", "answer": "arguments", "explanation": "The passage says: “These differences may sometimes lead to arguments.”"}, {"q": "Family members should listen with ____________ to reduce conflicts.", "answer": "patience", "explanation": "The passage says one important way to reduce family conflicts is to listen with patience."}, {"q": "Parents should avoid making decisions without ____________ them first.", "answer": "discussing", "explanation": "The passage says parents should avoid making decisions without discussing them first."}, {"q": "Sharing household responsibilities helps children become more ____________.", "answer": "responsible", "explanation": "The passage says children learn valuable life skills and become more responsible."}, {"q": "Saying “thank you” can make family members feel ____________.", "answer": "valued", "explanation": "The passage says a simple “thank you” can make someone feel valued."}];

let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq,duration=.1,type="sine",volume=.04,delay=0){
  if(!soundOn)return;
  const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,s);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(volume,s+.01);
  g.gain.exponentialRampToValueAtTime(.0001,s+duration);
  o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03);
}
function correctSound(){tone(660,.08,"sine",.035);tone(880,.1,"triangle",.035,.08);tone(1175,.14,"sine",.03,.17)}
function wrongSound(){tone(180,.16,"sawtooth",.035);tone(115,.22,"square",.02,.11)}
function nextSound(){tone(500,.06,"triangle",.018);tone(760,.07,"triangle",.016,.06)}
function finishSound(){[523,659,784,988,1175].forEach((f,i)=>tone(f,.17,"triangle",.028,i*.09))}

$("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
  if(soundOn)nextSound();
};

function normalize(s){
  return s.toLowerCase().trim().replace(/[.,!?;:'"]/g,"").replace(/\s+/g," ");
}
function wordCount(s){
  return normalize(s).split(" ").filter(Boolean).length;
}

function render(){
  answered=false;
  $("answerInput").disabled=false;
  $("answerInput").value="";
  $("checkBtn").disabled=false;
  $("nextBtn").disabled=true;
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  const q=questions[current];

  $("tag").textContent=`Question ${current+1}`;
  $("question").textContent=q.q;
  $("counter").textContent=`Câu ${current+1}/${questions.length}`;
  $("scoreChip").textContent=`🌈 ${score} XP · Combo ${combo}`;
  $("heartChip").textContent=`❤️ ${hearts}`;
  $("bar").style.width=`${current/questions.length*100}%`;
  $("nextBtn").textContent=current===questions.length-1?"Finish Rainbow 🌈":"Next Question →";
  $("answerInput").focus();
}

function checkAnswer(){
  if(answered)return;
  const raw=$("answerInput").value.trim();
  if(!raw)return;

  answered=true;
  const q=questions[current];
  const tooLong=wordCount(raw)>2;
  const correct=!tooLong && normalize(raw)===normalize(q.answer);

  $("answerInput").disabled=true;
  $("checkBtn").disabled=true;
  $("nextBtn").disabled=false;

  if(correct){
    score+=10+combo*2;
    combo++;
    $("feedback").className="feedback correct show";
    $("feedback").innerHTML=`<strong>🌈 Chính xác!</strong>Đáp án: ${q.answer}<br>${q.explanation}`;
    correctSound();
  }else{
    hearts=Math.max(0,hearts-1);
    combo=0;
    $("feedback").className="feedback wrong show";
    $("feedback").innerHTML=`<strong>Chưa đúng. Đáp án: ${q.answer}</strong>${tooLong?"Câu trả lời vượt quá TWO WORDS.<br>":""}${q.explanation}`;
    wrongSound();
  }

  answers.push({given:raw,correct});
  $("scoreChip").textContent=`🌈 ${score} XP · Combo ${combo}`;
  $("heartChip").textContent=`❤️ ${hearts}`;
  $("bar").style.width=`${(current+1)/questions.length*100}%`;
}

$("checkBtn").onclick=checkAnswer;
$("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});

$("nextBtn").onclick=()=>{
  if(!answered)return;
  nextSound();
  if(current<questions.length-1){current++;render();}
  else showResult();
};

function showResult(){
  $("quizArea").style.display="none";
  $("resultArea").classList.add("show");

  const correctCount=answers.filter(a=>a.correct).length;
  $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
  finishSound();

  if(correctCount===5) $("message").textContent="Perfect Rainbow Reader! Em đã hoàn thành toàn bộ thử thách.";
  else if(correctCount>=4) $("message").textContent="Excellent reading! Em đã xác định thông tin rất tốt.";
  else if(correctCount>=3) $("message").textContent="Good job! Hãy xem lại những câu chưa đúng.";
  else $("message").textContent="Hãy đọc lại đoạn văn và thử thêm một lần nữa nhé.";

  let html="<h3>🌈 Rainbow Review</h3>";
  questions.forEach((q,i)=>{
    const a=answers[i];
    html+=`<div class="item ${a&&a.correct?"ok":"no"}"><strong>Câu ${i+1}: ${a&&a.correct?"Đúng":"Sai"}</strong><br>Em trả lời: ${a?a.given:"Chưa trả lời"}<br>Đáp án đúng: ${q.answer}<br><em>${q.explanation}</em></div>`;
  });
  $("review").innerHTML=html;
}

$("restartBtn").onclick=()=>{
  current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
  $("resultArea").classList.remove("show");
  $("quizArea").style.display="block";
  render();nextSound();
};

$("passageText").innerHTML=passage.split("\n\n").map(p=>`<p>${p}</p>`).join("");
render();
</script>
</body>
</html>
