<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 12 - Unit 4 - Exercise 5 - Option D</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#17304a;background:linear-gradient(180deg,#c8efff 0%,#e9f9ff 43%,#d7f3e4 43%,#b9e0c5 100%);padding:22px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49%,rgba(255,255,255,.22) 50%,transparent 51%);background-size:90px 100%;opacity:.35}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;font-size:70px;opacity:.55;animation:float 18s linear infinite}.c1{top:4%;left:-10%}.c2{top:24%;left:-20%;animation-delay:7s}.c3{top:67%;left:-15%;animation-delay:12s}
@keyframes float{to{transform:translateX(125vw)}}
.wrap{max-width:1180px;margin:auto;position:relative}
.hero{background:linear-gradient(120deg,#126c88,#178aa1,#47a979);border:4px solid #fff;border-bottom:0;border-radius:28px 28px 0 0;color:#fff;padding:24px 28px;box-shadow:0 18px 45px #17435b38}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;gap:18px;align-items:center}.icon{font-size:66px}
h1{margin:0;font-size:clamp(27px,4vw,42px);color:#fff7c2;text-shadow:0 3px #126076}.sub{margin-top:7px;font-weight:900}
.sound{border:2px solid #fff;background:#fff;color:#17677f;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer}
.game{background:#f7fdff;border:4px solid #fff;border-top:0;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 20px 50px #17435b30}
.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 20px;background:#d8f2f5;border-bottom:1px solid #acdce3}
.track{height:14px;background:#b5d7dc;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#0c7b9a,#51b56f);transition:.3s}
.pill{background:#fff;border:2px solid #9dd4da;border-radius:99px;padding:8px 13px;font-weight:900}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.reading{background:#fff;border:2px solid #8ac9d2;border-radius:20px;padding:22px;line-height:1.72;max-height:690px;overflow:auto;box-shadow:inset 0 0 0 6px #e8f8f9}
.reading h2{margin-top:0;color:#126c88}.reading strong{color:#13864e}
.quiz{background:#fff;border:2px solid #8ac9d2;border-radius:20px;padding:22px;position:relative}
.badge{display:inline-block;background:linear-gradient(90deg,#126c88,#36a66d);color:#fff;border-radius:10px;padding:8px 13px;font-weight:900}
.q{font-size:20px;line-height:1.5;margin:18px 0}.answers{display:grid;gap:11px}
.ans{border:2px solid #c8dfe3;background:#fafdff;border-radius:13px;padding:14px;text-align:left;font-size:16px;color:#17304a;cursor:pointer;transition:.15s}
.ans:hover:not(:disabled){transform:translateX(4px);border-color:#3aa2b2;background:#f0fcff}
.ans.correct{background:#e9ffef;border-color:#2eaa61}.ans.wrong{background:#fff0f2;border-color:#d34f62}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.feedback.good{display:block;background:#e9ffef;border-left:5px solid #2eaa61}.feedback.bad{display:block;background:#fff0f2;border-left:5px solid #d34f62}
.controls{text-align:right;margin-top:14px}.next{display:none;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(90deg,#126c88,#39a66d);color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#f7fdff;border:4px solid #fff;border-radius:28px;padding:35px;text-align:center;box-shadow:0 20px 50px #17435b30}.result.show{display:block}.scoreBig{font-size:62px;font-weight:1000;color:#126c88}
.review{text-align:left;margin-top:25px}.reviewItem{padding:14px;margin:10px 0;border-radius:12px;background:#e8f4f5;border-left:5px solid #2993a8}.reviewItem.ok{border-color:#2eaa61}.reviewItem.no{border-color:#d34f62}
.restart{border:0;border-radius:12px;padding:13px 23px;background:#126c88;color:#fff;font-weight:900;cursor:pointer}
.city{position:fixed;bottom:-12px;left:0;right:0;font-size:75px;letter-spacing:5px;opacity:.12;white-space:nowrap;pointer-events:none}
@media(max-width:900px){.main{grid-template-columns:1fr}.reading{max-height:430px}}
@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="sky"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">☁️</div></div>
<div class="city">🏢🏙️🏢🌳🏘️🏙️🌳🏢🏘️🏙️🏢</div>
<div class="wrap">
<header class="hero"><div class="top"><div class="brand"><div class="icon">🏙️🌱</div><div><h1>Future City Builder</h1><div class="sub">Grade 12 - Unit 4 - Exercise 5 - Option D</div></div></div><button id="sound" class="sound">🔊 Sound On</button></div></header>
<section id="game" class="game">
<div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill">🏗️ Score <span id="score">0</span>/6</div><div class="pill">⚡ Streak <span id="streak">0</span></div></div>
<div class="main"><article id="reading" class="reading"></article><section class="quiz"><div id="tag" class="badge"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="next" class="next">NEXT →</button></div></section></div>
</section>
<section id="result" class="result"><div style="font-size:78px">🏙️🌳🏆</div><h2>Future City Completed!</h2><div id="final" class="scoreBig"></div><p id="message"></p><button class="restart" onclick="location.reload()">BUILD AGAIN ↻</button><div id="review" class="review"></div></section>
</div>
<script>
const Q=[{"q": "In many rapidly developing regions, urban populations (1) ______ considerably before local authorities have had sufficient time to upgrade transport networks, housing, and public facilities.", "o": ["have been expanding", "had expanded", "are expanding", "have expanded"], "a": 3, "e": "<b>Have expanded</b> is the best choice. The Present Perfect links the population growth to the present and matches <b>have had</b>. Here, <i>considerably</i> focuses on the extent of change already achieved."}, {"q": "A shortage of reasonably priced accommodation can leave low-income households struggling to (2) ______ ends meet.", "o": ["bring", "make", "get", "hold"], "a": 1, "e": "The fixed expression is <b>make ends meet</b> = manage to pay for basic living expenses."}, {"q": "Uncontrolled construction can (3) ______ the loss of natural habitats.", "o": ["accelerate", "enlarge", "strengthen", "expand"], "a": 0, "e": "<b>Accelerate the loss of...</b> means make the process of loss happen faster. It is a natural academic collocation."}, {"q": "These pressures are particularly serious in densely populated areas, (4) ______ limited green space makes it more difficult for cities to cope with extreme heat.", "o": ["which", "that", "where", "when"], "a": 2, "e": "<b>Where</b> refers to the place <i>densely populated areas</i>. It can be understood as <b>in which</b>."}, {"q": "Governments should (5) ______ provisions for future population growth when designing infrastructure and allocating resources.", "o": ["do", "take", "put", "make"], "a": 3, "e": "The correct collocation is <b>make provision/provisions for something</b> = plan or prepare for a future need or situation."}, {"q": "The benefits of urban development are not achieved at the (6) ______ of residents' long-term well-being.", "o": ["loss", "expense", "sacrifice", "price"], "a": 1, "e": "The fixed expression is <b>at the expense of</b> = by causing harm or disadvantage to something else. Option D is <i>price</i> in this official version so that only one answer is clearly correct."}],PASSAGE="\n<h2>When Urban Growth Outstrips Planning</h2>\n<p>Urbanisation is often associated with greater economic opportunities and improved access to essential services. Yet the speed at which cities expand can determine whether these benefits are shared widely. In many rapidly developing regions, urban populations <strong>(1) ______</strong> considerably before local authorities have had sufficient time to upgrade transport networks, housing, and public facilities. As a result, infrastructure originally designed for much smaller populations may become severely overstretched.</p>\n\n<p>Housing is particularly vulnerable to such rapid change. A shortage of reasonably priced accommodation can leave low-income households struggling to <strong>(2) ______</strong> ends meet, especially when wages fail to rise as quickly as rents. In some cases, residents are pushed towards informal settlements where basic services such as clean water and sanitation remain inadequate.</p>\n\n<p>The environmental consequences are equally significant. Uncontrolled construction can <strong>(3) ______</strong> the loss of natural habitats, while increasing traffic volumes contribute to both air pollution and carbon emissions. These pressures are particularly serious in densely populated areas, <strong>(4) ______</strong> limited green space makes it more difficult for cities to cope with extreme heat.</p>\n\n<p>Effective urban planning therefore requires authorities to look beyond short-term economic gains. Rather than responding to problems only after they arise, governments should <strong>(5) ______</strong> provisions for future population growth when designing infrastructure and allocating resources. Such an approach can make cities more resilient and ensure that the benefits of urban development are not achieved at the <strong>(6) ______</strong> of residents' long-term well-being.</p>\n",L=["A","B","C","D"];
let i=0,score=0,streak=0,answered=false,history=[],soundOn=true,audioCtx;
const $=x=>document.getElementById(x);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.045,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(660,.08);tone(850,.1,.07);tone(1080,.12,.14)}function bad(){tone(175,.2)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tone(460,.06)}
function render(){answered=false;let x=Q[i];$("tag").textContent="City District "+(i+1)+" / "+Q.length;$("question").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH CITY →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;let x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("correct");let ok=n===x.a;if(ok){score++;streak++;$("feedback").className="feedback good";$("feedback").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("feedback").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";history.push({n,ok});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tone(470,.05);if(i<Q.length-1){i++;render()}else finish()}
function finish(){$("game").style.display="none";$("result").classList.add("show");[523,659,784,1047].forEach((f,k)=>tone(f,.13,k*.08));let pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("message").textContent=pct===100?"Perfect planning! Your future city is thriving.":pct>=80?"Excellent work! Your city is ready for sustainable growth.":pct>=60?"Good work. Review the districts that need better planning.":"Review the explanations and rebuild your city.";let h="<h3>🏗️ City Planning Review</h3>";Q.forEach((x,k)=>{let a=history[k];h+='<div class="reviewItem '+(a.ok?"ok":"no")+'"><b>Question '+(k+1)+' — '+(a.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[a.n]+'. '+x.o[a.n]+'<br>Correct: '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'</div>'});$("review").innerHTML=h}
$("reading").innerHTML=PASSAGE;render();
</script>
</body></html>
