<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 3 - Exercise 1 (41-60) - Option B</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#173f52;
background:radial-gradient(circle at 15% 15%,rgba(255,220,80,.28),transparent 20%),
radial-gradient(circle at 85% 18%,rgba(100,215,255,.28),transparent 22%),
linear-gradient(145deg,#0d6b8c,#31a8c7 52%,#91dce5)}
.wrap{width:min(940px,94%);margin:26px auto}
.card{background:rgba(249,254,255,.97);border:1px solid #b9dfea;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px rgba(7,82,126,.22)}
.head{padding:24px;text-align:center;background:linear-gradient(100deg,#ffd34e,#4ab0d4)}
.head h1{margin:0;color:#073e5b;font-size:clamp(23px,4vw,36px)}
.head p{margin:8px 0 0;color:#20576f;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:#eefaff}
.stat{background:#fff;border:1px solid #c8e7f1;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;color:#0b4865}.stat span{font-size:11px;font-weight:800;color:#67808c}
.main{padding:22px}.progress{height:10px;background:#dceef4;border-radius:20px;overflow:hidden;margin-bottom:22px}
#bar{height:100%;background:linear-gradient(90deg,#23a6ce,#ffd24e);transition:.3s}
.q{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:18px;color:#0d4864}
.answers{display:grid;gap:12px}
.ans{padding:15px;text-align:left;font-size:17px;border-radius:14px;border:1px solid #bcdfea;background:#fbfeff;color:#173f52;cursor:pointer;transition:.18s}
.ans:hover{transform:translateY(-1px);background:#eaf9fd}.ans.ok{background:#d9f8e6;border-color:#39c77a;color:#096039}.ans.bad{background:#ffe0e0;border-color:#ef7474;color:#8a2424}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:14px;background:#eefaff;border:1px solid #bcdfea;line-height:1.6;color:#173f52}
.feedback.show{display:block}
.next{display:none;width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#168fb9,#e4aa16);color:white;font-weight:900;font-size:17px;cursor:pointer}
.next.show{display:block}.summary{display:none;text-align:center;padding:35px;color:#17465a}.summary.show{display:block}.summary h2{font-size:32px;color:#08779f}
.restart{padding:14px 22px;border:0;border-radius:14px;background:#168fb9;color:white;font-weight:900;cursor:pointer}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.main{padding:15px}.q{font-size:18px}.ans{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="head"><h1>GRADE 10 • UNIT 3 • EXERCISE 1</h1><p>(41–60) • OPTION B • MUSIC CHALLENGE</p></div>
<div class="stats">
<div class="stat"><b id="counter">1/15</b><span>QUESTION</span></div>
<div class="stat"><b id="heart">❤️❤️❤️❤️❤️</b><span>HEARTS</span></div>
<div class="stat"><b id="xp">0</b><span>XP</span></div>
<div class="stat"><b id="combo">0</b><span>COMBO</span></div>
</div>
<div class="main" id="game">
<div class="progress"><div id="bar"></div></div>
<div class="q" id="q"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">NEXT →</button>
</div>
<div class="summary" id="summary"><div style="font-size:55px">🎶🏆</div><h2>HOÀN THÀNH!</h2><p id="sum"></p><button class="restart" onclick="restart()">CHƠI LẠI</button></div>
</div></div>
<script>
const data = [
{q:"The festival gives students a valuable opportunity to _________ traditional music from different regions of the country.",options:["A. experience","B. perform","C. prepare","D. attract"],correct:0,explain:"“experience traditional music/culture” = trải nghiệm, tìm hiểu trực tiếp âm nhạc/văn hóa truyền thống."},
{q:"The event was designed to _________ young people’s interest in traditional forms of music.",options:["A. hesitate","B. raise","C. perform","D. prepare"],correct:1,explain:"“raise interest/awareness” = làm tăng sự quan tâm/nhận thức."},
{q:"Each group wore carefully designed _________ that represented the culture of their hometown.",options:["A. costumes","B. stages","C. instruments","D. audiences"],correct:0,explain:"“wear costumes” = mặc trang phục. Ngữ cảnh cho thấy trang phục đại diện cho văn hóa quê hương."},
{q:"The singer’s unusual combination of folk and modern music made her performance especially _________.",options:["A. ordinary","B. creative","C. limited","D. hesitant"],correct:1,explain:"“creative performance” = màn trình diễn sáng tạo. Sự kết hợp nhạc dân gian và hiện đại cho thấy tính sáng tạo."},
{q:"The performers spent several hours _________ the stage before the opening ceremony began.",options:["A. attracting","B. preparing","C. decorating","D. presenting"],correct:2,explain:"“decorate the stage” = trang trí sân khấu. Sau “spend time” dùng V-ing."},
{q:"The competition aims _________ talented young musicians from different parts of the country.",options:["A. at discovering","B. discover","C. to discovering","D. discovered"],correct:0,explain:"Cấu trúc đúng là “aim at + V-ing”, nên “aims at discovering” là đúng."},
{q:"Fans were disappointed because the remaining tickets had already been _________ by the time they reached the ticket office.",options:["A. taken up","B. sold out","C. checked in","D. brought back"],correct:1,explain:"“tickets are sold out” = vé đã bán hết."},
{q:"The band’s sudden rise in _________ came after one of their songs became popular on social media.",options:["A. hesitation","B. preparation","C. popularity","D. judgement"],correct:2,explain:"“a rise in popularity” = sự gia tăng độ nổi tiếng."},
{q:"If you are interested in performing, don’t _________ to register for the school music contest.",options:["A. hesitate","B. decide","C. prepare","D. compete"],correct:0,explain:"“Don’t hesitate to + V” = đừng ngần ngại làm gì."},
{q:"After thinking carefully about the risks, she finally _________ to take part in the national singing competition.",options:["A. prepared","B. hesitated","C. decided","D. performed"],correct:2,explain:"“decide to do something” = quyết định làm gì."},
{q:"The young musician received considerable _________ for combining traditional instruments with electronic music.",options:["A. praise","B. popularity","C. hesitation","D. preparation"],correct:0,explain:"“receive praise for + V-ing” = nhận được lời khen vì làm gì."},
{q:"The contestants were given only one week to _________ for the live semi-final.",options:["A. decide","B. prepare","C. hesitate","D. attract"],correct:1,explain:"“prepare for + noun/event” = chuẩn bị cho một sự kiện."},
{q:"Careful _________ was essential because the band had never performed in front of such a large audience before.",options:["A. popularity","B. hesitation","C. preparation","D. attraction"],correct:2,explain:"Sau “careful” cần danh từ. “careful preparation” = sự chuẩn bị kỹ lưỡng."},
{q:"Although he cannot play any musical instruments, he has very good _________ and can recognize many different styles of music.",options:["A. musical talent","B. taste in music","C. stage performance","D. cultural identity"],correct:1,explain:"“have good taste in music” = có gu âm nhạc tốt."},
{q:"The singer briefly introduced the story behind the song before _________ it for the audience.",options:["A. preparing","B. composing","C. performing","D. attracting"],correct:2,explain:"“perform a song” = biểu diễn/trình bày một bài hát. Sau “before” có thể dùng V-ing khi cùng chủ ngữ."}
];

const bonusQuestions=new Set([3,6,9,12]);
let current=0,hearts=5,xp=0,combo=0,wrong=0,locked=false;
let bonusGiven=new Set();
const $=id=>document.getElementById(id);

function updateStats(){
 $("counter").textContent=(current+1)+"/"+data.length;
 $("heart").textContent="❤️".repeat(hearts)+"🖤".repeat(Math.max(0,5-hearts));
 $("xp").textContent=xp;
 $("combo").textContent=combo;
 $("bar").style.width=(current/data.length*100)+"%";
}
function render(){
 locked=false;updateStats();
 const item=data[current];
 $("q").textContent="Question "+(current+1)+". "+item.q;
 $("answers").innerHTML="";
 $("feedback").className="feedback";
 $("feedback").textContent="";
 $("next").className="next";
 item.options.forEach((opt,index)=>{
   const btn=document.createElement("button");
   btn.className="ans";
   btn.textContent=opt;
   btn.onclick=()=>choose(index,btn);
   $("answers").appendChild(btn);
 });
}
function choose(index,btn){
 if(locked)return;
 const item=data[current];
 if(index===item.correct){
   locked=true;btn.classList.add("ok");
   [...$("answers").children].forEach(b=>b.disabled=true);
   combo++;
   let gain=combo>=3?20:combo>=2?15:10;
   xp+=gain;
   let bonusText="";
   const qNo=current+1;
   if(bonusQuestions.has(qNo)&&!bonusGiven.has(qNo)){
     bonusGiven.add(qNo);
     if(hearts<5){hearts++;bonusText="<br>💖 <strong>Bonus +1 tim!</strong>";}
     else{bonusText="<br>💖 <strong>Câu bonus! Tim đang đầy 5/5.</strong>";}
   }
   $("feedback").innerHTML="✅ <strong>Chính xác!</strong><br>"+item.explain+bonusText+"<br><strong>+"+gain+" XP</strong>";
   $("feedback").classList.add("show");
   updateStats();
   $("next").classList.add("show");
   $("next").textContent=current===data.length-1?"XEM KẾT QUẢ →":"NEXT →";
 }else{
   btn.classList.add("bad");btn.disabled=true;
   hearts--;wrong++;combo=0;updateStats();
   $("feedback").innerHTML="❌ <strong>Chưa đúng.</strong> Em hãy chọn lại. Chỉ được qua câu khi chọn đúng.";
   $("feedback").classList.add("show");
   if(hearts<=0){
     setTimeout(()=>{alert("💔 Hết 5 trái tim! Em phải làm lại từ câu 1.");restart();},300);
     return;
   }
   setTimeout(()=>{btn.classList.remove("bad");btn.disabled=false;},500);
 }
}
$("next").onclick=()=>{if(current<data.length-1){current++;render();}else finish();};
function finish(){
 $("bar").style.width="100%";
 $("game").style.display="none";
 $("summary").classList.add("show");
 $("sum").innerHTML="Em đã hoàn thành <strong>"+data.length+" câu</strong>.<br>XP: <strong>"+xp+"</strong> • Số lần chọn sai: <strong>"+wrong+"</strong><br>🎉 Great job!";
}
function restart(){
 current=0;hearts=5;xp=0;combo=0;wrong=0;locked=false;bonusGiven=new Set();
 $("summary").classList.remove("show");
 $("game").style.display="block";
 render();
}
render();
</script>
</body>
</html>
