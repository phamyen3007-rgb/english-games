<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 1 (100-132) - Option C</title>
<style>
:root{--bg:#06110d;--panel:#0f2a20;--panel2:#164132;--lime:#9be564;--green:#42cf78;--teal:#3ed8b5;--yellow:#f4d35e;--red:#ff6677;--text:#f3fff7;--muted:#b8d8c7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 18%,rgba(155,229,100,.14),transparent 25%),radial-gradient(circle at 85% 15%,rgba(62,216,181,.12),transparent 26%),linear-gradient(180deg,#030b08,#082018 58%,#020806);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snake{position:absolute;font-size:42px;animation:crawl linear infinite}.s1{left:-70px;top:18%;animation-duration:18s}.s2{left:-90px;top:38%;animation-duration:24s;animation-delay:4s}@keyframes crawl{to{transform:translateX(115vw) rotate(20deg)}}
.wrap{width:min(1040px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.icon{width:108px;height:108px;position:relative;display:grid;place-items:center}
.glow{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle,rgba(155,229,100,.28),rgba(62,216,181,.08) 58%,transparent 72%);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.snake-head{width:76px;height:58px;border-radius:34px;background:linear-gradient(180deg,#8fdc63,#3a9f58);position:relative;box-shadow:0 0 20px rgba(155,229,100,.25)}
.eye{position:absolute;top:15px;width:12px;height:12px;border-radius:50%;background:#fff}.eye:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#111}.eye.l{left:17px}.eye.r{right:17px}
.tongue{position:absolute;left:50%;bottom:-18px;width:2px;height:18px;background:#ff5a78}.tongue:after{content:"";position:absolute;bottom:-2px;left:-4px;width:10px;height:2px;background:#ff5a78}
h1{margin:0;font-size:clamp(28px,4vw,46px);background:linear-gradient(90deg,#eaffd8,var(--lime),var(--teal),#8ee3b4);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:var(--muted);font-weight:700}
.sound{border:1px solid rgba(155,229,100,.4);background:#12352d;color:#fff;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(155,229,100,.24);border-radius:24px;box-shadow:0 24px 65px rgba(0,0,0,.52);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:18px 22px 13px;background:#0a251d}
.barbox{height:13px;background:#05130f;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green),var(--teal));transition:.3s}
.chip{background:#173f34;border-radius:999px;padding:8px 13px;font-weight:900;white-space:nowrap}
.content{padding:24px 22px 26px}.tag{display:inline-block;padding:7px 13px;border-radius:9px;background:rgba(155,229,100,.08);border:1px solid rgba(155,229,100,.38);color:#caff9e;font-weight:900;margin-bottom:13px}
.question{margin:0 0 22px;font-size:clamp(22px,2.8vw,31px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{min-height:72px;border-radius:15px;border:1px solid rgba(180,255,200,.15);background:linear-gradient(135deg,#18473b,#0d2d25);color:#fff;display:flex;align-items:center;gap:13px;padding:16px 17px;font-size:18px;text-align:left;cursor:pointer}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--lime)}.letter{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;font-weight:1000;color:#0b2119;background:linear-gradient(135deg,var(--lime),#bdf0a5)}
.correct{background:#14563c!important;border-color:var(--green)!important}.wrong{background:#681f35!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:15px;background:#0b251e;border-left:5px solid;line-height:1.6}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--yellow)}
.details{margin-top:9px;color:#c9e3d5;font-size:15px}.controls{display:flex;justify-content:flex-end;margin-top:20px}
.action{border:0;border-radius:12px;padding:13px 23px;font-size:17px;font-weight:1000;color:#0c2119;cursor:pointer;background:linear-gradient(90deg,var(--lime),#a7ebca)}.action:disabled{opacity:.35}
.result{display:none;text-align:center;padding:38px 24px}.result.show{display:block}.score-big{font-size:62px;font-weight:1000;color:var(--lime)}
.review{text-align:left;margin-top:25px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}.item{padding:13px 14px;margin-bottom:10px;border-radius:12px;background:#0b251e;border-left:5px solid #66877a;line-height:1.5}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:760px){.hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.options{grid-template-columns:1fr}.content{padding:18px 15px 22px}}
</style>
</head>
<body>
<div class="bg"><div class="snake s1">🐍</div><div class="snake s2">🐍</div></div>
<main class="wrap">
<header class="hero"><div class="icon"><div class="glow"></div><div class="snake-head"><div class="eye l"></div><div class="eye r"></div><div class="tongue"></div></div></div><div><h1>Snakes Learning Quest</h1><p class="subtitle">Grade 10 · Unit 2 · Exercise 1 (100–132) · Option C</p></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></header>
<section class="card">
<div id="quiz"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="content"><div class="tag" id="tag"></div><h2 class="question" id="q"></h2><div class="options" id="ops"></div><div class="feedback" id="fb"></div><div class="controls"><button class="action" id="next" disabled>Next Slither 🐍</button></div></div></div>
<div class="result" id="result"><div style="font-size:74px" id="icon">🐍</div><h2>Snake Quest Complete</h2><div class="score-big" id="final"></div><p id="msg"></p><button class="action" id="restart">Slither Again ↻</button><div class="review" id="review"></div></div>
</section></main>
<script>
const Q=[["Many factories are expected to ____________ cleaner technology over the next five years.", ["damage", "attract", "adopt", "collect"], 2, "Adopt technology = áp dụng công nghệ.", ""], ["The weather forecast says temperatures will continue to ____________ this weekend.", ["raise", "rise", "destroy", "damage"], 1, "Rise là nội động từ, nghĩa là tăng lên.", "Raise là ngoại động từ, nghĩa là nâng cái gì lên."], ["By this time next month, over 2,000 trees ____________ in our city.", ["will plant", "will have planted", "will be planted", "are planting"], 2, "Dùng tương lai bị động: will be planted.", ""], ["Plastic waste in the oceans seriously ____________ sea animals every year.", ["harms", "sorts", "reminds", "adopts"], 0, "Harm sea animals = gây hại sinh vật biển.", ""], ["The city has already decided to build more bicycle lanes. It ____________ transport greener.", ["will make", "is making", "has made", "made"], 0, "Quyết định đã có và kết quả ở tương lai nên dùng will make.", ""], ["Students should be encouraged to ____________ part in environmental projects.", ["do", "make", "take", "give"], 2, "Take part in = tham gia.", ""], ["Several new recycling stations ____________ in our neighborhood at the moment.", ["are installing", "are being installed", "install", "have installed"], 1, "Dùng hiện tại tiếp diễn bị động: are being installed.", ""], ["The school hopes to ____________ students' awareness of climate change.", ["rise", "attract", "raise", "grow"], 2, "Raise awareness = nâng cao nhận thức.", ""], ["This reusable bottle is made ____________ recycled plastic.", ["in", "from", "by", "at"], 1, "Be made from dùng khi nguyên liệu đã qua chế biến.", ""], ["Don't forget ____________ your phone charger before leaving home.", ["taking", "take", "to take", "took"], 2, "Forget/Remember to V.", ""], ["Look at those waves! The boat ____________ into the rocks.", ["crashes", "is going to crash", "will crashing", "crashed"], 1, "Có dấu hiệu rõ ràng nên dùng be going to.", ""], ["The new science museum has become one of the city's most popular tourist ____________.", ["attractions", "achievements", "announcements", "emissions"], 0, "Tourist attraction = điểm tham quan.", ""], ["If everyone recycled more, we ____________ much less waste.", ["produce", "produced", "will produce", "would produce"], 3, "Câu điều kiện loại 2: If + Past Simple, ... would + V.", ""], ["The volunteers managed to ____________ over five million dong for poor children.", ["adopt", "collect", "raise", "damage"], 2, "Raise money = gây quỹ.", "Collect money = thu tiền; trong ngữ cảnh từ thiện, raise tự nhiên hơn."], ["The old batteries should never be thrown away because they contain ____________ chemicals.", ["harmful", "refillable", "compulsory", "sustainable"], 0, "Harmful chemicals = hóa chất độc hại.", ""]],L=["A","B","C","D"];let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null;const $=x=>document.getElementById(x);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine",v=.04){if(!on)return;let c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}
function ok(){tone(620,.08);setTimeout(()=>tone(920,.13,"triangle"),90)}function bad(){tone(160,.18,"sawtooth");setTimeout(()=>tone(90,.2,"square"),100)}function go(){tone(420,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(on)go()};
function show(){a=false;$("next").disabled=true;$("fb").className="feedback";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🐍 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((x,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${L[n]}</span><span>${x}</span>`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Snake 🐍":"Next Slither 🐍"}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+c*2;c++;b.classList.add("correct");$("fb").className="feedback correct show";ok()}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");$("fb").className="feedback wrong show";bad()}$("fb").innerHTML=`<strong>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</strong><br>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;ans.push({n,right});$("score").textContent=`🐍 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
function result(){$("quiz").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct>=12?"Excellent Snake Master!":"Hãy xem lại các câu sai để tiến bộ hơn.";let r="<h3>Snakes Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}:</b> ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`});$("review").innerHTML=r}
$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};$("restart").onclick=()=>location.reload();show();
</script></body></html>
