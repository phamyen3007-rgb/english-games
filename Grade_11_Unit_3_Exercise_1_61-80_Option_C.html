<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (61-80) - Option C</title>
<style>
*{box-sizing:border-box}
:root{
 --ink:#132a1f;--leaf:#1e7b50;--leaf2:#4fa36f;--cream:#fffdf4;
 --honey:#f2c45c;--red:#d95663;--green:#3ea568;--sky:#bfe9d1;
}
body{
 margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:var(--ink);
 background:
 radial-gradient(circle at 12% 14%,rgba(255,255,255,.75),transparent 14%),
 radial-gradient(circle at 88% 12%,rgba(242,196,92,.28),transparent 18%),
 linear-gradient(145deg,#cfead7,#eff7d8 48%,#f8e8b4);
}
.wrap{max-width:1120px;margin:auto}
.hero{
 position:relative;overflow:hidden;
 background:linear-gradient(120deg,#164a35,#1e7b50 58%,#7d8f43);
 color:white;border-radius:30px 30px 0 0;padding:25px 29px;
 box-shadow:0 18px 48px #12352244
}
.hero:before{content:"🐝";position:absolute;left:4%;bottom:-40px;font-size:120px;opacity:.12}
.hero:after{content:"🌻";position:absolute;right:4%;top:-25px;font-size:145px;opacity:.13}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}
h1{margin:0;color:#fff1a8;font-size:clamp(28px,4vw,43px);text-shadow:0 3px 8px #0c2f20}
.sub{font-weight:900;color:#f3fff7;margin-top:7px}
.sound{border:1px solid #d9f2df;background:#fffdf0;color:#2d6f4d;border-radius:18px;padding:11px 15px;font-weight:900;cursor:pointer}

.game{background:#fffdf6;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 20px 55px #12352233}
.status{
 display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
 padding:14px 20px;background:#e5f0d9;border-bottom:1px solid #bdd1ac
}
.track{height:13px;background:#c9d9bf;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#4fa36f,#e6b845,#d88937);transition:.3s}
.pill{background:#fff;border:1px solid #c8d7bb;border-radius:99px;padding:8px 13px;font-weight:900;white-space:nowrap}
.hearts{font-size:20px;letter-spacing:2px}
.main{padding:22px}
.quiz{background:#fff;border:2px solid #d5dfc6;border-radius:22px;padding:23px;box-shadow:inset 0 0 28px #edf4e355}
.tag{display:inline-block;background:linear-gradient(90deg,#1e7b50,#6d914b);color:white;padding:8px 14px;border-radius:14px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:19px 0;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{
 border:2px solid #d8dec9;background:#fffef9;color:#173021;border-radius:16px;padding:15px;text-align:left;
 font-size:16px;cursor:pointer;transition:.15s
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#6aa478;background:#f3faef}
.ans.correct{background:#eaffef;border-color:#3ea568}
.ans.wrong{background:#fff0f2;border-color:#d95663}
.fb{display:none;margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.fb.good{display:block;background:#eaffef;border-left:5px solid #3ea568}
.fb.bad{display:block;background:#fff0f2;border-left:5px solid #d95663}
.bonus{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff5c9;border-left:5px solid #f2c45c;font-weight:900}
.next{display:none;float:right;margin-top:15px;border:0;border-radius:16px;padding:12px 22px;background:linear-gradient(90deg,#1e7b50,#6d914b);color:#fff;font-weight:900;cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:#102419dd;z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.box{max-width:520px;width:100%;background:#fffdf4;border:3px solid #6c9b57;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #0006}
.restart{border:0;border-radius:16px;padding:13px 22px;background:#5b8747;color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#fffdf6;border-radius:30px;padding:36px;text-align:center;box-shadow:0 20px 55px #12352233}
.result.show{display:block}
.big{font-size:60px;font-weight:1000;color:#1e7b50}
.review{text-align:left;margin-top:24px}
.r{padding:13px 15px;margin:9px 0;border-radius:14px;background:#eef5e9;border-left:5px solid #6d914b;line-height:1.55}
@media(max-width:820px){
 .answers{grid-template-columns:1fr}
 .heroRow{flex-direction:column;align-items:flex-start}
 .status{grid-template-columns:1fr 1fr}
 .track{grid-column:1/-1;order:4}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="heroRow">
  <div class="brand">
   <div class="icon">🐝🌻</div>
   <div>
    <h1>Honey Garden Adventure</h1>
    <div class="sub">Grade 11 - Unit 3 - Exercise 1 (61-80) - Option C</div>
   </div>
  </div>
  <button id="sound" class="sound">🔊 Garden Sound On</button>
 </div>
</header>

<section id="game" class="game">
 <div class="status">
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div>
  <div class="pill">🍯 Streak <span id="streak">0</span></div>
  <div class="pill">🔁 Restarts <span id="restarts">0</span></div>
 </div>

 <main class="main">
  <section class="quiz">
   <div id="tag" class="tag"></div>
   <div id="q" class="q"></div>
   <div id="answers" class="answers"></div>
   <div id="fb" class="fb"></div>
   <div id="bonus" class="bonus"></div>
   <button id="next" class="next">NEXT FLOWER →</button>
   <div style="clear:both"></div>
  </section>
 </main>
</section>

<section id="result" class="result">
 <div style="font-size:82px">🐝🏆🌻</div>
 <h2>Garden Adventure Complete!</h2>
 <div id="final" class="big"></div>
 <p id="msg"></p>
 <div id="review" class="review"></div>
</section>
</div>

<div id="overlay" class="overlay">
 <div class="box">
  <div style="font-size:80px">🍂💔</div>
  <h2>All Hearts Lost!</h2>
  <p>Hết 5 tim. Học sinh phải làm lại từ Question 1.</p>
  <p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p>
  <button id="restartBtn" class="restart">RETURN TO THE GARDEN GATE ↻</button>
 </div>
</div>

<script>
const Q=[{"q": "More young people are beginning to ______ deeply about environmental protection and renewable energy.", "o": ["care", "fight", "ignore", "discuss"], "a": 0, "e": "<b>care about sth</b> = quan tâm đến điều gì."}, {"q": "Modern apartment buildings are designed to ______ residents with greater comfort and lower energy costs.", "o": ["support", "provide", "supply to", "require"], "a": 1, "e": "Cấu trúc: <b>provide sb with sth</b> = cung cấp cho ai cái gì."}, {"q": "Community gardens often provide fresh produce ______ nearby schools and local food markets.", "o": ["with", "for", "to", "at"], "a": 2, "e": "Cấu trúc: <b>provide sth to sb</b> = cung cấp cái gì cho ai."}, {"q": "Air pollution has fallen significantly since stricter vehicle ______ were introduced.", "o": ["emissions controls", "emission controls", "emitting controls", "emitted controls"], "a": 1, "e": "<b>emission controls</b> = các biện pháp kiểm soát khí thải."}, {"q": "Online platforms allow residents to ______ directly with local authorities about neighbourhood problems.", "o": ["cooperate", "connect", "interact", "combine"], "a": 2, "e": "<b>interact with sb</b> = tương tác với ai."}, {"q": "Smart homes have several ______, including energy efficiency and greater control over household devices.", "o": ["benefits", "disadvantages", "basics", "concerns"], "a": 0, "e": "<b>benefits</b> = lợi ích. Energy efficiency và greater control đều là lợi ích."}, {"q": "Expanding ______ areas can encourage people to walk more and reduce traffic noise in city centres.", "o": ["residential", "pedestrian", "industrial", "commercial"], "a": 1, "e": "<b>pedestrian areas/zones</b> = khu vực dành cho người đi bộ."}, {"q": "The city navigation app ______ drivers when serious congestion develops on major roads.", "o": ["informs to", "warns", "reminds about", "announces"], "a": 1, "e": "<b>warn sb about/of sth</b> = cảnh báo ai về điều gì."}, {"q": "Many researchers ______ that rooftop gardens can contribute to a more sustainable urban food supply.", "o": ["are believing", "believes", "believe", "are believed"], "a": 2, "e": "Chủ ngữ số nhiều <b>researchers</b> → <b>believe</b>. Đây cũng là stative verb."}, {"q": "To make urban development more inclusive, planners are increasingly involving local residents in ______.", "o": ["decision-making", "decisions making", "making decision", "decision making processings"], "a": 0, "e": "Cụm chuẩn: <b>involve sb in decision-making</b> = cho ai tham gia quá trình ra quyết định."}, {"q": "A growing number of homeowners ______ smart technology gives them greater control over household energy use.", "o": ["are thinking", "thinks", "believe", "believing"], "a": 2, "e": "<b>A growing number of + plural noun</b> → động từ số nhiều: <b>believe</b>."}, {"q": "A large ______ of the world's population is expected to live in urban areas by the middle of this century.", "o": ["amount", "proportion", "number", "quantity"], "a": 1, "e": "Collocation: <b>a large proportion of the population</b>."}, {"q": "Intelligent traffic systems ______ an increasingly important role in reducing congestion during peak hours.", "o": ["make", "have", "perform", "play"], "a": 3, "e": "Collocation: <b>play an important role in sth/doing sth</b>."}, {"q": "Rent for a ______ is generally higher than for a similar property in the suburbs.", "o": ["downtown modern apartment", "modern downtown apartment", "apartment modern downtown", "modern apartment downtown area"], "a": 1, "e": "Trật tự tự nhiên: <b>modern + downtown + apartment</b>."}, {"q": "Excessive vehicle emissions can have a serious ______ on both air quality and human health.", "o": ["damage", "influence to", "impact", "consequence to"], "a": 2, "e": "Collocation: <b>have an impact on sth</b> = có tác động đến..."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;
const $=x=>document.getElementById(x);

function tone(f,d=.1){
 if(!soundOn)return;
 if(!ctx)ctx=new(AudioContext||webkitAudioContext)();
 if(ctx.state==="suspended")ctx.resume();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.value=f;o.type="sine";g.gain.value=.03;
 o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)
}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Garden Sound On":"🔇 Sound Off";
};

function update(){
 $("hearts").textContent="❤️".repeat(hearts)+"🤎".repeat(MAX-hearts);
 $("streak").textContent=streak;
 $("restarts").textContent=restarts;
 $("bar").style.width=(i/Q.length*100)+"%";
}

function render(){
 const x=Q[i];
 $("tag").textContent="Flower "+(i+1)+" / "+Q.length;
 $("q").textContent=x.q;
 $("answers").innerHTML="";
 $("fb").className="fb";
 $("fb").style.display="none";
 $("bonus").style.display="none";
 $("next").style.display="none";
 update();

 x.o.forEach((v,n)=>{
   const b=document.createElement("button");
   b.className="ans";
   b.innerHTML="<b>"+L[n]+".</b> "+v;
   b.onclick=()=>choose(n,b);
   $("answers").appendChild(b);
 });
}

function choose(n,b){
 const x=Q[i];
 attempts[i]++;

 if(n!==x.a){
   hearts--;
   streak=0;
   b.classList.add("wrong");
   b.disabled=true;

   $("fb").className="fb bad";
   $("fb").style.display="block";
   $("fb").innerHTML="<b>❌ Chưa đúng.</b> Mất 1 ❤️. Em phải chọn lại đến khi đúng mới được đi tiếp.";
   tone(170,.2);
   update();

   if(hearts<=0){
     restarts++;
     $("restarts").textContent=restarts;
     $("restartBox").textContent=restarts;
     setTimeout(()=>$("overlay").classList.add("show"),250);
   }
   return;
 }

 streak++;
 if(attempts[i]===1) firstTry++;

 document.querySelectorAll(".ans").forEach(z=>z.disabled=true);
 b.classList.add("correct");

 $("fb").className="fb good";
 $("fb").style.display="block";
 $("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;
 tone(820,.11);

 const qn=i+1;
 if(BONUS.includes(qn)){
   const before=hearts;
   hearts=Math.min(MAX,hearts+1);
   $("bonus").style.display="block";
   $("bonus").innerHTML=hearts>before
     ?"🎁 BONUS HEART! +1 ❤️"
     :"🎁 BONUS FLOWER! Em đang đủ 5 ❤️ nên số tim giữ nguyên.";
   tone(1120,.12);
 }

 update();
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("next").style.display="inline-block";
 $("next").textContent=i===Q.length-1?"FINISH ADVENTURE →":"NEXT FLOWER →";
}

$("next").onclick=()=>{
 if(i<Q.length-1){i++;render()}
 else finish();
};

$("restartBtn").onclick=()=>{
 $("overlay").classList.remove("show");
 i=0;
 hearts=MAX;
 streak=0;
 firstTry=0;
 attempts=Array(Q.length).fill(0);
 render();
};

function finish(){
 $("game").style.display="none";
 $("result").classList.add("show");
 $("final").textContent="15 / 15";
 $("msg").innerHTML=
   "Hoàn thành với <b>"+restarts+"</b> lần làm lại.<br>"+
   "Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";

 let h="<h3>🌻 Garden Review</h3>";
 Q.forEach((x,k)=>{
   h+='<div class="r"><b>Question '+(k+1)+'</b> — Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>';
 });
 $("review").innerHTML=h;
}

render();
</script>
</body>
</html>
