<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 5 - Exercise 1 (61-80) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 5 - Exercise 1 (61-80) - Option C</h1>
    <div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "Unlike natural grass, the ________ grass on the indoor sports field is manufactured from synthetic materials.", "options": ["original", "artificial", "ordinary", "traditional"], "answer": "artificial", "explanation": "<em>Artificial</em> nghĩa là nhân tạo, được con người sản xuất thay vì hình thành tự nhiên."}, {"q": "Because the kit contains tiny parts that could be swallowed, it is not ________ for children under three.", "options": ["suit", "suitably", "suitability", "suitable"], "answer": "suitable", "explanation": "Sau <em>is not</em> cần tính từ. <em>Be suitable for somebody</em>: phù hợp với ai."}, {"q": "Before selecting a material for the new screen, the researchers carried out several ________ to compare its strength with that of ordinary glass.", "options": ["experiments", "experiences", "expressions", "exhibitions"], "answer": "experiments", "explanation": "<em>Carry out experiments</em> nghĩa là tiến hành thí nghiệm để kiểm tra hoặc so sánh tính chất của vật liệu."}, {"q": "The technician ________ the new security software on all the school computers yesterday afternoon.", "options": ["has installed", "installs", "installed", "will install"], "answer": "installed", "explanation": "<em>Yesterday afternoon</em> là thời gian đã kết thúc trong quá khứ nên dùng quá khứ đơn."}, {"q": "The tablet’s screen is now badly cracked. Someone ________ it, and we will need to have it repaired.", "options": ["will damage", "has damaged", "damages", "is damaging"], "answer": "has damaged", "explanation": "Hành động đã xảy ra nhưng để lại kết quả hiện tại: màn hình đang bị nứt và cần sửa. Dùng hiện tại hoàn thành."}, {"q": "Before changing to engineering in 2024, Minh ________ computer science for two semesters.", "options": ["has studied", "studies", "will study", "studied"], "answer": "studied", "explanation": "Việc học thuộc một giai đoạn đã kết thúc trước khi Minh đổi ngành. <em>For two semesters</em> không bắt buộc dùng hiện tại hoàn thành."}, {"q": "Our teachers ________ this online platform since it was introduced, and they still use it to assign homework.", "options": ["have used", "used", "are using", "use"], "answer": "have used", "explanation": "<em>Since</em> chỉ mốc bắt đầu; việc sử dụng kéo dài đến hiện tại nên dùng hiện tại hoàn thành."}, {"q": "The robotics club has occupied this room ________ the beginning of the school year.", "options": ["for", "during", "since", "by"], "answer": "since", "explanation": "<em>The beginning of the school year</em> là mốc thời gian, vì vậy dùng <em>since</em>."}, {"q": "The laboratory has operated the same 3D printer ________ nearly five years without replacing its main components.", "options": ["since", "for", "from", "at"], "answer": "for", "explanation": "<em>Nearly five years</em> là khoảng thời gian nên dùng <em>for</em>."}, {"q": "“Can I speak to the engineer?” — “She ________ to the exhibition centre and won’t be back until this evening.”", "options": ["has been", "was going", "goes", "has gone"], "answer": "has gone", "explanation": "<em>Has gone to</em> nghĩa là đã đi đến nơi nào và chưa trở về, phù hợp với việc kỹ sư đang vắng mặt."}, {"q": "You can disconnect the laptop now; the backup programme has ________ copied all the files to the external drive.", "options": ["already", "yet", "ever", "still"], "answer": "already", "explanation": "<em>Already</em> cho biết việc sao lưu đã hoàn tất. <em>Yet</em> thường đứng cuối câu hỏi hoặc câu phủ định."}, {"q": "So far this term, the students ________ three working models, but they have not chosen one for the competition yet.", "options": ["build", "built", "have built", "are building"], "answer": "have built", "explanation": "<em>So far this term</em> nghĩa là tính đến hiện tại trong học kỳ này, dùng hiện tại hoàn thành."}, {"q": "I ________ the charging cable, so we cannot connect the device to a power supply at the moment.", "options": ["misplace", "have misplaced", "will misplace", "am misplacing"], "answer": "have misplaced", "explanation": "<em>Have misplaced</em> diễn tả việc để thất lạc dây sạc với kết quả hiện tại là không thể cấp điện cho thiết bị."}, {"q": "Have you ever ________ a digital model into a physical object using a 3D printer?", "options": ["turn", "turning", "turns", "turned"], "answer": "turned", "explanation": "Hiện tại hoàn thành có cấu trúc <em>have/has + V3</em>. <em>Turn something into something</em>: biến thứ gì thành thứ khác."}, {"q": "Neither of the two students ________ the new application yet, so both will need instructions before using it.", "options": ["has tried", "have tried", "tried", "tries"], "answer": "has tried", "explanation": "<em>Neither of + danh từ số nhiều</em> dùng động từ số ít trong văn phong chuẩn. <em>Yet</em> và ngữ cảnh trải nghiệm tính đến hiện tại phù hợp với <em>has tried</em>."}];
const START=61;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
