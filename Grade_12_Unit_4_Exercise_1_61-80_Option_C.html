<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 4 - Exercise 1 (61-80) - Option C</title>
<style>
:root{--panel:#0e2537;--panel2:#14344b;--cyan:#5be4ff;--blue:#5d8cff;--orange:#ffb35b;--green:#4fd39a;--red:#ff6a78;--white:#f5fbff;--muted:#b5c9d8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--white);background:radial-gradient(circle at 14% 10%,rgba(91,228,255,.11),transparent 24%),radial-gradient(circle at 86% 18%,rgba(93,140,255,.09),transparent 22%),linear-gradient(160deg,#050b12,#081b29 58%,#03070b);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}.radar{position:absolute;right:-110px;top:8%;width:360px;height:360px;border-radius:50%;border:1px solid rgba(91,228,255,.12);box-shadow:0 0 0 60px rgba(91,228,255,.035),0 0 0 120px rgba(91,228,255,.02)}
.wrap{max-width:1120px;margin:auto;position:relative;z-index:2}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.hero-left{display:flex;align-items:center;gap:14px}.icon{font-size:64px}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#eafaff,#5be4ff,#5d8cff,#ffb35b);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:6px;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(91,228,255,.24);background:#102b40;color:white;padding:11px 14px;border-radius:12px;font-weight:900;cursor:pointer}.shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(91,228,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.4)}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#091b2a}.track{height:13px;background:#04090d;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--orange));transition:.25s}.chip{background:#12354f;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}.game{padding:22px}.card{max-width:880px;margin:auto;background:#0d2a40;border:2px solid #225979;border-radius:20px;padding:20px}.headline{display:flex;justify-content:space-between;align-items:center;gap:12px}.qtag{display:inline-block;background:#173f5b;color:#d8f8ff;padding:7px 12px;border-radius:10px;font-weight:900}.control-tag{font-size:12px;letter-spacing:1.5px;color:#7bdfff;font-weight:900}.question{font-size:22px;line-height:1.55;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{padding:15px;border:2px solid #2a5b79;border-radius:14px;background:#12334e;color:white;text-align:left;font-size:17px;cursor:pointer;transition:.15s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}.option.correct{background:#154232!important;border-color:var(--green)!important}.option.wrong{background:#482229!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#091c2b;line-height:1.55}.feedback.show{display:block}.feedback.ok{border-color:var(--green)}.feedback.no{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#88eaff,#9bb7ff,#ffd19b);color:#17334a;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:32px}.result.show{display:block}.big{font-size:58px;font-weight:1000;color:#79e9ff}.review{text-align:left;margin-top:22px}.item{padding:12px 14px;background:#0b2234;border-left:5px solid #59748a;border-radius:12px;margin:9px 0;line-height:1.5}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:700px){.options{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style></head>
<body><div class="bg"><div class="grid"></div><div class="radar"></div></div>
<div class="wrap"><div class="hero"><div class="hero-left"><div class="icon">🏙️🛰️</div><div><h1>City Control Center</h1><div class="sub">Grade 12 · Unit 4 · Exercise 1 (61–80) · Option C</div></div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="shell"><div id="quizArea"><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="game"><div class="card"><div class="headline"><div class="qtag" id="qtag"></div><div class="control-tag">URBAN SYSTEM NODE</div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next" disabled>Next Control Node →</button></div></div></div></div>
<div class="result" id="result"><div style="font-size:74px">🛰️🏙️</div><h2>City Control Mission Complete!</h2><div class="big" id="final"></div><p id="message"></p><button class="next" id="restart">Run Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const Q=[{"q": "As housing demand continues to rise in major cities, reasonably priced apartments are becoming ____________ difficult for low-income families to find.", "options": ["increasingly", "increased", "increase", "more increased"], "answer": 0, "explanation": "Increasingly + adjective = ngày càng... → increasingly difficult = ngày càng khó."}, {"q": "The city council has invested heavily in the metro network ____________, but traffic congestion remains a serious problem in several central districts.", "options": ["yet", "since", "so far", "ever"], "answer": 2, "explanation": "So far thường dùng với Present Perfect để diễn tả 'cho đến nay'. → has invested heavily ... so far."}, {"q": "The more rapidly suburban areas are developed, ____________ pressure is placed on existing transport networks and public services.", "options": ["the greatest", "the more", "more and more", "the most"], "answer": 1, "explanation": "So sánh kép: The more rapidly..., the more pressure... = càng phát triển nhanh thì càng nhiều áp lực."}, {"q": "Although the new bus network is relatively ____________, many residents still prefer private vehicles because buses become extremely crowded during rush hour.", "options": ["affordable", "outdated", "residential", "polluted"], "answer": 0, "explanation": "Affordable = có giá phải chăng. Câu nhượng bộ cho thấy dù xe buýt khá rẻ, nhiều người vẫn thích xe cá nhân vì quá đông."}, {"q": "Thousands of workers ____________ to the outskirts in recent years because accommodation near the city centre has become unaffordable.", "options": ["move", "had moved", "are moving", "have moved"], "answer": 3, "explanation": "In recent years → Present Perfect. → have moved."}, {"q": "As urban development continues, the amount of undeveloped land available for public parks is becoming ____________.", "options": ["the least", "fewer and fewer", "less and less", "the fewer"], "answer": 2, "explanation": "Land là danh từ không đếm được, nên dùng less and less = ngày càng ít."}, {"q": "City authorities are introducing stricter emission standards in an attempt to ____________ the environmental impact of the growing number of private vehicles.", "options": ["maintain", "reduce", "expand", "generate"], "answer": 1, "explanation": "Reduce the environmental impact = giảm tác động môi trường. Đây là collocation phù hợp nhất."}, {"q": "The expansion of residential areas has been particularly ____________ in districts connected to the newly constructed metro lines.", "options": ["rapid", "rapidly", "rapidity", "more rapidly"], "answer": 0, "explanation": "Sau has been cần tính từ để mô tả expansion. → has been particularly rapid."}, {"q": "The city's public transport system has become considerably ____________ since several new metro lines were put into operation.", "options": ["the most reliable", "reliably", "more reliably", "more reliable"], "answer": 3, "explanation": "Become + adjective. Có considerably để nhấn mạnh so sánh hơn → considerably more reliable."}, {"q": "Many rural residents choose to ____________ to large cities because they believe urban areas offer better employment and educational opportunities.", "options": ["commute", "settle in", "migrate", "get by"], "answer": 2, "explanation": "Migrate to + place = di cư đến nơi khác để sinh sống. Đây là đáp án phù hợp với việc rời nông thôn đến thành phố."}, {"q": "The population density in the central districts is getting ____________, putting increasing pressure on housing and essential services.", "options": ["high and high", "higher and higher", "more and more highly", "the higher"], "answer": 1, "explanation": "Comparative + and + comparative = ngày càng... → higher and higher."}, {"q": "The government has not found an effective long-term solution to severe traffic congestion ____________.", "options": ["already", "ever", "just", "yet"], "answer": 3, "explanation": "Yet thường dùng ở cuối câu phủ định với Present Perfect. → has not found ... yet."}, {"q": "The ____________ urban areas become, the greater the demand for efficient public transport and affordable housing.", "options": ["crowded", "most crowded", "more crowded", "more and more crowded"], "answer": 2, "explanation": "Cấu trúc so sánh kép: The more crowded urban areas become, the greater the demand..."}, {"q": "After moving from a small village to a major metropolitan area, it took Minh several months to ____________ and become accustomed to the much faster pace of life.", "options": ["settle in", "move on", "get by", "commute"], "answer": 0, "explanation": "Settle in = ổn định và làm quen với môi trường sống mới. Phù hợp với 'become accustomed to'."}, {"q": "Although industrial activity has increased considerably, stricter environmental regulations have helped keep carbon ____________ from rising at the same rate.", "options": ["pollution", "footprints", "emissions", "resources"], "answer": 2, "explanation": "Carbon emissions = lượng khí thải carbon. Cụm này phù hợp nhất với động từ rising và chủ đề quy định môi trường."}],L=["A","B","C","D"];let i=0,xp=0,hearts=5,combo=0,answered=false,history=[],soundOn=true,ctx=null;const $=id=>document.getElementById(id);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine",v=.035,delay=0){if(!soundOn)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(650,.08,"triangle");tone(920,.11,"sine",.03,.08)}function bad(){tone(165,.16,"sawtooth");tone(95,.2,"square",.018,.1)}function nextSound(){tone(430,.06,"triangle",.018);tone(670,.07,"triangle",.015,.06)}function win(){[523,659,784,1047].forEach((f,k)=>tone(f,.17,"triangle",.027,k*.09))}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)nextSound()};
function render(){answered=false;$("next").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";const q=Q[i];$("qtag").textContent=`Node ${i+1}`;$("question").textContent=q.q;$("count").textContent=`${i+1}/${Q.length}`;$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${i/Q.length*100}%`;$("options").innerHTML="";q.options.forEach((op,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<strong>${L[n]}.</strong> ${op}`;b.onclick=()=>choose(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Complete Control 🛰️":"Next Control Node →"}
function choose(n,btn){if(answered)return;answered=true;const q=Q[i],buttons=[...document.querySelectorAll(".option")],right=n===q.answer;buttons.forEach(b=>b.disabled=true);buttons[q.answer].classList.add("correct");if(right){xp+=10+combo*2;combo++;$("feedback").className="feedback ok show";$("feedback").innerHTML=`<strong>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;good()}else{hearts=Math.max(0,hearts-1);combo=0;btn.classList.add("wrong");$("feedback").className="feedback no show";$("feedback").innerHTML=`<strong>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;bad()}history.push({selected:n,correct:right});$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!answered)return;nextSound();if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("quizArea").style.display="none";$("result").classList.add("show");win();const correct=history.filter(x=>x.correct).length;$("final").textContent=`${correct}/${Q.length} · ${xp} XP`;$("message").textContent=correct===Q.length?"Perfect City Controller!":correct>=13?"Excellent! Em nắm rất chắc Urbanisation vocabulary & grammar.":correct>=10?"Good job! Hãy xem lại các câu chưa đúng.":"Hãy ôn lại collocations, Present Perfect và comparative structures rồi thử lại.";let html="<h3>🛰️ City Control Review</h3>";Q.forEach((q,k)=>{const a=history[k];html+=`<div class="item ${a.correct?"ok":"no"}"><strong>Node ${k+1}: ${a.correct?"Correct":"Incorrect"}</strong><br>Your answer: ${L[a.selected]}. ${q.options[a.selected]}<br>Correct: ${L[q.answer]}. ${q.options[q.answer]}<br><em>${q.explanation}</em></div>`});$("review").innerHTML=html}
$("restart").onclick=()=>location.reload();render();
</script></body></html>
