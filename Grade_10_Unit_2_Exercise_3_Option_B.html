<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 3 - Option B</title>
<style>
:root{
 --sky:#cfe8ff;--sun:#ffd46b;--orange:#f6a35b;--rose:#ef8b91;--blue:#5f9ed6;
 --deep:#294b69;--panel:#fffdf8;--panel2:#f7fbff;--green:#50c98d;--red:#ef6675;
 --text:#334b5f;--muted:#71889a
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
 linear-gradient(180deg,#9fd6ff 0%,#d8ecff 45%,#ffe3bd 74%,#f4b176 100%);
 padding:18px;overflow-x:hidden
}
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sun{
 position:absolute;left:50%;bottom:18%;transform:translateX(-50%);
 width:150px;height:150px;border-radius:50%;
 background:radial-gradient(circle,#fff9c9 0 18%,#ffd46b 46%,#f7a255 100%);
 box-shadow:0 0 55px rgba(255,197,91,.6)
}
.horizon{position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(180deg,#e9a36f,#b36e57)}
.horizon:before{content:"";position:absolute;left:-10%;right:-10%;top:-55px;height:100px;border-radius:50%;background:#bf7a5e}
.cloud{position:absolute;background:rgba(255,255,255,.72);border-radius:999px;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:120px;height:35px;left:-140px;top:18%;animation-duration:24s}
.c1:before{width:52px;height:52px;left:18px;top:-24px}.c1:after{width:58px;height:58px;right:12px;top:-27px}
.c2{width:90px;height:28px;left:-120px;top:35%;animation-duration:31s;animation-delay:6s}
.c2:before{width:40px;height:40px;left:14px;top:-18px}.c2:after{width:46px;height:46px;right:8px;top:-21px}
@keyframes drift{to{transform:translateX(120vw)}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.horizon-icon{width:105px;height:105px;position:relative;display:grid;place-items:center}
.mini-sun{position:absolute;top:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#fff6bb,#ffc85e);box-shadow:0 0 24px rgba(255,200,94,.45)}
.mini-land{position:absolute;left:8px;right:8px;bottom:18px;height:32px;border-radius:50% 50% 10px 10px;background:linear-gradient(180deg,#d68259,#8d584b)}
.ray{position:absolute;width:2px;height:24px;background:#ffd46b;top:4px;left:51px;transform-origin:1px 49px}
.r1{transform:rotate(0)}.r2{transform:rotate(45deg)}.r3{transform:rotate(-45deg)}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#345e82,#5d9ad0,#f3a05f,#d66f75);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:#587085;font-weight:700}
.sound{border:1px solid rgba(95,158,214,.3);background:#fff;color:#3c607d;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:rgba(255,255,255,.97);border:1px solid rgba(95,158,214,.25);border-radius:24px;box-shadow:0 24px 65px rgba(70,90,110,.18);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:linear-gradient(90deg,#f3faff,#fff8ef)}
.barbox{height:13px;background:#e3edf5;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#5f9ed6,#ffd46b,#f6a35b,#ef8b91);transition:.3s}
.chip{background:#fff;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(70,90,110,.07)}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#f9fcff;border:2px solid #d8e8f3;border-radius:18px;padding:18px;max-height:600px;overflow:auto;line-height:1.75}
.passage h3{margin:0 0 10px;color:#4a7393}
.quiz{background:#fffaf4;border:2px solid #efd8c1;border-radius:18px;padding:18px}
.tag{display:inline-block;background:#eaf4fb;color:#4b7190;padding:7px 12px;border-radius:10px;font-weight:900}
.question{font-size:23px;margin:16px 0}
.options{display:grid;gap:12px}
.option{padding:14px 15px;border:2px solid #d9e4ed;border-radius:14px;background:#fff;color:var(--text);text-align:left;font-size:17px;cursor:pointer;transition:.16s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:#f0a368;box-shadow:0 8px 18px rgba(120,90,60,.08)}
.option.correct{background:#e8fff3!important;border-color:var(--green)!important}
.option.wrong{background:#fff0f2!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#fff;line-height:1.55}
.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#cce9ff,#ffd89a);color:#344c5c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}
.scorebig{font-size:58px;font-weight:1000;color:#d88959}
.review{text-align:left;margin-top:24px;border-top:1px solid #e4e6e8;padding-top:16px}
.item{padding:12px 14px;background:#fbfdff;border-radius:12px;margin:9px 0;border-left:5px solid #a8b5be;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}
@media(max-width:650px){.hero{grid-template-columns:80px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.horizon-icon{transform:scale(.8);transform-origin:left center;width:80px}}
</style>
</head>
<body>
<div class="scene">
 <div class="cloud c1"></div><div class="cloud c2"></div>
 <div class="sun"></div><div class="horizon"></div>
</div>

<main class="wrap">
<header class="hero">
 <div class="horizon-icon">
  <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div>
  <div class="mini-sun"></div><div class="mini-land"></div>
 </div>
 <div>
  <h1>Horizon Energy Challenge</h1>
  <p class="subtitle">Grade 10 · Unit 2 · Exercise 3 · Option B</p>
 </div>
 <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
 <div class="status">
  <div class="barbox"><div class="bar" id="bar"></div></div>
  <div class="chip" id="counter"></div>
  <div class="chip" id="scoreChip"></div>
  <div class="chip" id="heartChip"></div>
 </div>

 <div class="main">
  <div class="passage">
   <h3>🌅 A Smart Way to Save Energy</h3>
   <div id="passageText"></div>
  </div>

  <div class="quiz">
   <div class="tag" id="tag"></div>
   <div class="question" id="question"></div>
   <div class="options" id="options"></div>
   <div id="feedback" class="feedback"></div>
   <div class="controls"><button id="nextBtn" class="btn" disabled>Next Horizon →</button></div>
  </div>
 </div>
</div>

<div id="resultArea" class="result">
 <div style="font-size:74px">🌅✨</div>
 <h2>Horizon Challenge Complete!</h2>
 <div id="finalScore" class="scorebig"></div>
 <p id="message"></p>
 <button id="restartBtn" class="btn">Play Again ↻</button>
 <div id="review" class="review"></div>
</div>
</section>
</main>

<script>
const passage="Many families use a large amount of electricity every day without realizing how much energy they are wasting. One common (1) ____________ is leaving lights and electrical devices on when nobody is using them. This not only increases electricity bills (2) ____________ also has a negative effect on the environment.\n\nOne simple (3) ____________ to this problem is the use of smart home technology. Smart devices can automatically turn lights off when people (4) ____________ a room. Some systems can even control air conditioners according to the temperature inside the house. As a (5) ____________, families can reduce their energy consumption without making major changes to their daily routines.\n\nThese devices are also (6) ____________ to use. Most of them can be controlled through a smartphone, allowing users to check their electricity use at any time. (7) ____________, people can turn off an appliance even when they are away from home.\n\nSmart technology may cost more at first, but it can help households (8) ____________ money in the long term. More importantly, reducing electricity consumption helps protect natural (9) ____________ and lowers the amount of pollution produced by power stations. For these reasons, smart technology can play an important (10) ____________ in creating a greener lifestyle.";
const questions=[["Question 1", ["mistake", "result", "advantage", "solution"], 0, "a common mistake = một lỗi/thói quen sai thường gặp. Việc để đèn và thiết bị hoạt động khi không sử dụng là một lỗi phổ biến."], ["Question 2", ["or", "so", "but", "because"], 2, "Cấu trúc not only ... but also ... = không những... mà còn..."], ["Question 3", ["answer", "effect", "reason", "damage"], 0, "an answer to a problem = một giải pháp cho vấn đề. Giới từ to phía sau là dấu hiệu quan trọng."], ["Question 4", ["enter", "leave", "reach", "attend"], 1, "leave a room = rời khỏi phòng. Hệ thống tự tắt đèn khi mọi người rời phòng."], ["Question 5", ["result", "problem", "cause", "purpose"], 0, "as a result = kết quả là / do đó. Đây là cụm từ cố định chỉ kết quả."], ["Question 6", ["convenient", "harmful", "traditional", "wasteful"], 0, "convenient to use = thuận tiện/dễ sử dụng. Việc có thể điều khiển bằng điện thoại cho thấy thiết bị rất tiện lợi."], ["Question 7", ["However", "For example", "Otherwise", "Although"], 1, "Câu sau đưa ra ví dụ cụ thể về lợi ích của việc điều khiển thiết bị bằng điện thoại nên dùng For example."], ["Question 8", ["waste", "spend", "save", "pay"], 2, "save money = tiết kiệm tiền. → help households save money = giúp các hộ gia đình tiết kiệm tiền."], ["Question 9", ["resources", "appliances", "temperatures", "lifestyles"], 0, "natural resources = tài nguyên thiên nhiên. Giảm sử dụng điện giúp bảo vệ tài nguyên thiên nhiên."], ["Question 10", ["part", "action", "place", "position"], 0, "play an important part in + V-ing = đóng vai trò quan trọng trong việc gì."]];
const letters=["A","B","C","D"];

let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
 if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}
function tone(freq,duration=.1,type="sine",volume=.04,delay=0){
 if(!soundOn)return;
 const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(freq,s);
 g.gain.setValueAtTime(.0001,s);
 g.gain.exponentialRampToValueAtTime(volume,s+.01);
 g.gain.exponentialRampToValueAtTime(.0001,s+duration);
 o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03);
}
function correctSound(){tone(610,.08,"triangle",.03);tone(860,.11,"sine",.03,.08)}
function wrongSound(){tone(170,.16,"sawtooth",.035);tone(100,.22,"square",.018,.11)}
function nextSound(){tone(420,.06,"triangle",.017);tone(630,.07,"triangle",.015,.06)}
function finishSound(){[523,659,784,988].forEach((f,i)=>tone(f,.17,"triangle",.027,i*.09))}

$("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
 if(soundOn)nextSound();
};

function render(){
 answered=false;
 $("nextBtn").disabled=true;
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 const q=questions[current];

 $("tag").textContent=`Question ${current+1}`;
 $("question").textContent=q[0];
 $("counter").textContent=`Câu ${current+1}/${questions.length}`;
 $("scoreChip").textContent=`🌅 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${current/questions.length*100}%`;
 $("options").innerHTML="";

 q[1].forEach((op,index)=>{
  const b=document.createElement("button");
  b.className="option";
  b.innerHTML=`<strong>${letters[index]}.</strong> ${op}`;
  b.onclick=()=>choose(index);
  $("options").appendChild(b);
 });

 $("nextBtn").textContent=current===questions.length-1?"Finish Horizon 🌅":"Next Horizon →";
}

function choose(index){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const buttons=[...document.querySelectorAll(".option")];
 const correct=index===q[2];

 buttons.forEach(b=>b.disabled=true);
 buttons[q[2]].classList.add("correct");

 if(correct){
  score+=10+combo*2;
  combo++;
  $("feedback").className="feedback correct show";
  $("feedback").innerHTML=`<strong>🌅 Chính xác! ${letters[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}`;
  correctSound();
 }else{
  hearts=Math.max(0,hearts-1);
  combo=0;
  buttons[index].classList.add("wrong");
  $("feedback").className="feedback wrong show";
  $("feedback").innerHTML=`<strong>Chưa đúng. Đáp án: ${letters[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}`;
  wrongSound();
 }

 answers.push({selected:index,correct});
 $("scoreChip").textContent=`🌅 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(current+1)/questions.length*100}%`;
 $("nextBtn").disabled=false;
}

$("nextBtn").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(current<questions.length-1){
  current++;
  render();
 }else{
  showResult();
 }
};

function showResult(){
 $("quizArea").style.display="none";
 $("resultArea").classList.add("show");

 const correctCount=answers.filter(a=>a.correct).length;
 $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
 finishSound();

 if(correctCount===10) $("message").textContent="Perfect Horizon Master! Em đã hoàn thành toàn bộ thử thách.";
 else if(correctCount>=8) $("message").textContent="Excellent! Em nắm rất chắc vocabulary, collocations và linking words.";
 else if(correctCount>=6) $("message").textContent="Good job! Hãy xem lại những câu chưa đúng.";
 else $("message").textContent="Hãy đọc lại passage và thử thêm một lần nữa.";

 let html="<h3>🌅 Horizon Review</h3>";
 questions.forEach((q,i)=>{
  const a=answers[i];
  html+=`<div class="item ${a&&a.correct?"ok":"no"}">
   <strong>Câu ${i+1}: ${a&&a.correct?"Đúng":"Sai"}</strong><br>
   Em chọn: ${a?letters[a.selected]:"-"}. ${a?q[1][a.selected]:""}<br>
   Đáp án đúng: ${letters[q[2]]}. ${q[1][q[2]]}<br>
   <em>${q[3]}</em>
  </div>`;
 });
 $("review").innerHTML=html;
}

$("restartBtn").onclick=()=>{
 current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
 $("resultArea").classList.remove("show");
 $("quizArea").style.display="block";
 render();nextSound();
};

$("passageText").innerHTML=passage.split("\\n\\n").map(p=>`<p>${p}</p>`).join("");
render();
</script>
</body>
</html>
