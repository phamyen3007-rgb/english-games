<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 11 - Unit 4 - Exercise 1 (61-80) - option B</title>
<style>
  :root{
    --bg1:#eefbf7;
    --bg2:#eaf2ff;
    --card:#ffffff;
    --text:#17324d;
    --muted:#65758b;
    --primary:#0f8f79;
    --primary-dark:#087160;
    --success:#1f9d63;
    --danger:#e24b4b;
    --warning:#f0a93b;
    --line:#dbe7ee;
    --shadow:0 14px 40px rgba(30,70,90,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 10% 10%, rgba(81,212,178,.18), transparent 30%),
      radial-gradient(circle at 90% 15%, rgba(87,145,255,.16), transparent 28%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
  }
  .app{max-width:980px;margin:0 auto;padding:24px 16px 40px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.7);
    padding:14px 16px;border-radius:20px;box-shadow:var(--shadow);
    position:sticky;top:10px;z-index:20;
  }
  .brand h1{font-size:18px;margin:0 0 3px}
  .brand p{font-size:13px;color:var(--muted);margin:0}
  .stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .pill{
    background:#f7fbfd;border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;font-size:14px;font-weight:700;white-space:nowrap;
  }
  .hearts{letter-spacing:2px}
  .reset-btn{
    border:none;background:var(--primary);color:#fff;padding:10px 14px;
    border-radius:999px;font-weight:800;cursor:pointer;
  }
  .reset-btn:hover{background:var(--primary-dark)}
  .progress-wrap{
    margin:18px 2px 14px;background:#dfeaed;border-radius:999px;height:10px;overflow:hidden;
  }
  .progress{height:100%;width:0;background:linear-gradient(90deg,#17a589,#5c8df6);transition:.3s}
  .card{
    background:var(--card);border:1px solid rgba(255,255,255,.8);
    border-radius:26px;box-shadow:var(--shadow);padding:28px;
  }
  .qmeta{
    display:flex;justify-content:space-between;gap:12px;align-items:center;
    color:var(--muted);font-size:14px;margin-bottom:14px
  }
  .tag{
    font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:#0b7867;background:#e9f9f5;padding:7px 10px;border-radius:999px;
  }
  .question{font-size:23px;line-height:1.5;font-weight:800;margin:8px 0 22px}
  .options{display:grid;gap:12px}
  .option{
    width:100%;text-align:left;border:2px solid var(--line);background:#fbfdfe;
    border-radius:16px;padding:15px 16px;font-size:17px;color:var(--text);
    cursor:pointer;transition:.16s;display:flex;gap:12px;align-items:flex-start;
  }
  .option:hover:not(:disabled){transform:translateY(-1px);border-color:#90cfc4;background:#f4fffc}
  .option:disabled{cursor:default}
  .letter{
    width:30px;height:30px;border-radius:50%;background:#edf4f7;display:grid;place-items:center;
    font-weight:900;flex:0 0 30px
  }
  .option.correct{border-color:#7ad0a6;background:#edfbf4}
  .option.correct .letter{background:var(--success);color:#fff}
  .option.wrong{border-color:#f1a4a4;background:#fff2f2}
  .option.wrong .letter{background:var(--danger);color:#fff}
  .feedback{
    display:none;margin-top:20px;border-radius:18px;padding:16px 18px;line-height:1.55;
    border:1px solid var(--line);background:#f8fbfc
  }
  .feedback.show{display:block}
  .feedback.good{border-color:#a9dfc2;background:#f0fbf5}
  .feedback.bad{border-color:#efb3b3;background:#fff5f5}
  .feedback strong{display:block;margin-bottom:6px}
  .controls{display:flex;justify-content:flex-end;margin-top:18px}
  .next-btn{
    border:none;background:#17324d;color:white;padding:12px 18px;border-radius:14px;
    font-weight:800;cursor:pointer;display:none
  }
  .next-btn.show{display:inline-block}
  .footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
  .modal{
    position:fixed;inset:0;background:rgba(10,25,35,.55);display:none;place-items:center;
    padding:18px;z-index:100;
  }
  .modal.show{display:grid}
  .modal-card{
    width:min(560px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.25)
  }
  .modal-card h2{margin:0 0 10px;font-size:28px}
  .modal-card p{color:var(--muted);line-height:1.6}
  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0
  }
  .summary div{background:#f5f9fb;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
  .summary b{display:block;font-size:22px;margin-bottom:4px}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
  .primary,.secondary{
    flex:1;border:none;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer
  }
  .primary{background:var(--primary);color:#fff}
  .secondary{background:#eef4f7;color:var(--text)}
  .mistakes{max-height:240px;overflow:auto;margin-top:14px}
  .mistake-item{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.45}
  @media(max-width:700px){
    .topbar{align-items:flex-start}
    .brand h1{font-size:16px}
    .stats{gap:6px}
    .pill{padding:8px 9px;font-size:12px}
    .card{padding:20px}
    .question{font-size:20px}
    .option{font-size:16px}
    .summary{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Grade 11 - Unit 4 - Exercise 1 (61-80) - option B</h1>
      <p>UNIT 4 – CORE PRACTICE – SET 4</p>
    </div>
    <div class="stats">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill hearts" id="hearts">❤️❤️❤️❤️❤️</div>
      <button class="reset-btn" id="resetBtn">↻ Reset</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <main class="card">
    <div class="qmeta">
      <span id="counter">Question 1/15</span>
      <span class="tag">5 lives</span>
    </div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>
  </main>
  <div class="footer">Reset = shuffle questions + shuffle answer choices</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="summary" id="summary"></div>
    <div class="mistakes" id="mistakes"></div>
    <div class="modal-actions">
      <button class="primary" id="restartBtn">Làm lại từ đầu</button>
      <button class="secondary" id="closeBtn">Đóng</button>
    </div>
  </div>
</div>

<script>
const QUESTION_BANK = [
  {
    "id": 1,
    "q": "The student committee suggested __________ a traditional food exhibition as part of ASEAN Cultural Week.",
    "choices": [
      "to organise",
      "organising",
      "organised",
      "organise"
    ],
    "answer": "organising",
    "explanation": "Cấu trúc suggest + V-ing = đề nghị làm việc gì. → suggested organising a traditional food exhibition. Không dùng suggest + to-infinitive trong cấu trúc này."
  },
  {
    "id": 2,
    "q": "After several months of planning, the youth organisation finally __________ in attracting more than 500 participants to the regional programme.",
    "choices": [
      "believed",
      "attempted",
      "succeeded",
      "competed"
    ],
    "answer": "succeeded",
    "explanation": "Cấu trúc succeed in + V-ing = thành công trong việc làm gì. → succeeded in attracting more than 500 participants."
  },
  {
    "id": 3,
    "q": "The festival offered a wide __________ of performances, including folk dances, traditional songs and modern music.",
    "choices": [
      "amount",
      "variety",
      "degree",
      "level"
    ],
    "answer": "variety",
    "explanation": "Cụm a wide variety of + plural noun = nhiều loại đa dạng. → a wide variety of performances."
  },
  {
    "id": 4,
    "q": "Before starting the charity project, the volunteers had to __________ suitable ways to reach families in remote villages.",
    "choices": [
      "look for",
      "depend on",
      "give away",
      "fall into"
    ],
    "answer": "look for",
    "explanation": "Look for = tìm kiếm. → look for suitable ways. Depend on = phụ thuộc vào; give away = cho đi; fall into = rơi vào/thuộc vào."
  },
  {
    "id": 5,
    "q": "The organisers __________ a public call for students who were willing to assist at the ASEAN youth forum.",
    "choices": [
      "turned in",
      "put out",
      "handed over",
      "took in"
    ],
    "answer": "put out",
    "explanation": "Put out a call/announcement = đưa ra, phát đi lời kêu gọi/thông báo. → put out a public call for students."
  },
  {
    "id": 6,
    "q": "The school must __________ arrangements for transport before the exchange students arrive next month.",
    "choices": [
      "do",
      "make",
      "take",
      "set"
    ],
    "answer": "make",
    "explanation": "Collocation cố định: make arrangements for something = sắp xếp, chuẩn bị cho việc gì. → make arrangements for transport."
  },
  {
    "id": 7,
    "q": "In addition to __________ at the opening ceremony, Mai volunteered to guide international visitors around the exhibition.",
    "choices": [
      "sing",
      "to sing",
      "singing",
      "being sung"
    ],
    "answer": "singing",
    "explanation": "In addition to + noun/V-ing = ngoài việc... To ở đây là giới từ nên phải theo sau bằng V-ing. → In addition to singing..."
  },
  {
    "id": 8,
    "q": "Loud music and fireworks may __________ away wildlife living close to festival areas.",
    "choices": [
      "scare",
      "move",
      "push",
      "send"
    ],
    "answer": "scare",
    "explanation": "Cụm scare away = làm cho người hoặc động vật sợ và bỏ đi. → scare away wildlife."
  },
  {
    "id": 9,
    "q": "Students from different schools often __________ one another at weekends to prepare for the regional cultural performance.",
    "choices": [
      "take part in",
      "get together with",
      "show respect for",
      "reach a goal with"
    ],
    "answer": "get together with",
    "explanation": "Get together with somebody = gặp gỡ, tụ họp với ai. Ngữ cảnh cho thấy các học sinh gặp nhau để cùng chuẩn bị chương trình."
  },
  {
    "id": 10,
    "q": "After hearing how plastic waste was affecting local beaches, many teenagers felt __________ to take immediate action.",
    "choices": [
      "arranged",
      "represented",
      "qualified",
      "motivated"
    ],
    "answer": "motivated",
    "explanation": "Be motivated to do something = có động lực làm việc gì. → felt motivated to take immediate action."
  },
  {
    "id": 11,
    "q": "The media club produced a short film __________ the importance of preserving traditional crafts.",
    "choices": [
      "promote",
      "promoted",
      "promoting",
      "promotion"
    ],
    "answer": "promoting",
    "explanation": "Promoting là hiện tại phân từ, rút gọn mệnh đề quan hệ: a short film which promotes the importance... = a short film promoting the importance..."
  },
  {
    "id": 12,
    "q": "International students may need several days to __________ to unfamiliar food, schedules and social customs.",
    "choices": [
      "adopt",
      "adapt",
      "approve",
      "arrange"
    ],
    "answer": "adapt",
    "explanation": "Adapt to something = thích nghi với điều gì. → adapt to unfamiliar food and customs. Adopt = nhận nuôi/chấp nhận một phương pháp hoặc ý tưởng, không phù hợp ở đây."
  },
  {
    "id": 13,
    "q": "Successful cultural exchange requires openness, mutual respect and __________ towards different ways of life.",
    "choices": [
      "tolerant",
      "tolerably",
      "tolerance",
      "tolerate"
    ],
    "answer": "tolerance",
    "explanation": "Sau openness, mutual respect and... cần một danh từ song song. Tolerance = sự khoan dung, sự tôn trọng khác biệt. → openness, mutual respect and tolerance."
  },
  {
    "id": 14,
    "q": "Young people discussed how renewable energy could contribute to environmental __________ across Southeast Asia.",
    "choices": [
      "sustainable",
      "sustainability",
      "sustain",
      "sustaining"
    ],
    "answer": "sustainability",
    "explanation": "Sau tính từ environmental cần danh từ. Sustainability = tính/sự bền vững. → environmental sustainability."
  },
  {
    "id": 15,
    "q": "Taking part in regional youth projects gives students opportunities to practise __________ their ideas clearly and confidently.",
    "choices": [
      "express",
      "to express",
      "expressing",
      "to expressing"
    ],
    "answer": "expressing",
    "explanation": "Cấu trúc practise + V-ing = luyện tập làm việc gì. → practise expressing their ideas. Không dùng practise + to-infinitive."
  }
];

const $ = id => document.getElementById(id);
let game = [];
let current = 0;
let lives = 5;
let score = 0;
let locked = false;
let mistakes = [];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeGame(){
  return shuffle(QUESTION_BANK).map(item => ({
    ...item,
    shuffledChoices: shuffle(item.choices)
  }));
}

function startGame(){
  game = makeGame();
  current = 0;
  lives = 5;
  score = 0;
  locked = false;
  mistakes = [];
  closeModal();
  updateStats();
  renderQuestion();
}

function updateStats(){
  $("score").textContent = score;
  $("hearts").textContent = "❤️".repeat(lives) + "🖤".repeat(5-lives);
  $("progress").style.width = `${(current/game.length)*100}%`;
}

function renderQuestion(){
  if(current >= game.length){
    finishGame();
    return;
  }
  locked = false;
  const item = game[current];
  $("counter").textContent = `Question ${current+1}/${game.length}`;
  $("question").textContent = item.q;
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("nextBtn").classList.remove("show");
  $("options").innerHTML = "";

  item.shuffledChoices.forEach((choice,index)=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="letter">${String.fromCharCode(65+index)}</span><span>${choice}</span>`;
    btn.addEventListener("click",()=>selectAnswer(choice,btn));
    $("options").appendChild(btn);
  });
  updateStats();
}

function selectAnswer(choice, selectedBtn){
  if(locked) return;
  locked = true;

  const item = game[current];
  const buttons = [...document.querySelectorAll(".option")];
  buttons.forEach(b=>b.disabled=true);

  const isCorrect = choice === item.answer;
  if(isCorrect){
    score++;
    selectedBtn.classList.add("correct");
    $("feedback").className = "feedback show good";
    $("feedback").innerHTML = `<strong>✅ Correct!</strong>${item.explanation}`;
  }else{
    lives--;
    selectedBtn.classList.add("wrong");
    buttons.forEach(btn=>{
      const text = btn.querySelector("span:last-child").textContent;
      if(text === item.answer) btn.classList.add("correct");
    });
    mistakes.push({
      id:item.id,
      q:item.q,
      chosen:choice,
      answer:item.answer
    });
    $("feedback").className = "feedback show bad";
    $("feedback").innerHTML = `<strong>❌ Incorrect. Correct answer: ${item.answer}</strong>${item.explanation}`;
  }
  updateStats();

  if(lives <= 0){
    setTimeout(()=>showGameOver(),450);
    return;
  }

  $("nextBtn").classList.add("show");
  $("nextBtn").textContent = current === game.length-1 ? "Finish →" : "Next →";
}

$("nextBtn").addEventListener("click",()=>{
  current++;
  renderQuestion();
});

$("resetBtn").addEventListener("click", startGame);
$("restartBtn").addEventListener("click", startGame);
$("closeBtn").addEventListener("click", closeModal);

function showGameOver(){
  $("modalTitle").textContent = "💔 Hết 5 tim!";
  $("modalText").textContent = "Em phải làm lại từ đầu. Khi bắt đầu lại, thứ tự câu hỏi và các đáp án A–D sẽ được trộn mới.";
  $("summary").innerHTML = `
    <div><b>${score}</b>Correct</div>
    <div><b>${current+1}</b>Questions attempted</div>
    <div><b>0</b>Lives left</div>`;
  renderMistakes();
  $("modal").classList.add("show");
  $("closeBtn").style.display = "none";
}

function finishGame(){
  $("progress").style.width = "100%";
  $("modalTitle").textContent = score === game.length ? "🏆 Excellent!" : "🎉 Completed!";
  $("modalText").textContent = "Em đã hoàn thành toàn bộ bài luyện tập.";
  $("summary").innerHTML = `
    <div><b>${score}/${game.length}</b>Correct</div>
    <div><b>${Math.round(score/game.length*100)}%</b>Accuracy</div>
    <div><b>${lives}</b>Lives left</div>`;
  renderMistakes();
  $("modal").classList.add("show");
  $("closeBtn").style.display = "block";
}

function renderMistakes(){
  if(!mistakes.length){
    $("mistakes").innerHTML = `<div class="mistake-item"><b>Không có câu sai.</b></div>`;
    return;
  }
  $("mistakes").innerHTML = `<b>Các câu đã sai:</b>` + mistakes.map(m=>`
    <div class="mistake-item">
      <b>Original Q${m.id}</b><br>
      ${m.q}<br>
      <span style="color:#b73737">Your answer: ${m.chosen}</span><br>
      <span style="color:#147a4e">Correct answer: ${m.answer}</span>
    </div>
  `).join("");
}

function closeModal(){
  $("modal").classList.remove("show");
}

startGame();
</script>
</body>
</html>
