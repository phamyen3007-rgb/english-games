<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 11 - Unit 4 - Exercise 1 (21-40) - option B</title>
<style>
  :root{
    --bg1:#eefbf7;
    --bg2:#eaf2ff;
    --card:#ffffff;
    --text:#17324d;
    --muted:#65758b;
    --primary:#0f8f79;
    --primary-dark:#087160;
    --success:#1f9d63;
    --danger:#e24b4b;
    --warning:#f0a93b;
    --line:#dbe7ee;
    --shadow:0 14px 40px rgba(30,70,90,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 10% 10%, rgba(81,212,178,.18), transparent 30%),
      radial-gradient(circle at 90% 15%, rgba(87,145,255,.16), transparent 28%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
  }
  .app{max-width:980px;margin:0 auto;padding:24px 16px 40px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.7);
    padding:14px 16px;border-radius:20px;box-shadow:var(--shadow);
    position:sticky;top:10px;z-index:20;
  }
  .brand h1{font-size:18px;margin:0 0 3px}
  .brand p{font-size:13px;color:var(--muted);margin:0}
  .stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .pill{
    background:#f7fbfd;border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;font-size:14px;font-weight:700;white-space:nowrap;
  }
  .hearts{letter-spacing:2px}
  .reset-btn{
    border:none;background:var(--primary);color:#fff;padding:10px 14px;
    border-radius:999px;font-weight:800;cursor:pointer;
  }
  .reset-btn:hover{background:var(--primary-dark)}
  .progress-wrap{
    margin:18px 2px 14px;background:#dfeaed;border-radius:999px;height:10px;overflow:hidden;
  }
  .progress{height:100%;width:0;background:linear-gradient(90deg,#17a589,#5c8df6);transition:.3s}
  .card{
    background:var(--card);border:1px solid rgba(255,255,255,.8);
    border-radius:26px;box-shadow:var(--shadow);padding:28px;
  }
  .qmeta{
    display:flex;justify-content:space-between;gap:12px;align-items:center;
    color:var(--muted);font-size:14px;margin-bottom:14px
  }
  .tag{
    font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:#0b7867;background:#e9f9f5;padding:7px 10px;border-radius:999px;
  }
  .question{font-size:23px;line-height:1.5;font-weight:800;margin:8px 0 22px}
  .options{display:grid;gap:12px}
  .option{
    width:100%;text-align:left;border:2px solid var(--line);background:#fbfdfe;
    border-radius:16px;padding:15px 16px;font-size:17px;color:var(--text);
    cursor:pointer;transition:.16s;display:flex;gap:12px;align-items:flex-start;
  }
  .option:hover:not(:disabled){transform:translateY(-1px);border-color:#90cfc4;background:#f4fffc}
  .option:disabled{cursor:default}
  .letter{
    width:30px;height:30px;border-radius:50%;background:#edf4f7;display:grid;place-items:center;
    font-weight:900;flex:0 0 30px
  }
  .option.correct{border-color:#7ad0a6;background:#edfbf4}
  .option.correct .letter{background:var(--success);color:#fff}
  .option.wrong{border-color:#f1a4a4;background:#fff2f2}
  .option.wrong .letter{background:var(--danger);color:#fff}
  .feedback{
    display:none;margin-top:20px;border-radius:18px;padding:16px 18px;line-height:1.55;
    border:1px solid var(--line);background:#f8fbfc
  }
  .feedback.show{display:block}
  .feedback.good{border-color:#a9dfc2;background:#f0fbf5}
  .feedback.bad{border-color:#efb3b3;background:#fff5f5}
  .feedback strong{display:block;margin-bottom:6px}
  .controls{display:flex;justify-content:flex-end;margin-top:18px}
  .next-btn{
    border:none;background:#17324d;color:white;padding:12px 18px;border-radius:14px;
    font-weight:800;cursor:pointer;display:none
  }
  .next-btn.show{display:inline-block}
  .footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
  .modal{
    position:fixed;inset:0;background:rgba(10,25,35,.55);display:none;place-items:center;
    padding:18px;z-index:100;
  }
  .modal.show{display:grid}
  .modal-card{
    width:min(560px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.25)
  }
  .modal-card h2{margin:0 0 10px;font-size:28px}
  .modal-card p{color:var(--muted);line-height:1.6}
  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0
  }
  .summary div{background:#f5f9fb;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
  .summary b{display:block;font-size:22px;margin-bottom:4px}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
  .primary,.secondary{
    flex:1;border:none;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer
  }
  .primary{background:var(--primary);color:#fff}
  .secondary{background:#eef4f7;color:var(--text)}
  .mistakes{max-height:240px;overflow:auto;margin-top:14px}
  .mistake-item{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.45}
  @media(max-width:700px){
    .topbar{align-items:flex-start}
    .brand h1{font-size:16px}
    .stats{gap:6px}
    .pill{padding:8px 9px;font-size:12px}
    .card{padding:20px}
    .question{font-size:20px}
    .option{font-size:16px}
    .summary{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Grade 11 - Unit 4 - Exercise 1 (21-40) - option B</h1>
      <p>UNIT 4 – CORE PRACTICE – SET 2</p>
    </div>
    <div class="stats">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill hearts" id="hearts">❤️❤️❤️❤️❤️</div>
      <button class="reset-btn" id="resetBtn">↻ Reset</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <main class="card">
    <div class="qmeta">
      <span id="counter">Question 1/15</span>
      <span class="tag">5 lives</span>
    </div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>
  </main>
  <div class="footer">Reset = shuffle questions + shuffle answer choices</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="summary" id="summary"></div>
    <div class="mistakes" id="mistakes"></div>
    <div class="modal-actions">
      <button class="primary" id="restartBtn">Làm lại từ đầu</button>
      <button class="secondary" id="closeBtn">Đóng</button>
    </div>
  </div>
</div>

<script>
const QUESTION_BANK = [
  {
    "id": 1,
    "q": "Only suitably __________ applicants will be invited to join the ASEAN student leadership programme.",
    "choices": [
      "qualification",
      "qualify",
      "qualified",
      "qualifying"
    ],
    "answer": "qualified",
    "explanation": "Qualified là tính từ, nghĩa là đủ năng lực/đủ tiêu chuẩn. Nó đứng trước danh từ applicants để bổ nghĩa. → qualified applicants = những ứng viên đủ tiêu chuẩn. Qualify = động từ; qualification = danh từ; qualifying không phù hợp nghĩa trong ngữ cảnh này."
  },
  {
    "id": 2,
    "q": "The organisers hired a professional __________ to create the visual style for the cultural festival.",
    "choices": [
      "decoration",
      "decorator",
      "decorative",
      "decorate"
    ],
    "answer": "decorator",
    "explanation": "Sau a professional cần danh từ chỉ người. Decorator = người trang trí/nhà thiết kế trang trí. Decoration = sự/vật trang trí; decorative = có tính trang trí; decorate = trang trí."
  },
  {
    "id": 3,
    "q": "The opinions of ASEAN __________ should be heard when programmes for young people are being developed.",
    "choices": [
      "youth",
      "youthful",
      "youthfulness",
      "youngly"
    ],
    "answer": "youth",
    "explanation": "Youth có thể dùng như danh từ tập hợp, nghĩa là giới trẻ/thanh niên. → the opinions of ASEAN youth = ý kiến của giới trẻ ASEAN. Các phương án còn lại không phù hợp loại từ."
  },
  {
    "id": 4,
    "q": "The exchange programme gives students an opportunity to travel throughout the ASEAN __________ and experience different traditions.",
    "choices": [
      "division",
      "region",
      "section",
      "zone"
    ],
    "answer": "region",
    "explanation": "Region = khu vực/vùng địa lý. ASEAN region là collocation tự nhiên khi nói về khu vực Đông Nam Á. Division/section thường chỉ bộ phận; zone có nghĩa khu vực nhưng không tự nhiên bằng region trong ngữ cảnh này."
  },
  {
    "id": 5,
    "q": "The campaign succeeded __________ attracting hundreds of students to community-service activities.",
    "choices": [
      "at",
      "for",
      "in",
      "on"
    ],
    "answer": "in",
    "explanation": "Cấu trúc cố định: succeed in + V-ing = thành công trong việc làm gì. → succeeded in attracting hundreds of students."
  },
  {
    "id": 6,
    "q": "The programme could not have been successful without the enthusiastic __________ of local teenagers.",
    "choices": [
      "participate",
      "participant",
      "participating",
      "participation"
    ],
    "answer": "participation",
    "explanation": "Sau tính từ enthusiastic cần một danh từ. Participation = sự tham gia. → the enthusiastic participation of local teenagers. Participant = người tham gia; participate = động từ."
  },
  {
    "id": 7,
    "q": "Tomorrow's workshop will __________ issues ranging from cultural diversity to environmental protection.",
    "choices": [
      "achieve",
      "reply",
      "cover",
      "reach"
    ],
    "answer": "cover",
    "explanation": "Cover a topic/issue = đề cập, bao quát một chủ đề. → The workshop will cover issues... Achieve dùng với mục tiêu/thành tựu, không dùng với issues theo nghĩa này."
  },
  {
    "id": 8,
    "q": "Students spent several weeks preparing __________ the international youth forum.",
    "choices": [
      "with",
      "for",
      "on",
      "about"
    ],
    "answer": "for",
    "explanation": "Cấu trúc cố định prepare for something = chuẩn bị cho sự kiện/việc gì. → prepare for the international youth forum."
  },
  {
    "id": 9,
    "q": "Mai is particularly __________ on discovering how young people in other ASEAN countries celebrate traditional festivals.",
    "choices": [
      "interested",
      "curious",
      "keen",
      "enthusiastic"
    ],
    "answer": "keen",
    "explanation": "Cấu trúc cố định be keen on + noun/V-ing = rất thích, hứng thú với việc gì. → keen on discovering... Interested đi với in; curious thường đi với about; enthusiastic thường đi với about."
  },
  {
    "id": 10,
    "q": "Many teenagers have expressed a strong __________ to take part in projects that benefit their communities.",
    "choices": [
      "desire",
      "desirable",
      "desired",
      "desiring"
    ],
    "answer": "desire",
    "explanation": "Sau a strong cần danh từ. Desire to do something = mong muốn làm việc gì. → a strong desire to take part... Desirable = đáng mong muốn; desired = được mong muốn."
  },
  {
    "id": 11,
    "q": "The teacher paid the student a sincere __________ on the quality of her presentation.",
    "choices": [
      "complaint",
      "command",
      "compliment",
      "commentation"
    ],
    "answer": "compliment",
    "explanation": "Pay/give somebody a compliment = khen ai. → paid the student a sincere compliment. Complaint = lời phàn nàn; command = mệnh lệnh."
  },
  {
    "id": 12,
    "q": "Please __________ to the invitation before Friday so that the organisers can finalise the guest list.",
    "choices": [
      "reply",
      "reflect",
      "deliver",
      "announce"
    ],
    "answer": "reply",
    "explanation": "Reply to an invitation/message/email = trả lời lời mời/tin nhắn/email. → reply to the invitation. Lưu ý reply thường đi với giới từ to."
  },
  {
    "id": 13,
    "q": "Greater cooperation in education and trade can support peace and economic __________ throughout the region.",
    "choices": [
      "prosper",
      "prosperity",
      "prosperous",
      "prosperously"
    ],
    "answer": "prosperity",
    "explanation": "Sau economic cần danh từ trong cụm economic prosperity = sự thịnh vượng kinh tế. Prosperous = thịnh vượng (tính từ); prosper = phát triển/thịnh vượng (động từ)."
  },
  {
    "id": 14,
    "q": "By learning a few local greetings, visitors can __________ respect for the culture of their host country.",
    "choices": [
      "show",
      "reply",
      "depend",
      "introduce"
    ],
    "answer": "show",
    "explanation": "Collocation: show respect for somebody/something = thể hiện sự tôn trọng đối với ai/cái gì. → show respect for the culture."
  },
  {
    "id": 15,
    "q": "At the regional forum, a student __________ from Indonesia presented the views of her school delegation.",
    "choices": [
      "participation",
      "organiser",
      "representative",
      "visitor"
    ],
    "answer": "representative",
    "explanation": "Representative = người đại diện. Ngữ cảnh cho biết học sinh này presented the views of her delegation, tức là nói thay mặt đoàn. → a student representative from Indonesia."
  }
];

const $ = id => document.getElementById(id);
let game = [];
let current = 0;
let lives = 5;
let score = 0;
let locked = false;
let mistakes = [];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeGame(){
  return shuffle(QUESTION_BANK).map(item => ({
    ...item,
    shuffledChoices: shuffle(item.choices)
  }));
}

function startGame(){
  game = makeGame();
  current = 0;
  lives = 5;
  score = 0;
  locked = false;
  mistakes = [];
  closeModal();
  updateStats();
  renderQuestion();
}

function updateStats(){
  $("score").textContent = score;
  $("hearts").textContent = "❤️".repeat(lives) + "🖤".repeat(5-lives);
  $("progress").style.width = `${(current/game.length)*100}%`;
}

function renderQuestion(){
  if(current >= game.length){
    finishGame();
    return;
  }
  locked = false;
  const item = game[current];
  $("counter").textContent = `Question ${current+1}/${game.length}`;
  $("question").textContent = item.q;
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("nextBtn").classList.remove("show");
  $("options").innerHTML = "";

  item.shuffledChoices.forEach((choice,index)=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="letter">${String.fromCharCode(65+index)}</span><span>${choice}</span>`;
    btn.addEventListener("click",()=>selectAnswer(choice,btn));
    $("options").appendChild(btn);
  });
  updateStats();
}

function selectAnswer(choice, selectedBtn){
  if(locked) return;
  locked = true;

  const item = game[current];
  const buttons = [...document.querySelectorAll(".option")];
  buttons.forEach(b=>b.disabled=true);

  const isCorrect = choice === item.answer;
  if(isCorrect){
    score++;
    selectedBtn.classList.add("correct");
    $("feedback").className = "feedback show good";
    $("feedback").innerHTML = `<strong>✅ Correct!</strong>${item.explanation}`;
  }else{
    lives--;
    selectedBtn.classList.add("wrong");
    buttons.forEach(btn=>{
      const text = btn.querySelector("span:last-child").textContent;
      if(text === item.answer) btn.classList.add("correct");
    });
    mistakes.push({
      id:item.id,
      q:item.q,
      chosen:choice,
      answer:item.answer
    });
    $("feedback").className = "feedback show bad";
    $("feedback").innerHTML = `<strong>❌ Incorrect. Correct answer: ${item.answer}</strong>${item.explanation}`;
  }
  updateStats();

  if(lives <= 0){
    setTimeout(()=>showGameOver(),450);
    return;
  }

  $("nextBtn").classList.add("show");
  $("nextBtn").textContent = current === game.length-1 ? "Finish →" : "Next →";
}

$("nextBtn").addEventListener("click",()=>{
  current++;
  renderQuestion();
});

$("resetBtn").addEventListener("click", startGame);
$("restartBtn").addEventListener("click", startGame);
$("closeBtn").addEventListener("click", closeModal);

function showGameOver(){
  $("modalTitle").textContent = "💔 Hết 5 tim!";
  $("modalText").textContent = "Em phải làm lại từ đầu. Khi bắt đầu lại, thứ tự câu hỏi và các đáp án A–D sẽ được trộn mới.";
  $("summary").innerHTML = `
    <div><b>${score}</b>Correct</div>
    <div><b>${current+1}</b>Questions attempted</div>
    <div><b>0</b>Lives left</div>`;
  renderMistakes();
  $("modal").classList.add("show");
  $("closeBtn").style.display = "none";
}

function finishGame(){
  $("progress").style.width = "100%";
  $("modalTitle").textContent = score === game.length ? "🏆 Excellent!" : "🎉 Completed!";
  $("modalText").textContent = "Em đã hoàn thành toàn bộ bài luyện tập.";
  $("summary").innerHTML = `
    <div><b>${score}/${game.length}</b>Correct</div>
    <div><b>${Math.round(score/game.length*100)}%</b>Accuracy</div>
    <div><b>${lives}</b>Lives left</div>`;
  renderMistakes();
  $("modal").classList.add("show");
  $("closeBtn").style.display = "block";
}

function renderMistakes(){
  if(!mistakes.length){
    $("mistakes").innerHTML = `<div class="mistake-item"><b>Không có câu sai.</b></div>`;
    return;
  }
  $("mistakes").innerHTML = `<b>Các câu đã sai:</b>` + mistakes.map(m=>`
    <div class="mistake-item">
      <b>Original Q${m.id}</b><br>
      ${m.q}<br>
      <span style="color:#b73737">Your answer: ${m.chosen}</span><br>
      <span style="color:#147a4e">Correct answer: ${m.answer}</span>
    </div>
  `).join("");
}

function closeModal(){
  $("modal").classList.remove("show");
}

startGame();
</script>
</body>
</html>
