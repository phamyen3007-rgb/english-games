<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 3 - Exercise 4 - Option B</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#f4fff9;
  background:
    radial-gradient(circle at 12% 14%,rgba(255,226,111,.18),transparent 18%),
    radial-gradient(circle at 86% 18%,rgba(111,255,198,.15),transparent 20%),
    radial-gradient(circle at 50% 110%,rgba(39,149,119,.24),transparent 36%),
    linear-gradient(145deg,#071c1a,#0e3b32 48%,#123f4d 100%);
}
body:before{
  content:"✨   🌲   ✨   🎵   🌿   ✨";
  position:fixed;
  top:18px;left:0;width:100%;
  text-align:center;
  font-size:25px;
  opacity:.36;
  pointer-events:none;
}
.wrap{width:min(1050px,94%);margin:26px auto}
.card{
  background:rgba(8,31,29,.96);
  border:1px solid rgba(139,236,189,.25);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.28),0 0 30px rgba(83,220,167,.10)
}
.head{
  padding:24px;
  text-align:center;
  background:linear-gradient(95deg,rgba(23,112,83,.96),rgba(28,118,125,.94),rgba(91,100,151,.90));
}
.head h1{
  margin:0;
  color:#fff;
  font-size:clamp(23px,4vw,36px);
  text-shadow:0 0 12px rgba(186,255,221,.55)
}
.head p{margin:8px 0 0;color:#effff7;font-weight:800}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:14px;
  background:rgba(6,24,23,.96)
}
.stat{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(137,227,183,.16);
  border-radius:14px;
  padding:10px;
  text-align:center
}
.stat b{display:block;font-size:19px;color:#fff}
.stat span{font-size:11px;font-weight:800;color:#b9e6d1}
.main{padding:22px}
.progress{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px
}
#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#f0d66a,#57d69a,#6ca6dd);
  transition:.3s
}
.q{
  font-size:21px;
  font-weight:800;
  line-height:1.55;
  margin-bottom:18px;
  color:#f4fff8;
  white-space:pre-line
}
.answers{display:grid;gap:12px}
.ans{
  padding:15px;
  text-align:left;
  font-size:17px;
  border-radius:14px;
  border:1px solid rgba(120,203,166,.28);
  background:#fbfffd;
  color:#24483d;
  cursor:pointer;
  transition:.18s
}
.ans:hover{
  transform:translateY(-1px);
  background:#effaf5;
  border-color:#55bd8f
}
.ans.ok{
  background:#d9f8e6;
  border-color:#39c77a;
  color:#096039
}
.ans.bad{
  background:#ffe0e3;
  border-color:#ef7474;
  color:#8a2424
}
.feedback{
  display:none;
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  background:#f0fbf6;
  border:1px solid #c9e5d8;
  line-height:1.65;
  color:#30483f
}
.feedback.show{display:block}
.next{
  display:none;
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#2a9d72,#477daf);
  color:white;
  font-weight:900;
  font-size:17px;
  cursor:pointer
}
.next.show{display:block}
.summary{
  display:none;
  text-align:center;
  padding:35px;
  color:#effff7
}
.summary.show{display:block}
.summary h2{
  font-size:32px;
  color:#f2dc7b
}
.restart{
  padding:14px 22px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#2a9d72,#477daf);
  color:white;
  font-weight:900;
  cursor:pointer
}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .main{padding:14px}
  .q{font-size:18px}
  .ans{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">

<div class="head">
<h1>GRADE 10 • UNIT 3 • EXERCISE 4</h1>
<p>OPTION B • ENCHANTED FOREST MUSIC NIGHT</p>
</div>

<div class="stats">
<div class="stat"><b id="counter">1/8</b><span>QUESTION</span></div>
<div class="stat"><b id="heart">❤️❤️❤️❤️❤️</b><span>HEARTS</span></div>
<div class="stat"><b id="xp">0</b><span>XP</span></div>
<div class="stat"><b id="combo">0</b><span>COMBO</span></div>
</div>

<div class="main" id="game">
<div class="progress"><div id="bar"></div></div>
<div class="q" id="q"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">NEXT →</button>
</div>

<div class="summary" id="summary">
<div style="font-size:56px">✨🌲🏆</div>
<h2>HOÀN THÀNH!</h2>
<p id="sum"></p>
<button class="restart" onclick="restart()">CHƠI LẠI</button>
</div>

</div>
</div>

<script>
const data=[
{
q:"Question 1\n\na. Yes, I did. The final performance was especially impressive.\nb. Really? What did you like most about it?\nc. I watched the school talent show last night. It was much better than I expected.",
options:["A. a – c – b","B. b – a – c","C. c – a – b","D. c – b – a"],
correct:3,
explain:"(c) mở đầu chủ đề → (b) hỏi thêm “What did you like most?” → (a) trả lời về phần biểu diễn cuối. Vì vậy chọn D."
},
{
q:"Question 2\n\na. That sounds exciting! Are you going to perform alone or with your band?\nb. With my band. We've been practising together for nearly three weeks.\nc. We're going to perform at the school music festival next Saturday.\nd. I hope everything goes well. Good luck with your performance!",
options:["A. c – a – b – d","B. a – b – c – d","C. c – b – a – d","D. b – c – d – a"],
correct:0,
explain:"(c) giới thiệu việc biểu diễn → (a) hỏi “alone or with your band?” → (b) trả lời “With my band” → (d) chúc may mắn. Chọn A."
},
{
q:"Question 3\n\na. Although she was nervous at first, she became more confident after the first song.\nb. Last weekend, my sister took part in her first singing competition.\nc. In the end, she didn't win, but she was proud of her performance.\nd. She had practised for several weeks before the competition.\ne. The experience encouraged her to continue developing her singing skills.",
options:["A. b – a – d – c – e","B. d – b – a – e – c","C. b – d – a – c – e","D. b – d – c – a – e"],
correct:2,
explain:"Mạch thời gian: tham gia cuộc thi → chuẩn bị trước đó → lúc biểu diễn → kết quả → bài học/ảnh hưởng. “In the end” ở (c) báo hiệu gần cuối; “The experience” ở (e) tổng kết. Chọn C."
},
{
q:"Question 4\n\na. Why don't you try playing the guitar? You already have a good sense of rhythm.\nb. I'd like to learn a musical instrument, but I haven't decided which one yet.\nc. That's a good idea. My brother has a guitar, so I can practise with his.\nd. What are you planning to do during the summer holiday?\ne. I'm thinking of joining a music class.",
options:["A. d – b – e – a – c","B. d – e – b – a – c","C. b – d – e – c – a","D. d – e – a – b – c"],
correct:1,
explain:"(d) hỏi kế hoạch → (e) trả lời “joining a music class” → (b) nói cụ thể muốn học nhạc cụ nhưng chưa chọn → (a) đề nghị guitar → (c) đồng ý. Chọn B."
},
{
q:"Question 5\n\nHi Emma,\n\na. When the lights came on, everyone started cheering as the band walked onto the stage.\nb. By the time the concert ended, I had almost lost my voice from singing along.\nc. I went to an outdoor music festival with some classmates last Saturday.\nd. Despite the large crowd, we managed to find a good place near the stage.\ne. It was definitely one of the most enjoyable evenings I've had this year.\n\nWrite back soon,\nAnna",
options:["A. c – d – a – b – e","B. a – c – d – e – b","C. c – a – d – b – e","D. d – c – a – e – b"],
correct:0,
explain:"Mạch thời gian: đi lễ hội → tìm chỗ → ban nhạc lên sân khấu → concert kết thúc → đánh giá cuối. Vì vậy c – d – a – b – e, chọn A."
},
{
q:"Question 6\n\na. As a result, students can become more confident when performing or speaking in front of others.\nb. Learning music can provide teenagers with skills that are useful beyond the classroom.\nc. Group performances, for example, require students to listen carefully and cooperate with one another.\nd. These skills can also help them work more effectively on school projects.\ne. Regular practice also teaches them patience and self-discipline.",
options:["A. b – e – a – c – d","B. c – d – b – e – a","C. b – c – d – e – a","D. e – b – c – a – d"],
correct:2,
explain:"(b) topic sentence → (c) ví dụ về teamwork → (d) “These skills” quy chiếu về kỹ năng ở (c) → (e) bổ sung lợi ích khác → (a) kết quả tổng quát. Chọn C."
},
{
q:"Question 7\n\na. Instead of giving up, he continued practising the difficult parts every evening.\nb. After several weeks, he could finally play the entire piece without making a mistake.\nc. Learning the piano was much more challenging than Nam had expected.\nd. This experience taught him that improvement often requires both patience and effort.\ne. At first, he found it difficult to use both hands at the same time.",
options:["A. c – e – a – b – d","B. e – c – a – d – b","C. c – a – e – b – d","D. a – e – c – b – d"],
correct:0,
explain:"(c) giới thiệu khó khăn → (e) “At first” nêu khó khăn cụ thể → (a) cách giải quyết → (b) “After several weeks” nêu kết quả → (d) “This experience” rút ra bài học. Chọn A."
},
{
q:"Question 8\n\na. The audience became even more excited when the singers invited everyone to sing along.\nb. However, the most memorable part of the evening was the final group performance.\nc. The school concert included a variety of performances, from solo songs to traditional dances.\nd. Overall, the event was a great success and gave students a chance to show their talents.\ne. Several students also performed songs they had written themselves.",
options:["A. c – b – a – e – d","B. e – c – a – b – d","C. c – e – b – a – d","D. c – e – a – d – b"],
correct:2,
explain:"(c) topic sentence → (e) thêm một loại tiết mục → (b) chuyển sang điểm nổi bật → (a) phát triển màn biểu diễn đó → (d) “Overall” kết luận. Chọn C."
}
];

let current=0,hearts=5,xp=0,combo=0,wrong=0,locked=false;
const $=id=>document.getElementById(id);

function updateStats(){
 $("counter").textContent=(current+1)+"/"+data.length;
 $("heart").textContent="❤️".repeat(hearts)+"🖤".repeat(Math.max(0,5-hearts));
 $("xp").textContent=xp;
 $("combo").textContent=combo;
 $("bar").style.width=(current/data.length*100)+"%";
}

function render(){
 locked=false;
 updateStats();

 const item=data[current];
 $("q").textContent=item.q;
 $("answers").innerHTML="";
 $("feedback").className="feedback";
 $("feedback").textContent="";
 $("next").className="next";

 item.options.forEach((opt,index)=>{
  const btn=document.createElement("button");
  btn.className="ans";
  btn.textContent=opt;
  btn.onclick=()=>choose(index,btn);
  $("answers").appendChild(btn);
 });
}

function choose(index,btn){
 if(locked)return;
 const item=data[current];

 if(index===item.correct){
  locked=true;
  btn.classList.add("ok");
  [...$("answers").children].forEach(b=>b.disabled=true);

  combo++;
  let gain=combo>=3?20:combo>=2?15:10;
  xp+=gain;

  $("feedback").innerHTML=
   "✅ <strong>Chính xác!</strong><br>"+
   item.explain+
   "<br><strong>+"+gain+" XP</strong>";

  $("feedback").classList.add("show");
  updateStats();

  $("next").classList.add("show");
  $("next").textContent=current===data.length-1?"XEM KẾT QUẢ →":"NEXT →";

 }else{
  btn.classList.add("bad");
  btn.disabled=true;

  hearts--;
  wrong++;
  combo=0;
  updateStats();

  $("feedback").innerHTML=
   "❌ <strong>Chưa đúng.</strong> Em hãy chọn lại. Chỉ được qua câu khi chọn đúng.";
  $("feedback").classList.add("show");

  if(hearts<=0){
   setTimeout(()=>{
    alert("💔 Hết 5 trái tim! Em phải làm lại từ câu 1.");
    restart();
   },300);
   return;
  }

  setTimeout(()=>{
   btn.classList.remove("bad");
   btn.disabled=false;
  },500);
 }
}

$("next").onclick=()=>{
 if(current<data.length-1){
  current++;
  render();
 }else{
  finish();
 }
};

function finish(){
 $("bar").style.width="100%";
 $("game").style.display="none";
 $("summary").classList.add("show");

 $("sum").innerHTML=
  "Em đã hoàn thành <strong>"+data.length+" câu</strong>.<br>"+
  "XP: <strong>"+xp+"</strong> • Số lần chọn sai: <strong>"+wrong+"</strong><br>"+
  "✨ Forest Music mission complete!";
}

function restart(){
 current=0;
 hearts=5;
 xp=0;
 combo=0;
 wrong=0;
 locked=false;

 $("summary").classList.remove("show");
 $("game").style.display="block";
 render();
}

render();
</script>
</body>
</html>
