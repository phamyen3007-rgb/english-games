<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (1-20) - Option C</title>
<style>
*{box-sizing:border-box}
:root{--ink:#261b16;--lava:#d64a22;--ember:#f08a26;--ash:#38302c;--sand:#f7e2b8;--green:#2f9f65;--red:#c92f3c}
body{
  margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 50% 110%,#ff9b3d 0 12%,transparent 12.5%),
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.18),transparent 22%),
    linear-gradient(150deg,#33241e,#6a2d20 48%,#1f1b1a);
}
.wrap{max-width:1120px;margin:auto}
.hero{
  background:linear-gradient(120deg,#1d1a19,#51271f 55%,#9b3a20);
  color:#fff;border-radius:28px 28px 0 0;padding:24px 28px;
  box-shadow:0 18px 50px #0008;position:relative;overflow:hidden
}
.hero:after{content:"🌋";position:absolute;right:5%;top:-22px;font-size:150px;opacity:.14}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}
h1{margin:0;color:#ffd087;font-size:clamp(28px,4vw,43px)}
.sub{margin-top:7px;color:#ffe7cf;font-weight:900}
.sound{border:1px solid #ffd49c;background:#fff4dc;color:#612d20;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}

.game{background:#fffaf0;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 20px 55px #0005}
.status{
  display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
  background:#f4dfc6;padding:14px 20px;border-bottom:1px solid #d9bc97
}
.track{height:13px;background:#d9c3aa;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#d64a22,#f08a26,#f2c65d);transition:.3s}
.pill{background:#fff;border:1px solid #dbc6ae;border-radius:99px;padding:8px 13px;font-weight:900}
.hearts{letter-spacing:2px;font-size:20px;white-space:nowrap}
.main{padding:20px}
.quiz{background:#fff;border:2px solid #ead8c4;border-radius:20px;padding:22px}
.tag{display:inline-block;background:linear-gradient(90deg,#772e20,#d64a22);color:white;border-radius:10px;padding:8px 13px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:18px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{
  border:2px solid #e7d8ca;background:#fffdf9;border-radius:14px;padding:15px;text-align:left;
  font-size:16px;color:var(--ink);cursor:pointer;transition:.15s
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#e07c42;background:#fff7ee}
.ans.correct{background:#eafff1;border-color:var(--green)}
.ans.wrong{background:#fff0f2;border-color:var(--red)}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}
.feedback.good{display:block;background:#eafff1;border-left:5px solid var(--green)}
.feedback.bad{display:block;background:#fff0f2;border-left:5px solid var(--red)}
.bonus{display:none;margin-top:10px;padding:11px 13px;border-radius:12px;background:#fff3c8;border-left:5px solid #e4ac2f;font-weight:900}
.controls{text-align:right;margin-top:14px}
.next{display:none;border:0;border-radius:12px;padding:12px 21px;background:linear-gradient(90deg,#7c3020,#d64a22);color:#fff;font-weight:900;cursor:pointer}

.restartOverlay{
  display:none;position:fixed;inset:0;background:#16100ed9;z-index:50;align-items:center;justify-content:center;padding:20px
}
.restartOverlay.show{display:flex}
.restartBox{
  max-width:520px;width:100%;background:#fff7e8;border:3px solid #e76b2e;border-radius:24px;
  padding:30px;text-align:center;box-shadow:0 25px 70px #0008
}
.restartBox .bigIcon{font-size:80px}.restartBox h2{color:#a43720}
.restartBtn{border:0;border-radius:12px;padding:13px 22px;background:#a43720;color:white;font-weight:900;cursor:pointer}

.result{display:none;background:#fffaf0;border-radius:28px;padding:36px;text-align:center;box-shadow:0 20px 55px #0005}
.result.show{display:block}
.scoreBig{font-size:62px;font-weight:1000;color:#a43720}
.review{text-align:left;margin-top:24px}
.reviewItem{padding:13px 15px;margin:9px 0;border-radius:12px;background:#f5e9da;border-left:5px solid #d64a22;line-height:1.55}
.restartAgain{border:0;border-radius:12px;padding:12px 21px;background:#7c3020;color:white;font-weight:900;cursor:pointer}

@media(max-width:820px){
  .answers{grid-template-columns:1fr}
  .heroRow{flex-direction:column;align-items:flex-start}
  .status{grid-template-columns:1fr 1fr}
  .track{grid-column:1/-1;order:4}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="heroRow">
  <div class="brand">
   <div class="icon">🌋🧗</div>
   <div>
    <h1>Volcano Survival Quest</h1>
    <div class="sub">Grade 11 - Unit 3 - Exercise 1 (1-20) - Option C</div>
   </div>
  </div>
  <button id="sound" class="sound">🔊 Sound On</button>
 </div>
</header>

<section id="game" class="game">
 <div class="status">
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div>
  <div class="pill">🔥 Streak <span id="streak">0</span></div>
  <div class="pill">🔁 Restarts <span id="restarts">0</span></div>
 </div>

 <main class="main">
  <section class="quiz">
   <div id="tag" class="tag"></div>
   <div id="question" class="q"></div>
   <div id="answers" class="answers"></div>
   <div id="feedback" class="feedback"></div>
   <div id="bonus" class="bonus"></div>
   <div class="controls"><button id="next" class="next">NEXT →</button></div>
  </section>
 </main>
</section>

<section id="result" class="result">
 <div style="font-size:82px">🌋🏆🧗</div>
 <h2>You Survived the Volcano!</h2>
 <div id="final" class="scoreBig"></div>
 <p id="message"></p>
 <button class="restartAgain" onclick="location.reload()">PLAY AGAIN ↻</button>
 <div id="review" class="review"></div>
</section>
</div>

<div id="restartOverlay" class="restartOverlay">
 <div class="restartBox">
  <div class="bigIcon">💥🌋</div>
  <h2>Out of Hearts!</h2>
  <p>You lost all 5 hearts. The expedition must restart from Question 1.</p>
  <p><b>Restart count:</b> <span id="restartCountBox">1</span></p>
  <button id="restartBtn" class="restartBtn">RESTART FROM QUESTION 1 ↻</button>
 </div>
</div>

<script>
const Q=[{"q": "The city council plans to ______ a collection of energy-saving inventions at next month's environmental event.", "o": ["perform", "interact", "exhibit", "predict"], "a": 2, "e": "<b>Exhibit</b> = trưng bày. → <i>exhibit a collection of inventions</i>."}, {"q": "Although residents were doubtful at first, the newly renovated neighbourhood now ______ much safer and more welcoming at night.", "o": ["feels", "remains", "turns", "appears"], "a": 0, "e": "<b>Feel + adjective</b> là cấu trúc linking verb. → <i>feels much safer</i>."}, {"q": "Expanding the underground railway could help relieve traffic ______ on major roads leading into the city centre.", "o": ["transport", "congestion", "circulation", "infrastructure"], "a": 1, "e": "Collocation: <b>traffic congestion</b> = ùn tắc giao thông."}, {"q": "Rooftop gardens are becoming increasingly popular among city ______ who have little space for growing plants at ground level.", "o": ["commuters", "pedestrians", "dwellers", "developers"], "a": 2, "e": "<b>City dwellers</b> = cư dân thành phố."}, {"q": "The city's waste collection system needs to operate more ______ if the growing amount of household rubbish is to be properly managed.", "o": ["efficiency", "efficient", "efficiencies", "efficiently"], "a": 3, "e": "Sau động từ <b>operate</b> cần trạng từ → <b>efficiently</b>."}, {"q": "Better coordination between buses and trains can significantly improve the ______ of the entire public transport network.", "o": ["efficiency", "efficient", "efficiently", "inefficient"], "a": 0, "e": "Sau <i>the</i> cần danh từ → <b>efficiency</b>."}, {"q": "Without adequate ______, rapidly growing cities may struggle to provide residents with clean water, electricity, and reliable transport.", "o": ["architecture", "accommodation", "infrastructure", "construction"], "a": 2, "e": "<b>Infrastructure</b> = cơ sở hạ tầng, gồm hệ thống nước, điện, giao thông..."}, {"q": "The river initially ______ clean after the environmental project, but further tests revealed that some pollutants were still present.", "o": ["tasted", "looked", "became", "remained"], "a": 1, "e": "<b>Look + adjective</b> = trông có vẻ... → <i>looked clean</i>."}, {"q": "By using buses instead of private cars for daily journeys, commuters can considerably reduce their carbon ______.", "o": ["emissions", "footprint", "consumption", "pollution"], "a": 1, "e": "Collocation: <b>carbon footprint</b> = lượng khí thải carbon gắn với một cá nhân/hoạt động."}, {"q": "Despite the rapid construction of modern apartment blocks, the old quarter has ______ remarkably peaceful and attractive.", "o": ["turned", "grown", "remained", "become"], "a": 2, "e": "<b>Remain + adjective</b> = vẫn giữ trạng thái. → <i>has remained peaceful</i>."}, {"q": "Hundreds of visitors attended the ______ to learn about environmentally friendly technologies for future cities.", "o": ["urban sustainable technology exhibition", "sustainable urban technology exhibition", "technology sustainable urban exhibition", "exhibition urban sustainable technology"], "a": 1, "e": "Trật tự đúng: <b>sustainable + urban + technology + exhibition</b>."}, {"q": "The council has introduced stricter building regulations to prevent further loss of natural ______ around the edge of the city.", "o": ["emission", "infrastructure", "consumption", "vegetation"], "a": 3, "e": "<b>Vegetation</b> = thảm thực vật. → <i>loss of natural vegetation</i>."}, {"q": "Unless countries reduce their dependence on ______, achieving long-term climate targets will remain extremely difficult.", "o": ["solar power", "fossil fuels", "renewable resources", "clean energy"], "a": 1, "e": "<b>Fossil fuels</b> = nhiên liệu hoá thạch, nguồn phát thải lớn."}, {"q": "New residential buildings are increasingly ______, allowing heating, lighting, and security systems to operate automatically.", "o": ["computer-controlled", "densely-populated", "architect-designed", "heat-resistant"], "a": 0, "e": "<b>Computer-controlled</b> = được điều khiển bằng máy tính, phù hợp với các hệ thống hoạt động tự động."}, {"q": "Improving affordable housing, sanitation, and access to public services can significantly raise the ______ of people living in disadvantaged urban areas.", "o": ["living habits", "living expenses", "living conditions", "living arrangements"], "a": 2, "e": "Collocation: <b>living conditions</b> = điều kiện sống."}],L=["A","B","C","D"];
const MAX_HEARTS=5;
const BONUS_QUESTIONS=[5,10,15];

let i=0,hearts=MAX_HEARTS,streak=0,restarts=0;
let correctFirstTry=0;
let attempts=Array(Q.length).fill(0);
let completed=Array(Q.length).fill(false);
let soundOn=true,audioCtx;
const $=id=>document.getElementById(id);

function tone(f,d=.1,delay=0){
 if(!soundOn)return;
 if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();
 if(audioCtx.state==="suspended")audioCtx.resume();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+delay;
 o.frequency.value=f;o.type="triangle";
 g.gain.setValueAtTime(.001,s);
 g.gain.exponentialRampToValueAtTime(.04,s+.01);
 g.gain.exponentialRampToValueAtTime(.001,s+d);
 o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+d+.03)
}
function good(){tone(620,.08);tone(820,.1,.07);tone(1040,.12,.14)}
function bad(){tone(150,.22)}
function bonusSound(){tone(760,.08);tone(980,.1,.08);tone(1240,.13,.16)}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";
 if(soundOn)tone(440,.05)
};

function updateStatus(){
 $("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(MAX_HEARTS-hearts);
 $("streak").textContent=streak;
 $("restarts").textContent=restarts;
 $("bar").style.width=(i/Q.length*100)+"%";
}

function render(){
 const x=Q[i];
 $("tag").textContent="Checkpoint "+(i+1)+" / "+Q.length;
 $("question").textContent=x.q;
 $("answers").innerHTML="";
 $("feedback").className="feedback";
 $("feedback").style.display="none";
 $("bonus").style.display="none";
 $("next").style.display="none";
 updateStatus();

 x.o.forEach((v,n)=>{
   const b=document.createElement("button");
   b.className="ans";
   b.innerHTML="<b>"+L[n]+".</b> "+v;
   b.onclick=()=>choose(n,b);
   $("answers").appendChild(b);
 });
}

function choose(n,b){
 const x=Q[i];
 attempts[i]++;

 if(n!==x.a){
   hearts--;
   streak=0;
   b.classList.add("wrong");
   b.disabled=true;
   $("feedback").className="feedback bad";
   $("feedback").style.display="block";
   $("feedback").innerHTML="<b>❌ Sai rồi.</b> Mất 1 tim. Hãy chọn lại cho đến khi đúng.";
   bad();
   updateStatus();

   if(hearts<=0){
     restarts++;
     $("restarts").textContent=restarts;
     $("restartCountBox").textContent=restarts;
     setTimeout(()=>$("restartOverlay").classList.add("show"),250);
   }
   return;
 }

 // Correct
 completed[i]=true;
 streak++;
 if(attempts[i]===1) correctFirstTry++;
 document.querySelectorAll(".ans").forEach(btn=>btn.disabled=true);
 b.classList.add("correct");

 $("feedback").className="feedback good";
 $("feedback").style.display="block";
 $("feedback").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;
 good();

 const qNum=i+1;
 if(BONUS_QUESTIONS.includes(qNum)){
   const before=hearts;
   hearts=Math.min(MAX_HEARTS,hearts+1);
   if(hearts>before){
     $("bonus").innerHTML="🎁 BONUS HEART! +1 ❤️";
   }else{
     $("bonus").innerHTML="🎁 BONUS CHECKPOINT! Bạn đã đủ 5 ❤️ nên tim được giữ ở mức tối đa.";
   }
   $("bonus").style.display="block";
   bonusSound();
 }

 updateStatus();
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("next").style.display="inline-block";
 $("next").textContent=i===Q.length-1?"FINISH →":"NEXT →";
}

$("next").onclick=()=>{
 tone(440,.05);
 if(i<Q.length-1){i++;render()}
 else finish()
};

$("restartBtn").onclick=()=>{
 $("restartOverlay").classList.remove("show");
 i=0;
 hearts=MAX_HEARTS;
 streak=0;
 correctFirstTry=0;
 attempts=Array(Q.length).fill(0);
 completed=Array(Q.length).fill(false);
 render();
};

function finish(){
 $("game").style.display="none";
 $("result").classList.add("show");
 [523,659,784,1047].forEach((f,k)=>tone(f,.13,k*.08));

 $("final").textContent="15 / 15";
 $("message").innerHTML=
   "Completed all checkpoints with <b>"+restarts+"</b> restart(s).<br>"+
   "First-try correct answers: <b>"+correctFirstTry+"/15</b>.";

 let h="<h3>🌋 Final Review</h3>";
 Q.forEach((x,k)=>{
   h+='<div class="reviewItem"><b>Question '+(k+1)+'</b> — Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>';
 });
 $("review").innerHTML=h;
}

render();
</script>
</body>
</html>
