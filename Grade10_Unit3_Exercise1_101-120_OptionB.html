<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 3 - Exercise 1 (101-120) - Option B</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#f4fff8;
  background:
    radial-gradient(circle at 82% 12%,rgba(255,220,94,.28),transparent 18%),
    radial-gradient(circle at 15% 18%,rgba(97,219,140,.20),transparent 22%),
    linear-gradient(145deg,#082f26,#0c5a3e 50%,#164d35 100%);
}
body:before{
  content:"🌿   🍃   🌴   🦜   🍃   🌿";
  position:fixed;top:18px;left:0;width:100%;text-align:center;
  font-size:24px;opacity:.32;pointer-events:none;
}
.wrap{width:min(950px,94%);margin:26px auto}
.card{
  background:rgba(8,42,33,.96);
  border:1px solid rgba(139,232,170,.28);
  border-radius:24px;overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.28)
}
.head{
  padding:24px;text-align:center;
  background:linear-gradient(100deg,rgba(225,177,48,.95),rgba(33,139,84,.96))
}
.head h1{
  margin:0;color:#fff;font-size:clamp(23px,4vw,36px);
  text-shadow:0 2px 10px rgba(0,59,35,.45)
}
.head p{margin:8px 0 0;color:#f5fff4;font-weight:800}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  padding:14px;background:rgba(5,34,27,.96)
}
.stat{
  background:rgba(255,255,255,.08);border:1px solid rgba(160,238,184,.17);
  border-radius:14px;padding:10px;text-align:center
}
.stat b{display:block;font-size:19px;color:#fff}
.stat span{font-size:11px;font-weight:800;color:#bfe8ca}
.main{padding:22px}
.progress{
  height:10px;background:rgba(255,255,255,.08);
  border-radius:20px;overflow:hidden;margin-bottom:22px
}
#bar{
  height:100%;background:linear-gradient(90deg,#efd04d,#4dd082,#29b4a8);
  transition:.3s
}
.q{
  font-size:21px;font-weight:800;line-height:1.55;
  margin-bottom:18px;color:#f5fff7
}
.answers{display:grid;gap:12px}
.ans{
  padding:15px;text-align:left;font-size:17px;border-radius:14px;
  border:1px solid rgba(87,169,119,.30);
  background:#fbfffc;color:#1e4939;cursor:pointer;transition:.18s
}
.ans:hover{
  transform:translateY(-1px);background:#effcf3;border-color:#45a96d
}
.ans.ok{background:#d9f8e6;border-color:#39c77a;color:#096039}
.ans.bad{background:#ffe0e0;border-color:#ef7474;color:#8a2424}
.feedback{
  display:none;margin-top:16px;padding:14px;border-radius:14px;
  background:#f2fff6;border:1px solid rgba(79,167,112,.26);
  line-height:1.6;color:#204b3a
}
.feedback.show{display:block}
.next{
  display:none;width:100%;margin-top:15px;padding:14px;border:0;
  border-radius:14px;background:linear-gradient(90deg,#d4a72f,#238e59);
  color:#fff;font-weight:900;font-size:17px;cursor:pointer
}
.next.show{display:block}
.summary{display:none;text-align:center;padding:35px;color:#effff4}
.summary.show{display:block}
.summary h2{font-size:32px;color:#f0d56e}
.restart{
  padding:14px 22px;border:0;border-radius:14px;
  background:linear-gradient(90deg,#d4a72f,#238e59);
  color:white;font-weight:900;cursor:pointer
}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .main{padding:15px}.q{font-size:18px}.ans{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="head">
<h1>GRADE 10 • UNIT 3 • EXERCISE 1</h1>
<p>(101–120) • OPTION B • TROPICAL JUNGLE CHALLENGE</p>
</div>

<div class="stats">
<div class="stat"><b id="counter">1/15</b><span>QUESTION</span></div>
<div class="stat"><b id="heart">❤️❤️❤️❤️❤️</b><span>HEARTS</span></div>
<div class="stat"><b id="xp">0</b><span>XP</span></div>
<div class="stat"><b id="combo">0</b><span>COMBO</span></div>
</div>

<div class="main" id="game">
<div class="progress"><div id="bar"></div></div>
<div class="q" id="q"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">NEXT →</button>
</div>

<div class="summary" id="summary">
<div style="font-size:55px">🌴🏆</div>
<h2>HOÀN THÀNH!</h2>
<p id="sum"></p>
<button class="restart" onclick="restart()">CHƠI LẠI</button>
</div>
</div>
</div>

<script>
const data=[
{q:"Every _________ in the school talent show received a small gift after the event.",options:["A. judge","B. audience","C. fan","D. participant"],correct:3,explain:"“participant” = người tham gia. Mỗi người tham gia chương trình tài năng đều nhận được một món quà nhỏ."},
{q:"During the traditional ceremony, villagers _________ old songs to honour their ancestors.",options:["A. record","B. chant","C. upload","D. compose"],correct:1,explain:"“chant” = hát/đọc theo nhịp, thường dùng trong các nghi lễ. Vì vậy chọn “chant”."},
{q:"She practised singing every evening, _________ she wanted to improve her voice before the contest.",options:["A. for","B. yet","C. or","D. and"],correct:0,explain:"Ở đây “for” = because, dùng để giải thích lý do: cô ấy luyện hát mỗi tối vì muốn cải thiện giọng trước cuộc thi."},
{q:"The students prepared the stage, _________ they checked all the microphones before the show.",options:["A. but","B. yet","C. and","D. or"],correct:2,explain:"“and” nối hai hành động bổ sung/liên tiếp: chuẩn bị sân khấu và kiểm tra micro."},
{q:"He is very talented, _________ he still practises for several hours every day.",options:["A. for","B. so","C. or","D. but"],correct:3,explain:"Có sự tương phản giữa “very talented” và “still practises for several hours”, nên dùng “but”."},
{q:"You can perform a solo song, _________ you can join a group performance.",options:["A. or","B. so","C. yet","D. for"],correct:0,explain:"“or” = hoặc, dùng để đưa ra hai lựa chọn: hát solo hoặc tham gia biểu diễn nhóm."},
{q:"The singer was extremely nervous, _________ she managed to finish the song successfully.",options:["A. and","B. yet","C. for","D. so"],correct:1,explain:"“yet” = tuy nhiên, diễn tả sự tương phản bất ngờ: rất lo lắng nhưng vẫn hoàn thành bài hát."},
{q:"The final performance was excellent, _________ the judges gave the group the highest score.",options:["A. but","B. for","C. so","D. yet"],correct:2,explain:"“so” = vì vậy, diễn tả kết quả: màn trình diễn xuất sắc nên giám khảo cho điểm cao nhất."},
{q:"She did not enjoy singing competitions, _________ she joined one to support her best friend.",options:["A. so","B. and","C. for","D. but"],correct:3,explain:"Không thích thi hát nhưng vẫn tham gia để ủng hộ bạn thân → quan hệ tương phản, dùng “but”."},
{q:"The band wanted to perform well, _________ they spent several weeks preparing for the concert.",options:["A. so","B. yet","C. or","D. for"],correct:0,explain:"Ban nhạc muốn biểu diễn tốt, vì vậy họ dành nhiều tuần chuẩn bị. “so” diễn tả kết quả."},
{q:"The composer wrote a new song, _________ the band later performed it at the school festival.",options:["A. yet","B. and","C. but","D. or"],correct:1,explain:"“and” nối hai hành động liên quan theo trình tự: sáng tác bài hát rồi ban nhạc biểu diễn bài đó."},
{q:"The young singer wanted to win, _________ her final performance was not strong enough.",options:["A. so","B. for","C. but","D. and"],correct:2,explain:"Muốn chiến thắng nhưng màn trình diễn cuối chưa đủ tốt → quan hệ tương phản, dùng “but”."},
{q:"The group delayed the recording, _________ they wanted to practise the difficult part again.",options:["A. yet","B. so","C. and","D. for"],correct:3,explain:"Ở đây “for” = because, đưa ra lý do cho việc trì hoãn thu âm."},
{q:"The competition was difficult, _________ our school team still reached the final round.",options:["A. yet","B. so","C. for","D. or"],correct:0,explain:"“difficult” tương phản với “still reached the final round”, nên dùng “yet”."},
{q:"Not only did he compose the song, _________ he also performed it at the concert.",options:["A. or","B. but","C. for","D. yet"],correct:1,explain:"Cấu trúc cố định “not only ... but also ...” = không những... mà còn..."}
];

const bonusQuestions=new Set([3,6,9,12]);
let current=0,hearts=5,xp=0,combo=0,wrong=0,locked=false;
let bonusGiven=new Set();
const $=id=>document.getElementById(id);

function updateStats(){
 $("counter").textContent=(current+1)+"/"+data.length;
 $("heart").textContent="❤️".repeat(hearts)+"🖤".repeat(Math.max(0,5-hearts));
 $("xp").textContent=xp;$("combo").textContent=combo;
 $("bar").style.width=(current/data.length*100)+"%";
}
function render(){
 locked=false;updateStats();
 const item=data[current];
 $("q").textContent="Question "+(current+1)+". "+item.q;
 $("answers").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("next").className="next";
 item.options.forEach((opt,index)=>{
  const btn=document.createElement("button");
  btn.className="ans";btn.textContent=opt;
  btn.onclick=()=>choose(index,btn);
  $("answers").appendChild(btn);
 });
}
function choose(index,btn){
 if(locked)return;
 const item=data[current];

 if(index===item.correct){
  locked=true;btn.classList.add("ok");
  [...$("answers").children].forEach(b=>b.disabled=true);

  combo++;
  let gain=combo>=3?20:combo>=2?15:10;
  xp+=gain;

  let bonusText="";
  const qNo=current+1;
  if(bonusQuestions.has(qNo)&&!bonusGiven.has(qNo)){
   bonusGiven.add(qNo);
   if(hearts<5){
    hearts++;
    bonusText="<br>💖 <strong>Bonus +1 tim!</strong>";
   }else{
    bonusText="<br>💖 <strong>Câu bonus! Tim đang đầy 5/5.</strong>";
   }
  }

  $("feedback").innerHTML="✅ <strong>Chính xác!</strong><br>"+item.explain+bonusText+"<br><strong>+"+gain+" XP</strong>";
  $("feedback").classList.add("show");
  updateStats();
  $("next").classList.add("show");
  $("next").textContent=current===data.length-1?"XEM KẾT QUẢ →":"NEXT →";

 }else{
  btn.classList.add("bad");
  btn.disabled=true;
  hearts--;wrong++;combo=0;
  updateStats();

  $("feedback").innerHTML="❌ <strong>Chưa đúng.</strong> Em hãy chọn lại. Chỉ được qua câu khi chọn đúng.";
  $("feedback").classList.add("show");

  if(hearts<=0){
   setTimeout(()=>{
    alert("💔 Hết 5 trái tim! Em phải làm lại từ câu 1.");
    restart();
   },300);
   return;
  }

  setTimeout(()=>{
   btn.classList.remove("bad");
   btn.disabled=false;
  },500);
 }
}

$("next").onclick=()=>{
 if(current<data.length-1){
  current++;
  render();
 }else{
  finish();
 }
};

function finish(){
 $("bar").style.width="100%";
 $("game").style.display="none";
 $("summary").classList.add("show");

 $("sum").innerHTML=
  "Em đã hoàn thành <strong>"+data.length+" câu</strong>.<br>"+
  "XP: <strong>"+xp+"</strong> • Số lần chọn sai: <strong>"+wrong+"</strong><br>"+
  "🌴 Jungle mission complete!";
}

function restart(){
 current=0;hearts=5;xp=0;combo=0;wrong=0;locked=false;
 bonusGiven=new Set();
 $("summary").classList.remove("show");
 $("game").style.display="block";
 render();
}

render();
</script>
</body>
</html>
