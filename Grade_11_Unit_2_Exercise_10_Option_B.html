<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 11 - Unit 2 - Exercise 10 - Option B</title>
<style>
:root{
 --black:#0d0d12;--panel:#171720;--panel2:#222230;--violet:#8b5cf6;--ghost:#d9d6ff;
 --blue:#6ea8fe;--green:#54d6a0;--red:#ff6677;--gold:#f4cc70;--text:#f7f5ff;--muted:#b8b3c8
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
   radial-gradient(circle at 15% 15%,rgba(139,92,246,.16),transparent 25%),
   radial-gradient(circle at 85% 18%,rgba(110,168,254,.12),transparent 24%),
   linear-gradient(180deg,#09090d,#111119 58%,#07070a);
 padding:18px;overflow-x:hidden
}
.ghost-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fog{position:absolute;width:70vw;height:22vh;border-radius:50%;background:rgba(255,255,255,.045);filter:blur(42px);animation:fogmove 16s ease-in-out infinite}
.f1{left:-20%;top:10%}.f2{right:-20%;top:38%;animation-delay:4s}.f3{left:8%;bottom:2%;animation-delay:8s}
@keyframes fogmove{50%{transform:translateX(12%) translateY(10px);opacity:.65}}
.ghost{position:absolute;font-size:42px;opacity:.28;animation:float 7s ease-in-out infinite}
.g1{left:7%;top:20%}.g2{right:8%;top:28%;animation-delay:2s}.g3{left:48%;bottom:8%;animation-delay:4s}
@keyframes float{50%{transform:translateY(-18px) rotate(5deg)}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.ghost-icon{width:110px;height:110px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 18px rgba(217,214,255,.22))}
.spirit{
 width:70px;height:72px;border-radius:50% 50% 35% 35%;
 background:linear-gradient(180deg,#f4f2ff,#b8b1d8);
 position:relative;box-shadow:0 0 25px rgba(217,214,255,.25)
}
.spirit:before,.spirit:after{content:"";position:absolute;bottom:-12px;width:25px;height:25px;background:#b8b1d8;border-radius:50%}
.spirit:before{left:5px}.spirit:after{right:5px}
.eye{position:absolute;top:24px;width:10px;height:14px;border-radius:50%;background:#252331}
.eye.l{left:19px}.eye.r{right:19px}
.mouth{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:18px;height:9px;border-bottom:3px solid #3a3548;border-radius:0 0 50% 50%}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#f4f2ff,#bcb5ff,#7aa7ff,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:#c0bbcb;font-weight:700}
.sound{border:1px solid rgba(139,92,246,.4);background:#1b1b27;color:#f2edff;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(139,92,246,.22);border-radius:24px;box-shadow:0 24px 65px rgba(0,0,0,.5);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:#11111a}
.barbox{height:13px;background:#09090f;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#c3b8ff,#8b5cf6,#6ea8fe);transition:.3s}
.chip{background:#1d1d28;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#12121b;border:2px solid #2f2b43;border-radius:18px;padding:18px;max-height:560px;overflow:auto;line-height:1.75}
.passage h3{margin:0 0 10px;color:#cfc8ff}
.quizbox{background:#161620;border:2px solid #312d44;border-radius:18px;padding:18px}
.tag{display:inline-block;background:#252239;color:#d9d3ff;padding:7px 12px;border-radius:10px;font-weight:900}
.question{font-size:23px;line-height:1.5;margin:16px 0}
.options{display:grid;gap:12px}
.option{width:100%;padding:14px 15px;border:2px solid #353247;border-radius:14px;background:#20202a;color:#f7f5ff;text-align:left;font-size:17px;line-height:1.45;cursor:pointer;transition:.16s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:#8b5cf6;box-shadow:0 8px 18px rgba(139,92,246,.1)}
.option.correct{background:#15392f!important;border-color:var(--green)!important}
.option.wrong{background:#47202a!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#111119;line-height:1.55}
.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#c7bfff,#8fa7ff);color:#1a1730}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}
.scorebig{font-size:58px;font-weight:1000;color:#c9c1ff}
.review{text-align:left;margin-top:24px;border-top:1px solid #2d2b38;padding-top:16px}
.item{padding:12px 14px;background:#14141d;border-radius:12px;margin:9px 0;border-left:5px solid #5b5870;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}
@media(max-width:650px){.hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.ghost-icon{transform:scale(.78);transform-origin:left center;width:85px}}
</style>
</head>
<body>
<div class="ghost-bg">
  <div class="fog f1"></div><div class="fog f2"></div><div class="fog f3"></div>
  <div class="ghost g1">👻</div><div class="ghost g2">👻</div><div class="ghost g3">👻</div>
</div>

<main class="wrap">
<header class="hero">
  <div class="ghost-icon">
    <div class="spirit"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
  </div>
  <div>
    <h1>Ghost Story Reading Challenge</h1>
    <p class="subtitle">Grade 11 · Unit 2 · Exercise 10 · Option B</p>
  </div>
  <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
  <div class="status">
    <div class="barbox"><div class="bar" id="bar"></div></div>
    <div class="chip" id="counter"></div>
    <div class="chip" id="scoreChip"></div>
    <div class="chip" id="heartChip"></div>
  </div>

  <div class="main">
    <div class="passage">
      <h3>👻 Understanding Different Generations</h3>
      <div id="passageText"></div>
    </div>

    <div class="quizbox">
      <div class="tag" id="tag"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="controls"><button id="nextBtn" class="btn" disabled>Next Shadow →</button></div>
    </div>
  </div>
</div>

<div id="resultArea" class="result">
  <div style="font-size:74px">👻🌙</div>
  <h2>Ghost Story Complete!</h2>
  <div id="finalScore" class="scorebig"></div>
  <p id="message"></p>
  <button id="restartBtn" class="btn">Play Again ↻</button>
  <div id="review" class="review"></div>
</div>
</section>
</main>

<script>
const passage = "In modern families, differences between generations are becoming more noticeable. Teenagers are often influenced by technology, social media, and global trends, while their parents may prefer more traditional ways of thinking. These differences can create tension, especially when family members fail to (1) ____________.\n\nMany young people want greater independence and freedom to make their own decisions. At the same time, parents may worry that their children are not experienced enough to handle difficult situations. Because of this, (2) ____________.\n\nThis generation, (3) ____________, tends to value personal choice and open communication. They often expect adults to explain rules instead of simply asking them to obey.\n\nHowever, disagreements do not always damage family relationships. (4) ____________. When both sides remain calm and respectful, they can understand each other better and find solutions together.\n\n(5) ____________. The generation gap may never disappear completely, but strong communication can prevent small differences from becoming serious conflicts.";
const questions = [{"q": "Question 1", "options": ["keep their opinions completely private", "communicate openly with one another", "avoid discussing important family matters", "depend entirely on social media"], "answer": 1, "explanation": "Câu nói mâu thuẫn xuất hiện khi các thành viên không giao tiếp cởi mở với nhau. Vì vậy “communicate openly with one another” phù hợp nhất."}, {"q": "Question 2", "options": ["children should always follow every decision made by adults", "parents rarely become concerned about their children's choices", "conflicts may arise when the two sides have different expectations", "young people gradually lose interest in becoming independent"], "answer": 2, "explanation": "Cha mẹ lo lắng trong khi con muốn tự quyết, nên sự khác biệt về kỳ vọng dễ gây xung đột."}, {"q": "Question 3", "options": ["having grown up with easy access to information", "who grow up with technology but prefers traditional values", "which has influenced by rapid social development", "being grow up in a highly connected world"], "answer": 0, "explanation": "“having + V3” là cấu trúc đúng ngữ pháp. “having grown up...” bổ sung trải nghiệm của thế hệ này."}, {"q": "Question 4", "options": ["Although respect is important, arguments should be encouraged", "Parents should avoid listening when children become emotional", "Young people usually solve conflicts by refusing to talk", "In fact, respectful conversations can help reduce misunderstandings"], "answer": 3, "explanation": "Câu sau nói hai bên bình tĩnh và tôn trọng sẽ hiểu nhau hơn, nên đáp án D liên kết tốt nhất."}, {"q": "Question 5", "options": ["Therefore, families should completely remove all traditional rules", "Mutual respect is one of the keys to maintaining healthy family relationships", "Younger generations will eventually replace all older values", "The best solution is to avoid differences whenever possible"], "answer": 1, "explanation": "Đây là câu kết phù hợp với thông điệp toàn bài: giao tiếp và tôn trọng giúp giảm khoảng cách thế hệ."}];
const letters=["A","B","C","D"];

let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq,duration=.1,type="sine",volume=.04,delay=0){
  if(!soundOn)return;
  const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,s);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(volume,s+.01);
  g.gain.exponentialRampToValueAtTime(.0001,s+duration);
  o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03);
}
function correctSound(){tone(430,.08,"triangle",.03);tone(680,.12,"sine",.03,.08)}
function wrongSound(){tone(140,.18,"sawtooth",.035);tone(80,.24,"square",.02,.12)}
function nextSound(){tone(300,.07,"triangle",.018);tone(460,.08,"triangle",.016,.06)}
function finishSound(){[330,440,550,660].forEach((f,i)=>tone(f,.18,"triangle",.028,i*.1))}

$("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
  if(soundOn)nextSound();
};

function render(){
  answered=false;
  $("nextBtn").disabled=true;
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  const q=questions[current];

  $("tag").textContent=`Question ${current+1}`;
  $("question").textContent=q.q;
  $("counter").textContent=`Câu ${current+1}/${questions.length}`;
  $("scoreChip").textContent=`👻 ${score} XP · Combo ${combo}`;
  $("heartChip").textContent=`❤️ ${hearts}`;
  $("bar").style.width=`${current/questions.length*100}%`;
  $("options").innerHTML="";

  q.options.forEach((op,index)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<strong>${letters[index]}.</strong> ${op}`;
    b.onclick=()=>choose(index);
    $("options").appendChild(b);
  });

  $("nextBtn").textContent=current===questions.length-1?"Finish Story 👻":"Next Shadow →";
}

function choose(index){
  if(answered)return;
  answered=true;

  const q=questions[current];
  const buttons=[...document.querySelectorAll(".option")];
  const correct=index===q.answer;

  buttons.forEach(b=>b.disabled=true);
  buttons[q.answer].classList.add("correct");

  if(correct){
    score+=10+combo*2;
    combo++;
    $("feedback").className="feedback correct show";
    $("feedback").innerHTML=`<strong>👻 Chính xác! ${letters[q.answer]}. ${q.options[q.answer]}</strong>${q.explanation}`;
    correctSound();
  }else{
    hearts=Math.max(0,hearts-1);
    combo=0;
    buttons[index].classList.add("wrong");
    $("feedback").className="feedback wrong show";
    $("feedback").innerHTML=`<strong>Chưa đúng. Đáp án: ${letters[q.answer]}. ${q.options[q.answer]}</strong>${q.explanation}`;
    wrongSound();
  }

  answers.push({selected:index,correct});
  $("scoreChip").textContent=`👻 ${score} XP · Combo ${combo}`;
  $("heartChip").textContent=`❤️ ${hearts}`;
  $("bar").style.width=`${(current+1)/questions.length*100}%`;
  $("nextBtn").disabled=false;
}

$("nextBtn").onclick=()=>{
  if(!answered)return;
  nextSound();
  if(current<questions.length-1){current++;render();}
  else showResult();
};

function showResult(){
  $("quizArea").style.display="none";
  $("resultArea").classList.add("show");
  const correctCount=answers.filter(a=>a.correct).length;
  $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
  finishSound();

  if(correctCount===5) $("message").textContent="Perfect Ghost Reader! Em đã hoàn thành toàn bộ thử thách.";
  else if(correctCount>=4) $("message").textContent="Excellent reading! Em xử lý rất tốt các liên kết ý.";
  else if(correctCount>=3) $("message").textContent="Good job! Hãy xem lại các câu chưa đúng.";
  else $("message").textContent="Hãy đọc lại passage và thử thêm một lần nữa.";

  let html="<h3>👻 Ghost Story Review</h3>";
  questions.forEach((q,i)=>{
    const a=answers[i];
    html+=`<div class="item ${a&&a.correct?"ok":"no"}"><strong>Câu ${i+1}: ${a&&a.correct?"Đúng":"Sai"}</strong><br>Em chọn: ${a?letters[a.selected]:"-"}. ${a?q.options[a.selected]:""}<br>Đáp án đúng: ${letters[q.answer]}. ${q.options[q.answer]}<br><em>${q.explanation}</em></div>`;
  });
  $("review").innerHTML=html;
}

$("restartBtn").onclick=()=>{
  current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
  $("resultArea").classList.remove("show");
  $("quizArea").style.display="block";
  render();nextSound();
};

$("passageText").innerHTML=passage.split("\n\n").map(p=>`<p>${p}</p>`).join("");
render();
</script>
</body>
</html>
