<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 1 (81-100) - Option B</title>
<style>
:root{--rose:#ff5d8f;--pink:#ff8fbd;--purple:#aa79e8;--green:#40ce8c;--red:#ff6478;--gold:#ffd166;--text:#533545;--muted:#91697d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;color:var(--text);background:radial-gradient(circle at 12% 18%,rgba(255,93,143,.2),transparent 25%),radial-gradient(circle at 86% 15%,rgba(170,121,232,.18),transparent 26%),linear-gradient(145deg,#fff5f8,#f9efff 55%,#fff0f4);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;color:rgba(255,93,143,.6);animation:float linear infinite}.h1{left:6%;bottom:-40px;font-size:32px;animation-duration:10s}.h2{left:22%;bottom:-50px;font-size:20px;animation-duration:8s;animation-delay:2s}.h3{right:10%;bottom:-50px;font-size:40px;animation-duration:12s}.h4{right:30%;bottom:-40px;font-size:24px;animation-duration:9s;animation-delay:3s}@keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:.05}}
.wrap{width:min(1040px,100%);margin:auto;position:relative}.hero{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}.icon{width:100px;height:100px;display:grid;place-items:center;position:relative}.glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,93,143,.3),rgba(170,121,232,.08) 58%,transparent 72%);animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}.env{width:76px;height:54px;border-radius:10px;background:linear-gradient(#fff,#ffd9e8);position:relative;box-shadow:0 10px 25px rgba(185,65,112,.18)}.env:before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0);background:#ffc2d9}.env:after{content:"❤";position:absolute;left:50%;top:28px;transform:translate(-50%,-50%);font-size:25px;color:var(--rose)}
h1{margin:0;font-size:clamp(28px,4vw,46px);background:linear-gradient(90deg,#8e4468,var(--rose),var(--purple),#d1436a);-webkit-background-clip:text;color:transparent}.sub{margin:7px 0 0;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(255,93,143,.4);background:#fff;color:#71465b;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:linear-gradient(#fff,#fff6fa);border:1px solid rgba(255,93,143,.28);border-radius:24px;box-shadow:0 24px 65px rgba(113,58,88,.16);overflow:hidden}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:18px 22px 13px;background:linear-gradient(90deg,#fff0f5,#f5edff)}.barbox{height:13px;background:#f2e5ed;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--rose),var(--purple));transition:.3s}.chip{background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;white-space:nowrap}.content{padding:24px 22px 26px}.tag{display:inline-block;padding:7px 13px;border-radius:9px;background:#fff0f5;border:1px solid rgba(255,93,143,.38);color:#d74978;font-weight:900;margin-bottom:13px}.question{margin:0 0 22px;font-size:clamp(22px,2.8vw,31px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{min-height:72px;border-radius:15px;border:2px solid #ead9e3;background:linear-gradient(135deg,#fff,#fff7fa);color:var(--text);display:flex;align-items:center;gap:13px;padding:16px 17px;font-size:18px;text-align:left;cursor:pointer}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--rose)}.letter{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,#ffd2e2,#dfd0ff)}.correct{background:#eafff4!important;border-color:var(--green)!important}.wrong{background:#fff0f2!important;border-color:var(--red)!important}.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:15px;background:#fff9fb;border-left:5px solid;line-height:1.6}.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--gold)}.controls{display:flex;justify-content:flex-end;margin-top:20px}.action{border:0;border-radius:12px;padding:13px 23px;font-size:17px;font-weight:1000;color:#5d3047;cursor:pointer;background:linear-gradient(90deg,#ffd0e0,#dacbff)}.action:disabled{opacity:.35}.result{display:none;text-align:center;padding:38px 24px}.result.show{display:block}.scorebig{font-size:62px;font-weight:1000;color:var(--rose)}.review{text-align:left;margin-top:25px;border-top:1px solid rgba(100,55,82,.1);padding-top:18px}.item{padding:13px 14px;margin-bottom:10px;border-radius:12px;background:#fff9fc;border-left:5px solid #bca5b1;line-height:1.5}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:760px){.hero{grid-template-columns:80px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.options{grid-template-columns:1fr}.content{padding:18px 15px 22px}}
</style></head>
<body>
<div class="bg"><div class="heart h1">❤</div><div class="heart h2">♡</div><div class="heart h3">❤</div><div class="heart h4">♡</div></div>
<main class="wrap">
<header class="hero"><div class="icon"><div class="glow"></div><div class="env"></div></div><div><h1>Love Stories Learning Quest</h1><p class="sub">Grade 10 · Unit 2 · Exercise 1 (81–100) · Option B</p></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></header>
<section class="card">
<div id="quiz"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="content"><div class="tag" id="tag"></div><h2 class="question" id="q"></h2><div class="options" id="ops"></div><div class="feedback" id="fb"></div><div class="controls"><button class="action" id="next" disabled>Next Chapter 💌</button></div></div></div>
<div class="result" id="result"><div style="font-size:74px" id="icon">💖</div><h2>Love Story Complete</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="action" id="restart">Read Again ↻</button><div class="review" id="review"></div></div>
</section></main>
<script>
const Q=[
["Using public transport instead of private cars can reduce your ____________.",["carbon footprint","electrical appliances","natural disasters","food shortage"],0,"Carbon footprint là lượng khí thải carbon do một người hoặc hoạt động tạo ra.",""],
["People should avoid cutting down forests because it can ____________ wildlife habitats.",["improve","encourage","destroy","protect"],2,"Destroy habitats = phá hủy môi trường sống.",""],
["Everyone should try to reduce their impact ____________ the environment.",["in","on","with","from"],1,"Cụm cố định: have an impact on.",""],
["The old bridge looks unsafe. It ____________ collapse soon.",["will","is going to","has","was going to"],1,"Có dấu hiệu rõ ràng ở hiện tại nên dùng be going to.","The old bridge looks unsafe là bằng chứng hiện tại."],
["Look! The students ____________ trees around the schoolyard.",["plant","planted","are planting","have planted"],2,"Look! cho biết hành động đang diễn ra nên dùng hiện tại tiếp diễn.",""],
["Hurry up, or you ____________ the beginning of the movie.",["miss","are missing","will miss","missed"],2,"Mệnh đề mệnh lệnh + or + will diễn tả kết quả trong tương lai.",""],
["This machine is used ____________ plastic bottles into small pieces.",["recycle","recycled","recycling","to recycle"],3,"Be used to + động từ nguyên mẫu = được dùng để làm gì.",""],
["Please remember ____________ the lights before leaving the classroom.",["turning off","turn off","to turn off","turned off"],2,"Remember to V = nhớ làm một việc chưa thực hiện.",""],
["The volunteers ____________ rubbish on the beach when it suddenly started raining.",["collected","were collecting","have collected","had collected"],1,"Quá khứ tiếp diễn diễn tả hành động đang xảy ra thì có hành động khác xen vào.",""],
["The classroom ____________ before the principal arrived.",["cleaned","was cleaning","had been cleaned","has cleaned"],2,"Hành động bị động xảy ra trước một thời điểm trong quá khứ.","Dùng quá khứ hoàn thành bị động: had been + V3."],
["Our class decided to ____________ a campaign to encourage students to recycle more.",["launch","do","give","collect"],0,"Launch a campaign = phát động một chiến dịch.","Đây là collocation rất phổ biến."],
["The speaker gave an excellent presentation and immediately ____________ everyone's attention.",["attracted","destroyed","collected","reminded"],0,"Attract someone's attention = thu hút sự chú ý của ai.",""],
["Never ____________ food because millions of people still suffer from hunger.",["throw away","turn off","break down","look after"],0,"Throw away food = vứt bỏ thức ăn.",""],
["The new recycling bins ____________ in our school next week.",["install","will install","are going to install","are going to be installed"],3,"Các thùng rác là đối tượng được lắp đặt nên dùng câu bị động tương lai.","Are going to be installed = sẽ được lắp đặt."],
["Are you cold? I ____________ close the window for you.",["am going to","will","was going to","have"],1,"Will được dùng cho quyết định đưa ra ngay tại thời điểm nói.",""]
];
const L=["A","B","C","D"];let i=0,xp=0,hearts=5,combo=0,answered=false,answers=[],sound=true,ctx=null;const $=id=>document.getElementById(id);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d,t="sine",v=.04,delay=0){if(!sound)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
function ok(){tone(523,.09);tone(659,.11,"triangle",.038,.08);tone(988,.16,"sine",.038,.17)}
function bad(){tone(190,.16,"sawtooth",.035);tone(120,.23,"square",.02,.12)}
function go(){tone(440,.055,"triangle",.018);tone(660,.07,"triangle",.016,.055)}
function finish(){[440,523,659,784,1047].forEach((f,n)=>tone(f,.19,"triangle",.03,n*.09))}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(sound)go()}
function render(){answered=false;$("next").disabled=true;$("fb").className="feedback";$("fb").innerHTML="";const q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`💌 ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((o,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${L[n]}</span><span>${o}</span>`;b.onclick=()=>choose(n);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Story 💖":"Next Chapter 💌"}
function choose(n){if(answered)return;answered=true;const q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+combo*2;combo++;bs[n].classList.add("correct");$("fb").className="feedback correct show";$("fb").innerHTML=`<strong>💖 Perfect Match! Chính xác.</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;ok()}else{hearts=Math.max(0,hearts-1);combo=0;bs[n].classList.add("wrong");$("fb").className="feedback wrong show";$("fb").innerHTML=`<strong>💔 Heart Missed. Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;bad()}answers.push({selected:n,right});$("score").textContent=`💌 ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
function showResult(){$("quiz").style.display="none";$("result").classList.add("show");const c=answers.filter(a=>a.right).length;$("final").textContent=`${xp} XP · ${c}/${Q.length}`;finish();const p=c/Q.length*100;if(p===100){$("icon").textContent="🏆💖";$("msg").textContent="Perfect Love Story! Em đã hoàn thành toàn bộ thử thách."}else if(p>=80){$("icon").textContent="💌✨";$("msg").textContent="Wonderful Story! Em đã nắm rất chắc kiến thức."}else if(p>=60){$("icon").textContent="🌹💫";$("msg").textContent="Good Chapter! Hãy xem lại các câu sai để tiến bộ hơn."}else{$("icon").textContent="📘💗";$("msg").textContent="New Chapter! Ôn lại kiến thức rồi thử lại."}let h="<h3>Love Story Review</h3>";Q.forEach((q,n)=>{const a=answers[n];h+=`<div class="item ${a&&a.right?"ok":"no"}"><strong>Câu ${n+1}: ${a&&a.right?"Đúng":"Sai"}</strong><br>Em chọn: ${a?`${L[a.selected]}. ${q[1][a.selected]}`:"Chưa trả lời"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><em>${q[3]}</em>${q[4]?`<div class="details">${q[4]}</div>`:""}</div>`});$("review").innerHTML=h}
$("next").onclick=()=>{if(!answered)return;go();if(i<Q.length-1){i++;render()}else showResult()}
$("restart").onclick=()=>{i=0;xp=0;hearts=5;combo=0;answered=false;answers=[];$("result").classList.remove("show");$("quiz").style.display="block";render();go()}
render();
</script></body></html>
