<script id="lesson-data" type="application/json">[{"id":"u8_ex10_C","unit":8,"unitName":"Wildlife Conservation","exercise":10,"level":"C","title":"Grade 12 Unit 8 - Exercise 10 - Set C","topic":"Evaluating a project from more than activity totals","kind":"listening","questions":[{"number":1,"stem":"What is the lecturer's main purpose?","options":["To explain what different project records can establish","To announce that one planting day restored every habitat","To claim all conservation projects use identical methods","To replace scientific work with a visitor competition"],"answer":0,"explanation":"Toàn bài phân biệt receipts, planting totals, observations và mục tiêu, giúp hiểu mỗi loại chứng cứ trả lời câu hỏi nào."},{"number":2,"stem":"What do the project's receipts establish?","options":["The survival of every animal in the area","How the recorded money was spent","The complete recovery of the whole habitat","The current global category of the study species"],"answer":1,"explanation":"Hóa đơn/chứng từ ghi lại cách chi tiền, hữu ích cho kế toán; chúng không tự chứng minh phục hồi sinh thái."},{"number":3,"stem":"Why are the two bird totals not directly comparable on their own?","options":["The first survey was never recorded in any form","Both surveys used no observers","The later survey used a longer observation period","The same individual birds were all identified and removed"],"answer":2,"explanation":"Audio nêu unequal observation periods; không có kết luận mọi cá thể đã nhận diện hoặc dời đi."},{"number":4,"stem":"How did residents affect the plan?","options":["They decided every animal's medical treatment","They proved that all species had recovered","Their attendance automatically counted as unanimous agreement","Their access concerns led to a route revision"],"answer":3,"explanation":"Người dân giải thích daily route, nhóm sửa map; không đồng nhất dự họp với đồng thuận."},{"number":5,"stem":"What did the team reserve part of its budget for?","options":["Follow-up monitoring","Replacing all original aims after the results appeared","Ending all communication with residents","A guarantee that every target would be reached"],"answer":0,"explanation":"Audio explicitly reserved funds for follow-up, giữ câu hỏi về diễn biến sau các hoạt động."}],"range":"","passage":"","transcript":"In this fictional project review, we ask what each record can establish. The team had receipts, a planting total, two bird counts and notes from a community discussion. The receipts showed how money was spent. They were useful for accounting but did not demonstrate ecological recovery. The planting total showed work completed, while later observations would be needed to assess the plants' condition and use of the habitat. The two bird totals also needed interpretation. Observers spent longer at the site during the second survey, so a higher count could partly reflect extra effort. The totals alone did not settle whether the population had grown. Residents then explained that the first proposed boundary would block a route they used every day. Their concerns led the team to revise the route. Attendance at the discussion was not treated as proof of unanimous agreement. Finally, the team reserved part of its budget for follow-up monitoring. The report could acknowledge completed work and an improved plan while remaining cautious about wider outcomes. A clear account says which question each piece of evidence answers and which questions still require investigation.","wordbank":[],"note":"","filename":"Grade_12_Unit_8_Exercise_10_Set_C.html","audio":"data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OExAAkcs38BnmSnABQHIiQJ8BjIwEgPA/3JR3fsDh4LWmYQQPJ60XbRHbLx9/8RzDECyabRy1kCwuoi8BwtjBQyjpGWDA2fFDKPUckEPSjIrDDke2jbUiSFw22jSFCBBvpAgQMLo0AoZFZuEMXQYjewXPsdtTJo2+oxDJ771RBJiCCKOZG0CYrFYeAAJJzRoGKhNdHI4f/gdSS4EB9ftWkGnRCALzuVVQHAcgHhIgbXEBg61slMMQUQTUYllKv//OExCEm0sYgAMLSQMYT2e3RGshJF5EIbmJ0a5hKBkaBCwoSdweUIEzqwUBMeIxY <script>
'use strict';
const LESSONS=JSON.parse(document.getElementById('lesson-data').textContent);
const DEFAULT_LESSON="u8_ex10_C";
const APPENDIX_HTML="<article><h2>1. Mệnh đề điều kiện: đọc đúng hướng logic<\/h2><p><b>Loại 1:<\/b> If + hiện tại đơn, will/can/may + động từ nguyên mẫu.<br>If the route is approved, the group will begin the survey.<\/p><p><b>Loại 2:<\/b> If + quá khứ đơn, would/could + động từ nguyên mẫu.<br>If the centre had more trained staff, it could provide more care.<\/p><p><b>Unless = if ... not:<\/b><br>Unless the habitat is suitable, the release will not proceed.<br>= If the habitat is not suitable, the release will not proceed.<\/p><p><b>Provided that / as long as:<\/b> với điều kiện là / miễn là.<br><b>Only if:<\/b> nêu điều kiện cần; không tự bảo đảm điều kiện đó là đủ.<br><b>In case:<\/b> phòng khi, diễn tả sự chuẩn bị trước: Take a spare battery in case the first one fails.<\/p><p>Không tự đảo if A, B thành if B, A. Giữ nguyên may/could khi viết lại; không đổi một khả năng thành will certainly.<\/p><\/article>\n<article><h2>2. So sánh: giữ đúng đối tượng và tiêu chí<\/h2><p><b>Hơn:<\/b> adjective-er / more + adjective/adverb + than.<br><b>Ngang bằng:<\/b> as + adjective/adverb + as.<br><b>Không bằng:<\/b> not as + adjective/adverb + as.<br>Route A is shorter than Route B.<br>= Route B is not as short as Route A.<\/p><p><b>Much + so sánh hơn:<\/b> much clearer, much more carefully; không dùng very clearer.<br><b>Fewer:<\/b> danh từ đếm được số nhiều: fewer errors.<br><b>Less:<\/b> lượng không đếm được: less water.<br><b>Bất quy tắc:<\/b> good/well → better; bad/badly → worse.<br><b>Bội số:<\/b> twice as large as.<\/p><p>As long as có thể là liên từ điều kiện hoặc phép so sánh chiều dài. Đọc cả câu để phân biệt. Lớn hơn, rẻ hơn hoặc nhanh hơn không tự chứng minh phù hợp hơn về mọi mặt.<\/p><\/article>\n<article><h2>3. Từ dễ nhầm trong chủ đề bảo tồn<\/h2><p><b>Endangered:<\/b> có nguy cơ tuyệt chủng; <b>dangerous:<\/b> có thể gây nguy hiểm.<br><b>Extinct:<\/b> không còn cá thể sống ở bất kỳ đâu; không suy từ một lần không thấy ở một nơi.<br><b>Vulnerable:<\/b> trong tiếng Anh thông thường là dễ tổn thương; Vulnerable còn là tên một hạng đánh giá chính thức khi dùng trong hệ thống IUCN.<br><b>Criterion → criteria:<\/b> số ít → số nhiều.<br><b>Capacity:<\/b> năng lực/sức chứa; <b>occupancy:<\/b> tình trạng hoặc mức đang sử dụng chỗ.<br><b>Rescue / treatment / release / survival:<\/b> cứu hộ / điều trị / thả / sống sót — các giai đoạn có liên quan nhưng không đồng nhất.<\/p><p>Phân hạng toàn cầu, tình trạng quần thể địa phương và dữ liệu của một đợt khảo sát có phạm vi khác nhau. Bảng loài A/B trong bộ bài là giả định; không dùng nó làm thông tin phân hạng loài thật.<\/p><\/article>\n<article><h2>4. Đọc hiểu và đánh giá bằng chứng<\/h2><p><b>Input:<\/b> tiền, thời gian, nguồn lực.<br><b>Activity:<\/b> cây đã trồng, buổi đã tổ chức, mẫu đã lấy.<br><b>Outcome:<\/b> kết quả liên quan mục tiêu, cần bằng chứng phù hợp theo thời gian.<\/p><p>Một tổng số ghi nhận cao hơn có thể chịu ảnh hưởng của thời lượng và phương pháp khảo sát. Không ghi nhận một con vật không tự chứng minh nó đã chết hoặc không hiện diện. Dữ liệu DNA môi trường phát hiện vật liệu di truyền; không tự là số cá thể sống tại điểm lấy mẫu.<\/p><p>Với câu suy luận, tránh phương án tự thêm all / always / guarantees / proves khi văn bản chỉ nói some / may / supports. Với câu chèn, tìm liên kết ở cả hai phía. Với câu paraphrase, giữ đúng hướng so sánh, điều kiện và mức độ chắc chắn.<\/p><\/article>";

function infoHelp(){document.getElementById('modalTitle').textContent='Cách luyện tập';document.getElementById('modalText').innerHTML='<p>Điền họ tên, chọn phương án rồi bấm <b>Kiểm tra</b>. Mỗi lần chọn sai mất 1 tim; bạn được thử lại. Sau khi đúng, câu được khóa và hiện giải thích.</p><p><b>Điểm /10 tính theo lần chọn đầu</b>. Số câu đã nắm được sau khi thử lại được báo riêng. Đạt 5 câu đúng liên tiếp sẽ hồi 1 tim, tối đa 5 tim.</p><p>Khi làm lại, câu rời và đáp án được trộn. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu để dễ đối chiếu. Kết quả lưu trên trình duyệt đang dùng.</p><p>Set B củng cố kiến thức vừa học. Set C tăng độ khó khoảng 30% theo mục tiêu thiết kế bằng ngữ cảnh, liên kết và suy luận. Set D tăng yêu cầu xử lý bằng chứng, diễn đạt tương đương và đọc hiểu theo hướng THPT 2026. Trọng tâm ngữ pháp: mệnh đề điều kiện, unless, provided that, as long as, in case và các cấu trúc so sánh.</p>';document.getElementById('modalCancel').classList.add('hidden');document.getElementById('modalConfirm').textContent='Đã hiểu';openModal(()=>{});}

function renderHome(){stopClock();stopAudio();active=null;state=null;document.title='Grade 12 Unit 8 - Sets B, C & D';app.innerHTML=`<section class="hero"><div><p class="eyebrow">Grade 12 / Global Success / Unit 8</p><h1>Protect wildlife.<span>Think beyond a number.</span></h1><p class="lead">Wildlife Conservation.<br>Hiểu điều kiện, so sánh và bằng chứng trong bảo tồn.<br>Chọn Set B, C hoặc D để luyện theo từng bước.</p><div class="pills"><span class="pill accent">Exercise 1 · 15 câu cốt lõi/bài</span><span class="pill">3 set · B / C / D</span><span class="pill">Giải thích tiếng Việt</span></div></div><aside class="heroart"><div class="artcaption">Observe. Compare. Conserve.</div><div class="artline">A healthier habitat.<br>A stronger future.</div><div class="artsmall">Read carefully.<br>Think independently.</div><div class="equal" aria-hidden="true">U8</div></aside></section><div class="statsbar"><div class="stat"><strong>${LESSONS.length}</strong><span>Bài thực hành</span></div><div class="stat"><strong>${LESSONS.reduce((n,l)=>n+l.questions.length,0)}</strong><span>Câu có giải thích</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.transcript).length}</strong><span>Audio nhúng sẵn</span></div><div class="stat"><strong id="completedCount">0</strong><span>Bài đã luyện tại đây</span></div></div><section aria-labelledby="catalogTitle"><div class="cataloghead"><div><p class="eyebrow" style="margin-bottom:6px">Choose your next step</p><h2 id="catalogTitle">Chọn bài luyện tập</h2><p>Exercise 1 có 6 bài/set, mỗi bài đúng 15 câu cốt lõi.</p></div><div class="filters" role="group" aria-label="Lọc set"><button class="filter" data-filter="all">Tất cả</button><button class="filter" data-filter="B">Set B</button><button class="filter" data-filter="C">Set C</button><button class="filter" data-filter="D">Set D</button></div></div><input class="search" id="lessonSearch" type="search" placeholder="Tìm Exercise, số câu hoặc kỹ năng…" aria-label="Tìm bài luyện tập" value="${esc(search)}"><div class="cards" id="cards"></div></section><details class="catalog-note"><summary>Phạm vi và mức độ của từng set</summary><p>Đủ Exercise 1–10. Mỗi set có 15 bài, 151 câu. Exercise 1 có 90 câu mới/set, chia 6 bài × 15 câu; các trọng tâm trong 110 câu mẫu được tuyển chọn và tái nhóm theo kỹ năng.</p><p>Set B: củng cố kiến thức. Set C: khó hơn khoảng 30% theo mục tiêu thiết kế, với ngữ cảnh, liên kết và yêu cầu phân tích sâu hơn. Set D: vận dụng theo hướng THPT 2026, tập trung bằng chứng, phạm vi kết luận, diễn đạt tương đương, chèn câu và suy luận.</p><p>Đây là bộ luyện theo Unit. Hai bài nghe của tài liệu được giữ ở cả ba set. Bài đọc, điền đoạn và bài nghe giữ thứ tự câu; câu rời, sắp xếp và phương án được trộn khi làm lại.</p><p>Tình huống, dự án và khảo sát trong bài là giả định phục vụ học tập. Sáu audio dùng giọng tổng hợp, nhúng sẵn để nghe không cần mạng. Kết quả lưu trên trình duyệt đang dùng.</p></details><div class="catalog-note"><b>Ôn nhanh trước khi luyện</b><p>Ôn mệnh đề điều kiện, unless, as long as và so sánh; phân biệt số liệu ghi nhận với kết luận về bảo tồn.</p><button class="secondary" id="appendixBtn">Mở phần ôn nhanh</button></div>${footer()}`;

function makeQuestions(l){let qs=l.questions.map(q=>{const opts=q.options.map((text,id)=>({text,id}));return {...q,opts:l.kind==='stress'||l.kind==='listening_tf'?opts:shuffle(opts)};});if(['mcq','stress','stress_compare','everyday','arrange','wordform','verbform'].includes(l.kind))qs=shuffle(qs);return qs;}

function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;const ready=typed?String(a.selected||'').trim().length>0:a.selected!==null&&!a.wrong.includes(a.selected);document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2>${typed?`<label class="finenote" for="typedAnswer">${state.lesson.kind==='ordering'?'Nhập chuỗi chữ cái theo thứ tự':'Nhập từ hoặc cụm từ phù hợp'}</label><input class="answerinput" id="typedAnswer" aria-labelledby="questionStem" value="${esc(a.selected||'')}" maxlength="160" autocomplete="off" autocapitalize="none" spellcheck="false" ${a.done?'disabled':''}><p class="finenote">Không phân biệt chữ hoa/thường. Có thể bấm Enter để kiểm tra.</p>`:`<div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?`<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>${typed?`Lần nhập trước: “${esc(a.wrong[a.wrong.length-1])}”. Chú ý dạng từ, cấu trúc và ngữ cảnh.`:'Đọc kỹ ngữ cảnh hoặc nghe lại trước khi chọn.'} Mỗi lần sai mất 1 tim.</div>`:''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||!ready?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 if(typed){const input=document.getElementById('typedAnswer');input.oninput=()=>{a.selected=input.value;document.getElementById('checkBtn').disabled=!input.value.trim();};input.onkeydown=e=>{if(e.key==='Enter'&&!a.done&&input.value.trim()){e.preventDefault();checkAnswer();}};}else{document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});}
 document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};

function updateMetrics(){document.getElementById('heartMetric').innerHTML=`<strong class="heart" aria-label="${state.hearts} trên 5 tim">${'♥'.repeat(state.hearts)}${'♡'.repeat(5-state.hearts)}</strong>`;document.getElementById('xp').textContent=state.xp;document.getElementById('combo').textContent=state.combo;const done=state.questions.filter(q=>state.answers[q.number].done).length;document.getElementById('progressFill').style.width=(100*done/state.questions.length)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',done);}
function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number],typed=!!q.accepted;if(a.done||a.selected===null)return;if(typed&&!String(a.selected).trim())return;if(!typed&&a.wrong.includes(a.selected))return;const correct=typed?q.accepted.some(x=>normalise(x,state.lesson.kind)===normalise(a.selected,state.lesson.kind)):a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}

function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Grade12_Unit8_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.wordbank.length?`<p><b>Word box:</b> ${l.wordbank.map(esc).join(' · ')}</p>`:''}${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.accepted?'Answer: __________________________________________':q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}

function correctText(q){return q.accepted?q.accepted[0]:q.options[q.answer];}
function normalise(text,kind){let t=String(text).normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'");if(kind==='ordering')return t.replace(/[^a-z]/g,'');return t.replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function renderAppendix(){stopClock();stopAudio();active=null;state=null;app.innerHTML=`<section class="lessonintro"><button class="back" id="appendixBack">Danh mục lớp 12</button><p class="eyebrow">Phần tham khảo bổ sung · Không tính điểm</p><h1>Ôn nhanh · Unit 8</h1></section><section class="resource">${APPENDIX_HTML}</section>${footer()}`;document.getElementById('appendixBack').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}

window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
