<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (61-80) - Option D</title>
<style>
*{box-sizing:border-box}
:root{
 --ink:#2e1d10;--navy:#12364a;--sea:#1d6881;--sand:#f4dfb2;--paper:#fffaf0;
 --gold:#d7a333;--green:#3d9a62;--red:#d4555e;--rope:#9f7740;
}
body{
 margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:var(--ink);
 background:
 radial-gradient(circle at 15% 10%,rgba(255,255,255,.55),transparent 14%),
 radial-gradient(circle at 85% 18%,rgba(255,218,142,.30),transparent 18%),
 linear-gradient(145deg,#96d3de,#d7edf0 44%,#efd59f 74%,#c79756);
}
.wrap{max-width:1120px;margin:auto}
.hero{
 position:relative;overflow:hidden;
 background:linear-gradient(120deg,#102c3e,#174f68 58%,#80582f);
 color:#fff;border-radius:30px 30px 0 0;padding:25px 29px;
 box-shadow:0 18px 48px #18303a55
}
.hero:before{content:"⚓";position:absolute;left:4%;bottom:-42px;font-size:120px;opacity:.12}
.hero:after{content:"🏴‍☠️";position:absolute;right:4%;top:-25px;font-size:145px;opacity:.13}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}
h1{margin:0;color:#ffe39a;font-size:clamp(28px,4vw,43px);text-shadow:0 3px 9px #061923}
.sub{font-weight:900;color:#f7fdff;margin-top:7px}
.sound{border:1px solid #f2d698;background:#fff8e8;color:#385266;border-radius:18px;padding:11px 15px;font-weight:900;cursor:pointer}

.game{background:#fffaf0;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 20px 55px #18303a40}
.status{
 display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
 padding:14px 20px;background:#efe2c4;border-bottom:1px solid #d4bc8b
}
.track{height:13px;background:#d4c49f;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#1d6881,#d7a333,#a45c2e);transition:.3s}
.pill{background:#fff;border:1px solid #d7c39c;border-radius:99px;padding:8px 13px;font-weight:900;white-space:nowrap}
.hearts{font-size:20px;letter-spacing:2px}
.main{padding:22px}
.quiz{background:#fffdf7;border:2px solid #dcc9a6;border-radius:22px;padding:23px;box-shadow:inset 0 0 28px #f3e5c655}
.tag{display:inline-block;background:linear-gradient(90deg,#174f68,#80582f);color:#fff;padding:8px 14px;border-radius:14px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:19px 0;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{
 border:2px solid #dfcfb4;background:#fffaf0;color:#2e1d10;border-radius:16px;padding:15px;text-align:left;
 font-size:16px;cursor:pointer;transition:.15s
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#32829a;background:#f2fbfd}
.ans.correct{background:#eaffef;border-color:#3d9a62}
.ans.wrong{background:#fff0f2;border-color:#d4555e}
.fb{display:none;margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.fb.good{display:block;background:#eaffef;border-left:5px solid #3d9a62}
.fb.bad{display:block;background:#fff0f2;border-left:5px solid #d4555e}
.bonus{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff3c4;border-left:5px solid #d7a333;font-weight:900}
.next{display:none;float:right;margin-top:15px;border:0;border-radius:16px;padding:12px 22px;background:linear-gradient(90deg,#174f68,#80582f);color:#fff;font-weight:900;cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:#0c2230e6;z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.box{max-width:520px;width:100%;background:#fff8e8;border:3px solid #a86c36;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #0006}
.restart{border:0;border-radius:16px;padding:13px 22px;background:#80582f;color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#fffaf0;border-radius:30px;padding:36px;text-align:center;box-shadow:0 20px 55px #18303a40}
.result.show{display:block}
.big{font-size:60px;font-weight:1000;color:#174f68}
.review{text-align:left;margin-top:24px}
.r{padding:13px 15px;margin:9px 0;border-radius:14px;background:#f3ead8;border-left:5px solid #80582f;line-height:1.55}
@media(max-width:820px){
 .answers{grid-template-columns:1fr}
 .heroRow{flex-direction:column;align-items:flex-start}
 .status{grid-template-columns:1fr 1fr}
 .track{grid-column:1/-1;order:4}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="heroRow">
  <div class="brand">
   <div class="icon">🏴‍☠️🗺️</div>
   <div>
    <h1>Pirate Treasure Quest</h1>
    <div class="sub">Grade 11 - Unit 3 - Exercise 1 (61-80) - Option D</div>
   </div>
  </div>
  <button id="sound" class="sound">🔊 Sea Sound On</button>
 </div>
</header>

<section id="game" class="game">
 <div class="status">
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div>
  <div class="pill">💰 Streak <span id="streak">0</span></div>
  <div class="pill">🔁 Restarts <span id="restarts">0</span></div>
 </div>

 <main class="main">
  <section class="quiz">
   <div id="tag" class="tag"></div>
   <div id="q" class="q"></div>
   <div id="answers" class="answers"></div>
   <div id="fb" class="fb"></div>
   <div id="bonus" class="bonus"></div>
   <button id="next" class="next">NEXT ISLAND →</button>
   <div style="clear:both"></div>
  </section>
 </main>
</section>

<section id="result" class="result">
 <div style="font-size:82px">🏴‍☠️🏆💰</div>
 <h2>Treasure Found!</h2>
 <div id="final" class="big"></div>
 <p id="msg"></p>
 <div id="review" class="review"></div>
</section>
</div>

<div id="overlay" class="overlay">
 <div class="box">
  <div style="font-size:80px">🌊💔</div>
  <h2>Shipwrecked!</h2>
  <p>Hết 5 tim. Học sinh phải làm lại từ Question 1.</p>
  <p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p>
  <button id="restartBtn" class="restart">RETURN TO THE FIRST ISLAND ↻</button>
 </div>
</div>

<script>
const Q=[{"q": "Many teenagers are becoming increasingly ______ of how their daily choices affect the urban environment.", "o": ["conscious", "familiar", "responsible", "interested"], "a": 0, "e": "Cấu trúc: <b>be conscious of sth</b> = nhận thức rõ về điều gì."}, {"q": "The city council plans to ______ residents with easier access to essential services through a single digital platform.", "o": ["supply for", "provide", "offer to", "equip to"], "a": 1, "e": "Cấu trúc: <b>provide sb with sth</b> = cung cấp cho ai cái gì."}, {"q": "Locally grown produce is delivered directly ______ restaurants and schools, reducing the need for long-distance transportation.", "o": ["for", "with", "to", "towards"], "a": 2, "e": "Cấu trúc: <b>deliver sth to sb/place</b> = giao cái gì cho ai/đến đâu."}, {"q": "Stricter regulations have been introduced to keep industrial ______ within environmentally acceptable limits.", "o": ["exhaust", "pollution", "releases", "emissions"], "a": 3, "e": "Collocation: <b>industrial emissions</b> = khí thải công nghiệp."}, {"q": "Digital community platforms enable residents to ______ directly with officials instead of waiting for public meetings.", "o": ["communicate", "participate", "cooperate", "involve"], "a": 0, "e": "Cấu trúc: <b>communicate with sb</b> = giao tiếp với ai."}, {"q": "One significant ______ of automated home systems is that they can reduce unnecessary energy consumption.", "o": ["convenience", "advantage", "opportunity", "preference"], "a": 1, "e": "Cấu trúc: <b>an advantage of sth</b> = một ưu điểm/lợi thế của cái gì."}, {"q": "Converting busy streets into ______ areas can make city centres safer and more attractive to walkers.", "o": ["residential", "suburban", "pedestrian", "industrial"], "a": 2, "e": "<b>pedestrian area</b> = khu vực dành cho người đi bộ."}, {"q": "The city's intelligent transport system automatically ______ motorists whenever an accident causes serious delays.", "o": ["announces", "reminds", "informs about", "alerts"], "a": 3, "e": "<b>alert sb when/to sth</b> = cảnh báo ai khi/về điều gì."}, {"q": "Environmental researchers generally ______ that increasing tree cover can reduce temperatures in densely built-up areas.", "o": ["are agreeing", "agree", "agrees", "are agreed"], "a": 1, "e": "Chủ ngữ số nhiều <b>researchers</b> → <b>agree</b>. Cấu trúc: <b>agree that + clause</b>."}, {"q": "Local communities should be actively involved in the ______ of major redevelopment projects rather than consulted only after plans are completed.", "o": ["decide", "deciding", "decision-making", "decision-makers"], "a": 2, "e": "Cụm chuẩn: <b>be involved in decision-making</b> = tham gia vào quá trình ra quyết định."}, {"q": "A considerable ______ of city residents now support replacing private cars with cleaner forms of transport.", "o": ["proportion", "amount", "quantity", "level"], "a": 0, "e": "Collocation: <b>a considerable proportion of + plural noun</b>."}, {"q": "Smart sensors ______ a vital role in adjusting street lighting according to actual traffic and pedestrian activity.", "o": ["perform", "play", "make", "take"], "a": 1, "e": "Collocation: <b>play a vital role in doing sth</b> = đóng vai trò thiết yếu trong việc..."}, {"q": "Demand has risen sharply for ______ located close to metro stations and other public transport facilities.", "o": ["apartments conveniently modern", "conveniently apartments modern", "conveniently located modern apartments", "modern located conveniently apartments"], "a": 2, "e": "Trật tự đúng: <b>conveniently located modern apartments</b>."}, {"q": "After the renovation, the former industrial district ______ far more welcoming, with wider pavements and additional green spaces.", "o": ["becomes", "is seeming", "remains", "looks"], "a": 3, "e": "Cấu trúc: <b>look + adjective</b> → <i>looks far more welcoming</i>."}, {"q": "Poorly planned urban expansion can have a lasting ______ on both the natural environment and residents' quality of life.", "o": ["consequence", "damage", "impact", "influence to"], "a": 2, "e": "Collocation: <b>have an impact on sth</b> = có tác động đến cái gì."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;
const $=x=>document.getElementById(x);

function tone(f,d=.1){
 if(!soundOn)return;
 if(!ctx)ctx=new(AudioContext||webkitAudioContext)();
 if(ctx.state==="suspended")ctx.resume();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.value=f;o.type="triangle";g.gain.value=.03;
 o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)
}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Sea Sound On":"🔇 Sound Off";
};

function update(){
 $("hearts").textContent="❤️".repeat(hearts)+"🤎".repeat(MAX-hearts);
 $("streak").textContent=streak;
 $("restarts").textContent=restarts;
 $("bar").style.width=(i/Q.length*100)+"%";
}

function render(){
 const x=Q[i];
 $("tag").textContent="Island "+(i+1)+" / "+Q.length;
 $("q").textContent=x.q;
 $("answers").innerHTML="";
 $("fb").className="fb";
 $("fb").style.display="none";
 $("bonus").style.display="none";
 $("next").style.display="none";
 update();

 x.o.forEach((v,n)=>{
   const b=document.createElement("button");
   b.className="ans";
   b.innerHTML="<b>"+L[n]+".</b> "+v;
   b.onclick=()=>choose(n,b);
   $("answers").appendChild(b);
 });
}

function choose(n,b){
 const x=Q[i];
 attempts[i]++;

 if(n!==x.a){
   hearts--;
   streak=0;
   b.classList.add("wrong");
   b.disabled=true;

   $("fb").className="fb bad";
   $("fb").style.display="block";
   $("fb").innerHTML="<b>❌ Chưa đúng.</b> Mất 1 ❤️. Em phải chọn lại đến khi đúng mới được sang đảo tiếp theo.";
   tone(165,.2);
   update();

   if(hearts<=0){
     restarts++;
     $("restarts").textContent=restarts;
     $("restartBox").textContent=restarts;
     setTimeout(()=>$("overlay").classList.add("show"),250);
   }
   return;
 }

 streak++;
 if(attempts[i]===1) firstTry++;

 document.querySelectorAll(".ans").forEach(z=>z.disabled=true);
 b.classList.add("correct");

 $("fb").className="fb good";
 $("fb").style.display="block";
 $("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;
 tone(820,.11);

 const qn=i+1;
 if(BONUS.includes(qn)){
   const before=hearts;
   hearts=Math.min(MAX,hearts+1);
   $("bonus").style.display="block";
   $("bonus").innerHTML=hearts>before
     ?"🎁 TREASURE HEART! +1 ❤️"
     :"🎁 TREASURE BONUS! Em đang đủ 5 ❤️ nên số tim giữ nguyên.";
   tone(1120,.12);
 }

 update();
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("next").style.display="inline-block";
 $("next").textContent=i===Q.length-1?"OPEN TREASURE CHEST →":"NEXT ISLAND →";
}

$("next").onclick=()=>{
 if(i<Q.length-1){i++;render()}
 else finish();
};

$("restartBtn").onclick=()=>{
 $("overlay").classList.remove("show");
 i=0;
 hearts=MAX;
 streak=0;
 firstTry=0;
 attempts=Array(Q.length).fill(0);
 render();
};

function finish(){
 $("game").style.display="none";
 $("result").classList.add("show");
 $("final").textContent="15 / 15";
 $("msg").innerHTML=
   "Hoàn thành với <b>"+restarts+"</b> lần làm lại.<br>"+
   "Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";

 let h="<h3>🗺️ Treasure Review</h3>";
 Q.forEach((x,k)=>{
   h+='<div class="r"><b>Question '+(k+1)+'</b> — Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>';
 });
 $("review").innerHTML=h;
}

render();
</script>
</body>
</html>
