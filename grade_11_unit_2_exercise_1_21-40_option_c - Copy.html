<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 11 - Unit 2 - Exercise 1 (21-40) - Option C</title>
<style>
:root{--blue:#2563eb;--purple:#7c3aed;--green:#059669;--red:#dc2626;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#eef6ff,#f5f3ff 55%,#ecfeff);padding:18px;overflow-x:hidden}body.shake{animation:shake .42s ease}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.container{width:min(1050px,100%);margin:auto}.topbar{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:16px}.title-card{background:linear-gradient(135deg,#1d4ed8,#0f766e 55%,#7c3aed);color:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 50px rgba(30,64,175,.22)}.title-card h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px)}.title-card p{margin:0;opacity:.92}.stats{display:grid;grid-template-columns:repeat(3,minmax(88px,1fr));gap:10px}.stat{background:#fffffff0;border-radius:18px;padding:14px 12px;text-align:center;box-shadow:0 12px 28px rgba(15,23,42,.08);font-weight:800}.stat small{display:block;color:var(--muted);margin-top:3px}.progress-wrap{background:#ffffffe6;border-radius:18px;padding:12px;margin:14px 0;box-shadow:0 10px 25px rgba(15,23,42,.07)}.progress-track{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed,#059669);transition:.35s}.game-card,.final-screen{background:#fffffff2;border-radius:28px;padding:24px;box-shadow:0 22px 55px rgba(15,23,42,.12)}.question-no{color:var(--purple);font-weight:900;margin-bottom:10px}.question{font-size:clamp(22px,3.6vw,32px);line-height:1.4;margin:0 0 22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer-btn{border:2px solid #dbeafe;background:#fff;border-radius:18px;padding:16px;font-size:18px;font-weight:800;text-align:left;cursor:pointer;transition:.2s;color:var(--text)}.answer-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#60a5fa}.answer-btn.correct{border-color:#10b981;background:#d1fae5;color:#065f46}.answer-btn.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b}.feedback{display:none;margin-top:20px;padding:18px;border-radius:18px;line-height:1.6}.feedback.show{display:block}.feedback.good{background:#ecfdf5;border:1px solid #a7f3d0}.feedback.bad{background:#fff1f2;border:1px solid #fecdd3}.next-btn{display:none;margin-top:18px;width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.next-btn.show{display:block}.gift-box{display:none;text-align:center;margin-top:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;font-weight:900}.gift-box.show{display:block;animation:pop .35s ease}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.final-screen{display:none;text-align:center}.final-screen.show{display:block}.score-big{font-size:72px;font-weight:900;color:var(--purple)}.restart-btn{border:0;border-radius:17px;padding:15px 24px;background:linear-gradient(135deg,#059669,#2563eb);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.effect-layer{pointer-events:none;position:fixed;inset:0;z-index:9999;overflow:hidden}.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:burst 900ms ease-out forwards}@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}.bomb-flash{position:fixed;inset:0;z-index:9998;background:rgba(239,68,68,.28);display:none;pointer-events:none}.bomb-flash.show{display:block;animation:flash .45s ease}@keyframes flash{0%,100%{opacity:0}40%{opacity:1}}@media(max-width:760px){.topbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.answers{grid-template-columns:1fr}.game-card{padding:18px}}
</style>
</head>
<body>
<div class="effect-layer" id="effectLayer"></div><div class="bomb-flash" id="bombFlash"></div>
<main class="container">
<div class="topbar"><section class="title-card"><h1>Grade 11 - Unit 2 - Exercise 1 (21–40) - Option C</h1><p>Family relationships • Vocabulary & Grammar Challenge</p></section><section class="stats"><div class="stat"><span id="hearts">❤️❤️❤️❤️❤️❤️❤️</span><small>Hearts</small></div><div class="stat"><span id="xp">0</span><small>XP</small></div><div class="stat"><span id="gifts">0</span><small>Gifts 🎁</small></div></section></div>
<div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div>
<section class="game-card" id="gameCard"><div class="question-no" id="questionNo"></div><h2 class="question" id="questionText"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="gift-box" id="giftBox">🎁 Surprise Gift! +20 XP</div><button class="next-btn" id="nextBtn">Next question →</button></section>
<section class="final-screen" id="finalScreen"><h2>🎉 Mission Complete!</h2><div class="score-big" id="finalScore">0/10</div><p id="finalMessage"></p><p><strong>XP:</strong> <span id="finalXP"></span> • <strong>Gifts:</strong> <span id="finalGifts"></span></p><button class="restart-btn" onclick="restartGame()">Play again</button></section>
</main>
<script>
const quizData=[
{q:"Teenagers should learn to ____________ household responsibilities instead of relying on their parents.",options:["take after","take on","take off","take over"],answer:1,explain:"take on = đảm nhận, nhận trách nhiệm. Cụm đúng: take on household responsibilities. take after = giống ai; take off = cởi ra/cất cánh; take over = tiếp quản."},
{q:"Parents should always listen to their children's ____________ before making important family decisions.",options:["points of view","ways of life","household chores","family values"],answer:0,explain:"points of view = quan điểm, ý kiến. Các đáp án khác lần lượt là lối sống, việc nhà và giá trị gia đình."},
{q:"Many teenagers find it difficult to ____________ to strict family rules.",options:["adapt","refer","depend","belong"],answer:0,explain:"adapt to = thích nghi với. refer to = đề cập đến; depend on = phụ thuộc vào; belong to = thuộc về."},
{q:"Spending quality time together helps strengthen family ____________.",options:["arguments","conflicts","relationships","behaviors"],answer:2,explain:"strengthen family relationships = củng cố mối quan hệ gia đình. Các lựa chọn còn lại không phù hợp về nghĩa."},
{q:"Children are encouraged ____________ responsibility for their own actions.",options:["take","taking","to take","took"],answer:2,explain:"Cấu trúc: encourage + O + to V. Ở câu bị động: Children are encouraged to take responsibility."},
{q:"Parents and teenagers often ____________ about the amount of time spent on social media.",options:["differ","divide","depend","share"],answer:0,explain:"differ about/on sth = bất đồng về điều gì. divide = chia; depend = phụ thuộc; share = chia sẻ."},
{q:"Being too ____________ on your parents may prevent you from becoming independent.",options:["dependence","depend","dependent","depending"],answer:2,explain:"Cụm cố định: be dependent on = phụ thuộc vào. dependent là tính từ, phù hợp sau động từ be."},
{q:"Good communication can help family members avoid unnecessary ____________.",options:["attitudes","arguments","experiences","characteristics"],answer:1,explain:"avoid arguments = tránh những cuộc cãi vã. Các đáp án khác không phù hợp ngữ cảnh."},
{q:"Teenagers should worry ____________ the consequences of posting personal information online.",options:["for","with","about","to"],answer:2,explain:"Cụm cố định: worry about = lo lắng về."},
{q:"Every family member should show mutual respect, even when they have ____________ opinions.",options:["differ","difference","differently","different"],answer:3,explain:"different là tính từ bổ nghĩa cho danh từ opinions. differ là động từ; difference là danh từ; differently là trạng từ."}
];
let current=0,score=0,hearts=7,xp=0,gifts=0,answered=false;
const questionNo=document.getElementById('questionNo'),questionText=document.getElementById('questionText'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('nextBtn'),progressBar=document.getElementById('progressBar'),heartsEl=document.getElementById('hearts'),xpEl=document.getElementById('xp'),giftsEl=document.getElementById('gifts'),giftBox=document.getElementById('giftBox'),gameCard=document.getElementById('gameCard'),finalScreen=document.getElementById('finalScreen');
function renderQuestion(){answered=false;const item=quizData[current];questionNo.textContent=`Question ${current+1} of ${quizData.length}`;questionText.textContent=item.q;answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';nextBtn.className='next-btn';giftBox.className='gift-box';progressBar.style.width=`${current/quizData.length*100}%`;item.options.forEach((option,index)=>{const btn=document.createElement('button');btn.className='answer-btn';btn.innerHTML=`<strong>${String.fromCharCode(65+index)}.</strong> ${option}`;btn.onclick=()=>selectAnswer(index,btn);answers.appendChild(btn)})}
function selectAnswer(index,button){if(answered)return;answered=true;const item=quizData[current],buttons=[...document.querySelectorAll('.answer-btn')];buttons.forEach(b=>b.disabled=true);buttons[item.answer].classList.add('correct');if(index===item.answer){score++;xp+=10;button.classList.add('correct');feedback.className='feedback show good';feedback.innerHTML=`<strong>✅ Chính xác!</strong><br>${item.explain}`;playFireworkSound();fireworks();if((current+1)%3===0){gifts++;xp+=20;giftBox.className='gift-box show'}}else{hearts=Math.max(0,hearts-1);button.classList.add('wrong');feedback.className='feedback show bad';feedback.innerHTML=`<strong>❌ Chưa đúng.</strong><br>${item.explain}`;bombEffect();playBombSound()}updateStats();nextBtn.className='next-btn show';nextBtn.textContent=current===quizData.length-1?'See results →':'Next question →'}
function updateStats(){heartsEl.textContent='❤️'.repeat(hearts)+'🖤'.repeat(7-hearts);xpEl.textContent=xp;giftsEl.textContent=gifts}
nextBtn.onclick=()=>{current++;current<quizData.length?renderQuestion():showFinal()};
function showFinal(){progressBar.style.width='100%';gameCard.style.display='none';finalScreen.classList.add('show');document.getElementById('finalScore').textContent=`${score}/10`;document.getElementById('finalXP').textContent=xp;document.getElementById('finalGifts').textContent=gifts;document.getElementById('finalMessage').textContent=score===10?'Xuất sắc! Bạn đã làm đúng toàn bộ câu hỏi.':score>=8?'Rất tốt! Bạn đã nắm chắc kiến thức.':score>=6?'Khá tốt! Hãy xem lại các câu còn sai.':'Cố gắng thêm nhé! Hãy chơi lại để ghi nhớ tốt hơn.';fireworks();playFireworkSound()}
function restartGame(){current=0;score=0;hearts=7;xp=0;gifts=0;finalScreen.classList.remove('show');gameCard.style.display='block';updateStats();renderQuestion()}
function fireworks(){const layer=document.getElementById('effectLayer'),colors=['#f59e0b','#ef4444','#22c55e','#3b82f6','#a855f7','#ec4899'],cx=innerWidth/2,cy=innerHeight/3;for(let i=0;i<50;i++){const s=document.createElement('span');s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';s.style.background=colors[Math.floor(Math.random()*colors.length)];const a=Math.random()*Math.PI*2,d=80+Math.random()*220;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');layer.appendChild(s);setTimeout(()=>s.remove(),950)}}
function bombEffect(){const f=document.getElementById('bombFlash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show');document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500)}
function playFireworkSound(){const c=new(window.AudioContext||window.webkitAudioContext)(),n=c.currentTime;[659,784,988,1319].forEach((freq,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,n+i*.08);g.gain.exponentialRampToValueAtTime(.18,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.08+.22);o.connect(g).connect(c.destination);o.start(n+i*.08);o.stop(n+i*.08+.24)})}
function playBombSound(){const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(140,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.45);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.5)}
updateStats();renderQuestion();
</script>
</body>
</html>
