<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (41-60) - Option C</title>
<style>
*{box-sizing:border-box}
:root{
 --ice:#e9fbff;--deep:#0b2e45;--blue:#1a6f9a;--cyan:#55d9ef;
 --snow:#f8fdff;--gold:#f2cf6a;--green:#36a56c;--red:#d95161;
}
body{
 margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#12354d;
 background:
 linear-gradient(180deg,rgba(255,255,255,.35),transparent 30%),
 radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
 linear-gradient(145deg,#cceefa,#e9f8ff 55%,#d8ebf2);
 background-size:auto,42px 42px,auto;
}
.wrap{max-width:1120px;margin:auto}
.hero{
 position:relative;overflow:hidden;
 background:linear-gradient(120deg,#0a3149,#155d7e 55%,#2f8db0);
 color:#fff;border-radius:30px 30px 0 0;padding:25px 29px;
 box-shadow:0 18px 50px #0b2e4540
}
.hero:before{content:"❄️";position:absolute;left:3%;bottom:-35px;font-size:110px;opacity:.12}
.hero:after{content:"🐧";position:absolute;right:5%;top:-18px;font-size:135px;opacity:.15}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px;position:relative;z-index:2}
.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}
h1{margin:0;color:#eaffff;font-size:clamp(28px,4vw,43px);text-shadow:0 3px 10px #001b2c}
.sub{font-weight:900;color:#dff7ff;margin-top:7px}
.sound{border:1px solid #bcefff;background:#f5fdff;color:#175773;border-radius:18px;padding:11px 15px;font-weight:900;cursor:pointer}

.game{background:#f7fcff;border-radius:0 0 30px 30px;overflow:hidden;box-shadow:0 20px 55px #0b2e4530}
.status{
 display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
 padding:14px 20px;background:#dff2f8;border-bottom:1px solid #b7d7e3
}
.track{height:13px;background:#bfd7e0;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#37b7d6,#438dc2,#7a70cf);transition:.3s}
.pill{background:#fff;border:1px solid #b8d2dc;border-radius:99px;padding:8px 13px;font-weight:900;white-space:nowrap}
.hearts{font-size:20px;letter-spacing:2px}
.main{padding:22px}
.quiz{background:#fff;border:2px solid #c5dee7;border-radius:22px;padding:23px;box-shadow:inset 0 0 28px #d7f0f755}
.tag{display:inline-block;background:linear-gradient(90deg,#155d7e,#438dc2);color:white;padding:8px 14px;border-radius:14px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:19px 0;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{
 border:2px solid #cfdee5;background:#fbfeff;color:#12354d;border-radius:16px;padding:15px;text-align:left;
 font-size:16px;cursor:pointer;transition:.15s
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#54aeca;background:#f0fbff}
.ans.correct{background:#e9fff1;border-color:#36a56c}
.ans.wrong{background:#fff0f3;border-color:#d95161}
.fb{display:none;margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.fb.good{display:block;background:#e9fff1;border-left:5px solid #36a56c}
.fb.bad{display:block;background:#fff0f3;border-left:5px solid #d95161}
.bonus{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff7cf;border-left:5px solid #f2cf6a;font-weight:900}
.next{display:none;float:right;margin-top:15px;border:0;border-radius:16px;padding:12px 22px;background:linear-gradient(90deg,#155d7e,#438dc2);color:#fff;font-weight:900;cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:#061722dd;z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.box{max-width:520px;width:100%;background:#f6fdff;border:3px solid #5baac5;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #0006}
.restart{border:0;border-radius:16px;padding:13px 22px;background:#155d7e;color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#f7fcff;border-radius:30px;padding:36px;text-align:center;box-shadow:0 20px 55px #0b2e4530}
.result.show{display:block}
.big{font-size:60px;font-weight:1000;color:#155d7e}
.review{text-align:left;margin-top:24px}
.r{padding:13px 15px;margin:9px 0;border-radius:14px;background:#eaf5f8;border-left:5px solid #438dc2;line-height:1.55}
@media(max-width:820px){
 .answers{grid-template-columns:1fr}
 .heroRow{flex-direction:column;align-items:flex-start}
 .status{grid-template-columns:1fr 1fr}
 .track{grid-column:1/-1;order:4}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="heroRow">
  <div class="brand">
   <div class="icon">🧊🐧</div>
   <div>
    <h1>Arctic Research Mission</h1>
    <div class="sub">Grade 11 - Unit 3 - Exercise 1 (41-60) - Option C</div>
   </div>
  </div>
  <button id="sound" class="sound">🔊 Arctic Sound On</button>
 </div>
</header>

<section id="game" class="game">
 <div class="status">
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div>
  <div class="pill">🧭 Streak <span id="streak">0</span></div>
  <div class="pill">🔁 Restarts <span id="restarts">0</span></div>
 </div>

 <main class="main">
  <section class="quiz">
   <div id="tag" class="tag"></div>
   <div id="q" class="q"></div>
   <div id="answers" class="answers"></div>
   <div id="fb" class="fb"></div>
   <div id="bonus" class="bonus"></div>
   <button id="next" class="next">NEXT STATION →</button>
   <div style="clear:both"></div>
  </section>
 </main>
</section>

<section id="result" class="result">
 <div style="font-size:82px">🧊🏆🐧</div>
 <h2>Arctic Mission Complete!</h2>
 <div id="final" class="big"></div>
 <p id="msg"></p>
 <div id="review" class="review"></div>
</section>
</div>

<div id="overlay" class="overlay">
 <div class="box">
  <div style="font-size:80px">🥶💔</div>
  <h2>All Hearts Frozen!</h2>
  <p>Hết 5 tim. Học sinh phải làm lại từ Question 1.</p>
  <p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p>
  <button id="restartBtn" class="restart">RETURN TO BASE CAMP ↻</button>
 </div>
</div>

<script>
const Q=[{"q": "Residents have called for a noticeable improvement in the ______ of public services, particularly waste collection and clean-water supply.", "o": ["quality", "schedule", "coverage", "quantity"], "a": 0, "e": "<b>quality of public services</b> = chất lượng dịch vụ công."}, {"q": "By producing vegetables close to where people live, rooftop farming can help ______ the distance food has to travel.", "o": ["prevent", "reduce", "decline", "lower down"], "a": 1, "e": "<b>reduce + noun</b> = làm giảm cái gì. → reduce the distance."}, {"q": "The city has invested heavily in scenic ______ that allow cyclists to travel safely without competing with motor vehicles.", "o": ["crossroads", "motorways", "cycle paths", "parking zones"], "a": 2, "e": "<b>cycle paths</b> = đường dành cho xe đạp."}, {"q": "Although the building was constructed more than twenty years ago, its glass-and-steel exterior still ______ surprisingly modern.", "o": ["remains", "looks", "becomes", "appears to be looking"], "a": 1, "e": "Cấu trúc <b>look + adjective</b> → <i>looks surprisingly modern</i>."}, {"q": "Additional metro services are usually introduced during ______ periods when passenger numbers are at their highest.", "o": ["busy traffic", "late-hour", "peak", "off-time"], "a": 2, "e": "Collocation: <b>peak periods / peak hours</b> = thời gian cao điểm."}, {"q": "In an integrated smart-home network, sensors communicate ______ one another so that lighting and temperature can be adjusted automatically.", "o": ["with", "for", "among", "toward"], "a": 0, "e": "Cấu trúc: <b>communicate with one another</b> = giao tiếp/tương tác với nhau."}, {"q": "Well-designed public parks can encourage social ______ by creating spaces where residents naturally meet and spend time together.", "o": ["contact", "communication", "interaction", "connection"], "a": 2, "e": "Collocation: <b>social interaction</b> = sự tương tác xã hội."}, {"q": "Property developers increasingly ______ that environmentally friendly features can make residential projects more attractive to buyers.", "o": ["are realizing", "realize", "are knowing", "predict"], "a": 1, "e": "<b>realize that...</b> = nhận ra rằng..."}, {"q": "Electric trams are considered particularly suitable for city centres because they operate quietly and produce no direct ______ emissions.", "o": ["traffic", "engine", "exhaust", "transport"], "a": 2, "e": "Collocation: <b>exhaust emissions</b> = khí thải từ động cơ/phương tiện."}, {"q": "The lighting system automatically ______ brighter whenever its motion sensors detect someone entering the corridor.", "o": ["turns", "becomes", "grows", "makes"], "a": 1, "e": "Cấu trúc: <b>become + adjective</b> → <i>becomes brighter</i>."}, {"q": "Many young professionals prefer living in high-rise ______ because they provide both security and easy access to public transport.", "o": ["skyscrapers", "neighbourhoods", "apartments", "villas"], "a": 2, "e": "Collocation: <b>high-rise apartments</b> = căn hộ cao tầng."}, {"q": "Real-time parking apps make vacant spaces immediately ______ to drivers, reducing the time spent searching for a place to park.", "o": ["accessible", "available", "convenient", "provided"], "a": 1, "e": "Cấu trúc: <b>make something available to somebody</b> = làm cho cái gì có sẵn để ai sử dụng."}, {"q": "Despite improvements in safety technology, some passengers are still reluctant to ______ completely driverless buses.", "o": ["get", "travel", "board", "enter on"], "a": 2, "e": "<b>board + bus/train/plane</b> = lên xe/tàu/máy bay."}, {"q": "Public bike-sharing schemes can have a highly ______ effect on residents' physical health by encouraging short daily journeys by bicycle.", "o": ["beneficial", "impressive", "effective", "favorablely"], "a": 0, "e": "Collocation: <b>a beneficial effect on sth</b> = tác động có lợi đối với..."}, {"q": "As the urban population expands, planners must find ways to make room ______ both affordable housing and additional green spaces.", "o": ["to", "with", "of", "for"], "a": 3, "e": "Cụm cố định: <b>make room for + noun</b> = tạo chỗ/không gian cho..."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;
const $=x=>document.getElementById(x);

function tone(f,d=.1){
 if(!soundOn)return;
 if(!ctx)ctx=new(AudioContext||webkitAudioContext)();
 if(ctx.state==="suspended")ctx.resume();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.value=f;o.type="sine";g.gain.value=.03;
 o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)
}
$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Arctic Sound On":"🔇 Sound Off"
};

function update(){
 $("hearts").textContent="❤️".repeat(hearts)+"🤍".repeat(MAX-hearts);
 $("streak").textContent=streak;
 $("restarts").textContent=restarts;
 $("bar").style.width=(i/Q.length*100)+"%";
}

function render(){
 const x=Q[i];
 $("tag").textContent="Research Station "+(i+1)+" / "+Q.length;
 $("q").textContent=x.q;
 $("answers").innerHTML="";
 $("fb").className="fb";
 $("fb").style.display="none";
 $("bonus").style.display="none";
 $("next").style.display="none";
 update();

 x.o.forEach((v,n)=>{
   const b=document.createElement("button");
   b.className="ans";
   b.innerHTML="<b>"+L[n]+".</b> "+v;
   b.onclick=()=>choose(n,b);
   $("answers").appendChild(b);
 });
}

function choose(n,b){
 const x=Q[i];
 attempts[i]++;

 if(n!==x.a){
   hearts--;
   streak=0;
   b.classList.add("wrong");
   b.disabled=true;

   $("fb").className="fb bad";
   $("fb").style.display="block";
   $("fb").innerHTML="<b>❌ Chưa đúng.</b> Mất 1 ❤️. Em phải chọn lại cho đến khi đúng mới được sang trạm tiếp theo.";
   tone(170,.2);
   update();

   if(hearts<=0){
     restarts++;
     $("restarts").textContent=restarts;
     $("restartBox").textContent=restarts;
     setTimeout(()=>$("overlay").classList.add("show"),250);
   }
   return;
 }

 streak++;
 if(attempts[i]===1) firstTry++;

 document.querySelectorAll(".ans").forEach(z=>z.disabled=true);
 b.classList.add("correct");

 $("fb").className="fb good";
 $("fb").style.display="block";
 $("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;
 tone(800,.11);

 const qn=i+1;
 if(BONUS.includes(qn)){
   const before=hearts;
   hearts=Math.min(MAX,hearts+1);
   $("bonus").style.display="block";
   $("bonus").innerHTML=hearts>before
     ?"🎁 BONUS HEART! +1 ❤️"
     :"🎁 BONUS STATION! Em đang đủ 5 ❤️ nên số tim giữ nguyên.";
   tone(1100,.12);
 }

 update();
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("next").style.display="inline-block";
 $("next").textContent=i===Q.length-1?"FINISH MISSION →":"NEXT STATION →";
}

$("next").onclick=()=>{
 if(i<Q.length-1){i++;render()}
 else finish();
};

$("restartBtn").onclick=()=>{
 $("overlay").classList.remove("show");
 i=0;
 hearts=MAX;
 streak=0;
 firstTry=0;
 attempts=Array(Q.length).fill(0);
 render();
};

function finish(){
 $("game").style.display="none";
 $("result").classList.add("show");
 $("final").textContent="15 / 15";
 $("msg").innerHTML=
   "Hoàn thành nhiệm vụ với <b>"+restarts+"</b> lần làm lại.<br>"+
   "Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";

 let h="<h3>🧭 Arctic Review</h3>";
 Q.forEach((x,k)=>{
   h+='<div class="r"><b>Question '+(k+1)+'</b> — Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>';
 });
 $("review").innerHTML=h;
}

render();
</script>
</body>
</html>
