<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 3 - Exercise 6 - Option B</title>
<style>
:root{--green:#148f67;--lime:#74e8a2;--panel:#f7fff9;--ok:#48c98a;--red:#ef6675;--text:#204136}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;color:var(--text);background:linear-gradient(180deg,#dff8e9,#c7f0da 56%,#a6dec6);padding:18px;overflow-x:hidden}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.leaf{position:absolute;font-size:30px;opacity:.27;animation:move linear infinite}.l1{left:-50px;top:20%;animation-duration:18s}.l2{left:-70px;top:60%;animation-duration:24s;animation-delay:5s}@keyframes move{to{transform:translateX(115vw) rotate(360deg)}}.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}.hero{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;margin-bottom:16px}.icon{font-size:66px;text-align:center}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#0b5b46,#17a06f,#73df9d);-webkit-background-clip:text;color:transparent}.sub{color:#4f7165;font-weight:700}.sound{border:1px solid #b8ddc7;background:white;color:#145b48;border-radius:12px;padding:11px 14px;font-weight:900}.card{background:rgba(255,255,255,.97);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(30,90,65,.15)}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#effff5}.barbox{height:13px;background:#d8eee0;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7ce7a6,#27b879,#0e6c52)}.chip{background:white;padding:8px 12px;border-radius:999px;font-weight:900}.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.passage,.quiz{background:#f8fffa;border:2px solid #d1ebdb;border-radius:18px;padding:18px}.passage{max-height:620px;overflow:auto;line-height:1.75}.tag{display:inline-block;background:#dff7e8;color:#1d6a54;padding:7px 12px;border-radius:10px;font-weight:900}.q{font-size:23px;margin:16px 0}.options{display:grid;gap:12px}.option{padding:14px 15px;border:2px solid #d3e7da;border-radius:14px;background:white;color:#204136;text-align:left;font-size:17px;cursor:pointer}.option:hover:not(:disabled){border-color:#3fc38a}.correct{background:#e8fff3!important;border-color:var(--ok)!important}.wrong{background:#fff0f2!important;border-color:var(--red)!important}.fb{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:white;line-height:1.55}.fb.show{display:block}.fb.correct{border-color:var(--ok)}.fb.wrong{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#c9f7d9,#7de2a5);color:#174b3b}.btn:disabled{opacity:.4}.result{display:none;text-align:center;padding:34px}.result.show{display:block}.scorebig{font-size:58px;font-weight:1000;color:#1c9368}.review{text-align:left}.item{padding:12px 14px;background:#f8fffa;border-left:5px solid #8daf9f;border-radius:12px;margin:9px 0}.item.ok{border-left-color:var(--ok)}.item.no{border-left-color:var(--red)}@media(max-width:850px){.main{grid-template-columns:1fr}}@media(max-width:650px){.hero{grid-template-columns:70px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}}
</style></head><body>
<div class="bg"><div class="leaf l1">🍃</div><div class="leaf l2">🌿</div></div>
<div class="wrap"><div class="hero"><div class="icon">🌍</div><div><h1>GreenChoice Eco Tech Challenge</h1><div class="sub">Grade 12 · Unit 3 · Exercise 6 · Option B</div></div><button class="sound" id="sound">🔊 Âm thanh: Bật</button></div>
<div class="card"><div id="quizArea"><div class="status"><div class="barbox"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="main"><div class="passage"><h3>🌱 BUILD A GREENER FUTURE WITH GREENCHOICE!</h3><div id="passage"></div></div><div class="quiz"><div class="tag" id="tag"></div><div class="q" id="q"></div><div class="options" id="ops"></div><div class="fb" id="fb"></div><div class="controls"><button class="btn" id="next" disabled>Next Green Step →</button></div></div></div></div>
<div class="result" id="result"><div style="font-size:74px">🌍🌱</div><h2>GreenChoice Challenge Complete!</h2><div class="scorebig" id="final"></div><p id="msg"></p><button class="btn" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage="At GreenChoice, we provide environmentally responsible products (1) ____________ to help households conserve natural resources and adopt more sustainable habits. By switching (2) ____________ energy-efficient appliances and reusable household items, consumers can (3) ____________ their dependence on disposable products, (4) ____________ contributing to a significant reduction in household waste.\n\nOur practical solutions (5) ____________ environmentally responsible behaviour, (6) ____________ both local communities and the natural environment (7) ____________. Designed with convenience in mind, these products can be easily incorporated (8) ____________ everyday routines without requiring major lifestyle changes.\n\nWhether households choose solar-powered devices or other forms of (9) ____________ energy, every responsible decision matters. GreenChoice solutions (10) ____________ minimizing unnecessary resource consumption while helping individuals develop greener habits for the future."; const Q=[["Question 1", ["designing", "designed", "which designing", "having designed"], 1, "designed to + V = được thiết kế để làm gì. Cụm products designed to help households... là mệnh đề quan hệ rút gọn bị động."], ["Question 2", ["for", "with", "to", "into"], 2, "switch to + noun = chuyển sang sử dụng cái gì. → switch to energy-efficient appliances."], ["Question 3", ["make up for", "cut down on", "come up with", "put up with"], 1, "cut down on = cắt giảm. → cut down on their dependence on disposable products."], ["Question 4", ["therefore", "otherwise", "nevertheless", "likewise"], 0, "therefore = vì vậy/do đó. Giảm phụ thuộc vào đồ dùng một lần sẽ góp phần làm giảm rác thải hộ gia đình."], ["Question 5", ["discourage", "promote", "prevent", "resist"], 1, "promote environmentally responsible behaviour = thúc đẩy hành vi có trách nhiệm với môi trường."], ["Question 6", ["benefiting", "benefited", "to benefiting", "benefit from"], 0, "benefiting... là cụm V-ing bổ sung kết quả/ý nghĩa cho mệnh đề trước."], ["Question 7", ["on behalf of", "in charge of", "in the long run", "at short notice"], 2, "in the long run = về lâu dài. Đây là cụm phù hợp nhất với lợi ích lâu dài cho cộng đồng và môi trường."], ["Question 8", ["for", "with", "into", "from"], 2, "incorporate sth into sth = đưa/kết hợp cái gì vào cái gì. → incorporated into everyday routines."], ["Question 9", ["renewed", "renewable", "renewal", "renewably"], 1, "renewable energy = năng lượng tái tạo. Cần tính từ đứng trước danh từ energy."], ["Question 10", ["rely on", "result from", "focus on", "account for"], 2, "focus on + V-ing = tập trung vào việc gì. → focus on minimizing unnecessary resource consumption."]]; const L=["A","B","C","D"];
let i=0,xp=0,h=5,c=0,a=false,ans=[],on=true,ctx=null; const $=x=>document.getElementById(x);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine"){if(!on)return;let z=ac(),o=z.createOscillator(),g=z.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(z.destination);o.start();o.stop(z.currentTime+d)}
function ok(){tone(620,.08);setTimeout(()=>tone(860,.12,"triangle"),80)} function bad(){tone(170,.16,"sawtooth")} function go(){tone(420,.07,"triangle")}
$("sound").onclick=()=>{on=!on;$("sound").textContent=on?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";if(on)go()};
function show(){a=false;$("next").disabled=true;$("fb").className="fb";$("fb").innerHTML="";let q=Q[i];$("tag").textContent=`Question ${i+1}`;$("q").textContent=q[0];$("count").textContent=`Câu ${i+1}/${Q.length}`;$("score").textContent=`🌿 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${i/Q.length*100}%`;$("ops").innerHTML="";q[1].forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${o}`;b.onclick=()=>pick(n,b);$("ops").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish GreenChoice 🌱":"Next Green Step →"}
function pick(n,b){if(a)return;a=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q[2];bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add("correct");if(right){xp+=10+c*2;c++;$("fb").className="fb correct show";ok()}else{h=Math.max(0,h-1);c=0;b.classList.add("wrong");$("fb").className="fb wrong show";bad()}$("fb").innerHTML=`<strong>Đáp án: ${L[q[2]]}. ${q[1][q[2]]}</strong><br>${q[3]}`;ans.push({n,right});$("score").textContent=`🌿 ${xp} XP · Combo ${c}`;$("heart").textContent=`❤️ ${h}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!a)return;go();if(i<Q.length-1){i++;show()}else result()};
function result(){$("quizArea").style.display="none";$("result").classList.add("show");let correct=ans.filter(x=>x.right).length;$("final").textContent=`${xp} XP · ${correct}/${Q.length}`;$("msg").textContent=correct===10?"Perfect GreenChoice Master!":correct>=8?"Excellent!":"Hãy xem lại các câu sai.";let r="<h3>🌱 GreenChoice Review</h3>";Q.forEach((q,n)=>{let z=ans[n];r+=`<div class="item ${z&&z.right?"ok":"no"}"><b>Câu ${n+1}: ${z&&z.right?"Đúng":"Sai"}</b><br>Em chọn: ${z?L[z.n]:"-"}<br>Đáp án đúng: ${L[q[2]]}. ${q[1][q[2]]}<br><i>${q[3]}</i></div>`});$("review").innerHTML=r}
$("restart").onclick=()=>location.reload(); $("passage").innerHTML=passage.split("\n\n").map(p=>`<p>${p}</p>`).join(""); show();
</script></body></html>
