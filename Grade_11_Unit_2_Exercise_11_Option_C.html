<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 11 - Unit 2 - Exercise 11 - Option C</title>
<style>
:root{
 --night:#050713;--night2:#0b1025;--panel:#12182d;--panel2:#18213c;
 --moon:#dbe7ff;--blue:#7aa7ff;--violet:#9a7cff;--cyan:#72d5e8;
 --green:#52d39a;--red:#ff687b;--gold:#f4d37a;--text:#f5f7ff;--muted:#b7bfd6;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
  radial-gradient(circle at 80% 12%,rgba(122,167,255,.13),transparent 24%),
  radial-gradient(circle at 15% 18%,rgba(154,124,255,.11),transparent 22%),
  linear-gradient(180deg,#03050d,#080c1c 58%,#02040a);
 padding:18px;overflow-x:hidden
}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:white;opacity:.75;animation:twinkle 2.6s ease-in-out infinite}
.s1{left:8%;top:12%}.s2{left:18%;top:27%;animation-delay:.4s}.s3{left:34%;top:9%;animation-delay:1s}
.s4{right:12%;top:27%;animation-delay:1.6s}.s5{right:27%;top:8%;animation-delay:.8s}.s6{right:39%;top:34%;animation-delay:2s}
.s7{left:10%;bottom:18%;animation-delay:1.2s}.s8{right:15%;bottom:16%;animation-delay:.3s}
@keyframes twinkle{50%{opacity:.15;transform:scale(.55)}}
.shooting{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);top:17%;left:-150px;transform:rotate(-18deg);animation:shoot 8s linear infinite}
@keyframes shoot{55%,100%{transform:translateX(125vw) translateY(120px) rotate(-18deg);opacity:0}}
.wrap{width:min(1120px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.moon-icon{width:110px;height:110px;position:relative;display:grid;place-items:center}
.glow{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(219,231,255,.25),rgba(122,167,255,.08) 58%,transparent 73%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);opacity:.65}}
.crescent{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#eef5ff,#a9c5ff);position:relative;box-shadow:0 0 30px rgba(180,208,255,.38)}
.crescent:after{content:"";position:absolute;width:68px;height:68px;border-radius:50%;background:#091026;left:22px;top:-7px}
.spark{position:absolute;color:#dbe7ff;font-size:22px;animation:twinkle 2s infinite}.sp1{left:6px;top:12px}.sp2{right:5px;bottom:10px;animation-delay:1s}
h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#eff5ff,#9fc0ff,#a58aff,#6ed5e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:#b4bed5;font-weight:700}
.sound{border:1px solid rgba(122,167,255,.35);background:#12182a;color:#eef4ff;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(122,167,255,.2);border-radius:24px;box-shadow:0 24px 65px rgba(0,0,0,.5);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 20px;background:#0c1122;border-bottom:1px solid rgba(255,255,255,.06)}
.barbox{height:13px;background:#060a16;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#dbe7ff,#7aa7ff,#9a7cff,#72d5e8);transition:.3s;box-shadow:0 0 12px rgba(122,167,255,.25)}
.chip{background:#161e34;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}
.main{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}
.passage{background:#0d1427;border:2px solid #253555;border-radius:18px;padding:18px;max-height:560px;overflow:auto;line-height:1.75}
.passage h3{margin:0 0 10px;color:#c7d8ff}
.quizbox{background:#10172a;border:2px solid #293757;border-radius:18px;padding:18px}
.tag{display:inline-block;background:#1d2945;color:#c7d7ff;padding:7px 12px;border-radius:10px;font-weight:900}
.statement{font-size:23px;line-height:1.5;margin:16px 0 20px}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf-btn{padding:20px 14px;border-radius:16px;border:2px solid #31405f;background:#171e32;color:#f5f7ff;font-size:20px;font-weight:900;cursor:pointer;transition:.16s}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#7aa7ff;box-shadow:0 0 18px rgba(122,167,255,.12)}
.tf-btn.correct{background:#14382f!important;border-color:var(--green)!important}
.tf-btn.wrong{background:#46202b!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:17px;padding:15px;border-left:5px solid;border-radius:12px;background:#0b1120;line-height:1.6}
.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}
.controls{display:flex;justify-content:flex-end;margin-top:14px}
.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#d7e5ff,#a9a2ff);color:#19223a}
.next:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center;padding:34px 22px}.result.show{display:block}
.scorebig{font-size:58px;font-weight:1000;color:#b8cbff}
.review{text-align:left;margin-top:24px;border-top:1px solid #29344b;padding-top:16px}
.item{padding:12px 14px;background:#0d1425;border-radius:12px;margin:9px 0;border-left:5px solid #58667f;line-height:1.5}
.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:850px){.main{grid-template-columns:1fr}.passage{max-height:380px}}
@media(max-width:650px){.hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}.status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}.moon-icon{transform:scale(.78);transform-origin:left center;width:85px}}
</style>
</head>
<body>
<div class="sky">
 <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div>
 <div class="star s5"></div><div class="star s6"></div><div class="star s7"></div><div class="star s8"></div>
 <div class="shooting"></div>
</div>

<main class="wrap">
<header class="hero">
 <div class="moon-icon">
  <div class="glow"></div><div class="crescent"></div><div class="spark sp1">✦</div><div class="spark sp2">✧</div>
 </div>
 <div>
  <h1>New Moon True / False Quest</h1>
  <p class="subtitle">Grade 11 · Unit 2 · Exercise 11 · Option C</p>
 </div>
 <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
 <div class="status">
  <div class="barbox"><div class="bar" id="bar"></div></div>
  <div class="chip" id="counter"></div>
  <div class="chip" id="scoreChip"></div>
  <div class="chip" id="heartChip"></div>
 </div>

 <div class="main">
  <div class="passage">
   <h3>🌙 Emily's Blog</h3>
   <div id="passageText"></div>
  </div>

  <div class="quizbox">
   <div class="tag" id="tag"></div>
   <div class="statement" id="statement"></div>
   <div class="tf-grid">
    <button class="tf-btn" id="trueBtn">T · TRUE ✨</button>
    <button class="tf-btn" id="falseBtn">F · FALSE 🌑</button>
   </div>
   <div id="feedback" class="feedback"></div>
   <div class="controls"><button id="nextBtn" class="next" disabled>Next Moon →</button></div>
  </div>
 </div>
</div>

<div id="resultArea" class="result">
 <div style="font-size:74px">🌙✨</div>
 <h2>New Moon Quest Complete!</h2>
 <div id="finalScore" class="scorebig"></div>
 <p id="message"></p>
 <button id="restartBtn" class="next">Play Again ↻</button>
 <div id="review" class="review"></div>
</div>
</section>
</main>

<script>
const passage="When I was younger, I believed that my parents simply didn't understand me. They often questioned my decisions, reminded me to finish my homework before going out, and limited the amount of time I spent on social media. I thought they were being too strict, so we argued quite often.\n\nEverything began to change after my English teacher asked our class to keep a family communication diary for a month. Every evening, I spent ten minutes talking to my parents about my day instead of staying in my room. At first, our conversations felt uncomfortable because none of us knew what to say. However, after a few weeks, we gradually became more open with one another.\n\nI discovered that my parents did not expect me to be perfect. What they really wanted was for me to make responsible decisions and learn from my mistakes. They also admitted that they sometimes made incorrect judgments because they didn't always understand the pressure teenagers face at school today.\n\nNow, when we disagree, we try to solve the problem by discussing it calmly instead of blaming each other. We still have different opinions from time to time, but we no longer see every disagreement as a serious conflict. In fact, our relationship has become stronger because we have learned to respect different points of view rather than trying to win every argument.";
const questions=[{"statement": "Emily's parents allowed her to spend as much time on social media as she wanted.", "answer": false, "explanation": "The blog says Emily's parents limited the amount of time she spent on social media. “Limited” is the opposite of “as much time as she wanted”."}, {"statement": "The family communication diary immediately improved Emily's relationship with her parents.", "answer": false, "explanation": "At first, the conversations felt uncomfortable. Only after a few weeks did they gradually become more open. The change was gradual, not immediate."}, {"statement": "Emily realized that her parents expected her to make sensible choices instead of being perfect.", "answer": true, "explanation": "Emily says her parents did not expect her to be perfect. They wanted her to make responsible decisions. “Responsible decisions” paraphrases “sensible choices”."}, {"statement": "Emily's parents believed they always understood the difficulties teenagers experienced at school.", "answer": false, "explanation": "Her parents admitted that they sometimes made incorrect judgments because they didn't always understand the pressure teenagers face at school."}, {"statement": "According to Emily, respecting different opinions is more important than winning every argument.", "answer": true, "explanation": "Emily says their relationship became stronger because they learned to respect different points of view rather than trying to win every argument."}];

let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
 if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}
function tone(freq,duration=.1,type="sine",volume=.04,delay=0){
 if(!soundOn)return;
 const c=getCtx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(freq,s);
 g.gain.setValueAtTime(.0001,s);
 g.gain.exponentialRampToValueAtTime(volume,s+.01);
 g.gain.exponentialRampToValueAtTime(.0001,s+duration);
 o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+duration+.03);
}
function correctSound(){tone(610,.08,"triangle",.03);tone(830,.1,"sine",.03,.08);tone(1050,.14,"triangle",.028,.17)}
function wrongSound(){tone(170,.16,"sawtooth",.035);tone(100,.22,"square",.018,.11)}
function nextSound(){tone(400,.06,"triangle",.017);tone(610,.07,"triangle",.015,.06)}
function finishSound(){[440,554,659,880].forEach((f,i)=>tone(f,.18,"triangle",.027,i*.1))}

$("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
 if(soundOn)nextSound();
};

function render(){
 answered=false;
 $("trueBtn").disabled=false;
 $("falseBtn").disabled=false;
 $("trueBtn").className="tf-btn";
 $("falseBtn").className="tf-btn";
 $("nextBtn").disabled=true;
 $("feedback").className="feedback";
 $("feedback").innerHTML="";

 const q=questions[current];
 $("tag").textContent=`Statement ${current+1}`;
 $("statement").textContent=q.statement;
 $("counter").textContent=`Câu ${current+1}/${questions.length}`;
 $("scoreChip").textContent=`🌙 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${current/questions.length*100}%`;
 $("nextBtn").textContent=current===questions.length-1?"Finish Moon 🌙":"Next Moon →";
}

function choose(value){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const correct=value===q.answer;
 $("trueBtn").disabled=true;
 $("falseBtn").disabled=true;

 const chosenBtn=value?$("trueBtn"):$("falseBtn");
 const correctBtn=q.answer?$("trueBtn"):$("falseBtn");
 correctBtn.classList.add("correct");

 if(correct){
  score+=10+combo*2;
  combo++;
  $("feedback").className="feedback correct show";
  $("feedback").innerHTML=`<strong>🌙 Chính xác — ${q.answer?"TRUE":"FALSE"}.</strong>${q.explanation}`;
  correctSound();
 }else{
  hearts=Math.max(0,hearts-1);
  combo=0;
  chosenBtn.classList.add("wrong");
  $("feedback").className="feedback wrong show";
  $("feedback").innerHTML=`<strong>🌑 Chưa đúng. Đáp án: ${q.answer?"TRUE":"FALSE"}.</strong>${q.explanation}`;
  wrongSound();
 }

 answers.push({selected:value,correct});
 $("scoreChip").textContent=`🌙 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(current+1)/questions.length*100}%`;
 $("nextBtn").disabled=false;
}

$("trueBtn").onclick=()=>choose(true);
$("falseBtn").onclick=()=>choose(false);

$("nextBtn").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(current<questions.length-1){
  current++;
  render();
 }else{
  showResult();
 }
};

function showResult(){
 $("quizArea").style.display="none";
 $("resultArea").classList.add("show");

 const correctCount=answers.filter(a=>a.correct).length;
 $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
 finishSound();

 if(correctCount===5) $("message").textContent="Perfect Moon Reader! Em đã trả lời đúng toàn bộ statements.";
 else if(correctCount>=4) $("message").textContent="Excellent! Em xác định thông tin True / False rất tốt.";
 else if(correctCount>=3) $("message").textContent="Good job! Hãy xem lại những statement chưa đúng.";
 else $("message").textContent="Hãy đọc lại Emily's Blog và thử thêm một lần nữa nhé.";

 let html="<h3>🌙 New Moon Review</h3>";
 questions.forEach((q,i)=>{
  const a=answers[i];
  html+=`<div class="item ${a&&a.correct?"ok":"no"}">
   <strong>Câu ${i+1}: ${a&&a.correct?"Đúng":"Sai"}</strong><br>
   Em chọn: ${a?(a.selected?"TRUE":"FALSE"):"-"}<br>
   Đáp án đúng: ${q.answer?"TRUE":"FALSE"}<br>
   <em>${q.explanation}</em>
  </div>`;
 });
 $("review").innerHTML=html;
}

$("restartBtn").onclick=()=>{
 current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
 $("resultArea").classList.remove("show");
 $("quizArea").style.display="block";
 render();nextSound();
};

$("passageText").innerHTML=passage.split("\\n\\n").map(p=>`<p>${p}</p>`).join("");
render();
</script>
</body>
</html>
