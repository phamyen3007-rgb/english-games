<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 12 - Unit 2 - Exercise 7 - Option B</title>
  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#f5f3ff;
      --bg3:#ecfeff;
      --text:#0f172a;
      --muted:#64748b;
      --purple:#7c3aed;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 15%,rgba(37,99,235,.18),transparent 26%),
        radial-gradient(circle at 90% 20%,rgba(124,58,237,.16),transparent 25%),
        radial-gradient(circle at 80% 90%,rgba(5,150,105,.15),transparent 28%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
      padding:18px;
      overflow-x:hidden;
    }
    body.shake{animation:shake .42s ease}
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      40%{transform:translateX(9px)}
      60%{transform:translateX(-7px)}
      80%{transform:translateX(5px)}
    }
    .container{width:min(1050px,100%);margin:auto}
    .topbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      align-items:center;
      margin-bottom:16px;
    }
    .title-card{
      background:linear-gradient(135deg,#1d4ed8,#0f766e 55%,#7c3aed);
      color:#fff;
      border-radius:26px;
      padding:24px;
      box-shadow:0 18px 50px rgba(30,64,175,.22);
    }
    .title-card h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px)}
    .title-card p{margin:0;opacity:.92;line-height:1.5}
    .stats{
      display:grid;
      grid-template-columns:repeat(3,minmax(88px,1fr));
      gap:10px;
    }
    .stat{
      background:rgba(255,255,255,.92);
      border-radius:18px;
      padding:14px 12px;
      text-align:center;
      box-shadow:0 12px 28px rgba(15,23,42,.08);
      font-weight:800;
    }
    .stat small{display:block;color:var(--muted);font-weight:700;margin-top:3px}
    .progress-wrap{
      background:rgba(255,255,255,.9);
      border-radius:18px;
      padding:12px;
      margin:14px 0;
      box-shadow:0 10px 25px rgba(15,23,42,.07);
    }
    .progress-track{
      height:14px;
      background:#e2e8f0;
      border-radius:999px;
      overflow:hidden;
    }
    .progress-bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#2563eb,#7c3aed,#059669);
      transition:.35s ease;
    }
    .game-card{
      background:rgba(255,255,255,.95);
      border-radius:28px;
      padding:24px;
      box-shadow:0 22px 55px rgba(15,23,42,.12);
      position:relative;
      overflow:hidden;
    }
    .question-no{
      color:var(--purple);
      font-weight:900;
      letter-spacing:.5px;
      margin-bottom:10px;
    }
    .question{
      font-size:clamp(22px,3.6vw,32px);
      line-height:1.4;
      margin:0 0 22px;
    }
    .answers{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .answer-btn{
      border:2px solid #dbeafe;
      background:#fff;
      border-radius:18px;
      padding:16px;
      font-size:18px;
      font-weight:800;
      text-align:left;
      cursor:pointer;
      transition:.2s ease;
      color:var(--text);
    }
    .answer-btn:hover:not(:disabled){
      transform:translateY(-2px);
      border-color:#60a5fa;
      box-shadow:0 10px 24px rgba(37,99,235,.12);
    }
    .answer-btn.correct{
      border-color:#10b981;
      background:#d1fae5;
      color:#065f46;
    }
    .answer-btn.wrong{
      border-color:#ef4444;
      background:#fee2e2;
      color:#991b1b;
    }
    .answer-btn:disabled{cursor:not-allowed;opacity:.95}
    .feedback{
      display:none;
      margin-top:20px;
      padding:18px;
      border-radius:18px;
      line-height:1.6;
      font-size:16px;
    }
    .feedback.show{display:block}
    .feedback.good{background:#ecfdf5;border:1px solid #a7f3d0}
    .feedback.bad{background:#fff1f2;border:1px solid #fecdd3}
    .next-btn{
      display:none;
      margin-top:18px;
      width:100%;
      border:0;
      border-radius:17px;
      padding:15px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      color:white;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }
    .next-btn.show{display:block}
    .gift-box{
      margin:16px 0 0;
      display:none;
      text-align:center;
      padding:18px;
      border-radius:20px;
      background:linear-gradient(135deg,#fef3c7,#fde68a);
      border:1px solid #fbbf24;
      font-weight:900;
      animation:pop .35s ease;
    }
    .gift-box.show{display:block}
    @keyframes pop{
      from{transform:scale(.8);opacity:0}
      to{transform:scale(1);opacity:1}
    }
    .final-screen{
      display:none;
      text-align:center;
      background:rgba(255,255,255,.96);
      border-radius:28px;
      padding:32px;
      box-shadow:0 22px 55px rgba(15,23,42,.12);
    }
    .final-screen.show{display:block}
    .final-screen h2{font-size:clamp(30px,5vw,48px);margin:0 0 12px}
    .score-big{font-size:72px;font-weight:900;color:var(--purple);margin:10px 0}
    .restart-btn{
      border:0;
      border-radius:17px;
      padding:15px 24px;
      background:linear-gradient(135deg,#059669,#2563eb);
      color:white;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }
    .effect-layer{
      pointer-events:none;
      position:fixed;
      inset:0;
      z-index:9999;
      overflow:hidden;
    }
    .spark{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      animation:burst 900ms ease-out forwards;
    }
    @keyframes burst{
      from{transform:translate(0,0) scale(1);opacity:1}
      to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
    }
    .bomb-flash{
      position:fixed;
      inset:0;
      z-index:9998;
      background:rgba(239,68,68,.28);
      display:none;
      pointer-events:none;
    }
    .bomb-flash.show{display:block;animation:flash .45s ease}
    @keyframes flash{0%,100%{opacity:0}40%{opacity:1}}
    @media(max-width:760px){
      .topbar{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(3,1fr)}
      .answers{grid-template-columns:1fr}
      .game-card{padding:18px}
    }
  </style>
</head>
<body>
  <div class="effect-layer" id="effectLayer"></div>
  <div class="bomb-flash" id="bombFlash"></div>

  <main class="container">
    <div class="topbar">
      <section class="title-card">
        <h1>Grade 12 - Unit 2 - Exercise 7 - Option B</h1>
        <p>The Edinburgh Fringe Festival • Grammar & Reading Challenge</p>
      </section>

      <section class="stats">
        <div class="stat"><span id="hearts">❤️❤️❤️</span><small>Hearts</small></div>
        <div class="stat"><span id="xp">0</span><small>XP</small></div>
        <div class="stat"><span id="gifts">0</span><small>Gifts 🎁</small></div>
      </section>
    </div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <section class="game-card" id="gameCard">
      <div class="question-no" id="questionNo"></div>
      <h2 class="question" id="questionText"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="gift-box" id="giftBox">🎁 Surprise Gift! +20 XP</div>
      <button class="next-btn" id="nextBtn">Next question →</button>
    </section>

    <section class="final-screen" id="finalScreen">
      <h2>🎉 Mission Complete!</h2>
      <div class="score-big" id="finalScore">0/5</div>
      <p id="finalMessage"></p>
      <p><strong>XP:</strong> <span id="finalXP"></span> • <strong>Gifts:</strong> <span id="finalGifts"></span></p>
      <button class="restart-btn" onclick="restartGame()">Play again</button>
    </section>
  </main>

  <script>
    const quizData = [
      {
        q:"Taking place every August, the Edinburgh Fringe Festival ____________.",
        options:[
          "attracting thousands of performers and visitors from around the world",
          "attracts thousands of performers and visitors from around the world",
          "attracted thousands of performers and visitors from around the world",
          "has attracted by thousands of performers and visitors from around the world"
        ],
        answer:1,
        explain:"Sau cụm phân từ Taking place every August, cần một mệnh đề chính hoàn chỉnh. Chủ ngữ the Edinburgh Fringe Festival là số ít nên dùng attracts. Đáp án đúng: B."
      },
      {
        q:"The festival ____________ as an unofficial event alongside the Edinburgh International Festival in 1947.",
        options:["begins","has begun","beginning","began"],
        answer:3,
        explain:"Có mốc thời gian xác định in 1947 nên dùng quá khứ đơn. Đáp án đúng: began."
      },
      {
        q:"Today, it features a variety of performances, ____________ make the festival one of the largest arts events in the world.",
        options:["where","who","which","that"],
        answer:2,
        explain:"Sau dấu phẩy cần mệnh đề quan hệ không xác định. which thay thế cho toàn bộ ý phía trước; that không dùng sau dấu phẩy. Đáp án đúng: which."
      },
      {
        q:"Visitors can enjoy performances in theatres, parks, cafés, and even on the streets, ____________.",
        options:[
          "created a lively atmosphere throughout the city",
          "which create a lively atmosphere throughout the city by them",
          "create a lively atmosphere throughout the city",
          "creating a lively atmosphere throughout the city"
        ],
        answer:3,
        explain:"Sau dấu phẩy có thể dùng cụm V-ing để bổ sung kết quả hoặc ý nghĩa cho cả mệnh đề trước. Đáp án đúng: creating a lively atmosphere throughout the city."
      },
      {
        q:"The Edinburgh Fringe Festival is loved by many people because ____________.",
        options:[
          "only professional actors are allowed to perform there",
          "it is held in a different country each year",
          "it offers unforgettable cultural experiences for audiences of all ages",
          "audiences avoided attending its performances every year"
        ],
        answer:2,
        explain:"Câu cần nêu lý do hợp lý khiến lễ hội được yêu thích. Đáp án đúng: it offers unforgettable cultural experiences for audiences of all ages."
      }
    ];

    let current = 0;
    let score = 0;
    let hearts = 3;
    let xp = 0;
    let gifts = 0;
    let answered = false;

    const questionNo = document.getElementById("questionNo");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const heartsEl = document.getElementById("hearts");
    const xpEl = document.getElementById("xp");
    const giftsEl = document.getElementById("gifts");
    const giftBox = document.getElementById("giftBox");
    const gameCard = document.getElementById("gameCard");
    const finalScreen = document.getElementById("finalScreen");

    function renderQuestion(){
      answered = false;
      const item = quizData[current];

      questionNo.textContent = `Question ${current + 1} of ${quizData.length}`;
      questionText.textContent = item.q;
      answers.innerHTML = "";
      feedback.className = "feedback";
      feedback.innerHTML = "";
      nextBtn.className = "next-btn";
      giftBox.className = "gift-box";
      progressBar.style.width = `${(current / quizData.length) * 100}%`;

      item.options.forEach((option,index)=>{
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.innerHTML = `<strong>${String.fromCharCode(65+index)}.</strong> ${option}`;
        btn.addEventListener("click",()=>selectAnswer(index,btn));
        answers.appendChild(btn);
      });
    }

    function selectAnswer(index,button){
      if(answered) return;
      answered = true;

      const item = quizData[current];
      const buttons = [...document.querySelectorAll(".answer-btn")];

      buttons.forEach(btn=>btn.disabled=true);
      buttons[item.answer].classList.add("correct");

      if(index === item.answer){
        score++;
        xp += 10;
        button.classList.add("correct");
        feedback.className = "feedback show good";
        feedback.innerHTML = `<strong>✅ Chính xác!</strong><br>${item.explain}`;
        playFireworkSound();
        fireworks();

        if(current === 2 || current === 4){
          gifts++;
          xp += 20;
          giftBox.className = "gift-box show";
        }
      }else{
        hearts = Math.max(0,hearts-1);
        button.classList.add("wrong");
        feedback.className = "feedback show bad";
        feedback.innerHTML = `<strong>❌ Chưa đúng.</strong><br>${item.explain}`;
        bombEffect();
        playBombSound();
      }

      updateStats();
      nextBtn.className = "next-btn show";
      nextBtn.textContent = current === quizData.length-1 ? "See results →" : "Next question →";
    }

    function updateStats(){
      heartsEl.textContent = "❤️".repeat(hearts) + "🖤".repeat(3-hearts);
      xpEl.textContent = xp;
      giftsEl.textContent = gifts;
    }

    nextBtn.addEventListener("click",()=>{
      current++;
      if(current < quizData.length){
        renderQuestion();
      }else{
        showFinal();
      }
    });

    function showFinal(){
      progressBar.style.width = "100%";
      gameCard.style.display = "none";
      finalScreen.classList.add("show");

      document.getElementById("finalScore").textContent = `${score}/5`;
      document.getElementById("finalXP").textContent = xp;
      document.getElementById("finalGifts").textContent = gifts;

      const message =
        score === 5 ? "Xuất sắc! Bạn đã làm đúng toàn bộ câu hỏi." :
        score === 4 ? "Rất tốt! Bạn đã nắm khá chắc kiến thức." :
        score >= 3 ? "Khá tốt! Hãy xem lại những câu còn sai." :
        "Cố gắng thêm nhé! Hãy chơi lại để ghi nhớ tốt hơn.";

      document.getElementById("finalMessage").textContent = message;
      fireworks();
      playFireworkSound();
    }

    function restartGame(){
      current=0;
      score=0;
      hearts=3;
      xp=0;
      gifts=0;

      finalScreen.classList.remove("show");
      gameCard.style.display="block";
      updateStats();
      renderQuestion();
    }

    function fireworks(){
      const layer = document.getElementById("effectLayer");
      const colors = ["#f59e0b","#ef4444","#22c55e","#3b82f6","#a855f7","#ec4899"];
      const cx = window.innerWidth/2;
      const cy = window.innerHeight/3;

      for(let i=0;i<50;i++){
        const s=document.createElement("span");
        s.className="spark";
        s.style.left=cx+"px";
        s.style.top=cy+"px";
        s.style.background=colors[Math.floor(Math.random()*colors.length)];

        const angle=Math.random()*Math.PI*2;
        const distance=80+Math.random()*220;

        s.style.setProperty("--x",Math.cos(angle)*distance+"px");
        s.style.setProperty("--y",Math.sin(angle)*distance+"px");

        layer.appendChild(s);
        setTimeout(()=>s.remove(),950);
      }
    }

    function bombEffect(){
      const flash=document.getElementById("bombFlash");
      flash.classList.remove("show");
      void flash.offsetWidth;
      flash.classList.add("show");

      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");

      setTimeout(()=>document.body.classList.remove("shake"),500);
    }

    function playFireworkSound(){
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(!AudioContextClass) return;

      const ctx=new AudioContextClass();
      const now=ctx.currentTime;

      [659,784,988,1319].forEach((freq,i)=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.type="sine";
        osc.frequency.value=freq;
        gain.gain.setValueAtTime(.0001,now+i*.08);
        gain.gain.exponentialRampToValueAtTime(.18,now+i*.08+.02);
        gain.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.22);

        osc.connect(gain).connect(ctx.destination);
        osc.start(now+i*.08);
        osc.stop(now+i*.08+.24);
      });
    }

    function playBombSound(){
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(!AudioContextClass) return;

      const ctx=new AudioContextClass();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();

      osc.type="sawtooth";
      osc.frequency.setValueAtTime(140,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45,ctx.currentTime+.45);
      gain.gain.setValueAtTime(.25,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);

      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime+.5);
    }

    updateStats();
    renderQuestion();
  </script>
</body>
</html>
