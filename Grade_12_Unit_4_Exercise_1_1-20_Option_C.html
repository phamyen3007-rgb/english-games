<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 4 - Exercise 1 (1-20) - Option C</title>
<style>
:root{--night:#07111f;--panel:#0d2038;--panel2:#123052;--cyan:#5ce7ff;--pink:#ff6ec7;--violet:#8f7cff;--gold:#ffd66e;--green:#4fd39a;--red:#ff6878;--text:#f4f9ff;--muted:#b3c7db}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 12%,rgba(92,231,255,.10),transparent 24%),radial-gradient(circle at 86% 18%,rgba(255,110,199,.09),transparent 22%),linear-gradient(160deg,#050c16,#091a2c 58%,#040914);padding:18px;overflow-x:hidden}
.city-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.building{position:absolute;bottom:0;background:linear-gradient(180deg,#0d2031,#040912);border-top:1px solid rgba(255,255,255,.05)}.b1{left:2%;width:9%;height:33%}.b2{left:13%;width:12%;height:48%}.b3{left:27%;width:8%;height:40%}.b4{right:25%;width:10%;height:46%}.b5{right:11%;width:12%;height:37%}.b6{right:1%;width:8%;height:52%}.window{position:absolute;width:5px;height:8px;background:var(--gold);box-shadow:0 0 8px rgba(255,214,110,.55);opacity:.7}.w1{left:15%;top:18%}.w2{left:48%;top:32%}.w3{right:18%;top:22%}.w4{right:35%;top:45%}.glow{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(45px);opacity:.14}.g1{background:#5ce7ff;left:-90px;top:8%}.g2{background:#ff6ec7;right:-100px;bottom:8%}
.wrap{max-width:1120px;margin:auto;position:relative;z-index:2}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.hero-left{display:flex;align-items:center;gap:14px}.icon{font-size:64px;filter:drop-shadow(0 0 16px rgba(92,231,255,.22))}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#eafaff,#5ce7ff,#8f7cff,#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:6px;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(92,231,255,.25);background:#102844;color:white;padding:11px 14px;border-radius:12px;font-weight:900;cursor:pointer}.shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(92,231,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.4)}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#0a1a2d}.track{height:13px;background:#040a12;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold));transition:.25s}.chip{background:#12304e;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}.game{padding:22px}.card{background:#0d263f;border:2px solid #1e4b6d;border-radius:20px;padding:20px;max-width:850px;margin:auto}.qtag{display:inline-block;background:#173b5c;color:#d8f7ff;padding:7px 12px;border-radius:10px;font-weight:900}.question{font-size:22px;line-height:1.55;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{padding:15px;border:2px solid #285372;border-radius:14px;background:#112e4b;color:#fff;text-align:left;font-size:17px;cursor:pointer;transition:.15s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 18px rgba(92,231,255,.09)}.option.correct{background:#154232!important;border-color:var(--green)!important}.option.wrong{background:#482229!important;border-color:var(--red)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#091b2c;line-height:1.55}.feedback.show{display:block}.feedback.ok{border-color:var(--green)}.feedback.no{border-color:var(--red)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#8cecff,#b6a6ff,#ffb7e0);color:#18314f;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:32px}.result.show{display:block}.big{font-size:58px;font-weight:1000;color:#8cecff}.review{text-align:left;margin-top:22px}.item{padding:12px 14px;background:#0b2035;border-left:5px solid #58728b;border-radius:12px;margin:9px 0;line-height:1.5}.item.ok{border-left-color:var(--green)}.item.no{border-left-color:var(--red)}
@media(max-width:700px){.options{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="city-bg"><div class="glow g1"></div><div class="glow g2"></div><div class="building b1"><span class="window w1"></span></div><div class="building b2"><span class="window w2"></span></div><div class="building b3"></div><div class="building b4"><span class="window w3"></span></div><div class="building b5"><span class="window w4"></span></div><div class="building b6"></div></div>
<div class="wrap">
<div class="hero"><div class="hero-left"><div class="icon">🌆</div><div><h1>Urban Neon Challenge</h1><div class="sub">Grade 12 · Unit 4 · Exercise 1 (1–20) · Option C</div></div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="shell"><div id="quizArea"><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="game"><div class="card"><div class="qtag" id="qtag"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next" disabled>Next City Block →</button></div></div></div></div>
<div class="result" id="result"><div style="font-size:74px">🌆🏆</div><h2>Urban Mission Complete!</h2><div class="big" id="final"></div><p id="message"></p><button class="next" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const Q=[{"q": "Rapid urbanisation has placed enormous pressure on the city's ____________, particularly its transport, water supply, and waste management systems.", "options": ["accommodation", "convenience", "infrastructure", "landscape"], "answer": 2, "explanation": "Infrastructure = cơ sở hạ tầng, bao gồm hệ thống giao thông, cấp nước và xử lý rác thải. Vì vậy đáp án C phù hợp nhất."}, {"q": "As more agricultural land is converted into residential areas, many farmers find it difficult to ____________ their traditional way of life.", "options": ["afford", "urbanise", "accommodate", "maintain"], "answer": 3, "explanation": "Maintain a way of life = duy trì lối sống. Câu nói nông dân khó tiếp tục lối sống truyền thống khi đất nông nghiệp bị chuyển đổi."}, {"q": "Despite several measures introduced by the local authorities, traffic congestion has become ____________ during peak hours.", "options": ["more and more serious", "the most serious", "as seriously as", "less serious than"], "answer": 0, "explanation": "More and more + adjective = ngày càng... → more and more serious = ngày càng nghiêm trọng."}, {"q": "The rapid ____________ of the city has resulted in the construction of numerous high-rise buildings on its outskirts.", "options": ["expense", "expansion", "employment", "residence"], "answer": 1, "explanation": "Expansion = sự mở rộng. Rapid expansion of the city = sự mở rộng nhanh chóng của thành phố."}, {"q": "The government ____________ several major infrastructure projects since the city's population began to increase dramatically.", "options": ["launched", "was launching", "had launched", "has launched"], "answer": 3, "explanation": "Since + mốc quá khứ thường đi với Present Perfect ở mệnh đề chính. → has launched."}, {"q": "Housing in the city centre has become so expensive that many low-income residents can no longer ____________ to live there.", "options": ["reside", "afford", "expand", "provide"], "answer": 1, "explanation": "Afford to do something = có đủ khả năng tài chính để làm gì. → can no longer afford to live there."}, {"q": "____________ public transport becomes, ____________ likely urban residents are to depend on private vehicles.", "options": ["More efficient / less", "The most efficient / the least", "The more efficient / the less", "The more efficiently / the fewer"], "answer": 2, "explanation": "Cấu trúc so sánh kép: The + comparative..., the + comparative... → The more efficient..., the less likely..."}, {"q": "A shortage of affordable housing may lead to serious ____________ as increasing numbers of people compete for limited living space.", "options": ["overcrowding", "convenience", "urban development", "employment"], "answer": 0, "explanation": "Overcrowding = tình trạng quá đông đúc. Thiếu nhà ở giá phải chăng có thể dẫn đến quá tải chỗ ở."}, {"q": "The city authorities are investing heavily in public transportation in an attempt to ____________ traffic congestion and improve air quality.", "options": ["put up with", "make up for", "come up with", "cut down on"], "answer": 3, "explanation": "Cut down on = cắt giảm. → cut down on traffic congestion = giảm tình trạng ùn tắc giao thông."}, {"q": "____________ the city becomes, the greater the demand for housing, transportation, and other public facilities becomes.", "options": ["The densely populated", "The more densely populated", "The most densely populated", "The more densely population"], "answer": 1, "explanation": "So sánh kép: The more densely populated the city becomes, the greater the demand... = Thành phố càng đông dân thì nhu cầu càng lớn."}],L=["A","B","C","D"];let i=0,xp=0,hearts=5,combo=0,answered=false,history=[],soundOn=true,ctx=null;const $=id=>document.getElementById(id);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine",v=.035,delay=0){if(!soundOn)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(650,.08,"triangle");tone(920,.11,"sine",.03,.08)}function bad(){tone(165,.16,"sawtooth");tone(95,.2,"square",.018,.1)}function nextSound(){tone(420,.06,"triangle",.018);tone(660,.07,"triangle",.015,.06)}function win(){[523,659,784,1047].forEach((f,k)=>tone(f,.17,"triangle",.027,k*.09))}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)nextSound()};
function render(){answered=false;$("next").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";const q=Q[i];$("qtag").textContent=`Question ${i+1}`;$("question").textContent=q.q;$("count").textContent=`${i+1}/${Q.length}`;$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${i/Q.length*100}%`;$("options").innerHTML="";q.options.forEach((op,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<strong>${L[n]}.</strong> ${op}`;b.onclick=()=>choose(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Mission 🌆":"Next City Block →"}
function choose(n,btn){if(answered)return;answered=true;const q=Q[i],buttons=[...document.querySelectorAll(".option")],right=n===q.answer;buttons.forEach(b=>b.disabled=true);buttons[q.answer].classList.add("correct");if(right){xp+=10+combo*2;combo++;$("feedback").className="feedback ok show";$("feedback").innerHTML=`<strong>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;good()}else{hearts=Math.max(0,hearts-1);combo=0;btn.classList.add("wrong");$("feedback").className="feedback no show";$("feedback").innerHTML=`<strong>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;bad()}history.push({selected:n,correct:right});$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!answered)return;nextSound();if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("quizArea").style.display="none";$("result").classList.add("show");win();const correct=history.filter(x=>x.correct).length;$("final").textContent=`${correct}/${Q.length} · ${xp} XP`;$("message").textContent=correct===Q.length?"Perfect Urban Master!":correct>=8?"Excellent! Em nắm rất chắc từ vựng và ngữ pháp Urbanisation.":correct>=6?"Good job! Hãy xem lại các câu chưa đúng.":"Hãy ôn lại các collocations và cấu trúc so sánh rồi thử lại.";let html="<h3>🌆 Urban Review</h3>";Q.forEach((q,k)=>{const a=history[k];html+=`<div class="item ${a.correct?"ok":"no"}"><strong>Question ${k+1}: ${a.correct?"Correct":"Incorrect"}</strong><br>Your answer: ${L[a.selected]}. ${q.options[a.selected]}<br>Correct: ${L[q.answer]}. ${q.options[q.answer]}<br><em>${q.explanation}</em></div>`});$("review").innerHTML=html}
$("restart").onclick=()=>location.reload();render();
</script>
</body></html>
