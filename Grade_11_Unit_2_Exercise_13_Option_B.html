<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#1b2430,#10161d);color:#433b37;padding:18px;min-height:100vh}.wrap{max-width:1180px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}.hero h1{margin:0;color:#fff;font-size:clamp(28px,4vw,43px)}.sub{color:#d5c7bd;font-weight:700;margin-top:5px}.sound{border:1px solid #6b5b52;background:#2b3440;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.shell{background:#fffaf3;border-radius:24px;overflow:hidden;box-shadow:0 24px 65px #0007}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:15px 18px;background:#f7ede3}.track{height:12px;background:#e9ddd2;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#d9828f,#e6b85c,#7a9fc8,#52b788)}.chip{background:#fff;padding:8px 11px;border-radius:999px;font-weight:900}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;padding:20px}.passage,.quiz{border:2px solid #eadbce;border-radius:18px;padding:18px}.passage{background:#fff;max-height:690px;overflow:auto;line-height:1.75}.quiz{background:#fbf2e9}.qtag{display:inline-block;background:#f0dfd2;padding:7px 11px;border-radius:10px;font-weight:900}.question{font-size:21px;line-height:1.5;margin:16px 0}.options{display:grid;gap:11px}.option{padding:14px;border:2px solid #dec9b8;background:#fff;border-radius:14px;text-align:left;font-size:16px;cursor:pointer}.option.correct{background:#eafff3;border-color:#52b788}.option.wrong{background:#fff0f2;border-color:#e66b78}.feedback{display:none;margin-top:14px;padding:14px;border-left:5px solid;border-radius:12px;background:#fff;line-height:1.55}.feedback.show{display:block}.feedback.ok{border-color:#52b788}.feedback.no{border-color:#e66b78}.controls{text-align:right;margin-top:14px}.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#f1c4ca,#f4d99a,#bed3e7);cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:30px}.result.show{display:block}.big{font-size:56px;font-weight:1000;color:#a86570}.review{text-align:left;margin-top:22px}.item{padding:12px;background:#fff;border-left:5px solid #b8a89b;border-radius:12px;margin:9px 0}.item.ok{border-left-color:#52b788}.item.no{border-left-color:#e66b78}

</style></head><body><div class="wrap">
<div class="hero"><div><h1>👨‍👩‍👧‍👦 Family Bridge Reading Challenge</h1><div class="sub">Grade 11 · Unit 2 · Exercise 13 · Option B</div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="shell"><div id="quizArea"><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div>
<div class="grid"><section class="passage"><h2>BUILDING UNDERSTANDING BETWEEN PARENTS AND TEENAGERS</h2><div id="passage"></div></section><section class="quiz"><div class="qtag" id="qtag"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next" disabled>Next Bridge Step →</button></div></section></div></div>
<div class="result" id="result"><div style="font-size:72px">🌉💗</div><h2>Family Bridge Complete!</h2><div class="big" id="final"></div><p id="message"></p><button class="next" id="restart">Play Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const passage="<p><strong>[I]</strong> The relationship between teenagers and their parents often changes as young people grow older. During childhood, children usually depend heavily on their parents for guidance and support. As they enter adolescence, however, they begin to develop their own opinions, interests, and values. <strong>[II]</strong> This growing desire for independence is a natural part of becoming an adult. <strong>[III]</strong> Nevertheless, it can sometimes create tension within the family, especially when parents and teenagers have different expectations. <strong>[IV]</strong></p>\n<p>One common source of disagreement is the amount of freedom teenagers should have. Young people may want to spend more time with friends, choose their own clothes, or decide how to use their free time. Parents, on the other hand, may worry that giving too much freedom could expose their children to unnecessary risks. As a result, they often establish rules concerning study time, social activities, and the use of digital devices. Although teenagers may consider these rules too restrictive, parents usually create them out of concern for their children's safety and well-being.</p>\n<p>Communication also plays an important role in maintaining a healthy parent-teen relationship. Arguments can become more serious when family members refuse to listen to one another or express their feelings respectfully. Instead of immediately criticizing their children, parents can encourage open conversations and allow teenagers to explain their views. Teenagers, in return, should try to understand that parental advice often comes from experience and concern. When both sides are willing to listen and compromise, many conflicts can be <u>resolved</u> before they damage the relationship.</p>\n<p>Another challenge facing modern families is technology. Smartphones and social media have changed the way teenagers communicate and spend their free time. While these technologies provide opportunities for learning and social interaction, excessive screen time may reduce face-to-face communication within families. Some parents therefore establish technology-free periods, particularly during meals or family activities. Such measures are not intended to completely control teenagers but rather to encourage <u>them</u> to maintain a healthier balance between their online and offline lives.</p>",Q=[{"q": "Where in paragraph 1 does the following sentence best fit? “They may therefore begin to question rules that they once accepted without complaint.”", "options": ["[I]", "[II]", "[III]", "[IV]"], "answer": 2, "explanation": "Mạch ý hợp lý: desire for independence → question rules → family tension. “They” = teenagers và “therefore” nối kết quả trực tiếp với ý trước."}, {"q": "According to paragraph 2, which of the following is NOT mentioned as an area in which parents may establish rules?", "options": ["how teenagers use digital devices", "how much time teenagers spend studying", "which friends teenagers are allowed to have", "teenagers' social activities"], "answer": 2, "explanation": "Bài nêu study time, social activities và the use of digital devices. Việc cha mẹ quy định teenagers được chơi với bạn nào không được nhắc đến."}, {"q": "Which of the following best paraphrases the sentence about teenagers finding rules restrictive and parents setting them for safety and well-being?", "options": ["Parents establish rules mainly because they want complete control over their teenagers' decisions.", "Teenagers usually accept family rules because they understand that their parents want to protect them.", "Even though teenagers may feel that family rules limit their freedom, parents generally set them because they want to protect their children.", "Parents are becoming less willing to give teenagers freedom because young people frequently ignore family rules."], "answer": 2, "explanation": "C giữ nguyên đủ hai ý: teenagers cảm thấy rules hạn chế tự do, nhưng parents đặt rules vì muốn bảo vệ con cái."}, {"q": "The word “resolved” in paragraph 3 is closest in meaning to ______.", "options": ["avoided", "settled", "discovered", "repeated"], "answer": 1, "explanation": "Resolve a conflict = giải quyết xung đột. Settle a conflict/dispute cũng có nghĩa là giải quyết, dàn xếp."}, {"q": "Which of the following is TRUE according to the passage?", "options": ["Teenagers' desire for independence is presented as a normal stage of growing up.", "Parents are advised to allow teenagers complete freedom in order to prevent family conflicts.", "Digital technology has mainly improved communication between parents and teenagers.", "Family disagreements usually occur because teenagers refuse to follow their parents' career choices."], "answer": 0, "explanation": "Đoạn 1 nói mong muốn độc lập là “a natural part of becoming an adult”, tức là một giai đoạn bình thường của quá trình trưởng thành."}, {"q": "The word “them” in the phrase “encourage them to maintain a healthier balance” in the last paragraph refers to ______.", "options": ["technologies", "parents", "family activities", "teenagers"], "answer": 3, "explanation": "Câu đầy đủ có cấu trúc: control teenagers → encourage them. Vì vậy “them” = teenagers."}, {"q": "Which of the following best summarizes paragraph 3?", "options": ["Parents should avoid giving advice because teenagers prefer making decisions independently.", "Family conflicts can often be reduced through respectful communication, listening, and compromise from both parents and teenagers.", "Teenagers should follow parental advice because parents have more life experience.", "Arguments between parents and teenagers mainly result from parents' inability to understand modern lifestyles."], "answer": 1, "explanation": "Đoạn 3 tập trung vào communication, listening, respectful expression và compromise như cách giảm xung đột gia đình."}, {"q": "Which of the following best summarizes the passage?", "options": ["Teenagers increasingly depend on technology, so parents should introduce strict rules to control their social activities and online communication.", "Most conflicts between parents and teenagers result from young people's unwillingness to accept parental authority and family responsibilities.", "Parents should give teenagers greater independence because family rules generally prevent young people from developing important life skills.", "As teenagers seek greater independence, families may face conflicts over freedom, communication, and technology, but mutual understanding and reasonable boundaries can help maintain healthy relationships."], "answer": 3, "explanation": "D bao quát toàn bài: independence, conflicts over freedom, communication, technology và giải pháp là mutual understanding cùng reasonable boundaries."}],L=["A","B","C","D"];let i=0,xp=0,hearts=5,combo=0,answered=false,history=[],soundOn=true,ctx=null;const $=x=>document.getElementById(x);
function tone(f,d=.1,t="sine"){if(!soundOn)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function good(){tone(640,.08,"triangle");setTimeout(()=>tone(900,.12),80)}function bad(){tone(160,.16,"sawtooth")}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off"};
function render(){answered=false;$("next").disabled=true;$("feedback").className="feedback";const q=Q[i];$("qtag").textContent=`Question ${i+1}`;$("question").textContent=q.q;$("count").textContent=`${i+1}/${Q.length}`;$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${i/Q.length*100}%`;$("options").innerHTML="";q.options.forEach((op,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${L[n]}.</b> ${op}`;b.onclick=()=>pick(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Bridge 💗":"Next Bridge Step →"}
function pick(n,b){if(answered)return;answered=true;let q=Q[i],bs=[...document.querySelectorAll(".option")],right=n===q.answer;bs.forEach(x=>x.disabled=true);bs[q.answer].classList.add("correct");if(right){xp+=10+combo*2;combo++;$("feedback").className="feedback ok show";$("feedback").innerHTML=`<b>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</b><br>${q.explanation}`;good()}else{hearts=Math.max(0,hearts-1);combo=0;b.classList.add("wrong");$("feedback").className="feedback no show";$("feedback").innerHTML=`<b>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</b><br>${q.explanation}`;bad()}history.push({selected:n,correct:right});$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!answered)return;if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("quizArea").style.display="none";$("result").classList.add("show");let c=history.filter(x=>x.correct).length;$("final").textContent=`${c}/${Q.length} · ${xp} XP`;$("message").textContent=c===8?"Perfect! Em đã hoàn thành toàn bộ Family Bridge.":c>=7?"Excellent reading comprehension!":c>=5?"Good job! Hãy xem lại các câu chưa đúng.":"Hãy đọc lại passage và thử thêm một lần nữa.";let h="<h3>📘 Family Bridge Review</h3>";Q.forEach((q,k)=>{let a=history[k];h+=`<div class="item ${a.correct?"ok":"no"}"><b>Question ${k+1}: ${a.correct?"Correct":"Incorrect"}</b><br>Your answer: ${L[a.selected]}. ${q.options[a.selected]}<br>Correct: ${L[q.answer]}. ${q.options[q.answer]}<br><i>${q.explanation}</i></div>`});$("review").innerHTML=h}
$("restart").onclick=()=>location.reload();$("passage").innerHTML=passage;render();
</script></body></html>
