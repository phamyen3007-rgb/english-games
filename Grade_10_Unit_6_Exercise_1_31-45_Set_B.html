name;save();startLesson(false);};window.scrollTo({top:0,behavior:'instant'});}

 document.getElementById('restartBtn').onclick=()=>ask('Làm lại từ đầu?','Lượt đang làm sẽ kết thúc mà không lưu điểm. Câu rời và đáp án sẽ được trộn; thứ tự bài đọc/nghe được giữ nguyên.',()=>startLesson(true),'Làm lại');document.getElementById('submitBtn').onclick=()=>{const un=state.questions.filter(q=>!state.answers[q.number].done).length;ask('Nộp bài?',un?`Còn ${un} câu chưa trả lời đúng. Điểm theo lần chọn đầu vẫn được lưu; câu chưa chọn tính 0 điểm.`:'Tất cả câu đã được trả lời đúng. Lưu kết quả lượt này?',()=>finish('submitted'));};

function renderQuestion(focus=false){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number];document.getElementById('questionArea').innerHTML=`<div class="qhead"><strong>Câu ${q.number}</strong><span>${state.index+1}/${state.questions.length}${a.done?' · Đã khóa':''}</span></div><h2 class="question" id="questionStem" tabindex="-1">${esc(q.stem)}</h2><div class="options" role="group" aria-labelledby="questionStem">${q.opts.map((o,i)=>`<button class="option ${a.selected===o.id?'selected':''} ${a.wrong.includes(o.id)?'wrong':''} ${a.done&&o.id===q.answer?'correct':''}" data-option="${o.id}" aria-pressed="${a.selected===o.id}" ${a.done||a.wrong.includes(o.id)?'disabled':''}><span class="optletter">${q.options.length===2?'•':letter(i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${a.done?`<div class="feedback"><strong>Chính xác${a.firstCorrect?' · Đúng lần đầu':''}</strong>${esc(q.explanation)}</div>`:a.attempts?'<div class="feedback bad"><strong>Chưa đúng. Em thử lại nhé.</strong>Đọc kỹ ngữ cảnh hoặc nghe lại. Mỗi lần chọn sai mất 1 tim.</div>':''}</div><div class="actionrow"><button class="secondary" id="prevBtn" ${state.index===0?'disabled':''}>Câu trước</button><button class="primary" id="checkBtn" ${a.done||a.selected===null||a.wrong.includes(a.selected)?'disabled':''}>Kiểm tra</button><button class="secondary" id="nextBtn">${state.index===state.questions.length-1?'Kết quả':'Câu tiếp'}</button></div>`;
 document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>{const on=Number(x.dataset.option)===a.selected;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on);});document.getElementById('checkBtn').disabled=false;});document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('prevBtn').onclick=()=>{if(state.index>0){state.index--;renderQuestion(true);}};document.getElementById('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion(true);}else if(state.questions.every(x=>state.answers[x.number].done)){finish('completed');}else{document.getElementById('submitBtn').click();}};

function checkAnswer(){if(!state||state.finished)return;const q=state.questions[state.index],a=state.answers[q.number];if(a.done||a.selected===null||a.wrong.includes(a.selected))return;const correct=a.selected===q.answer;a.attempts++;if(a.attempts===1){a.firstCorrect=correct;if(correct)state.firstCorrect++;}if(correct){a.done=true;state.xp+=a.attempts===1?10:5;state.combo=a.attempts===1?state.combo+1:0;state.maxCombo=Math.max(state.maxCombo,state.combo);if(state.combo>0&&state.combo%5===0&&state.hearts<5){state.hearts++;toast('5 câu đúng liên tiếp · Hồi 1 tim!');}}else{a.wrong.push(a.selected);a.selected=null;state.hearts--;state.combo=0;}renderQuestion();if(state.hearts<=0)finish('hearts');}
function finish(reason){if(!state||state.finished)return;state.finished=true;stopClock();stopAudio();state.elapsed=timeNow();const s=state,mastered=s.questions.filter(q=>s.answers[q.number].done).length;const attempt={name:db.name,lesson:s.lesson.id,title:s.lesson.title,score:scoreNum(s),firstCorrect:s.firstCorrect,mastered,total:s.questions.length,seconds:s.elapsed,xp:s.xp,maxCombo:s.maxCombo,reason,date:new Date().toISOString(),transcriptSeen:s.transcriptSeen,plays:s.plays,restarts:s.restarts,review:s.questions.map(q=>({number:q.number,attempts:s.answers[q.number].attempts,firstCorrect:s.answers[q.number].firstCorrect,mastered:s.answers[q.number].done}))};db.attempts[s.lesson.id]=[...(db.attempts[s.lesson.id]||[]),attempt];save();state.result=attempt;renderResult();}
function renderResult(){const s=state,r=s.result;const heading=r.reason==='hearts'?'Hết tim, thêm một cơ hội để tiến bộ.':r.mastered===r.total?'Hoàn thành bài luyện tập!':'Kết quả lượt luyện tập';app.innerHTML=`<section class="result"><p class="eyebrow">${esc(r.title)}</p><span class="settag ${s.lesson.level==='C'?'c':''}">Set ${s.lesson.level}</span><h2>${heading}</h2><p><strong>${esc(r.name)}</strong> · ${new Date(r.date).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</p><div class="score">${r.score.toFixed(2)}<small> /10</small></div><p class="finenote">Điểm theo lần chọn đầu, không cộng lại điểm khi thử lại.</p><div class="resultmetrics"><div><strong>${r.firstCorrect}/${r.total}</strong><span>Đúng ngay lần đầu</span></div><div><strong>${r.mastered}/${r.total}</strong><span>Đã đúng sau khi luyện</span></div><div><strong>${fmt(r.seconds)}</strong><span>Thời gian làm bài</span></div></div><p class="finenote">${r.xp} XP · Combo cao nhất: ${r.maxCombo} · Số lần làm lại từ đầu: ${r.restarts}${s.lesson.transcript?' · Đã mở transcript: '+(r.transcriptSeen?'Có':'Chưa'):''}</p><div class="resultactions"><button class="primary" id="retryResult">Làm lại &amp; trộn bài</button><button class="secondary" id="downloadResult">Tải kết quả CSV</button><button class="secondary" id="homeResult">Danh mục bài</button></div><details class="review" open><summary>Đáp án và giải thích từng câu</summary>${[...s.questions].sort((a,b)=>a.number-b.number).map(q=>{const a=s.answers[q.number];return `<article class="reviewitem"><span class="statusbadge ${a.firstCorrect?'ok':''}">${a.firstCorrect?'Đúng lần đầu':a.done?'Đã sửa đúng':a.attempts?'Cần luyện thêm':'Chưa chọn đáp án'}</span><h3>Câu ${q.number}. ${esc(q.stem)}</h3><p class="answer">Đáp án: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p></article>`;}).join('')}</details>${s.lesson.transcript?`<details class="review"><summary>Transcript bài nghe</summary>${s.lesson.transcript.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</details>`:''}</section>${footer()}`;document.getElementById('retryResult').onclick=()=>startLesson(true);document.getElementById('downloadResult').onclick=downloadResult;document.getElementById('homeResult').onclick=goHome;window.scrollTo({top:0,behavior:'instant'});}
function csvField(v){let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function downloadResult(){const r=state.result;const headers=['Ho ten','Bai','Diem lan chon dau /10','Dung lan dau','Da dung sau khi luyen','Tong cau','Thoi gian giay','XP','Combo cao nhat','So lan lam lai','Da mo transcript','Thoi diem','Cau can luyen them'];const values=[r.name,r.title,r.score,r.firstCorrect,r.mastered,r.total,r.seconds,r.xp,r.maxCombo,r.restarts,r.transcriptSeen?'Co':'Khong',r.date,r.review.filter(x=>!x.firstCorrect).map(x=>x.number).join(' ')];const csv='\ufeff'+[headers,values].map(row=>row.map(csvField).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ket_qua_Unit6_'+r.lesson+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printLesson(l){const p=document.getElementById('printsheet');p.innerHTML=`<h1>${esc(l.title)}</h1><p>${esc(l.topic)}</p><p>Họ tên: _______________________________ Lớp: ____________</p>${l.passage?`<div class="passage">${esc(l.passage)}</div>`:''}${l.transcript?'<p>Listening: Use the matching audio file. Transcript is in the teacher answer file.</p>':''}${l.questions.map(q=>`<div class="printq"><strong>${q.number}. ${esc(q.stem)}</strong><div class="printopts">${q.options.map((o,i)=>esc((q.options.length>2?letter(i)+'. ':'')+o)).join('<br>')}</div></div>`).join('')}`;window.print();}
window.addEventListener('beforeunload',e=>{if(state&&!state.finished){e.preventDefault();e.returnValue='';}});
if(DEFAULT_LESSON)chooseLesson(DEFAULT_LESSON);else renderHome();
</script>
