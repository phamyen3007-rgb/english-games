<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 3 - Exercise 1 (41-60) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#173f52;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,220,80,.28),transparent 20%),
    radial-gradient(circle at 85% 18%,rgba(100,215,255,.28),transparent 22%),
    linear-gradient(145deg,#0d6b8c,#31a8c7 52%,#91dce5)
}
.wrap{width:min(940px,94%);margin:26px auto}
.card{
  background:rgba(249,254,255,.97);
  border:1px solid #b9dfea;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 18px 45px rgba(7,82,126,.22)
}
.head{
  padding:24px;text-align:center;
  background:linear-gradient(100deg,#ffd34e,#4ab0d4)
}
.head h1{margin:0;color:#073e5b;font-size:clamp(23px,4vw,36px)}
.head p{margin:8px 0 0;color:#20576f;font-weight:800}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:14px;
  background:#eefaff
}
.stat{
  background:#fff;
  border:1px solid #c8e7f1;
  border-radius:14px;
  padding:10px;
  text-align:center
}
.stat b{display:block;font-size:19px;color:#0b4865}
.stat span{font-size:11px;font-weight:800;color:#67808c}
.main{padding:22px}
.progress{
  height:10px;
  background:#dceef4;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px
}
#bar{
  height:100%;
  background:linear-gradient(90deg,#23a6ce,#ffd24e);
  transition:.3s
}
.q{
  font-size:21px;
  font-weight:800;
  line-height:1.55;
  margin-bottom:18px;
  color:#0d4864
}
.answers{display:grid;gap:12px}
.ans{
  padding:15px;
  text-align:left;
  font-size:17px;
  border-radius:14px;
  border:1px solid #bcdfea;
  background:#fbfeff;
  color:#173f52;
  cursor:pointer;
  transition:.18s
}
.ans:hover{transform:translateY(-1px);background:#eaf9fd}
.ans.ok{background:#d9f8e6;border-color:#39c77a;color:#096039}
.ans.bad{background:#ffe0e0;border-color:#ef7474;color:#8a2424}
.feedback{
  display:none;
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  background:#eefaff;
  border:1px solid #bcdfea;
  line-height:1.6;
  color:#173f52
}
.feedback.show{display:block}
.next{
  display:none;
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#168fb9,#e4aa16);
  color:white;
  font-weight:900;
  font-size:17px;
  cursor:pointer
}
.next.show{display:block}
.summary{
  display:none;
  text-align:center;
  padding:35px;
  color:#17465a
}
.summary.show{display:block}
.summary h2{font-size:32px;color:#08779f}
.restart{
  padding:14px 22px;
  border:0;
  border-radius:14px;
  background:#168fb9;
  color:white;
  font-weight:900;
  cursor:pointer
}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .main{padding:15px}
  .q{font-size:18px}
  .ans{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>GRADE 10 • UNIT 3 • EXERCISE 1</h1>
      <p>(41–60) • OPTION C • MUSIC CHALLENGE</p>
    </div>

    <div class="stats">
      <div class="stat"><b id="counter">1/15</b><span>QUESTION</span></div>
      <div class="stat"><b id="heart">❤️❤️❤️❤️❤️</b><span>HEARTS</span></div>
      <div class="stat"><b id="xp">0</b><span>XP</span></div>
      <div class="stat"><b id="combo">0</b><span>COMBO</span></div>
    </div>

    <div class="main" id="game">
      <div class="progress"><div id="bar"></div></div>
      <div class="q" id="q"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="next">NEXT →</button>
    </div>

    <div class="summary" id="summary">
      <div style="font-size:55px">🎤🏆</div>
      <h2>HOÀN THÀNH!</h2>
      <p id="sum"></p>
      <button class="restart" onclick="restart()">CHƠI LẠI</button>
    </div>
  </div>
</div>

<script>
const data = [
{
q:"Visitors to the cultural fair can _________ a wide range of musical traditions without travelling to different parts of the country.",
options:["A. attract","B. experience","C. prepare","D. praise"],
correct:1,
explain:"“experience musical traditions” = trực tiếp trải nghiệm/tìm hiểu các truyền thống âm nhạc."
},
{
q:"_________ performances by young artists as well as exhibitions of traditional instruments.",
options:["A. This annual festival includes","B. These annual festival include","C. This festival annual includes","D. This annual festivals includes"],
correct:0,
explain:"Cấu trúc đúng là “This + adjective + singular noun + singular verb”: “This annual festival includes...”"
},
{
q:"Instead of wearing ordinary clothes, the dancers appeared in colourful _________ specially made for the ceremony.",
options:["A. curtains","B. uniforms","C. costumes","D. masks"],
correct:2,
explain:"“costume” = trang phục dùng cho biểu diễn/lễ hội. Cụm “specially made for the ceremony” là dấu hiệu rõ."
},
{
q:"What made the performance particularly _________ was the use of everyday objects to create musical sounds.",
options:["A. creative","B. widespread","C. traditional","D. hesitant"],
correct:0,
explain:"Dùng các đồ vật thường ngày để tạo âm thanh cho thấy cách biểu diễn rất “creative” = sáng tạo."
},
{
q:"By the time we arrived at the concert hall, a large crowd had already gathered outside the _________.",
options:["A. ticket stadium office","B. office ticket concert","C. concert ticket hall","D. ticket office"],
correct:3,
explain:"“ticket office” = quầy/phòng bán vé. “outside the ticket office” = bên ngoài quầy vé."
},
{
q:"The organizers hope _________ more teenagers to traditional music by making the festival more interactive.",
options:["A. attracting","B. to attract","C. attract","D. to attracting"],
correct:1,
explain:"Cấu trúc “hope to + V” = hy vọng làm gì. Vì vậy “hope to attract” là đúng."
},
{
q:"The singer almost hesitated before entering the contest because she was worried about performing in front of a large audience.",
options:["A. decided","B. prepared","C. hesitated","D. presented"],
correct:2,
explain:"“hesitate before doing something” = do dự trước khi làm gì. Vì vậy “hesitated” là đáp án đúng."
},
{
q:"The group earned widespread _________ for keeping the original melody while giving the song a modern sound.",
options:["A. praise","B. decision","C. preparation","D. hesitation"],
correct:0,
explain:"“earn praise for + V-ing” = nhận được lời khen vì làm gì. “widespread praise” = sự khen ngợi rộng rãi."
},
{
q:"The outdoor concert attracted such a large crowd that all available seats were _________ long before the show began.",
options:["A. brought back","B. checked in","C. taken up","D. turned out"],
correct:2,
explain:"“seats are taken up” = các chỗ ngồi đã có người/được chiếm hết. Khác với “tickets were sold out” = vé được bán hết."
},
{
q:"After weeks of discussion, the group reached a final _________ about which song they would perform in the competition.",
options:["A. popularity","B. decision","C. preparation","D. surprise"],
correct:1,
explain:"“reach a decision about/on something” = đi đến quyết định về việc gì."
},
{
q:"The musicians' careful _________ of traditional and modern sounds gave the performance its unique character.",
options:["A. hesitation","B. attraction","C. combination","D. popularity"],
correct:2,
explain:"“a combination of A and B” = sự kết hợp giữa A và B."
},
{
q:"Although she had little time to practise, the young musician _________ the difficult piece confidently in front of hundreds of people.",
options:["A. experienced","B. attracted","C. decorated","D. presented"],
correct:3,
explain:"“present a musical piece” = trình bày một tác phẩm âm nhạc. Ngữ cảnh cho thấy hành động biểu diễn/trình bày trước khán giả."
},
{
q:"Traditional music remains _________ in the region, particularly during weddings, New Year celebrations, and village festivals.",
options:["A. widespread","B. limited","C. nervous","D. personal"],
correct:0,
explain:"“widespread” = phổ biến rộng rãi. Việc xuất hiện trong nhiều dịp khác nhau cho thấy loại nhạc này rất phổ biến."
},
{
q:"Having grown up in a family that listened to everything from folk music to jazz, she developed a broad _________.",
options:["A. musical stage","B. cultural costume","C. taste in music","D. music performance"],
correct:2,
explain:"“develop/have a taste in music” = hình thành/có gu âm nhạc. Từ folk music đến jazz cho thấy gu âm nhạc đa dạng."
},
{
q:"The audience did not expect a modern pop singer to perform the ancient folk song so beautifully, so her performance came as a pleasant _________.",
options:["A. hesitation","B. surprise","C. preparation","D. decision"],
correct:1,
explain:"“come as a surprise” = khiến ai đó bất ngờ. “a pleasant surprise” = một điều bất ngờ thú vị."
}
];

const bonusQuestions=new Set([3,6,9,12]);

let current=0,hearts=5,xp=0,combo=0,wrong=0,locked=false;
let bonusGiven=new Set();

const $=id=>document.getElementById(id);

function updateStats(){
  $("counter").textContent=(current+1)+"/"+data.length;
  $("heart").textContent="❤️".repeat(hearts)+"🖤".repeat(Math.max(0,5-hearts));
  $("xp").textContent=xp;
  $("combo").textContent=combo;
  $("bar").style.width=(current/data.length*100)+"%";
}

function render(){
  locked=false;
  updateStats();

  const item=data[current];
  $("q").textContent="Question "+(current+1)+". "+item.q;
  $("answers").innerHTML="";
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("next").className="next";

  item.options.forEach((opt,index)=>{
    const btn=document.createElement("button");
    btn.className="ans";
    btn.textContent=opt;
    btn.onclick=()=>choose(index,btn);
    $("answers").appendChild(btn);
  });
}

function choose(index,btn){
  if(locked)return;

  const item=data[current];

  if(index===item.correct){
    locked=true;
    btn.classList.add("ok");
    [...$("answers").children].forEach(b=>b.disabled=true);

    combo++;
    let gain=combo>=3?20:combo>=2?15:10;
    xp+=gain;

    let bonusText="";
    const qNo=current+1;

    if(bonusQuestions.has(qNo) && !bonusGiven.has(qNo)){
      bonusGiven.add(qNo);

      if(hearts<5){
        hearts++;
        bonusText="<br>💖 <strong>Bonus +1 tim!</strong>";
      }else{
        bonusText="<br>💖 <strong>Câu bonus! Tim đang đầy 5/5.</strong>";
      }
    }

    $("feedback").innerHTML=
      "✅ <strong>Chính xác!</strong><br>"+
      item.explain+
      bonusText+
      "<br><strong>+"+gain+" XP</strong>";

    $("feedback").classList.add("show");
    updateStats();

    $("next").classList.add("show");
    $("next").textContent=
      current===data.length-1 ? "XEM KẾT QUẢ →" : "NEXT →";

  }else{
    btn.classList.add("bad");
    btn.disabled=true;

    hearts--;
    wrong++;
    combo=0;
    updateStats();

    $("feedback").innerHTML=
      "❌ <strong>Chưa đúng.</strong> Em hãy chọn lại. Chỉ được qua câu khi chọn đúng.";
    $("feedback").classList.add("show");

    if(hearts<=0){
      setTimeout(()=>{
        alert("💔 Hết 5 trái tim! Em phải làm lại từ câu 1.");
        restart();
      },300);
      return;
    }

    setTimeout(()=>{
      btn.classList.remove("bad");
      btn.disabled=false;
    },500);
  }
}

$("next").onclick=()=>{
  if(current<data.length-1){
    current++;
    render();
  }else{
    finish();
  }
};

function finish(){
  $("bar").style.width="100%";
  $("game").style.display="none";
  $("summary").classList.add("show");

  $("sum").innerHTML=
    "Em đã hoàn thành <strong>"+data.length+" câu</strong>.<br>"+
    "XP: <strong>"+xp+"</strong> • Số lần chọn sai: <strong>"+wrong+"</strong><br>"+
    "🎉 Great job!";
}

function restart(){
  current=0;
  hearts=5;
  xp=0;
  combo=0;
  wrong=0;
  locked=false;
  bonusGiven=new Set();

  $("summary").classList.remove("show");
  $("game").style.display="block";
  render();
}

render();
</script>
</body>
</html>
