<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 - Unit 5 - Exercise 1 (1-20) - Option C</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.96) 0 5%,transparent 6%),
    linear-gradient(135deg,#fffef2,#fff3a8 52%,#e9f8be);
  min-height:100vh;
  color:#423d13
}
.wrap{width:min(940px,94vw);margin:auto;padding:24px 0 40px}
.head,.card{background:#ffffffee;border:2px solid #efd85c;border-radius:24px;box-shadow:0 14px 32px #7660141d}
.head{padding:20px;margin-bottom:18px}
h1{margin:0;text-align:center;color:#6b6217;font-size:clamp(24px,4vw,36px);line-height:1.2}
.sub{text-align:center;margin:8px 0 16px;font-weight:700;color:#77712b}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.track{height:15px;background:#fff2a2;border-radius:99px;overflow:hidden;border:1px solid #e4d260}
#prog{height:100%;width:0;background:linear-gradient(90deg,#ffdc3f,#cbe75c);transition:.2s}
#hearts{font-size:23px;white-space:nowrap;letter-spacing:2px}
button{font:inherit}
.reset{border:0;border-radius:13px;padding:10px 14px;background:#fff08f;color:#5a5211;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px #ddc94d}
.card{padding:24px}
.qnum{display:inline-block;background:#fff16d;border-radius:99px;padding:7px 13px;font-weight:900;color:#625910}
.q{font-size:clamp(20px,2.5vw,27px);font-weight:800;line-height:1.5;margin:14px 0 20px}
.opts{display:grid;gap:12px}
.opt{width:100%;border:2px solid #ead45b;background:#fffdf4;border-radius:17px;padding:14px 16px;text-align:left;font-size:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.opt:hover{background:#fff8cb;transform:translateY(-1px)}
.letter{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffec70;font-weight:900}
.correct{background:#eff8d4!important;border-color:#99bc3b!important}
.wrong{background:#fff0ec!important;border-color:#e77a63!important;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:15px;line-height:1.55;font-size:17px}
.feedback.show{display:block}
.good{background:#f1f8da;border:1px solid #b2cf58;color:#53631f}
.bad{background:#fff1ee;border:1px solid #ee9d8d;color:#8c3f31}
.next{display:none;margin:18px auto 0;border:0;border-radius:15px;padding:12px 22px;background:linear-gradient(135deg,#ffe04b,#d6ec61);font-weight:900;color:#4c4612;cursor:pointer}
.next.show{display:block}
.finish{text-align:center;padding:20px}
.finish h2{font-size:34px;color:#676016}
.modal{position:fixed;inset:0;background:#302b0b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(460px,92vw);background:#fffef6;border:3px solid #efd65a;border-radius:24px;padding:26px;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.22)}
.box button{border:0;border-radius:14px;background:#ffe359;padding:12px 20px;font-weight:900;cursor:pointer}
.note{text-align:center;margin-top:12px;color:#716c32;font-size:14px}
@media(max-width:650px){.bar{grid-template-columns:1fr auto}.track{grid-column:1/-1}.card{padding:18px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <h1>Grade 10 - Unit 5 - Exercise 1 (1-20) - Option C</h1>
    <div class="sub">Choose the correct answer. Wrong answer = lose 1 heart and try again.</div>
    <div class="bar">
      <div class="track"><div id="prog"></div></div>
      <div id="hearts"></div>
      <button class="reset" onclick="manualReset()">↻ Reset</button>
    </div>
  </section>

  <section class="card" id="card"></section>
  <div class="note">Reset hoặc hết tim sẽ làm lại từ đầu và trộn lại A/B/C/D. Thứ tự câu hỏi được giữ nguyên.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>💛 Hết tim rồi!</h2>
    <p>Bạn phải làm lại từ đầu. Các phương án trả lời sẽ được trộn lại.</p>
    <button onclick="gameOverReset()">Làm lại bài</button>
  </div>
</div>

<script>
const original=[{"q": "The interactive science app was designed to ________ users about renewable energy through short simulations rather than lengthy explanations.", "options": ["education", "educational", "educate", "educationally"], "answer": "educate", "explanation": "Sau <em>to</em> cần động từ nguyên mẫu. <em>Educate somebody about something</em>: cung cấp kiến thức cho ai về điều gì."}, {"q": "Unlike scientists who discover things that already exist in nature, designers ________ products that have not existed before.", "options": ["invent", "detect", "observe", "identify"], "answer": "invent", "explanation": "<em>Invent</em> là tạo ra thứ mới; <em>discover</em> là tìm ra thứ đã tồn tại nhưng trước đó chưa được biết đến."}, {"q": "The competition judges assessed each ________ according to its usefulness, originality and safety.", "options": ["invent", "inventive", "inventively", "invention"], "answer": "invention", "explanation": "Sau <em>each</em> cần danh từ số ít. <em>Invention</em> là phát minh được đánh giá theo tính hữu ích, độc đáo và an toàn."}, {"q": "By turning discarded bicycle parts into a low-cost water pump, the students demonstrated a remarkably ________ approach to solving the problem.", "options": ["invented", "inventive", "inventively", "invention"], "answer": "inventive", "explanation": "Trước <em>approach</em> cần tính từ. <em>Inventive</em> nghĩa là sáng tạo, có khả năng đưa ra ý tưởng mới."}, {"q": "Schools increasingly ________ software that allows teachers to adapt activities to learners with different abilities.", "options": ["valuable", "valuation", "value", "valuably"], "answer": "value", "explanation": "Câu cần động từ sau chủ ngữ <em>schools</em>. <em>Value something</em> nghĩa là coi trọng, đánh giá cao thứ gì."}, {"q": "Although the engineer offered her advice free of charge, it was ________ to the team because it prevented a costly design error.", "options": ["invaluable", "worthless", "inexpensive", "unnecessary"], "answer": "invaluable", "explanation": "<em>Invaluable</em> nghĩa là vô cùng quý giá, không phải “không có giá trị”. Lời khuyên giúp tránh một lỗi thiết kế tốn kém."}, {"q": "For the ________ of visitors, the exhibition provides charging points beside every seating area.", "options": ["convenient", "conveniently", "convene", "convenience"], "answer": "convenience", "explanation": "<em>For the convenience of somebody</em>: để thuận tiện cho ai. Chỗ trống cần danh từ."}, {"q": "The testing form allows users to ________ their opinions anonymously, so they can comment honestly on the device.", "options": ["impress", "express", "suppress", "depress"], "answer": "express", "explanation": "<em>Express opinions</em> nghĩa là bày tỏ ý kiến. <em>Anonymously</em> cho biết người dùng không phải công khai danh tính."}, {"q": "The researchers recorded users’ facial ________ to see whether the instructions caused surprise or confusion.", "options": ["expressive", "expressively", "expressions", "express"], "answer": "expressions", "explanation": "<em>Facial expressions</em> là biểu cảm khuôn mặt, có thể thể hiện sự ngạc nhiên hoặc bối rối."}, {"q": "After several unsuccessful trials, the students were finally ________ with the robot’s performance: it completed every task without assistance.", "options": ["satisfied", "satisfying", "satisfaction", "satisfactorily"], "answer": "satisfied", "explanation": "<em>Be satisfied with something</em>: hài lòng với điều gì. <em>Satisfied</em> diễn tả cảm xúc của người; <em>satisfying</em> mô tả thứ đem lại sự hài lòng."}, {"q": "The programme uses ________ to recognise patterns in thousands of images and improve its predictions as it receives more data.", "options": ["virtual reality", "three-dimensional printing", "electrical wiring", "artificial intelligence"], "answer": "artificial intelligence", "explanation": "Nhận diện quy luật trong dữ liệu và cải thiện dự đoán là ứng dụng của trí tuệ nhân tạo."}, {"q": "Before cutting the wooden panels, the students used a tape to ________ their length accurately.", "options": ["estimate", "measure", "predict", "describe"], "answer": "measure", "explanation": "Dùng thước dây để xác định chiều dài chính xác là <em>measure</em> — đo; <em>estimate</em> chỉ ước lượng."}, {"q": "The proposed drone service could provide a new means of ________ for delivering medicine to villages that trucks cannot easily reach.", "options": ["communication", "production", "transport", "construction"], "answer": "transport", "explanation": "<em>A means of transport</em> là phương tiện vận chuyển; ở đây máy bay không người lái vận chuyển thuốc."}, {"q": "Please ________ the tablet fully before the field trip, as there may be nowhere to plug it in during the day.", "options": ["charge", "install", "upload", "operate"], "answer": "charge", "explanation": "<em>Charge a device</em> nghĩa là sạc thiết bị. Thông tin không có chỗ cắm điện giúp xác định đáp án."}, {"q": "To avoid connecting the wires incorrectly, follow the circuit ________ showing how the battery, switch and motor are linked.", "options": ["receipt", "timetable", "advertisement", "diagram"], "answer": "diagram", "explanation": "<em>Circuit diagram</em> là sơ đồ mạch điện, thể hiện cách các bộ phận được nối với nhau."}];
const START=1;
let qs=[],i=0,lives=5,correct=0,solved=false;

function shuffle(a){
  a=[...a];
  for(let x=a.length-1;x>0;x--){
    const j=Math.floor(Math.random()*(x+1));
    [a[x],a[j]]=[a[j],a[x]];
  }
  return a;
}

function build(mix=false){
  qs=original.map(x=>({...x,options:mix?shuffle(x.options):[...x.options]}));
}

function hearts(){
  document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);
}

function progress(){
  document.getElementById('prog').style.width=(correct/qs.length*100)+'%';
}

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

function render(){
  solved=false;
  hearts();
  progress();
  const card=document.getElementById('card');

  if(i>=qs.length){
    card.innerHTML=`<div class="finish">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã trả lời đúng <strong>${correct}/${qs.length}</strong> câu.</p>
      <p>Nhấn <strong>Reset</strong> để làm lại với các option được trộn mới.</p>
    </div>`;
    return;
  }

  const x=qs[i],labels=['A','B','C','D'];
  card.innerHTML=`<div class="qnum">Question ${START+i}</div>
    <div class="q">${x.q}</div>
    <div class="opts">
      ${x.options.map((o,k)=>`<button class="opt" data-v="${esc(o)}" onclick="choose(this)">
        <span class="letter">${labels[k]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Câu tiếp theo →</button>`;
}

function choose(btn){
  if(solved || lives<=0)return;

  const x=qs[i];
  const v=btn.getAttribute('data-v');
  const fb=document.getElementById('fb');

  if(v===x.answer){
    solved=true;
    correct++;
    btn.classList.add('correct');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.className='feedback show good';
    fb.innerHTML='<strong>✅ Chính xác!</strong><br>'+x.explanation;
    document.getElementById('next').classList.add('show');
    progress();
  }else{
    lives--;
    hearts();
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),450);
    fb.className='feedback show bad';
    fb.innerHTML='<strong>❌ Chưa đúng.</strong> Bạn mất 1 tim. Hãy chọn lại chính câu này cho đến khi đúng.';

    if(lives<=0){
      document.getElementById('modal').classList.add('show');
    }
  }
}

function nextQ(){
  if(!solved || lives<=0)return;
  i++;
  render();
}

function reset(mix=true){
  i=0;
  lives=5;
  correct=0;
  build(mix);
  render();
}

function manualReset(){
  if(confirm('Làm lại từ đầu? Các đáp án A/B/C/D sẽ được trộn lại.')) reset(true);
}

function gameOverReset(){
  document.getElementById('modal').classList.remove('show');
  reset(true);
}

build(false);
render();
</script>
</body>
</html>
