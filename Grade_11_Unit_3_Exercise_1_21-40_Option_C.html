<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 11 - Unit 3 - Exercise 1 (21-40) - Option C</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#eaffff;background:linear-gradient(#06101d,#0b1730 55%,#11162c)}
.wrap{max-width:1120px;margin:auto}.hero{background:linear-gradient(120deg,#07182e,#0e4b5f,#43255d);border-radius:28px 28px 0 0;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 20px 50px #0008}.brand{display:flex;gap:18px;align-items:center}.icon{font-size:68px}h1{margin:0;color:#83f7ff;text-shadow:0 0 14px #32efff;font-size:clamp(28px,4vw,43px)}.sub{font-weight:900;color:#eadcff;margin-top:7px}.sound{border:1px solid #32efff88;background:#09152b;color:#a6fbff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}
.game{background:#091127;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 20px 55px #0008}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:14px 20px;background:#0d1834}.track{height:13px;background:#20305a;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#35f2ff,#855cff,#ff4fd8);transition:.3s}.pill{background:#0c1530;border:1px solid #35f2ff44;border-radius:99px;padding:8px 13px;font-weight:900}.hearts{font-size:20px;letter-spacing:2px}.main{padding:20px}.quiz{background:#0d1634;border:1px solid #4c68a755;border-radius:20px;padding:22px}.tag{display:inline-block;background:linear-gradient(90deg,#126b81,#6a43a8);padding:8px 13px;border-radius:10px;font-weight:900}.q{font-size:21px;line-height:1.55;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{border:1px solid #4e659b66;background:#0a122b;color:#eaffff;border-radius:14px;padding:15px;text-align:left;font-size:16px;cursor:pointer}.ans:hover:not(:disabled){border-color:#35f2ff;background:#111d3e}.ans.correct{background:#0d3226;border-color:#42e58e}.ans.wrong{background:#36141c;border-color:#ff5b6e}.fb{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.fb.good{display:block;background:#0d3226;border-left:5px solid #42e58e}.fb.bad{display:block;background:#36141c;border-left:5px solid #ff5b6e}.bonus{display:none;margin-top:10px;padding:11px 13px;border-radius:12px;background:#3a3210;border-left:5px solid #ffe66b;color:#fff3a3;font-weight:900}.next{display:none;float:right;margin-top:14px;border:0;border-radius:12px;padding:12px 21px;background:linear-gradient(90deg,#126b81,#6a43a8);color:white;font-weight:900;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#01030be8;z-index:99;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.box{max-width:520px;background:#0d1634;border:2px solid #ff5b6e;border-radius:24px;padding:30px;text-align:center}.restart{border:0;border-radius:12px;padding:13px 22px;background:#bd3349;color:white;font-weight:900;cursor:pointer}
.result{display:none;background:#091127;border-radius:28px;padding:36px;text-align:center}.result.show{display:block}.big{font-size:62px;font-weight:1000;color:#83f7ff}.review{text-align:left;margin-top:24px}.r{padding:13px 15px;margin:9px 0;border-radius:12px;background:#111a3a;border-left:5px solid #35f2ff;line-height:1.55}
@media(max-width:820px){.answers{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style></head><body>
<div class="wrap">
<header class="hero"><div class="brand"><div class="icon">🛸💾</div><div><h1>Neon Cyber Grid</h1><div class="sub">Grade 11 - Unit 3 - Exercise 1 (21-40) - Option C</div></div></div><button id="sound" class="sound">🔊 Sound On</button></header>
<section id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill"><span id="hearts" class="hearts">❤️❤️❤️❤️❤️</span></div><div class="pill">⚡ <span id="streak">0</span></div><div class="pill">🔁 Restarts <span id="restarts">0</span></div></div>
<main class="main"><section class="quiz"><div id="tag" class="tag"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="fb"></div><div id="bonus" class="bonus"></div><button id="next" class="next">NEXT →</button><div style="clear:both"></div></section></main></section>
<section id="result" class="result"><div style="font-size:80px">🛸🏆💾</div><h2>Cyber Grid Cleared!</h2><div id="final" class="big"></div><p id="msg"></p><div id="review" class="review"></div></section>
</div>
<div id="overlay" class="overlay"><div class="box"><div style="font-size:78px">💀⚡</div><h2>Out of Hearts!</h2><p>Hết 5 tim. Học sinh phải làm lại từ Question 1.</p><p><b>Số lần làm lại:</b> <span id="restartBox">1</span></p><button id="restartBtn" class="restart">RESTART FROM QUESTION 1 ↻</button></div></div>
<script>
const Q=[{"q": "To avoid getting stuck in heavy traffic, many commuters choose to travel outside the morning ______.", "o": ["traffic stream", "rush hour", "office period", "transport time"], "a": 1, "e": "<b>rush hour</b> = giờ cao điểm."}, {"q": "Rather than working independently, students from several schools were asked to ______ on a proposal for a greener city centre.", "o": ["interact", "assist", "collaborate", "participate"], "a": 2, "e": "<b>collaborate on + project/proposal/task</b> = hợp tác cùng làm."}, {"q": "Despite several major renovations over the past decade, the historic building ______ structurally safe and energy-efficient.", "o": ["maintains", "remains", "keeps", "continues"], "a": 1, "e": "<b>remain + adjective</b> = vẫn ở trạng thái nào đó."}, {"q": "Modern smart-home systems are becoming increasingly ______, enabling residents to control lighting, security, and temperature through a single device.", "o": ["interactive", "sustainable", "renewable", "ecological"], "a": 0, "e": "<b>interactive</b> = có tính tương tác."}, {"q": "Community gardens can strengthen residents' ______ of belonging by encouraging neighbours to work towards a common goal.", "o": ["feeling", "sense", "awareness", "impression"], "a": 1, "e": "Collocation: <b>a sense of belonging</b>."}, {"q": "Advanced access-control systems are installed in apartment buildings primarily to improve residents' ______ without reducing convenience.", "o": ["stability", "privacy", "security", "protection"], "a": 2, "e": "<b>security</b> = an ninh."}, {"q": "Although artificial intelligence offers numerous ______ for urban management, city authorities must also consider the risks associated with it.", "o": ["advantages", "interests", "profits", "conveniences"], "a": 0, "e": "<b>advantages</b> = lợi ích/ưu điểm."}, {"q": "Urban planning ______ have warned that rapid development without sufficient green space may negatively affect residents' well-being.", "o": ["dwellers", "experts", "participants", "assistants"], "a": 1, "e": "<b>urban planning experts</b> = chuyên gia quy hoạch đô thị."}, {"q": "In response to growing demand from students, the local council has decided to ______ the library's opening hours until 10 p.m.", "o": ["expand", "prolong", "extend", "enlarge"], "a": 2, "e": "Collocation: <b>extend opening hours</b>."}, {"q": "High-rise buildings account for a considerable ______ of the energy consumed in densely populated urban areas.", "o": ["amount", "number", "level", "proportion"], "a": 3, "e": "<b>account for a considerable proportion of</b> = chiếm một tỷ lệ đáng kể."}, {"q": "Continuous construction work can seriously ______ residents who attend online meetings or study from home.", "o": ["interrupt", "interfere", "disturb", "prevent"], "a": 2, "e": "<b>disturb somebody</b> = làm phiền ai."}, {"q": "City planners are working towards creating a ______ where residents have convenient access to public transport, green areas, and essential services.", "o": ["modern livable urban environment", "livable modern environment urban", "urban modern livable environment", "modern urban environment livable"], "a": 0, "e": "Trật tự đúng: <b>modern + livable + urban + environment</b>."}, {"q": "Environmental scientists ______ that coastal cities will face increasingly serious flooding unless greenhouse-gas emissions are significantly reduced.", "o": ["advise", "predict", "prevent", "announce"], "a": 1, "e": "<b>predict + that-clause</b> = dự đoán rằng."}, {"q": "Even though property prices have risen considerably, this neighbourhood ______ one of the most attractive places for young families to live.", "o": ["stays as", "remains", "is remaining", "has remained being"], "a": 1, "e": "<b>remain + noun phrase/adjective</b> = vẫn là/vẫn giữ trạng thái."}, {"q": "Smart technologies may make urban life more convenient; ______, their effectiveness largely depends on how responsibly they are designed and used.", "o": ["therefore", "otherwise", "however", "moreover"], "a": 2, "e": "Quan hệ tương phản → <b>however</b>."}],L=["A","B","C","D"],MAX=5,BONUS=[5,10,15];
let i=0,hearts=MAX,streak=0,restarts=0,firstTry=0,attempts=Array(Q.length).fill(0),soundOn=true,ctx;const $=x=>document.getElementById(x);
function tone(f,d=.1){if(!soundOn)return;if(!ctx)ctx=new(AudioContext||webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type="square";g.gain.value=.025;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),d*1000)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off"};
function update(){ $("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(MAX-hearts);$("streak").textContent=streak;$("restarts").textContent=restarts;$("bar").style.width=(i/Q.length*100)+"%"}
function render(){let x=Q[i];$("tag").textContent="Node "+(i+1)+" / "+Q.length;$("q").textContent=x.q;$("answers").innerHTML="";$("fb").className="fb";$("fb").style.display="none";$("bonus").style.display="none";$("next").style.display="none";update();x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)})}
function choose(n,b){let x=Q[i];attempts[i]++;if(n!==x.a){hearts--;streak=0;b.classList.add("wrong");b.disabled=true;$("fb").className="fb bad";$("fb").style.display="block";$("fb").innerHTML="<b>❌ Sai rồi.</b> Mất 1 tim. Hãy chọn lại cho đến khi đúng.";tone(140,.2);update();if(hearts<=0){restarts++;$("restartBox").textContent=restarts;$("restarts").textContent=restarts;setTimeout(()=>$("overlay").classList.add("show"),250)}return}
streak++;if(attempts[i]===1)firstTry++;document.querySelectorAll(".ans").forEach(z=>z.disabled=true);b.classList.add("correct");$("fb").className="fb good";$("fb").style.display="block";$("fb").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;tone(880,.1);
let qn=i+1;if(BONUS.includes(qn)){let before=hearts;hearts=Math.min(MAX,hearts+1);$("bonus").style.display="block";$("bonus").innerHTML=hearts>before?"🎁 BONUS HEART! +1 ❤️":"🎁 BONUS CHECKPOINT! Bạn đang đủ 5 ❤️.";tone(1100,.1)}
update();$("bar").style.width=((i+1)/Q.length*100)+"%";$("next").style.display="inline-block";$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
$("next").onclick=()=>{if(i<Q.length-1){i++;render()}else finish()};
$("restartBtn").onclick=()=>{$("overlay").classList.remove("show");i=0;hearts=MAX;streak=0;firstTry=0;attempts=Array(Q.length).fill(0);render()};
function finish(){$("game").style.display="none";$("result").classList.add("show");$("final").textContent="15 / 15";$("msg").innerHTML="Hoàn thành với <b>"+restarts+"</b> lần làm lại.<br>Đúng ngay lần đầu: <b>"+firstTry+"/15</b>.";let h="<h3>💾 Final Review</h3>";Q.forEach((x,k)=>{h+='<div class="r"><b>Question '+(k+1)+'</b> — '+L[x.a]+'. '+x.o[x.a]+'<br>'+x.e+'<br>Attempts: <b>'+attempts[k]+'</b></div>'});$("review").innerHTML=h}
render();
</script></body></html>
