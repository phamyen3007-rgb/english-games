<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 10 - Unit 2 - Exercise 1 (61-80) - Option B</title>
<style>
:root{
 --bg:#fff3f8;--panel:#fffdfd;--panel2:#ffe8f1;--pink:#ff7eb6;--rose:#ff5b8f;
 --purple:#b58cff;--blue:#8ed8ff;--yellow:#ffd76a;--mint:#83e7c6;--green:#3ecf91;
 --red:#ff6677;--text:#4d3554;--muted:#8b6c94
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
 radial-gradient(circle at 12% 18%,rgba(255,126,182,.22),transparent 25%),
 radial-gradient(circle at 86% 16%,rgba(181,140,255,.2),transparent 25%),
 radial-gradient(circle at 50% 100%,rgba(142,216,255,.18),transparent 32%),
 linear-gradient(145deg,#fff7fb,#f6efff 54%,#eefaff);
 padding:18px;overflow-x:hidden
}
.sweets{position:fixed;inset:0;pointer-events:none;z-index:0}
.sweet{position:absolute;font-size:34px;animation:float 5s ease-in-out infinite;opacity:.78}
.s1{left:5%;top:12%}.s2{right:7%;top:17%;animation-delay:1s}.s3{left:10%;bottom:10%;animation-delay:2s}.s4{right:12%;bottom:12%;animation-delay:1.5s}.s5{left:48%;top:4%;font-size:28px;animation-delay:.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.wrap{width:min(1040px,100%);margin:auto;position:relative;z-index:2}
.hero{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.cupcake{width:108px;height:108px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 10px 18px rgba(255,91,143,.2))}
.glow{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle,rgba(255,126,182,.28),rgba(181,140,255,.08) 58%,transparent 72%);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.72}}
.cake-base{position:absolute;bottom:12px;width:64px;height:50px;background:linear-gradient(180deg,#ffc0d8,#ff8fb7);clip-path:polygon(8% 0,92% 0,80% 100%,20% 100%);border-radius:7px}
.cream{position:absolute;top:20px;width:70px;height:52px;background:linear-gradient(180deg,#fff,#ffe7f2);border-radius:48% 48% 42% 42%;box-shadow:0 0 16px rgba(255,255,255,.8)}
.cream:before{content:"";position:absolute;left:15px;top:-13px;width:40px;height:28px;border-radius:50%;background:#fff5fb}
.cherry{position:absolute;top:7px;width:20px;height:20px;border-radius:50%;background:#ff4f78;box-shadow:0 0 10px rgba(255,79,120,.35)}
h1{margin:0;font-size:clamp(28px,4vw,46px);background:linear-gradient(90deg,#7f4f8f,var(--rose),var(--purple),#5aaee5);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:7px 0 0;color:var(--muted);font-weight:700}
.sound{border:1px solid rgba(255,126,182,.42);background:#fff;color:#6f4c79;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(111,76,121,.08)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,246,251,.98));border:1px solid rgba(255,126,182,.3);border-radius:24px;box-shadow:0 24px 65px rgba(100,61,112,.16);overflow:hidden}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:18px 22px 13px;background:linear-gradient(90deg,#fff0f6,#f4efff);border-bottom:1px solid rgba(120,80,130,.08)}
.barbox{height:13px;background:#f1e8f4;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));transition:.3s}
.chip{background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;white-space:nowrap;box-shadow:0 5px 14px rgba(100,61,112,.08)}
.content{padding:24px 22px 26px}
.tag{display:inline-block;padding:7px 13px;border-radius:9px;background:#fff1f7;border:1px solid rgba(255,126,182,.4);color:#d84e88;font-weight:900;margin-bottom:13px}
.question{margin:0 0 22px;font-size:clamp(22px,2.8vw,31px);line-height:1.45}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{min-height:72px;border-radius:15px;border:2px solid #eadcec;background:linear-gradient(135deg,#fff,#fff8fc);color:var(--text);display:flex;align-items:center;gap:13px;padding:16px 17px;font-size:18px;text-align:left;cursor:pointer;transition:.16s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pink);box-shadow:0 10px 20px rgba(255,126,182,.12)}
.letter{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;font-weight:1000;color:#5b3865;background:linear-gradient(135deg,#ffd1e3,#dcd0ff)}
.option.correct{background:linear-gradient(135deg,#eafff5,#dffbef)!important;border-color:var(--green)!important}
.option.wrong{background:linear-gradient(135deg,#fff0f3,#ffe4ea)!important;border-color:var(--red)!important}
.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:15px;background:#fffafc;border-left:5px solid;line-height:1.6}
.feedback.show{display:block}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--yellow)}
.feedback strong{display:block;margin-bottom:7px}.details{margin-top:9px;color:#7e647f;font-size:15px}
.controls{display:flex;justify-content:flex-end;margin-top:20px}
.action{border:0;border-radius:12px;padding:13px 23px;font-size:17px;font-weight:1000;color:#59334f;cursor:pointer;background:linear-gradient(90deg,#ffd2e4,#d9ccff)}
.action:disabled{opacity:.35;cursor:not-allowed}
.result{display:none;text-align:center;padding:38px 24px}.result.show{display:block}
.result-icon{font-size:74px}.score-big{font-size:62px;font-weight:1000;color:var(--rose)}
.review{text-align:left;margin-top:25px;border-top:1px solid rgba(100,61,112,.1);padding-top:18px}
.review-item{padding:13px 14px;margin-bottom:10px;border-radius:12px;background:#fffafd;border-left:5px solid #bba9c1;line-height:1.5}
.review-item.ok{border-left-color:var(--green)}.review-item.no{border-left-color:var(--red)}
@media(max-width:760px){
 .hero{grid-template-columns:85px 1fr}.sound{grid-column:1/-1;justify-self:end}
 .status{grid-template-columns:1fr 1fr}.barbox{grid-column:1/-1;order:4}
 .options{grid-template-columns:1fr}.content{padding:18px 15px 22px}
 .cupcake{transform:scale(.8);transform-origin:left center;width:85px}
}
</style>
</head>
<body>
<div class="sweets">
 <div class="sweet s1">🍭</div><div class="sweet s2">🍩</div><div class="sweet s3">🍰</div>
 <div class="sweet s4">🧁</div><div class="sweet s5">🍬</div>
</div>

<main class="wrap">
<header class="hero">
 <div class="cupcake">
  <div class="glow"></div><div class="cake-base"></div><div class="cream"></div><div class="cherry"></div>
 </div>
 <div>
  <h1>Dessert Learning Quest</h1>
  <p class="subtitle">Grade 10 · Unit 2 · Exercise 1 (61–80) · Option B</p>
 </div>
 <button class="sound" id="soundBtn">🔊 Âm thanh: Bật</button>
</header>

<section class="card">
<div id="quizArea">
 <div class="status">
  <div class="barbox"><div class="bar" id="bar"></div></div>
  <div class="chip" id="counter"></div>
  <div class="chip" id="scoreChip"></div>
  <div class="chip" id="heartChip"></div>
 </div>
 <div class="content">
  <div class="tag" id="tag"></div>
  <h2 class="question" id="question"></h2>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls"><button class="action" id="nextBtn" disabled>Next Treat 🍰</button></div>
 </div>
</div>

<div class="result" id="resultArea">
 <div class="result-icon" id="resultIcon">🍰</div>
 <h2>Dessert Quest Complete</h2>
 <div class="score-big" id="finalScore"></div>
 <p id="message"></p>
 <button class="action" id="restartBtn">Taste Again ↻</button>
 <div class="review" id="review"></div>
</div>
</section>
</main>

<script>
const questions=[
["Riding a bicycle instead of driving helps reduce your ____________.",["greenhouse gases","carbon footprint","natural disasters","renewable energy"],1,"Carbon footprint là lượng khí thải carbon do một người hoặc hoạt động tạo ra.",""],
["Young trees cannot survive long in extreme ____________ without enough water.",["prevention","chemicals","heat","pollution"],2,"Extreme heat là nắng nóng gay gắt, có thể làm cây chết nếu thiếu nước.",""],
["Everyone should reduce their impact ____________ nature.",["on","at","with","into"],0,"Cụm cố định: have an impact on = có tác động đến.",""],
["Cutting down too many forests will eventually ____________ wildlife habitats.",["encourage","protect","destroy","improve"],2,"destroy habitats = phá hủy môi trường sống.",""],
["All the classroom windows ____________ closed before the students left.",["were","are","have been","had been"],3,"Hành động đóng cửa xảy ra trước hành động students left.","Dùng quá khứ hoàn thành bị động: had been + V3."],
["____________ student should help keep the school clean.",["Some","Every","Many","Few"],1,"Every + danh từ số ít.","Student là danh từ số ít."],
["The judges chose the most ____________.",["recycling creative idea","creative recycling idea","idea creative recycling","recycling idea creative"],1,"Trật tự đúng: creative + recycling + idea.","Creative là tính từ chỉ ý kiến; recycling đóng vai trò bổ nghĩa cho danh từ idea."],
["Look at the smoke from the factory! It ____________ the air.",["will pollute","pollutes","is going to pollute","polluted"],2,"Có bằng chứng hiện tại: Look at the smoke... nên dùng be going to.",""],
["Our school campaign ____________ at encouraging students to recycle more.",["reminds","aims","attracts","damages"],1,"aim at + V-ing = nhằm mục đích làm gì.",""],
["Hurry up, or you ____________ the beginning of the film.",["miss","are missing","will miss","missed"],2,"Mệnh lệnh + or + will dùng để cảnh báo kết quả có thể xảy ra.",""],
["My classmates are very ____________ on joining environmental clubs.",["interested","used","keen","able"],2,"be keen on + V-ing/N = rất thích.",""],
["These containers are used ____________ recyclable materials.",["collecting","collect","to collecting","to collect"],3,"be used to + V = được dùng để làm gì.","Ở đây to là dấu hiệu của động từ nguyên mẫu chỉ mục đích."],
["The volunteers ____________ rubbish along the beach when it suddenly started raining.",["collected","were collecting","have collected","had collected"],1,"Một hành động đang diễn ra thì hành động khác xen vào.","Dùng quá khứ tiếp diễn: were collecting."],
["That amazing science project really ____________ everyone's attention.",["attracted","caused","gave","took"],0,"attract someone's attention = thu hút sự chú ý của ai.",""],
["Please remember ____________ your reusable bottle before coming to school.",["bring","bringing","to bring","brought"],2,"remember to V = nhớ làm việc gì chưa làm.",""]
];

const letters=["A","B","C","D"];
let current=0,score=0,hearts=5,combo=0,answered=false,answers=[],soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);

function getCtx(){
 if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}
function tone(freq,duration,type="sine",volume=.05,delay=0){
 if(!soundOn)return;
 const c=getCtx(),o=c.createOscillator(),g=c.createGain(),start=c.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(freq,start);
 g.gain.setValueAtTime(.0001,start);
 g.gain.exponentialRampToValueAtTime(volume,start+.012);
 g.gain.exponentialRampToValueAtTime(.0001,start+duration);
 o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+duration+.03);
}
function correctSound(){
 tone(660,.09,"sine",.035,0);
 tone(880,.11,"triangle",.04,.08);
 tone(1175,.16,"sine",.038,.17);
}
function wrongSound(){
 tone(210,.15,"sawtooth",.035,0);
 tone(135,.22,"square",.02,.12);
}
function nextSound(){
 tone(520,.05,"triangle",.018,0);
 tone(720,.07,"triangle",.016,.05);
}
function finishSound(){
 [523,659,784,988,1175].forEach((f,i)=>tone(f,.19,"triangle",.03,i*.09));
}

$("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
 if(soundOn)nextSound();
};

function render(){
 answered=false;
 $("nextBtn").disabled=true;
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 const q=questions[current];

 $("tag").textContent=`Question ${current+1}`;
 $("question").textContent=q[0];
 $("counter").textContent=`Câu ${current+1}/${questions.length}`;
 $("scoreChip").textContent=`🍰 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${current/questions.length*100}%`;
 $("options").innerHTML="";

 q[1].forEach((option,index)=>{
  const button=document.createElement("button");
  button.className="option";
  button.innerHTML=`<span class="letter">${letters[index]}</span><span>${option}</span>`;
  button.onclick=()=>choose(index);
  $("options").appendChild(button);
 });

 $("nextBtn").textContent=current===questions.length-1?"Finish Dessert 🍰":"Next Treat 🍰";
}

function choose(index){
 if(answered)return;
 answered=true;

 const q=questions[current];
 const buttons=[...document.querySelectorAll(".option")];
 const isCorrect=index===q[2];

 buttons.forEach(button=>button.disabled=true);
 buttons[q[2]].classList.add("correct");

 if(isCorrect){
  score+=10+(combo*2);
  combo++;
  buttons[index].classList.add("correct");
  $("feedback").className="feedback correct show";
  $("feedback").innerHTML=`<strong>🍰 Sweet Answer! Chính xác.</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;
  correctSound();
 }else{
  hearts=Math.max(0,hearts-1);
  combo=0;
  buttons[index].classList.add("wrong");
  $("feedback").className="feedback wrong show";
  $("feedback").innerHTML=`<strong>⚠ Treat Missed. Đáp án đúng: ${letters[q[2]]}. ${q[1][q[2]]}</strong>${q[3]}${q[4]?`<div class="details">${q[4]}</div>`:""}`;
  wrongSound();
 }

 answers.push({selected:index,isCorrect,correct:q[2]});
 $("scoreChip").textContent=`🍰 ${score} XP · Combo ${combo}`;
 $("heartChip").textContent=`❤️ ${hearts}`;
 $("bar").style.width=`${(current+1)/questions.length*100}%`;
 $("nextBtn").disabled=false;
}

function showResult(){
 $("quizArea").style.display="none";
 $("resultArea").classList.add("show");

 const correctCount=answers.filter(answer=>answer.isCorrect).length;
 $("finalScore").textContent=`${score} XP · ${correctCount}/${questions.length}`;
 finishSound();

 const percent=correctCount/questions.length*100;
 if(percent===100){
  $("resultIcon").textContent="🏆🍰";
  $("message").textContent="Perfect Dessert Master! Em đã hoàn thành toàn bộ thử thách.";
 }else if(percent>=80){
  $("resultIcon").textContent="🧁✨";
  $("message").textContent="Excellent Baker! Em đã nắm rất chắc kiến thức.";
 }else if(percent>=60){
  $("resultIcon").textContent="🍩🌟";
  $("message").textContent="Good Treat! Hãy xem lại các câu sai để tiến bộ hơn.";
 }else{
  $("resultIcon").textContent="📘🍬";
  $("message").textContent="Training Kitchen! Ôn lại kiến thức rồi thử lại.";
 }

 let reviewHTML="<h3>Dessert Review</h3>";
 questions.forEach((q,index)=>{
  const answer=answers[index];
  reviewHTML+=`
   <div class="review-item ${answer&&answer.isCorrect?"ok":"no"}">
    <strong>Câu ${index+1}: ${answer&&answer.isCorrect?"Đúng":"Sai"}</strong><br>
    Em chọn: ${answer?`${letters[answer.selected]}. ${q[1][answer.selected]}`:"Chưa trả lời"}<br>
    Đáp án đúng: ${letters[q[2]]}. ${q[1][q[2]]}<br>
    <em>${q[3]}</em>
    ${q[4]?`<div class="details">${q[4]}</div>`:""}
   </div>`;
 });
 $("review").innerHTML=reviewHTML;
}

$("nextBtn").onclick=()=>{
 if(!answered)return;
 nextSound();
 if(current<questions.length-1){
  current++;
  render();
 }else{
  showResult();
 }
};

$("restartBtn").onclick=()=>{
 current=0;score=0;hearts=5;combo=0;answered=false;answers=[];
 $("resultArea").classList.remove("show");
 $("quizArea").style.display="block";
 render();
 nextSound();
};

render();
</script>
</body>
</html>
