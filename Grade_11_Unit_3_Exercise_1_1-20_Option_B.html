<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 - Unit 3 - Exercise 1 (1-20) - Option B</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#14334a;background:linear-gradient(145deg,#dbf3f4,#e9f4ff 48%,#fff3d6)}
.wrap{max-width:1160px;margin:auto}.hero{background:linear-gradient(120deg,#0e4051,#0f7d86 55%,#327ab7);color:#fff;border-radius:28px 28px 0 0;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 18px 50px #14334a2d}
.brand{display:flex;gap:17px;align-items:center}.icon{font-size:68px}h1{margin:0;color:#fff2b6;font-size:clamp(28px,4vw,43px)}.sub{margin-top:7px;color:#e7fbff;font-weight:900}
.sound{border:1px solid #d7fbff;background:#f8ffff;color:#17566a;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}
.game{background:#fbfeff;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 20px 55px #14334a20}.status{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:#e4f2f3;padding:14px 20px}
.track{height:13px;background:#c8dde0;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#0f7d86,#327ab7,#e8b85b);transition:.3s}.pill{background:#fff;border:1px solid #cfdee2;border-radius:99px;padding:8px 13px;font-weight:900}
.main{padding:20px}.quiz{background:#fff;border:2px solid #d8e4e8;border-radius:20px;padding:22px}.tag{display:inline-block;background:linear-gradient(90deg,#0f7d86,#327ab7);color:#fff;border-radius:10px;padding:8px 13px;font-weight:900}
.q{font-size:21px;line-height:1.55;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border:2px solid #d7e3e8;background:#fff;border-radius:14px;padding:15px;text-align:left;font-size:16px;color:#14334a;cursor:pointer;transition:.15s}.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#4ca2af;background:#f5feff}
.ans.correct{background:#eafff1;border-color:#2ca66a}.ans.wrong{background:#fff0f3;border-color:#d65361}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}.feedback.good{display:block;background:#eafff1;border-left:5px solid #2ca66a}.feedback.bad{display:block;background:#fff0f3;border-left:5px solid #d65361}
.controls{text-align:right;margin-top:14px}.next{display:none;border:0;border-radius:12px;padding:12px 21px;background:linear-gradient(90deg,#0f7d86,#327ab7);color:#fff;font-weight:900;cursor:pointer}
.result{display:none;background:#fbfeff;border-radius:28px;padding:36px;text-align:center}.result.show{display:block}.scoreBig{font-size:62px;font-weight:1000;color:#0f7d86}.review{text-align:left;margin-top:24px}.reviewItem{padding:13px 15px;margin:9px 0;border-radius:12px;background:#eef6f8;border-left:5px solid #327ab7;line-height:1.55}.reviewItem.ok{border-color:#2ca66a}.reviewItem.no{border-color:#d65361}
.restart{border:0;border-radius:12px;padding:12px 21px;background:#0f7d86;color:white;font-weight:900;cursor:pointer}
@media(max-width:760px){.answers{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:3}}
</style></head>
<body><div class="wrap">
<header class="hero"><div class="brand"><div class="icon">🌉🚈</div><div><h1>Smart City Crossing</h1><div class="sub">Grade 11 - Unit 3 - Exercise 1 (1-20) - Option B</div></div></div><button id="sound" class="sound">🔊 Sound On</button></header>
<section id="game" class="game"><div class="status"><div class="track"><div id="bar" class="bar"></div></div><div class="pill">⭐ <span id="score">0</span>/15</div><div class="pill">🔥 <span id="streak">0</span></div></div>
<main class="main"><section class="quiz"><div id="tag" class="tag"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="next" class="next">NEXT →</button></div></section></main></section>
<section id="result" class="result"><div style="font-size:80px">🌉🏆🏙️</div><h2>Crossing Complete!</h2><div id="final" class="scoreBig"></div><p id="message"></p><button class="restart" onclick="location.reload()">PLAY AGAIN ↻</button><div id="review" class="review"></div></section>
</div>
<script>
const Q=[{"q": "At the environmental fair, students ______ innovative models showing how household waste could be reused rather than thrown away.", "o": ["demonstrated", "exhibited", "performed", "exposed"], "a": 1, "e": "<b>Exhibit</b> = trưng bày. At an environmental fair, students <i>exhibited innovative models</i> is the most natural collocation."}, {"q": "Despite initial concerns about its cost, the new metro system ______ remarkably efficient during its first few months of operation.", "o": ["appeared", "turned", "remained", "sounded"], "a": 0, "e": "<b>Appear + adjective</b> is a linking-verb structure. → <i>appeared remarkably efficient</i>."}, {"q": "Introducing dedicated bus lanes is expected to ease traffic ______ in densely populated areas during peak hours.", "o": ["congestion", "circulation", "movement", "transportation"], "a": 0, "e": "Collocation: <b>traffic congestion</b> = tình trạng ùn tắc giao thông."}, {"q": "Community gardens are increasingly being developed to provide fresh produce for urban ______ who have limited access to affordable food.", "o": ["occupants", "dwellers", "settlers", "residentship"], "a": 1, "e": "<b>Urban dwellers</b> = cư dân đô thị."}, {"q": "By using real-time traffic data, the city can manage its transport network more ______ and respond quickly to unexpected problems.", "o": ["efficient", "efficiency", "efficiently", "efficiencies"], "a": 2, "e": "Sau động từ <b>manage</b> cần trạng từ → <b>efficiently</b>."}, {"q": "The council is seeking a more ______ approach to waste management, one that can remain effective without exhausting natural resources.", "o": ["sustainable", "sustained", "sustaining", "sustainability"], "a": 0, "e": "<b>Sustainable approach</b> = cách tiếp cận bền vững."}, {"q": "Rapid urban growth can place enormous pressure on existing ______, including water supplies, transport networks, and waste-treatment systems.", "o": ["facilities", "infrastructure", "construction", "architecture"], "a": 1, "e": "<b>Infrastructure</b> bao gồm hệ thống nước, giao thông, xử lý rác..."}, {"q": "After several months of testing, the newly introduced electric buses have ______ reliable even under demanding traffic conditions.", "o": ["stayed", "proved", "turned", "grown"], "a": 1, "e": "<b>Prove + adjective</b> = tỏ ra/chứng tỏ là. → <i>have proved reliable</i>."}, {"q": "Replacing short car journeys with walking or cycling can substantially reduce an individual's carbon ______ over time.", "o": ["emission", "consumption", "footprint", "output"], "a": 2, "e": "Collocation: <b>carbon footprint</b> = lượng phát thải carbon gắn với một cá nhân/hoạt động."}, {"q": "Although the neighbourhood has undergone rapid redevelopment, its historic character has ______ largely unchanged.", "o": ["remained", "appeared", "become", "turned"], "a": 0, "e": "<b>Remain + adjective</b> = vẫn giữ trạng thái. → <i>has remained largely unchanged</i>."}, {"q": "The city recently hosted a ______ to introduce technologies designed to reduce household energy consumption.", "o": ["sustainable technology exhibition", "technology sustainable exhibition", "sustainable exhibition technology", "exhibition sustainable technology"], "a": 0, "e": "Trật tự tự nhiên: <b>sustainable + technology + exhibition</b>."}, {"q": "To achieve its climate targets, the country is gradually reducing its dependence on ______ sources of energy such as coal and natural gas.", "o": ["renewable", "non-renewable", "reusable", "sustainable"], "a": 1, "e": "Coal and natural gas are <b>non-renewable energy sources</b>."}, {"q": "The government has introduced stricter standards in an effort to reduce greenhouse gas ______ from factories and power stations.", "o": ["emissions", "pollution", "footprints", "exhausts"], "a": 0, "e": "Collocation: <b>greenhouse gas emissions</b>."}, {"q": "The historic centre has been converted into a largely ______ area where private vehicles are restricted during most of the day.", "o": ["pedestrianised", "populated", "residential", "urbanised"], "a": 0, "e": "<b>Pedestrianised area</b> = khu vực ưu tiên người đi bộ, hạn chế xe cơ giới."}, {"q": "A city cannot become truly ______ simply by constructing modern buildings; residents must also have access to affordable housing, public services, and green spaces.", "o": ["inhabited", "lively", "livable", "living"], "a": 2, "e": "<b>Livable city</b> = thành phố đáng sống."}],L=["A","B","C","D"];let i=0,score=0,streak=0,answered=false,history=[],soundOn=true,audioCtx;const $=id=>document.getElementById(id);
function tone(f,d=.1,delay=0){if(!soundOn)return;if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.04,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(620,.08);tone(830,.1,.07);tone(1050,.12,.14)}function bad(){tone(170,.2)}$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)tone(450,.05)};
function render(){answered=false;const x=Q[i];$("tag").textContent="Question "+(i+1)+" / "+Q.length;$("question").textContent=x.q;$("bar").style.width=(i/Q.length*100)+"%";$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").style.display="none";$("next").style.display="none";x.o.forEach((v,n)=>{const b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+L[n]+".</b> "+v;b.onclick=()=>choose(n,b);$("answers").appendChild(b)});$("next").textContent=i===Q.length-1?"FINISH →":"NEXT →"}
function choose(n,b){if(answered)return;answered=true;const x=Q[i],buttons=[...document.querySelectorAll(".ans")];buttons.forEach(z=>z.disabled=true);buttons[x.a].classList.add("correct");const ok=n===x.a;if(ok){score++;streak++;$("feedback").className="feedback good";$("feedback").innerHTML="<b>✅ CORRECT — "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;good()}else{streak=0;b.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").innerHTML="<b>❌ INCORRECT. Correct answer: "+L[x.a]+". "+x.o[x.a]+"</b><br>"+x.e;bad()}$("feedback").style.display="block";$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=((i+1)/Q.length*100)+"%";history.push({n,ok});$("next").style.display="inline-block"}
$("next").onclick=()=>{if(!answered)return;tone(450,.05);if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("game").style.display="none";$("result").classList.add("show");const pct=Math.round(score/Q.length*100);$("final").textContent=score+"/"+Q.length+" · "+pct+"%";$("message").textContent=pct===100?"Perfect! You mastered every Smart City checkpoint.":pct>=80?"Excellent work!":pct>=60?"Good work. Review the missed questions below.":"Review the explanations and try again.";let h="<h3>🏙️ Review</h3>";Q.forEach((x,k)=>{const r=history[k];h+='<div class="reviewItem '+(r.ok?"ok":"no")+'"><b>Question '+(k+1)+' — '+(r.ok?"✅ Correct":"❌ Incorrect")+'</b><br>Your answer: '+L[r.n]+'. '+x.o[r.n]+'<br>Correct: <b>'+L[x.a]+'. '+x.o[x.a]+'</b><br>'+x.e+'</div>'});$("review").innerHTML=h}
render();
</script></body></html>
