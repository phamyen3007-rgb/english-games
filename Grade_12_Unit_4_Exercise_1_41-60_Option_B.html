<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 - Unit 4 - Exercise 1 (41-60) - Option B</title>
<style>
:root{--bg:#0a1418;--panel:#10272d;--panel2:#15343c;--cyan:#66e4ff;--green:#6ee7b7;--amber:#ffd166;--ok:#4fd39a;--bad:#ff6b78;--text:#f4fbfc;--muted:#b6cdd2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 12%,rgba(102,228,255,.10),transparent 24%),radial-gradient(circle at 85% 20%,rgba(110,231,183,.08),transparent 24%),linear-gradient(160deg,#071014,#0b1d22 58%,#050a0c);padding:18px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.gridline{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px}.block{position:absolute;bottom:0;background:#0b1d22;border-top:1px solid rgba(255,255,255,.04)}.b1{left:5%;width:12%;height:25%}.b2{left:20%;width:10%;height:38%}.b3{left:33%;width:14%;height:30%}.b4{right:32%;width:11%;height:44%}.b5{right:16%;width:13%;height:28%}.b6{right:3%;width:10%;height:36%}
.wrap{max-width:1120px;margin:auto;position:relative;z-index:2}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.hero-left{display:flex;align-items:center;gap:14px}.icon{font-size:62px}h1{margin:0;font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#e9ffff,#66e4ff,#6ee7b7,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:6px;color:var(--muted);font-weight:700}.sound{border:1px solid rgba(102,228,255,.25);background:#123039;color:white;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(102,228,255,.14);border-radius:24px;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.4)}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:16px 20px;background:#0b2026}.track{height:13px;background:#04090b;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green),var(--amber));transition:.25s}.chip{background:#173942;padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap}.game{padding:22px}.card{max-width:860px;margin:auto;background:#0e2a31;border:2px solid #24515d;border-radius:20px;padding:20px}.casehead{display:flex;justify-content:space-between;align-items:center;gap:10px}.qtag{display:inline-block;background:#173d46;color:#d9fbff;padding:7px 12px;border-radius:10px;font-weight:900}.zone{font-size:13px;color:#91d9e8;font-weight:900;letter-spacing:1px}.question{font-size:22px;line-height:1.55;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{padding:15px;border:2px solid #2a5864;border-radius:14px;background:#12343c;color:white;text-align:left;font-size:17px;cursor:pointer;transition:.15s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 18px rgba(102,228,255,.09)}.option.correct{background:#154232!important;border-color:var(--ok)!important}.option.wrong{background:#482229!important;border-color:var(--bad)!important}.feedback{display:none;margin-top:16px;padding:15px;border-left:5px solid;border-radius:12px;background:#0a2026;line-height:1.55}.feedback.show{display:block}.feedback.ok{border-color:var(--ok)}.feedback.no{border-color:var(--bad)}.controls{display:flex;justify-content:flex-end;margin-top:14px}.next{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:linear-gradient(90deg,#8cecff,#9ef0cf,#ffe08b);color:#16323a;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:32px}.result.show{display:block}.big{font-size:58px;font-weight:1000;color:#79e9ff}.review{text-align:left;margin-top:22px}.item{padding:12px 14px;background:#0b242a;border-left:5px solid #5f7d83;border-radius:12px;margin:9px 0;line-height:1.5}.item.ok{border-left-color:var(--ok)}.item.no{border-left-color:var(--bad)}
@media(max-width:700px){.options{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr 1fr}.track{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="bg"><div class="gridline"></div><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div><div class="block b4"></div><div class="block b5"></div><div class="block b6"></div></div>
<div class="wrap">
<div class="hero"><div class="hero-left"><div class="icon">🏗️🏙️</div><div><h1>Urban Growth Lab</h1><div class="sub">Grade 12 · Unit 4 · Exercise 1 (41–60) · Option B</div></div></div><button class="sound" id="sound">🔊 Sound On</button></div>
<div class="shell"><div id="quizArea"><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="chip" id="count"></div><div class="chip" id="score"></div><div class="chip" id="heart"></div></div><div class="game"><div class="card"><div class="casehead"><div class="qtag" id="qtag"></div><div class="zone">URBAN PLANNING ZONE</div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="next" disabled>Next Zone →</button></div></div></div></div>
<div class="result" id="result"><div style="font-size:74px">🏗️✅</div><h2>Urban Growth Lab Complete!</h2><div class="big" id="final"></div><p id="message"></p><button class="next" id="restart">Run Again ↻</button><div class="review" id="review"></div></div></div></div>
<script>
const Q=[{"q": "After considering several possible sites, the local authorities eventually decided ____________ an area on the outskirts for the new residential complex.", "options": ["at", "for", "on", "with"], "answer": 2, "explanation": "Decide on + noun = quyết định/chọn một phương án hoặc địa điểm. → decided on an area on the outskirts."}, {"q": "The conversion of agricultural land into housing developments has resulted in a serious ____________ of farmland in rapidly growing cities.", "options": ["shortage", "expansion", "availability", "abundance"], "answer": 0, "explanation": "A shortage of farmland = sự thiếu hụt đất nông nghiệp. Đây là cụm phù hợp với việc đất nông nghiệp bị chuyển sang xây nhà ở."}, {"q": "The more land that is used for urban development, ____________ space remains available for agricultural production.", "options": ["the fewer", "the less", "less and less", "the least"], "answer": 1, "explanation": "Space là danh từ không đếm được nên dùng less. Cấu trúc so sánh kép: The more..., the less..."}, {"q": "Many rural workers move to major cities to ____________ employment that offers higher wages and better working conditions.", "options": ["pursue", "attract", "provide", "afford"], "answer": 0, "explanation": "Pursue employment = tìm kiếm/theo đuổi cơ hội việc làm. Trong ngữ cảnh này, pursue là lựa chọn phù hợp nhất."}, {"q": "This is the first time the city ____________ such a dramatic increase in its urban population within such a short period.", "options": ["experienced", "has experienced", "had experienced", "experiences"], "answer": 1, "explanation": "This is the first time + S + has/have + V3. → has experienced."}, {"q": "Housing costs have risen considerably ____________ the new transportation system began operating in the area.", "options": ["for", "during", "since", "while"], "answer": 2, "explanation": "Since + mốc thời gian/mệnh đề quá khứ → Housing costs have risen considerably since..."}, {"q": "As urban populations continue to grow, clean water and affordable housing are becoming ____________ difficult to provide for all residents.", "options": ["much and much", "more and more", "the more", "most and most"], "answer": 1, "explanation": "More and more + adjective = ngày càng... → more and more difficult."}, {"q": "____________ farmland is available on the outskirts as residential and industrial developments continue to expand.", "options": ["Fewer and fewer", "The fewer", "Less and less", "The least"], "answer": 2, "explanation": "Farmland là danh từ không đếm được nên dùng less and less = ngày càng ít."}, {"q": "____________ have significantly reduced travel times and improved connections between suburban communities and city centres.", "options": ["Transportation efficient public systems", "Public efficient transportation systems", "Efficient public transportation systems", "Systems efficient public transportation"], "answer": 2, "explanation": "Trật tự từ đúng: Efficient + public + transportation + systems → Efficient public transportation systems."}, {"q": "The higher the cost of living becomes in major urban centres, ____________ young workers are able to afford accommodation near their workplaces.", "options": ["the less", "the fewer", "fewer and fewer", "the fewest"], "answer": 1, "explanation": "Young workers là danh từ đếm được số nhiều nên dùng fewer. Cấu trúc so sánh kép: The higher..., the fewer..."}],L=["A","B","C","D"];let i=0,xp=0,hearts=5,combo=0,answered=false,history=[],soundOn=true,ctx=null;const $=id=>document.getElementById(id);
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d=.1,t="sine",v=.035,delay=0){if(!soundOn)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}
function good(){tone(640,.08,"triangle");tone(900,.11,"sine",.03,.08)}function bad(){tone(160,.16,"sawtooth");tone(95,.2,"square",.018,.1)}function nextSound(){tone(420,.06,"triangle",.018);tone(650,.07,"triangle",.015,.06)}function win(){[523,659,784,1047].forEach((f,k)=>tone(f,.17,"triangle",.027,k*.09))}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)nextSound()};
function render(){answered=false;$("next").disabled=true;$("feedback").className="feedback";$("feedback").innerHTML="";const q=Q[i];$("qtag").textContent=`Zone ${i+1}`;$("question").textContent=q.q;$("count").textContent=`${i+1}/${Q.length}`;$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${i/Q.length*100}%`;$("options").innerHTML="";q.options.forEach((op,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<strong>${L[n]}.</strong> ${op}`;b.onclick=()=>choose(n,b);$("options").appendChild(b)});$("next").textContent=i===Q.length-1?"Finish Lab 🏙️":"Next Zone →"}
function choose(n,btn){if(answered)return;answered=true;const q=Q[i],buttons=[...document.querySelectorAll(".option")],right=n===q.answer;buttons.forEach(b=>b.disabled=true);buttons[q.answer].classList.add("correct");if(right){xp+=10+combo*2;combo++;$("feedback").className="feedback ok show";$("feedback").innerHTML=`<strong>✅ Correct: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;good()}else{hearts=Math.max(0,hearts-1);combo=0;btn.classList.add("wrong");$("feedback").className="feedback no show";$("feedback").innerHTML=`<strong>❌ Correct answer: ${L[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`;bad()}history.push({selected:n,correct:right});$("score").textContent=`⭐ ${xp} XP · Combo ${combo}`;$("heart").textContent=`❤️ ${hearts}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("next").disabled=false}
$("next").onclick=()=>{if(!answered)return;nextSound();if(i<Q.length-1){i++;render()}else finish()};
function finish(){$("quizArea").style.display="none";$("result").classList.add("show");win();const correct=history.filter(x=>x.correct).length;$("final").textContent=`${correct}/${Q.length} · ${xp} XP`;$("message").textContent=correct===Q.length?"Perfect Urban Planner!":correct>=8?"Excellent! Em nắm rất chắc Urbanisation vocabulary & grammar.":correct>=6?"Good job! Hãy xem lại những câu chưa đúng.":"Hãy ôn lại collocations, countable/uncountable nouns và cấu trúc so sánh kép.";let html="<h3>🏗️ Urban Growth Review</h3>";Q.forEach((q,k)=>{const a=history[k];html+=`<div class="item ${a.correct?"ok":"no"}"><strong>Zone ${k+1}: ${a.correct?"Correct":"Incorrect"}</strong><br>Your answer: ${L[a.selected]}. ${q.options[a.selected]}<br>Correct: ${L[q.answer]}. ${q.options[q.answer]}<br><em>${q.explanation}</em></div>`});$("review").innerHTML=html}
$("restart").onclick=()=>location.reload();render();
</script></body></html>
