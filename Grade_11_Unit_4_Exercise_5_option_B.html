<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 11 - Unit 4 - Exercise 5 - option B</title>
<style>
  :root{
    --bg1:#eefaf7;
    --bg2:#edf3ff;
    --card:#ffffff;
    --text:#17324d;
    --muted:#6d7c8e;
    --primary:#128a72;
    --primary-dark:#0c6e5c;
    --line:#dce8e5;
    --good:#1d9b62;
    --bad:#dc4b4b;
    --soft-good:#eefaf4;
    --soft-bad:#fff1f1;
    --shadow:0 16px 42px rgba(34,70,75,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 10% 10%,rgba(76,205,171,.16),transparent 30%),
      radial-gradient(circle at 90% 12%,rgba(92,143,255,.14),transparent 28%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
  }
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 42px}
  .header{
    position:sticky;top:10px;z-index:20;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .title h1{margin:0;font-size:20px}
  .title p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{
    background:#f8fbfa;border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;font-size:14px;font-weight:800
  }
  .hearts{letter-spacing:2px}
  .reset{
    border:none;background:var(--primary);color:#fff;border-radius:999px;
    padding:10px 14px;font-weight:800;cursor:pointer
  }
  .reset:hover{background:var(--primary-dark)}
  .progress-wrap{
    height:10px;background:#dfeae7;border-radius:999px;overflow:hidden;
    margin:18px 2px 14px
  }
  .progress{
    height:100%;width:0;background:linear-gradient(90deg,#1aa98c,#568ff4);
    transition:.3s
  }
  .card{
    background:var(--card);border:1px solid rgba(255,255,255,.9);
    border-radius:24px;box-shadow:var(--shadow);padding:26px
  }
  .qmeta{
    display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:14px;margin-bottom:12px
  }
  .tag{
    font-size:12px;font-weight:900;text-transform:uppercase;
    background:#e9f8f3;color:#0f7964;border-radius:999px;padding:7px 10px
  }
  .prompt{
    font-size:19px;font-weight:900;margin:4px 0 16px
  }
  .utterances{
    display:grid;gap:10px;margin-bottom:20px
  }
  .utterance{
    background:#f8fbfc;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;line-height:1.55;font-size:16px
  }
  .utterance b{color:var(--primary-dark)}
  .options{display:grid;gap:11px}
  .option{
    width:100%;text-align:left;border:2px solid var(--line);background:#fbfdfc;
    border-radius:16px;padding:14px 15px;cursor:pointer;display:flex;gap:11px;
    align-items:flex-start;transition:.15s
  }
  .option:hover:not(:disabled){
    transform:translateY(-1px);border-color:#8ccabb;background:#f4fffb
  }
  .option:disabled{cursor:default}
  .letter{
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    flex:0 0 30px;background:#edf4f2;font-weight:900
  }
  .option.correct{border-color:#82d3ac;background:var(--soft-good)}
  .option.correct .letter{background:var(--good);color:#fff}
  .option.wrong{border-color:#efa9a9;background:var(--soft-bad)}
  .option.wrong .letter{background:var(--bad);color:#fff}
  .feedback{
    display:none;margin-top:16px;border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;line-height:1.55;background:#f8fbfa
  }
  .feedback.show{display:block}
  .feedback.good{background:var(--soft-good);border-color:#a8dfc4}
  .feedback.bad{background:var(--soft-bad);border-color:#edb4b4}
  .feedback strong{display:block;margin-bottom:6px}
  .controls{display:flex;justify-content:flex-end;margin-top:16px}
  .next{
    display:none;border:none;background:#17324d;color:#fff;border-radius:14px;
    padding:11px 17px;font-weight:800;cursor:pointer
  }
  .next.show{display:inline-block}
  .footer{
    text-align:center;color:var(--muted);font-size:13px;margin-top:18px
  }
  .modal{
    position:fixed;inset:0;background:rgba(8,24,31,.58);
    display:none;place-items:center;padding:18px;z-index:100
  }
  .modal.show{display:grid}
  .modal-card{
    width:min(560px,100%);background:#fff;border-radius:24px;padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.25)
  }
  .modal-card h2{margin:0 0 10px;font-size:28px}
  .modal-card p{color:var(--muted);line-height:1.55}
  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0
  }
  .summary div{
    border:1px solid var(--line);background:#f7faf9;border-radius:15px;
    padding:13px;text-align:center
  }
  .summary b{display:block;font-size:21px;margin-bottom:3px}
  .actions{display:flex;gap:10px}
  .primary,.secondary{
    flex:1;border:none;border-radius:14px;padding:12px 14px;
    font-weight:800;cursor:pointer
  }
  .primary{background:var(--primary);color:#fff}
  .secondary{background:#eef4f2;color:var(--text)}
  @media(max-width:720px){
    .header{align-items:flex-start}
    .title h1{font-size:17px}
    .pill{font-size:12px;padding:8px 9px}
    .card{padding:20px}
    .prompt{font-size:18px}
    .utterance{font-size:15px}
    .summary{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="title">
      <h1>Grade 11 - Unit 4 - Exercise 5 - option B</h1>
      <p>Exercise 5: Choose the best arrangement of the utterances or sentences.</p>
    </div>
    <div class="status">
      <div class="pill">Score: <span id="score">0</span>/6</div>
      <div class="pill hearts" id="hearts">❤️❤️❤️</div>
      <button class="reset" id="resetBtn">↻ Reset</button>
    </div>
  </header>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <main class="card">
    <div class="qmeta">
      <span id="counter">Question 1/6</span>
      <span class="tag">3 lives</span>
    </div>

    <div class="prompt">Choose the best arrangement.</div>
    <div class="utterances" id="utterances"></div>
    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="next" id="nextBtn">Next →</button>
    </div>
  </main>

  <div class="footer">Question order stays fixed · Wrong answers stay hidden · Reset only shuffles A–D</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="primary" id="restartBtn">Làm lại từ đầu</button>
      <button class="secondary" id="closeBtn">Đóng</button>
    </div>
  </div>
</div>

<script>
const QUESTION_BANK = [
  {
    id:1,
    utterances:[
      "a. Minh: I do. I produced a short video for our school media club last term, so I could submit that.",
      "b. Lan: Are you still planning to apply for the ASEAN digital-storytelling workshop?",
      "c. Minh: Yes. The application asks candidates to include a sample of their previous media work.",
      "d. Lan: That should help. It shows both relevant experience and genuine interest in the programme."
    ],
    choices:["b-c-a-d","c-a-b-d","b-a-d-c","c-b-a-d"],
    answer:"b-c-a-d",
    explanation:"b mở đầu bằng câu hỏi. c trả lời Yes và nêu yêu cầu về a sample of previous media work. a với I do cho biết Minh có sản phẩm phù hợp để nộp. d với That should help nhận xét trực tiếp về video vừa được nhắc đến."
  },
  {
    id:2,
    utterances:[
      "a. Huy: That makes sense. Asking first is probably better than assuming someone's behaviour is rude.",
      "b. Mai: At first, I thought my exchange partner was being unfriendly because she spoke very little during group discussions.",
      "c. Huy: Did you later find out why?",
      "d. Mai: Yes. She explained that in her school, students are encouraged to listen carefully before speaking in a new group."
    ],
    choices:["b-d-c-a","c-b-a-d","b-c-d-a","d-a-b-c"],
    answer:"b-c-d-a",
    explanation:"b nêu sự hiểu lầm ban đầu. c hỏi nguyên nhân. d trả lời trực tiếp bằng Yes và giải thích. a với That makes sense phản hồi cho lời giải thích ở d và rút ra bài học."
  },
  {
    id:3,
    utterances:[
      "a. During the session, each mixed-country team will design one practical response to the issue it is given.",
      "b. Next month's ASEAN youth workshop will focus on problems that affect students across the region.",
      "c. Before the workshop begins, participants will receive short background notes so that everyone starts with the same basic information.",
      "d. At the end, teams will present their solutions and explain how they reached agreement."
    ],
    choices:["c-b-a-d","b-a-c-d","b-c-d-a","b-c-a-d"],
    answer:"b-c-a-d",
    explanation:"Trình tự thời gian: giới thiệu workshop → trước workshop → trong workshop → cuối workshop. Dấu hiệu: Before the workshop begins → During the session → At the end."
  },
  {
    id:4,
    utterances:[
      "a. By comparing the different answers, students will have to identify both shared concerns and contrasting viewpoints.",
      "b. This year's Culture Day will ask students to investigate how teenagers in several ASEAN countries think about the same social issue.",
      "c. Each group will first collect information from interviews, school websites, or short surveys.",
      "d. The activity is expected to develop research skills as well as a more balanced understanding of regional diversity."
    ],
    choices:["b-c-a-d","c-a-b-d","b-a-c-d","c-b-d-a"],
    answer:"b-c-a-d",
    explanation:"b giới thiệu nhiệm vụ tổng quát. c nêu bước đầu tiên: will first collect information. a dùng the different answers để chỉ thông tin đã thu thập ở c. d kết luận về lợi ích của toàn bộ activity."
  },
  {
    id:5,
    utterances:[
      "a. After the survey, the team ranked the suggestions according to cost, usefulness, and the number of students who would benefit.",
      "b. Before proposing a peer-support project, Trang wanted to know what difficulties younger students were actually facing.",
      "c. Using the highest-ranked ideas, the team prepared a detailed plan and estimated the resources required.",
      "d. They therefore conducted an anonymous survey and invited students to describe the support they needed most."
    ],
    choices:["b-a-d-c","d-b-a-c","b-d-a-c","b-d-c-a"],
    answer:"b-d-a-c",
    explanation:"b nêu nhu cầu tìm hiểu khó khăn thực tế. d có therefore nên là hành động xuất phát từ b. a bắt đầu bằng After the survey nên phải sau d. c dùng the highest-ranked ideas nên phải sau bước ranked the suggestions ở a."
  },
  {
    id:6,
    utterances:[
      "a. As participation increased, teachers created a shared online space where students could exchange ideas between meetings.",
      "b. The partnership began with a single online discussion between two schools in different ASEAN countries.",
      "c. What started as a small activity gradually developed into a year-long programme involving several joint projects.",
      "d. Encouraged by the positive response, the schools scheduled monthly sessions on culture, environment, and student life."
    ],
    choices:["b-d-a-c","b-a-d-c","d-b-c-a","b-c-d-a"],
    answer:"b-d-a-c",
    explanation:"b mở đầu vì có began with. d nhắc đến the positive response từ hoạt động đầu tiên. a với As participation increased cho thấy quy mô tiếp tục phát triển. c tổng kết quá trình từ một hoạt động nhỏ thành chương trình kéo dài cả năm."
  }
];

const $ = id => document.getElementById(id);

let shuffledChoices = [];
let current = 0;
let score = 0;
let lives = 3;
let locked = false;

function shuffle(arr){
  const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function prepareChoices(){
  shuffledChoices = QUESTION_BANK.map(q => shuffle(q.choices));
}

function startGame(){
  prepareChoices();
  current=0;
  score=0;
  lives=3;
  locked=false;
  closeModal();
  updateStatus();
  renderQuestion();
}

function updateStatus(){
  $("score").textContent=score;
  $("hearts").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
  $("progress").style.width=`${(current/QUESTION_BANK.length)*100}%`;
}

function renderQuestion(){
  if(current>=QUESTION_BANK.length){
    finishGame();
    return;
  }

  locked=false;
  const q=QUESTION_BANK[current];
  $("counter").textContent=`Question ${current+1}/6`;
  $("utterances").innerHTML=q.utterances.map(u=>{
    const first=u.slice(0,2);
    const rest=u.slice(2).trim();
    return `<div class="utterance"><b>${first}</b> ${rest}</div>`;
  }).join("");

  $("options").innerHTML="";
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  $("nextBtn").classList.remove("show");

  shuffledChoices[current].forEach((choice,index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.innerHTML=`<span class="letter">${String.fromCharCode(65+index)}</span><span>${choice}</span>`;
    btn.addEventListener("click",()=>selectAnswer(choice,btn));
    $("options").appendChild(btn);
  });

  updateStatus();
}

function selectAnswer(choice,selectedBtn){
  if(locked || selectedBtn.disabled) return;

  const q=QUESTION_BANK[current];

  if(choice===q.answer){
    locked=true;
    score++;
    selectedBtn.classList.add("correct");

    const buttons=[...document.querySelectorAll(".option")];
    buttons.forEach(btn=>btn.disabled=true);

    $("feedback").className="feedback show good";
    $("feedback").innerHTML=`<strong>✅ Correct! ${q.answer}</strong>${q.explanation}`;

    updateStatus();
    $("nextBtn").classList.add("show");
    $("nextBtn").textContent=current===QUESTION_BANK.length-1 ? "Finish →" : "Next →";
  }else{
    lives--;
    selectedBtn.classList.add("wrong");
    selectedBtn.disabled=true;

    $("feedback").className="feedback show bad";
    $("feedback").innerHTML=`<strong>❌ Incorrect. Try again!</strong>Đáp án đúng chưa được hiển thị. Hãy chọn lại một phương án khác.`;

    updateStatus();

    if(lives<=0){
      locked=true;
      setTimeout(showGameOver,400);
    }
  }
}

$("nextBtn").addEventListener("click",()=>{
  current++;
  renderQuestion();
});

$("resetBtn").addEventListener("click",startGame);
$("restartBtn").addEventListener("click",startGame);
$("closeBtn").addEventListener("click",closeModal);

function showGameOver(){
  $("modalTitle").textContent="💔 Hết 3 tim!";
  $("modalText").textContent="Em phải làm lại từ đầu. Thứ tự câu hỏi vẫn giữ nguyên 1→6, nhưng các phương án A–D sẽ được trộn lại.";
  $("summary").innerHTML=`
    <div><b>${score}</b>Correct</div>
    <div><b>${current+1}</b>Attempted</div>
    <div><b>0</b>Lives left</div>`;
  $("closeBtn").style.display="none";
  $("modal").classList.add("show");
}

function finishGame(){
  $("progress").style.width="100%";
  $("modalTitle").textContent=score===6 ? "🏆 Excellent!" : "🎉 Completed!";
  $("modalText").textContent="Em đã hoàn thành Exercise 5.";
  $("summary").innerHTML=`
    <div><b>${score}/6</b>Correct</div>
    <div><b>${Math.round(score/6*100)}%</b>Accuracy</div>
    <div><b>${lives}</b>Lives left</div>`;
  $("closeBtn").style.display="block";
  $("modal").classList.add("show");
}

function closeModal(){
  $("modal").classList.remove("show");
}

startGame();
</script>
</body>
</html>
